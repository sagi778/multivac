function renderEChart(outputEl, option, W, H) {
  if (typeof echarts === 'undefined') return;
  outputEl.innerHTML = '';
  const div = document.createElement('div');
  div.style.cssText = `width:${W}px;height:${H}px`;
  outputEl.appendChild(div);
  // Make every grid contain its own axis labels so text never overflows onto chart content
  if (option.grid) {
    const gs = Array.isArray(option.grid) ? option.grid : [option.grid];
    gs.forEach(g => { if (!('containLabel' in g)) g.containLabel = true; });
  }
  echarts.init(div, null, {}).setOption(option);
}

function _ecAxis(name, rotate) {
  return {
    name: name || '', nameLocation: 'end', nameGap: 6,
    nameTextStyle: { color: '#888', fontSize: 12 },
    axisLabel: { rotate: rotate || 0, color: '#555', fontSize: 12 },
    axisLine: { lineStyle: { color: '#ccc' } },
    axisTick: { lineStyle: { color: '#ccc' } },
    splitLine: { lineStyle: { color: '#eee' } },
  };
}

function _chartColors() {
  const s = getComputedStyle(document.documentElement);
  const g = v => s.getPropertyValue(v).trim();
  return {
    bg: g('--bg'), bg2: g('--bg2'), bg3: g('--bg3'),
    text: g('--text'), text2: g('--text2'),
    border: g('--border'), border2: g('--border2'),
    col: g('--col-color'),
  };
}

function _patchEchartsTheme() {
  if (!window.echarts || window._ecThemePatched) return;
  window._ecThemePatched = true;
  const _origSet = echarts.init;
  echarts.init = function(el, theme, opts) {
    const inst = _origSet(el, theme, opts);
    const _origSetOpt = inst.setOption.bind(inst);
    inst.setOption = function(option, ...rest) {
      const c = _chartColors();
      if (option.backgroundColor !== undefined) option.backgroundColor = 'transparent';
      const applyAxis = ax => {
        if (!ax) return;
        if (ax.axisLabel) { ax.axisLabel.color = ax.axisLabel.color ? c.text2 : undefined; ax.axisLabel.color = c.text2; }
        if (ax.nameTextStyle) ax.nameTextStyle.color = c.text2;
        if (ax.axisLine?.lineStyle) ax.axisLine.lineStyle.color = c.border;
        if (ax.splitLine?.lineStyle) ax.splitLine.lineStyle.color = c.border2;
        if (ax.axisLine) ax.axisLine.lineStyle = { ...(ax.axisLine.lineStyle||{}), color: c.border };
      };
      [].concat(option.xAxis||[], option.yAxis||[]).forEach(applyAxis);
      if (option.tooltip && option.tooltip.backgroundColor !== undefined) {
        option.tooltip.backgroundColor = c.bg2;
        option.tooltip.borderColor = c.border;
        if (option.tooltip.textStyle) option.tooltip.textStyle.color = c.text;
      }
      if (option.title?.textStyle) option.title.textStyle.color = c.text;
      if (option.legend?.textStyle) option.legend.textStyle.color = c.text2;
      if (option.visualMap?.textStyle) option.visualMap.textStyle.color = c.text2;
      return _origSetOpt(option, ...rest);
    };
    return inst;
  };
}

function _ecTooltip() {
  const c = _chartColors();
  return { backgroundColor: c.bg2, borderColor: c.border, textStyle: { color: c.text, fontSize: 13 } };
}

function _ecLegend(show) {
  if (!show) return { show: false };
  return {
    orient: 'vertical', right: 8, top: 'middle',
    textStyle: { color: '#555', fontSize: 12 },
    icon: 'circle', itemWidth: 10, itemHeight: 10,
  };
}

// Reusable searchable single-column select
// Returns { el } where el is the .ssel-wrap element
function makeSearchableSelect({ options, value, placeholder = '(pick)', optional = false, onChange }) {
  const wrap = document.createElement('div');
  wrap.className = 'ssel-wrap';

  const trigger = document.createElement('button');
  trigger.className = 'ssel-trigger';

  const dropdown = document.createElement('div');
  dropdown.className = 'ssel-dropdown';

  const searchInp = document.createElement('input');
  searchInp.type = 'text';
  searchInp.className = 'ssel-search';
  searchInp.placeholder = 'Search…';
  searchInp.autocomplete = 'off';

  const list = document.createElement('div');
  list.className = 'ssel-list';

  dropdown.appendChild(searchInp);
  dropdown.appendChild(list);
  wrap.appendChild(trigger);
  wrap.appendChild(dropdown);

  let current = value ?? '';

  function updateTrigger() {
    trigger.textContent = current || placeholder;
    trigger.classList.toggle('ssel-empty', !current);
  }

  function buildList(q) {
    list.innerHTML = '';
    const lq = q ? q.toLowerCase() : '';

    // Optional "(none)" item — always visible when optional, not filtered
    if (optional) {
      const btn = document.createElement('button');
      btn.className = 'ssel-opt ssel-none' + (current === '' ? ' ssel-selected' : '');
      btn.textContent = placeholder;
      btn.addEventListener('click', e => {
        e.stopPropagation();
        current = '';
        updateTrigger();
        onChange('');
        closeDropdown();
      });
      list.appendChild(btn);
    }

    const filtered = lq ? options.filter(o => o.toLowerCase().includes(lq)) : options;

    if (!filtered.length) {
      const msg = document.createElement('div');
      msg.className = 'ssel-no-match';
      msg.textContent = lq ? 'No match' : (optional ? '' : 'No columns');
      if (msg.textContent) list.appendChild(msg);
      return;
    }

    filtered.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'ssel-opt' + (opt === current ? ' ssel-selected' : '');
      btn.textContent = opt;
      btn.title = opt;
      btn.addEventListener('click', e => {
        e.stopPropagation();
        current = opt;
        updateTrigger();
        onChange(opt);
        closeDropdown();
      });
      list.appendChild(btn);
    });
  }

  function closeDropdown() {
    dropdown.classList.remove('open');
    searchInp.value = '';
    buildList('');
  }

  buildList('');
  updateTrigger();

  trigger.addEventListener('click', e => {
    e.stopPropagation();
    // Close all other ssel dropdowns
    document.querySelectorAll('.ssel-dropdown.open').forEach(d => {
      if (d !== dropdown) d.classList.remove('open');
    });
    const opening = !dropdown.classList.contains('open');
    dropdown.classList.toggle('open');
    if (opening) {
      searchInp.value = '';
      buildList('');
      setTimeout(() => searchInp.focus(), 0);
    }
  });

  searchInp.addEventListener('input', () => buildList(searchInp.value));
  searchInp.addEventListener('click', e => e.stopPropagation());
  dropdown.addEventListener('click', e => e.stopPropagation());

  // Expose updater so refreshes can sync value without rebuilding everything
  wrap._sselSetValue = v => { current = v ?? ''; updateTrigger(); buildList(searchInp.value); };

  return wrap;
}

function refreshColPicker(pickerEl, block, label) {
  const qCols   = block._queryColumns || _lastQueryColumns;
  const qSchema = block._querySchema  || _lastQuerySchema;
  pickerEl.innerHTML = '';
  const lbl = document.createElement('span');
  lbl.className = 'story-col-picker-label';
  lbl.textContent = label || 'Columns:';
  pickerEl.appendChild(lbl);

  if (!qCols.length) {
    const hint = document.createElement('span');
    hint.className = 'story-col-empty';
    hint.textContent = 'run a query first';
    pickerEl.appendChild(hint);
    return;
  }

  if (!block.params.columns) block.params.columns = [];
  // Remove stale column names that no longer exist in the current query result
  block.params.columns = block.params.columns.filter(c => qCols.includes(c));

  // Trigger button
  const trigger = document.createElement('button');
  trigger.className = 'story-col-trigger';
  const updateLabel = () => {
    const n = (block.params.columns || []).length;
    trigger.textContent = n === 0 ? `All columns ▾` : `${n} / ${qCols.length} ▾`;
  };
  updateLabel();
  pickerEl.appendChild(trigger);

  // Dropdown panel
  const dropdown = document.createElement('div');
  dropdown.className = 'story-col-dropdown';

  // All / None actions
  const actions = document.createElement('div');
  actions.className = 'story-col-actions';
  const allBtn  = document.createElement('button');
  allBtn.className  = 'story-col-action-btn'; allBtn.textContent  = 'All';
  const noneBtn = document.createElement('button');
  noneBtn.className = 'story-col-action-btn'; noneBtn.textContent = 'None';
  actions.appendChild(allBtn); actions.appendChild(noneBtn);
  dropdown.appendChild(actions);

  // Search input for filtering chips
  const chipSearch = document.createElement('input');
  chipSearch.type = 'text';
  chipSearch.className = 'story-col-search';
  chipSearch.placeholder = 'Filter columns…';
  chipSearch.autocomplete = 'off';
  dropdown.appendChild(chipSearch);

  // Chip list
  const chips = document.createElement('div');
  chips.className = 'story-col-chips';

  const syncSelection = () => {
    const allCbs = chips.querySelectorAll('input[type=checkbox]');
    const nowOn = [...allCbs].filter(c => c.checked).map(c => c.dataset.col);
    block.params.columns = nowOn.length === allCbs.length ? [] : nowOn;
    allCbs.forEach(cb => cb.closest('.story-col-chip').classList.toggle('on', cb.checked));
    updateLabel();
  };

  qCols.forEach(col => {
    const isOn = block.params.columns.length === 0 || block.params.columns.includes(col);
    const chip = document.createElement('label');
    chip.className = 'story-col-chip' + (isOn ? ' on' : '');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = isOn; cb.dataset.col = col;
    cb.addEventListener('change', syncSelection);
    chip.appendChild(cb);
    chip.appendChild(document.createTextNode(col));
    chips.appendChild(chip);
  });

  allBtn.addEventListener('click', () => {
    chips.querySelectorAll('input[type=checkbox]').forEach(cb => { cb.checked = true; });
    syncSelection();
  });
  noneBtn.addEventListener('click', () => {
    chips.querySelectorAll('input[type=checkbox]').forEach(cb => { cb.checked = false; });
    syncSelection();
  });

  dropdown.appendChild(chips);
  pickerEl.appendChild(dropdown);

  // Wire chip search — filter visible chips by name
  chipSearch.addEventListener('input', () => {
    const q = chipSearch.value.toLowerCase();
    chips.querySelectorAll('.story-col-chip').forEach(chip => {
      const col = chip.querySelector('input').dataset.col;
      chip.style.display = (q && !col.toLowerCase().includes(q)) ? 'none' : '';
    });
  });
  chipSearch.addEventListener('click', e => e.stopPropagation());

  trigger.addEventListener('click', e => {
    e.stopPropagation();
    // Close any other open col-pickers first
    document.querySelectorAll('.story-col-dropdown.open').forEach(d => {
      if (d !== dropdown) d.classList.remove('open');
    });
    const opening = !dropdown.classList.contains('open');
    dropdown.classList.toggle('open');
    if (opening) {
      chipSearch.value = '';
      chips.querySelectorAll('.story-col-chip').forEach(c => { c.style.display = ''; });
      setTimeout(() => chipSearch.focus(), 0);
    }
  });
  // Prevent clicks inside the dropdown from bubbling to document (which would close it)
  dropdown.addEventListener('click', e => e.stopPropagation());
}

function refreshSingleColPicker(pickerEl, block) {
  const qCols = block._queryColumns || _lastQueryColumns;
  pickerEl.innerHTML = '';
  if (block.params.column && qCols.length && !qCols.includes(block.params.column)) {
    block.params.column = '';
  }
  const lbl = document.createElement('label');
  lbl.textContent = 'Column: ';
  if (!qCols.length) {
    const hint = document.createElement('span');
    hint.className = 'story-col-empty';
    hint.textContent = 'run a query first';
    lbl.appendChild(hint);
  } else {
    const sselEl = makeSearchableSelect({
      options: qCols,
      value: block.params.column || '',
      placeholder: '(pick column)',
      onChange(v) { block.params.column = v; },
    });
    lbl.appendChild(sselEl);
  }
  pickerEl.appendChild(lbl);
}

function refreshColPickersRow(rowEl, block, pickerDefs) {
  const qCols   = block._queryColumns || _lastQueryColumns;
  const qSchema = block._querySchema  || _lastQuerySchema;
  rowEl.innerHTML = '';
  pickerDefs.forEach(picker => {
    const cols = filteredColumns(picker.typeFilter, qCols, qSchema);
    if (block.params[picker.key] && qCols.length && !cols.includes(block.params[picker.key])) {
      block.params[picker.key] = '';
    }
    const lbl = document.createElement('label');
    lbl.textContent = picker.label + ': ';
    if (!qCols.length) {
      const hint = document.createElement('span');
      hint.className = 'story-col-empty';
      hint.textContent = 'run query first';
      lbl.appendChild(hint);
    } else {
      const sselEl = makeSearchableSelect({
        options: cols,
        value: block.params[picker.key] || '',
        placeholder: picker.optional ? '(none)' : '(pick)',
        optional: !!picker.optional,
        onChange(v) { block.params[picker.key] = v; },
      });
      lbl.appendChild(sselEl);
    }
    rowEl.appendChild(lbl);
  });
}

function buildStoryBlock(block, opts = {}) {
  const def = STORY_BLOCK_DEFS[block.type];
  if (!def) {
    const el = document.createElement('div');
    el.className = 'story-block';
    el.textContent = `Unknown block type: ${block.type}`;
    return el;
  }
  if (!block.hasOwnProperty('folded')) block.folded = false;
  if (!block.hasOwnProperty('paramsHidden')) block.paramsHidden = false;
  if (!block.title) block.title = def.label;
  const el = document.createElement('div');
  el.className = 'story-block';
  el.dataset.id = block.id;
  el.draggable = false;  // drag enabled only via handle

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'story-block-hdr';
  hdr.innerHTML = `
    <span class="story-drag-handle" title="Drag to reorder">⠿</span>
    <button class="story-block-btn play" title="Run block">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
    </button>
    <button class="story-block-btn story-params-btn${block.paramsHidden ? ' active' : ''}" title="Toggle parameters">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
    </button>
    <span class="story-block-title" contenteditable="true" spellcheck="false">${block.title}</span>
    <button class="story-block-btn story-comment-btn" title="Comment">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
      </svg>
    </button>
    <button class="story-block-btn story-screenshot-btn" title="Copy output as image" disabled>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </button>
    <button class="story-block-btn story-fold-btn" title="Fold/unfold output">
      <span class="story-fold-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></span>
    </button>
    <button class="story-block-btn story-pin-btn" title="Pin to dashboard (drag or click)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    </button>
    <button class="story-block-btn story-del-btn" title="Delete block">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>`;

  // Params
  const paramsEl = document.createElement('div');
  paramsEl.className = 'story-params';
  def.params.forEach(p => {
    const lbl = document.createElement('label');
    lbl.textContent = p.label + ': ';
    if (p.type === 'number') {
      const inp = document.createElement('input');
      inp.type = 'number'; inp.min = p.min; inp.max = p.max; inp.value = block.params[p.key];
      if (p.step) inp.step = p.step;
      inp.dataset.paramKey = p.key;
      inp.addEventListener('change', () => { block.params[p.key] = +inp.value; });
      lbl.appendChild(inp);
    } else if (p.type === 'select') {
      const sel = document.createElement('select');
      sel.dataset.paramKey = p.key;
      p.options.forEach(opt => {
        const o = document.createElement('option');
        o.value = o.textContent = opt;
        if (opt === block.params[p.key]) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener('change', () => {
        block.params[p.key] = sel.value;
        // Re-render describe table immediately when sort changes
        if (block.type === 'describe' && p.key === 'sort_by' && block._lastData) {
          renderDescribeTable(block);
        }
        // Auto-update threshold default when outlier method changes
        if (block.type === 'outlier_detect' && p.key === 'method') {
          const defs = { 'IQR': 1.5, 'Z-Score': 3.0, 'Mod-Z': 3.5, 'Percentile': 1.0 };
          const d = defs[sel.value];
          if (d !== undefined) {
            block.params.threshold = d;
            const ti = paramsEl.querySelector('[data-param-key="threshold"]');
            if (ti) ti.value = d;
          }
        }
      });
      lbl.appendChild(sel);
    } else if (p.type === 'checkbox') {
      const chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.checked = !!block.params[p.key];
      chk.style.margin = '0 0 0 3px';
      chk.addEventListener('change', () => {
        block.params[p.key] = chk.checked;
        if (block.type === 'boxplot' && block._lastData) renderBoxplot(block);
      });
      lbl.appendChild(chk);
    } else if (p.type === 'text') {
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.className = 'story-text-inp';
      inp.value = block.params[p.key] != null ? block.params[p.key] : (p.default || '');
      if (p.placeholder) inp.placeholder = p.placeholder;
      inp.addEventListener('change', () => { block.params[p.key] = inp.value; });
      lbl.appendChild(inp);
    } else if (p.type === 'table_select') {
      const _tsWs = _workspaces.find(w => w.id === _activeWsId);
      const _tsSheets = _tsWs?._dataSheets ? Object.keys(_tsWs._dataSheets) : [];
      const sel = document.createElement('select');
      sel.className = 'story-sheet-sel';
      sel.dataset.paramKey = p.key;
      const dfOpt = document.createElement('option');
      dfOpt.value = 'df';
      dfOpt.textContent = 'df';
      sel.appendChild(dfOpt);
      _tsSheets.forEach(sname => {
        const opt = document.createElement('option');
        opt.value = 'df.' + sname;
        opt.textContent = 'df.' + sname;
        sel.appendChild(opt);
      });
      const cur = block.params[p.key] || 'df';
      sel.value = (cur !== 'df' && _tsSheets.some(s => 'df.' + s === cur)) ? cur : 'df';
      block.params[p.key] = sel.value;
      sel.addEventListener('change', () => { block.params[p.key] = sel.value; });
      lbl.appendChild(sel);
    } else if (p.type === 'textarea') {
      if (p.hint) {
        const hint = document.createElement('div');
        hint.className = 'story-textarea-hint';
        hint.innerHTML = p.hint;
        paramsEl.appendChild(hint);
      }
      const host = document.createElement('div');
      host.className = 'story-mini-editor-host';
      host.dataset.paramKey = p.key;
      paramsEl.appendChild(host);
      return;
    } else if (p.type === 'python') {
      const wrap = document.createElement('div');
      wrap.className = 'story-py-editor-wrap';
      const fmtBtn = document.createElement('button');
      fmtBtn.className = 'story-py-format-btn';
      fmtBtn.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/></svg> Format';
      fmtBtn.title = 'Auto-format Python code (requires autopep8 or black)';
      fmtBtn.addEventListener('click', async () => {
        if (!block._pyEditor) return;
        const code = block._pyEditor.getValue();
        fmtBtn.disabled = true;
        try {
          const res = await fetch('/api/python/format', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ code }),
          });
          const data = await res.json();
          if (data.code !== undefined) {
            block._pyEditor.setValue(data.code);
            block.params.code = data.code;
          }
          if (data.error) alert(data.error);
        } catch(e) { alert(e.message); }
        finally { fmtBtn.disabled = false; }
      });
      wrap.appendChild(fmtBtn);
      const host = document.createElement('div');
      host.className = 'story-mini-editor-host story-py-editor-host';
      host.dataset.paramKey = p.key;
      wrap.appendChild(host);
      paramsEl.appendChild(wrap);
      return;
    }
    paramsEl.appendChild(lbl);
  });

  // Column pickers
  let colPickerEl = null;
  if (def.hasColPicker) {
    colPickerEl = document.createElement('div');
    colPickerEl.className = 'story-col-picker';
    if (!block.params.columns) block.params.columns = [];
    refreshColPicker(colPickerEl, block, def.colPickerLabel);
  }
  let colPickersRowEl = null;
  if (def.colPickers) {
    colPickersRowEl = document.createElement('div');
    colPickersRowEl.className = 'story-col-pickers-row';
    def.colPickers.forEach(p => { if (!block.params.hasOwnProperty(p.key)) block.params[p.key] = ''; });
    refreshColPickersRow(colPickersRowEl, block, def.colPickers);
  }

  // Output
  const outputEl = document.createElement('div');
  outputEl.className = 'story-output';
  if (block.folded) outputEl.style.display = 'none';

  // Comment area (below output)
  const commentWrap = document.createElement('div');
  commentWrap.className = 'story-comment-wrap';
  const ta = document.createElement('textarea');
  ta.placeholder = 'Add a comment…';
  ta.value = block.comment;
  ta.addEventListener('input', () => { block.comment = ta.value; });
  commentWrap.appendChild(ta);
  if (block.comment) commentWrap.style.display = 'block';

  el.appendChild(hdr);
  el.appendChild(paramsEl);
  if (colPickersRowEl) el.appendChild(colPickersRowEl);
  if (colPickerEl) el.appendChild(colPickerEl);
  el.appendChild(outputEl);
  el.appendChild(commentWrap);

  // Button events
  const playBtn       = hdr.querySelector('.story-block-btn.play');
  const screenshotBtn = hdr.querySelector('.story-screenshot-btn');
  const foldBtn       = hdr.querySelector('.story-fold-btn');
  const commentBtn    = hdr.querySelector('.story-comment-btn');
  const delBtn        = hdr.querySelector('.story-del-btn');
  const paramsBtn     = hdr.querySelector('.story-params-btn');
  const titleEl       = hdr.querySelector('.story-block-title');

  // Editable title
  titleEl.addEventListener('input', () => { block.title = titleEl.textContent; });
  titleEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); titleEl.blur(); }
  });
  titleEl.addEventListener('blur', () => {
    if (!titleEl.textContent.trim()) { titleEl.textContent = def.label; block.title = def.label; }
  });

  // Params toggle
  const _paramsEls = [paramsEl, colPickersRowEl, colPickerEl].filter(Boolean);
  function applyParamsVisibility() {
    _paramsEls.forEach(el => { el.style.display = block.paramsHidden ? 'none' : ''; });
    paramsBtn.classList.toggle('active', block.paramsHidden);
  }
  applyParamsVisibility();
  paramsBtn.addEventListener('click', () => {
    block.paramsHidden = !block.paramsHidden;
    applyParamsVisibility();
  });

  playBtn.addEventListener('click', () => runStoryBlock(block, outputEl, playBtn, screenshotBtn));

  screenshotBtn.addEventListener('click', async () => {
    if (screenshotBtn.disabled) return;
    const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    const canvas = await html2canvas(outputEl, { backgroundColor: bg, scale: 2, logging: false });
    canvas.toBlob(async blob => {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      screenshotBtn.classList.add('copied');
      setTimeout(() => screenshotBtn.classList.remove('copied'), 1200);
    }, 'image/png');
  });

  commentBtn.addEventListener('click', () => {
    const show = commentWrap.style.display !== 'block';
    commentWrap.style.display = show ? 'block' : 'none';
    if (show) ta.focus();
  });

  delBtn.addEventListener('click', () => {
    if (opts.onDelete) { opts.onDelete(); return; }
    _storyBlocks = _storyBlocks.filter(b => b.id !== block.id);
    renderStoryBlocks();
    _schedSave();
  });

  foldBtn.addEventListener('click', () => {
    block.folded = !block.folded;
    const icon = foldBtn.querySelector('.story-fold-icon');
    icon.style.transform = block.folded ? 'rotate(-90deg)' : '';
    if (outputEl.classList.contains('visible')) {
      outputEl.style.display = block.folded ? 'none' : 'block';
    }
  });
  // Restore fold icon state on re-render
  if (block.folded) {
    foldBtn.querySelector('.story-fold-icon').style.transform = 'rotate(-90deg)';
  }
  // Restore screenshot btn state if block already has output
  if (block._lastData) screenshotBtn.disabled = false;

  // Pin-to-dashboard button
  const pinBtn = hdr.querySelector('.story-pin-btn');
  if (opts.hidePinBtn) pinBtn.style.display = 'none';
  pinBtn.draggable = true;
  pinBtn.addEventListener('dragstart', e => {
    e.dataTransfer.setData('application/bq-widget', JSON.stringify({ blockId: block.id, wsId: _activeWsId }));
    e.dataTransfer.effectAllowed = 'copy';
    e.stopPropagation();
  });
  pinBtn.addEventListener('click', e => {
    e.stopPropagation();
    const dashboards = _workspaces.filter(w => w.type === 'dashboard');
    if (dashboards.length === 0) {
      _saveCurrentWorkspace();
      const dws = _createDashboardState();
      _workspaces.push(dws);
      _renderWsBar();
      _addWidgetToDashboard({ blockId: block.id, wsId: _activeWsId }, dws.id);
    } else {
      _addWidgetToDashboard({ blockId: block.id, wsId: _activeWsId }, dashboards[0].id);
    }
  });

  // Drag-to-reorder — only enabled when dragging from the handle
  const dragHandle = hdr.querySelector('.story-drag-handle');
  dragHandle.addEventListener('mousedown', () => {
    el.draggable = true;
    document.addEventListener('mouseup', () => { el.draggable = false; }, { once: true });
  });
  el.addEventListener('dragstart', e => {
    _storyDragSrc = block.id;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => { el.style.opacity = '0.4'; }, 0);
  });
  el.addEventListener('dragend', () => { el.style.opacity = ''; el.draggable = false; _storyDragSrc = null; });
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drag-over'); });
  el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
  el.addEventListener('drop', e => {
    e.preventDefault();
    el.classList.remove('drag-over');
    if (!_storyDragSrc || _storyDragSrc === block.id) return;
    const fi = _storyBlocks.findIndex(b => b.id === _storyDragSrc);
    const ti = _storyBlocks.findIndex(b => b.id === block.id);
    if (fi < 0 || ti < 0) return;
    const [moved] = _storyBlocks.splice(fi, 1);
    _storyBlocks.splice(ti, 0, moved);
    renderStoryBlocks();
  });

  return el;
}

function _initMiniEditor(block, hostEl) {
  if (!window._monacoInstance || !hostEl || block._miniEditor) return;
  const monaco = window._monacoInstance;
  const savedTheme = localStorage.getItem('bqs-theme') || 'dark';
  const ed = monaco.editor.create(hostEl, {
    value: block.params.sql || 'SELECT * FROM df LIMIT 100',
    language: 'bigquery-sql',
    theme: MONACO_THEMES[savedTheme] || 'bqs-dark',
    minimap: { enabled: false },
    fontSize: 13,
    lineNumbers: 'off',
    wordWrap: 'on',
    scrollBeyondLastLine: false,
    automaticLayout: true,
    tabSize: 2,
    autoIndent: 'full',
    matchBrackets: 'always',
    renderLineHighlight: 'line',
    folding: false,
    lineDecorationsWidth: 0,
    lineNumbersMinChars: 0,
    glyphMargin: false,
    overviewRulerLanes: 0,
    hideCursorInOverviewRuler: true,
    scrollbar: { verticalScrollbarSize: 4, horizontalScrollbarSize: 4 },
    padding: { top: 6, bottom: 6 },
  });
  block._miniEditor = ed;
  // Auto-grow height with content (max 220px)
  const updateHeight = () => {
    const h = Math.min(220, Math.max(52, ed.getContentHeight()));
    if (hostEl.style.height !== h + 'px') { hostEl.style.height = h + 'px'; ed.layout(); }
  };
  ed.onDidContentSizeChange(updateHeight);
  updateHeight();
  // Sync value → block.params
  ed.onDidChangeModelContent(() => { block.params.sql = ed.getValue(); });
  // Ctrl/Cmd+Enter to run
  ed.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, () => {
    hostEl.closest('.story-block')?.querySelector('.story-block-btn.play')?.click();
  });
}

function _initPyEditor(block, hostEl) {

  const monaco = window._monacoInstance;
  const savedTheme = localStorage.getItem('bqs-theme') || 'dark';

    language: 'python',
    theme: MONACO_THEMES[savedTheme] || 'bqs-dark',
    minimap: { enabled: false },
    fontSize: 13,
    lineNumbers: 'on',
    wordWrap: 'on',
    scrollBeyondLastLine: false,
    automaticLayout: true,
    tabSize: 4,
    insertSpaces: true,
    autoIndent: 'full',
    matchBrackets: 'always',
    renderLineHighlight: 'line',
    folding: true,
    lineDecorationsWidth: 4,
    lineNumbersMinChars: 3,
    glyphMargin: false,

function _collapseBlockParams(block, outputEl) {
  const blockEl = outputEl.closest('.story-block');
  if (!blockEl) return;
  block.paramsHidden = true;
  blockEl.querySelectorAll('.story-params, .story-col-picker, .story-col-pickers-row, .story-single-col').forEach(el => { el.style.display = 'none'; });
  const pb = blockEl.querySelector('.story-params-btn');
  if (pb) pb.classList.add('active');
}

async function runStoryBlock(block, outputEl, playBtn, screenshotBtn) {
  const queryCtx = block._queryContext || _lastQueryContext;
  const _storyWs = _workspaces.find(w => w.id === _activeWsId);
  // python_exec: run Python code with df available
  if (block.type === 'python_exec') {
    const ws = _workspaces.find(w => w.id === _activeWsId);
    const code = (block.params.code || '').trim();
    if (!code) {
      outputEl.className = 'story-output visible';
      outputEl.innerHTML = '<div class="story-output-error">Enter Python code above.</div>';
      return;
    }
    outputEl.className = 'story-output visible';
    outputEl.innerHTML = '<div class="story-output-running">Running…</div>';
    playBtn.disabled = true;
    try {
      const qd = ws?.lastQueryData;
      const res = await fetch('/api/python/exec', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          code,
          columns: qd?.columns || [],
          rows:    qd?.rows    || [],
          bq_schema: qd?.schema || [],
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || res.statusText);
      block._lastPyResult = data;
      renderStoryOutput('python_exec', data, outputEl, block);
      if (block.folded) outputEl.style.display = 'none';
    } catch(e) {
      outputEl.innerHTML = `<div class="story-output-error">${e.message}</div>`;
    } finally {
      playBtn.disabled = false;
    }
    return;
  }
  // All other blocks require a query context or local data (data file workspace)
  if (!queryCtx && !_storyWs?.lastQueryData) {
    outputEl.className = 'story-output visible';
    outputEl.innerHTML = '<div class="story-output-error">Run a query first or open a data file.</div>';
    return;
  }
  // sql_query: run SQL against the in-memory result table via /api/query/local
  if (block.type === 'sql_query') {
    const ws = _workspaces.find(w => w.id === _activeWsId);
    if (!ws || !ws.lastQueryData) {
      outputEl.className = 'story-output visible';
      outputEl.innerHTML = '<div class="story-output-error">No query results available. Run a query first.</div>';
      return;
    }
    const sql = (block.params.sql || '').trim();
    if (!sql) {
      outputEl.className = 'story-output visible';
      outputEl.innerHTML = '<div class="story-output-error">Enter a SQL query above.</div>';
      return;
    }
    outputEl.className = 'story-output visible';
    outputEl.innerHTML = '<div class="story-output-running">Running…</div>';
    playBtn.disabled = true;
    try {
      const { columns, schema: bqSchema, rows } = ws.lastQueryData;
      const extraTables = {};
      if (ws._dataSheets) {
        for (const [, sdata] of Object.entries(ws._dataSheets)) {
          extraTables[sdata.tableName] = { columns: sdata.columns, rows: sdata.rows, bq_schema: sdata.schema || [] };
        }
      }
      const res = await fetch('/api/query/local', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sql, columns, rows, bq_schema: bqSchema || [], extra_tables: extraTables }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || res.statusText);
      block._lastData = data;
      renderStoryOutput('sql_query', data, outputEl, block);
      if (block.folded) outputEl.style.display = 'none';
      else outputEl.style.display = '';
    } catch(e) {
      outputEl.innerHTML = `<div class="story-output-error">${e.message}</div>`;
    } finally {
      playBtn.disabled = false;
    }
    return;
  }
  // noApi blocks operate directly on ws.lastQueryData
  if (STORY_BLOCK_DEFS[block.type]?.noApi) {
    const ws = _workspaces.find(w => w.id === _activeWsId);
    if (!ws || !ws.lastQueryData) {
      outputEl.className = 'story-output visible';
      outputEl.innerHTML = '<div class="story-output-error">No query results available. Run a query first.</div>';
      return;
    }
    outputEl.className = 'story-output visible';
    renderStoryOutput(block.type, null, outputEl, block);
    if (block.folded) outputEl.style.display = 'none';
    else outputEl.style.display = '';
    _collapseBlockParams(block, outputEl);
    return;
  }
  const isPlot = ['histogram','scatter','lineplot','boxplot','outlier_detect','linreg','hypo_test','barplot','corr_matrix','feature_importance','predict_model'].includes(block.type);
  outputEl.className = 'story-output visible' + (isPlot ? ' plot-output' : '');
  outputEl.innerHTML = '<div class="story-output-running">Running…</div>';
  playBtn.disabled = true;
  if (screenshotBtn) screenshotBtn.disabled = true;
  try {
    // Resolve the data source from block.params.table (sheet selector)
    const _tableParam = block.params?.table || 'df';
    let _localData = null;
    if (_tableParam !== 'df' && _storyWs?._dataSheets) {
      const _sheetName = _tableParam.startsWith('df.') ? _tableParam.slice(3) : null;
      if (_sheetName && _storyWs._dataSheets[_sheetName]) {
        const _sd = _storyWs._dataSheets[_sheetName];
        _localData = { columns: _sd.columns, rows: _sd.rows, schema: _sd.schema };
      }
    }
    if (!_localData) _localData = _storyWs?.lastQueryData;
    const _extraTables = {};
    if (_storyWs?._dataSheets) {
      for (const [, sdata] of Object.entries(_storyWs._dataSheets)) {
        _extraTables[sdata.tableName] = { columns: sdata.columns, rows: sdata.rows, bq_schema: sdata.schema || [] };
      }
    }
    const res = await fetch('/api/story/block', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        sql: queryCtx?.sql || '', project: queryCtx?.project || '',
        block_type: block.type, params: block.params,
        ...(_localData ? {
          local_columns: _localData.columns,
          local_rows:    _localData.rows,
          local_bq_schema: _localData.schema || [],
          local_extra_tables: _extraTables,
        } : {}),
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    renderStoryOutput(block.type, data, outputEl, block);
    if (screenshotBtn) screenshotBtn.disabled = false;
    if (block.folded) outputEl.style.display = 'none';
    else outputEl.style.display = '';
    _collapseBlockParams(block, outputEl);
  } catch(e) {
    outputEl.innerHTML = `<div class="story-output-error">${e.message}</div>`;
  } finally {
    playBtn.disabled = false;
  }
}

function makeTableResizable(table) {
  const ths = [...table.querySelectorAll('thead th')];
  if (!ths.length) return;

  // Measure natural text widths using canvas (works even before DOM insertion)
  const _cvs = makeTableResizable._cvs || (makeTableResizable._cvs = document.createElement('canvas'));
  const ctx = _cvs.getContext('2d');
  ctx.font = 'bold 12px monospace';
  const colWidths = ths.map(th => ctx.measureText(th.textContent.replace(/\s*[▴▾]$/, '').trim()).width);
  ctx.font = '12px monospace';
  [...table.querySelectorAll('tbody tr')].forEach(tr => {
    [...tr.querySelectorAll('td')].forEach((td, ci) => {
      if (ci >= colWidths.length) return;
      const w = ctx.measureText(td.textContent || '').width;
      if (w > colWidths[ci]) colWidths[ci] = w;
    });
  });

  table.style.tableLayout = 'fixed';
  ths.forEach((th, ci) => {
    const w = Math.min(400, Math.max(40, Math.ceil(colWidths[ci]) + 28));
    th.style.width = th.style.minWidth = th.style.maxWidth = w + 'px';
    th.style.position = 'relative';
    th.style.overflow = 'hidden';
    const handle = document.createElement('div');
    handle.className = 'col-resize-handle';
    handle.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation();
      const startX = e.clientX, startW = th.offsetWidth;
      handle.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      const onMove = e2 => {
        const w = Math.max(30, startW + e2.clientX - startX);
        th.style.width = th.style.minWidth = th.style.maxWidth = w + 'px';
      };
      const onUp = () => {
        handle.classList.remove('dragging');
        document.body.style.cursor = document.body.style.userSelect = '';
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
    th.appendChild(handle);
  });

  // Sync the sticky horizontal scrollbar for the main results table
  const scroll = table.closest('#results-scroll');
  if (scroll) _syncResultsHScrollbar(scroll, table);
}

function _syncResultsHScrollbar(scrollEl, table) {
  const bar   = document.getElementById('results-hscrollbar');
  const inner = document.getElementById('results-hscrollbar-inner');
  if (!bar || !inner) return;

  function updateBar() {
    const tableW  = table.scrollWidth;
    const wrapW   = scrollEl.clientWidth;
    const needBar = tableW > wrapW + 4;
    bar.style.display = needBar ? 'block' : 'none';
    inner.style.width  = tableW + 'px';
  }

  updateBar();

  // Remove old listeners before re-adding (table may be replaced)
  if (_syncResultsHScrollbar._offScroll) _syncResultsHScrollbar._offScroll();
  const onScroll = () => { bar.scrollLeft = scrollEl.scrollLeft; };
  const onBar    = () => { scrollEl.scrollLeft = bar.scrollLeft; };
  scrollEl.addEventListener('scroll', onScroll);
  bar.addEventListener('scroll', onBar);
  _syncResultsHScrollbar._offScroll = () => {
    scrollEl.removeEventListener('scroll', onScroll);
    bar.removeEventListener('scroll', onBar);
  };
}

function _addResizeHandle(outputEl, block) {
  const old = outputEl.querySelector(':scope > .story-resize-handle');
  if (old) old.remove();
  if (block && block.params && block.params.output_height) {
    outputEl.style.maxHeight = block.params.output_height + 'px';
    outputEl.style.overflowY = 'auto';
  }
  const handle = document.createElement('div');
  handle.className = 'story-resize-handle';
  handle.title = 'Drag to resize';
  outputEl.appendChild(handle);
  handle.addEventListener('mousedown', e => {
    e.preventDefault();
    handle.classList.add('dragging');
    const startY = e.clientY;
    const startH = outputEl.getBoundingClientRect().height;
    const MIN_H = 80, MAX_H = 800;
    const onMove = ev => {
      const h = Math.min(MAX_H, Math.max(MIN_H, startH + (ev.clientY - startY)));
      outputEl.style.maxHeight = h + 'px';
      outputEl.style.overflowY = 'auto';
    };
    const onUp = ev => {
      handle.classList.remove('dragging');
      if (block && block.params) {
        block.params.output_height = Math.round(Math.min(MAX_H, Math.max(MIN_H, startH + (ev.clientY - startY))));
        _schedSave();
      }
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

function renderPreviewTable(block, outputEl) {
  if (!block._lastData) return;
  const { columns, rows, schema, totalRows } = block._lastData;
  const sort = block._previewSort || { colIdx: null, dir: 1 };
  const _sm = schemaMap(schema);

  let displayRows = rows;
  if (sort.colIdx !== null) {
    displayRows = [...rows].sort((a, b) => {
      const av = a[sort.colIdx], bv = b[sort.colIdx];
      if (av === null || av === undefined) return 1;
      if (bv === null || bv === undefined) return -1;
      const an = Number(av), bn = Number(bv);
      const cmp = (!isNaN(an) && !isNaN(bn)) ? an - bn : String(av).localeCompare(String(bv));
      return cmp * sort.dir;
    });
  }
  // Honour the user-chosen row count (the backend already limits, but enforce here too)
  const maxRows = Number(block.params.amount) || rows.length;
  displayRows = displayRows.slice(0, maxRows);

  const wrap = document.createElement('div');
  wrap.className = 'lq-table-wrap';
  const tableWrap = document.createElement('div');
  tableWrap.className = 'lq-table-scroll';

  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const headerRow = document.createElement('tr');
  const idxTh = document.createElement('th');
  idxTh.className = 'tbl-idx-th';
  idxTh.textContent = '#';
  headerRow.appendChild(idxTh);
  columns.forEach((col, i) => {
    const th = document.createElement('th');
    const isActive = sort.colIdx === i;
    th.style.cursor = 'pointer';
    th.title = 'Sort by ' + col;
    const nameSpan = document.createElement('span');
    nameSpan.textContent = col + (isActive ? (sort.dir === 1 ? ' ▴' : ' ▾') : '');
    th.appendChild(nameSpan);
    addTypeIcon(th, _sm[col]);
    th.addEventListener('click', () => {
      if (sort.colIdx === i) sort.dir *= -1;
      else { sort.colIdx = i; sort.dir = 1; }
      block._previewSort = sort;
      renderPreviewTable(block, outputEl);
    });
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  displayRows.forEach((row, rowIdx) => {
    const r = document.createElement('tr');
    const idxTd = document.createElement('td');
    idxTd.className = 'tbl-idx-td';
    idxTd.textContent = rowIdx + 1;
    r.appendChild(idxTd);
    row.forEach(cell => {
      const td = document.createElement('td');
      if (cell === null || cell === undefined) { td.textContent = 'NULL'; td.className = 'null-cell'; }
      else td.textContent = String(cell);
      r.appendChild(td);
    });
    tbody.appendChild(r);
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  makeTableResizable(table);
  const totalCount = totalRows ?? rows.length;
  const countText = displayRows.length < totalCount
    ? `Showing ${displayRows.length.toLocaleString()} of ${totalCount.toLocaleString()} rows`
    : `${displayRows.length.toLocaleString()} row${displayRows.length !== 1 ? 's' : ''}`;
  wrap.appendChild(makeLqTableHeader(countText, table));
  wrap.appendChild(tableWrap);

  // Type legend — one entry per icon char, listing the actual SQL type names present
  const iconToTypes = new Map(); // char → Set of SQL type strings (preserves insertion order)
  columns.forEach(col => {
    const t = _sm[col];
    if (!t) return;
    const { char } = dtypeIconChar(t);
    if (!iconToTypes.has(char)) iconToTypes.set(char, new Set());
    iconToTypes.get(char).add(t);
  });
  if (iconToTypes.size > 0) {
    const legend = document.createElement('div');
    legend.className = 'preview-type-legend';
    iconToTypes.forEach((types, char) => {
      const firstType = [...types][0];
      const item = document.createElement('span');
      item.className = 'legend-item';
      const icon = document.createElement('span');
      icon.className = 'col-type-icon';
      icon.innerHTML = dtypeIconSvg(firstType);
      icon.style.color = dtypeColor(firstType);
      item.appendChild(icon);
      const lbl = document.createElement('span');
      lbl.textContent = [...types].join(', ');
      item.appendChild(lbl);
      legend.appendChild(item);
    });
    wrap.appendChild(legend);
  }

  outputEl.innerHTML = '';
  outputEl.appendChild(wrap);
  _addResizeHandle(outputEl, block);
}

function renderSearchTable(block, outputEl) {
  if (!block._lastData) return;
  const { columns, rows, total, showing } = block._lastData;
  const sort     = block._searchSort || { colIdx: null, dir: 1 };
  const colTypes = block._colTypes || {};

  outputEl.innerHTML = '';
  if (!block.params.filters)     block.params.filters = {};
  if (!block.params.filter_cols) {
    // Migrate from old all-columns format: keep only active ones
    block.params.filter_cols = Object.keys(block.params.filters).filter(col => {
      const f = block.params.filters[col]; if (!f) return false;
      const ct = colTypes[col] || 'string';
      if (ct === 'numeric') return (f.min != null && f.min !== '') || (f.max != null && f.max !== '');
      if (ct === 'date')    return !!(f.from || f.to);
      return !!(f.contains && f.contains.trim());
    });
  }
  const filters    = block.params.filters;
  const filterCols = block.params.filter_cols;

  // ── Filter panel ──────────────────────────────────────────────────────────
  if (columns.length) {
    function isFilterActive(col) {
      const f = filters[col]; if (!f) return false;
      const ct = colTypes[col] || 'string';
      if (ct === 'numeric') return (f.min != null && f.min !== '') || (f.max != null && f.max !== '');
      if (ct === 'date')    return !!(f.from || f.to);
      return !!(f.contains && f.contains.trim());
    }
    const activeCount = filterCols.filter(isFilterActive).length;

    const panel = document.createElement('div');
    panel.className = 'sf-panel';

    // Panel header
    const hdr = document.createElement('div');
    hdr.className = 'sf-panel-hdr';
    const hdrLeft = document.createElement('span');
    hdrLeft.style.cssText = 'display:flex;align-items:center;gap:5px;';
    hdrLeft.innerHTML = `<span style="font-size:11px;color:var(--text2)">Filters</span>`;
    if (activeCount) {
      const badge = document.createElement('span');
      badge.className = 'pf-count-badge'; badge.textContent = activeCount;
      hdrLeft.appendChild(badge);
    }
    hdr.appendChild(hdrLeft);
    if (filterCols.length) {
      const clrAll = document.createElement('button');
      clrAll.className = 'pf-clear-all'; clrAll.textContent = 'Clear all';
      clrAll.addEventListener('click', () => {
        block.params.filters = {}; block.params.filter_cols = [];
        renderSearchTable(block, outputEl);
      });
      hdr.appendChild(clrAll);
    }
    panel.appendChild(hdr);

    // Active filter chips
    const valid = filterCols.filter(c => columns.includes(c));
    if (valid.length) {
      const chipsWrap = document.createElement('div');
      chipsWrap.className = 'sf-chips';
      valid.forEach(col => {
        const ct = colTypes[col] || 'string';
        if (!filters[col]) filters[col] = {};
        const f = filters[col];
        const chip = document.createElement('div');
        chip.className = 'sf-chip' + (isFilterActive(col) ? ' sf-active' : '');
        const colLbl = document.createElement('span');
        colLbl.className = 'sf-chip-col'; colLbl.textContent = col;
        chip.appendChild(colLbl);
        function markActive() { chip.classList.toggle('sf-active', isFilterActive(col)); }

        if (ct === 'numeric') {
          const minI = document.createElement('input');
          minI.type = 'number'; minI.className = 'sf-inp sf-inp-num';
          minI.placeholder = 'min'; minI.value = f.min ?? '';
          minI.addEventListener('input', () => { f.min = minI.value !== '' ? Number(minI.value) : null; markActive(); });
          const sep = document.createElement('span'); sep.className = 'sf-sep'; sep.textContent = '–';
          const maxI = document.createElement('input');
          maxI.type = 'number'; maxI.className = 'sf-inp sf-inp-num';
          maxI.placeholder = 'max'; maxI.value = f.max ?? '';
          maxI.addEventListener('input', () => { f.max = maxI.value !== '' ? Number(maxI.value) : null; markActive(); });
          chip.appendChild(minI); chip.appendChild(sep); chip.appendChild(maxI);
        } else if (ct === 'date') {
          const fromI = document.createElement('input');
          fromI.type = 'date'; fromI.className = 'sf-inp sf-inp-date';
          fromI.value = f.from ?? '';
          fromI.addEventListener('change', () => { f.from = fromI.value || null; markActive(); });
          const sep = document.createElement('span'); sep.className = 'sf-sep'; sep.textContent = '–';
          const toI = document.createElement('input');
          toI.type = 'date'; toI.className = 'sf-inp sf-inp-date';
          toI.value = f.to ?? '';
          toI.addEventListener('change', () => { f.to = toI.value || null; markActive(); });
          chip.appendChild(fromI); chip.appendChild(sep); chip.appendChild(toI);
        } else {
          const opSel = document.createElement('select');
          opSel.className = 'sf-op-sel';
          [['contains','contains'],['equals','='],['starts_with','starts with'],['not_contains','≠ contains']].forEach(([val, lbl]) => {
            const o = document.createElement('option'); o.value = val; o.textContent = lbl;
            if ((f.op || 'contains') === val) o.selected = true;
            opSel.appendChild(o);
          });
          opSel.addEventListener('change', () => { f.op = opSel.value; markActive(); });
          const inp = document.createElement('input');
          inp.type = 'text'; inp.className = 'sf-inp sf-inp-str';
          inp.placeholder = 'value…'; inp.value = f.contains ?? '';
          inp.addEventListener('input', () => { f.contains = inp.value; markActive(); });
          chip.appendChild(opSel); chip.appendChild(inp);
        }
        const delBtn = document.createElement('button');
        delBtn.className = 'sf-del'; delBtn.textContent = '×'; delBtn.title = 'Remove filter';
        delBtn.addEventListener('click', () => {
          delete block.params.filters[col];
          block.params.filter_cols = block.params.filter_cols.filter(c => c !== col);
          renderSearchTable(block, outputEl);
        });
        chip.appendChild(delBtn);
        chipsWrap.appendChild(chip);
      });
      panel.appendChild(chipsWrap);
      if (activeCount) {
        const hint = document.createElement('div'); hint.className = 'pf-hint'; hint.textContent = 'Press ▶ to apply filters';
        panel.appendChild(hint);
      }
    }

    // ── Add-filter search row ───────────────────────────────────────────────
    const addRow = document.createElement('div');
    addRow.className = 'sf-add-row';
    const addLbl = document.createElement('span'); addLbl.className = 'sf-add-label'; addLbl.textContent = '+ filter:';
    addRow.appendChild(addLbl);
    const sw = document.createElement('div'); sw.className = 'sf-search-wrap';
    const si = document.createElement('input'); si.type = 'text'; si.className = 'sf-search-inp'; si.placeholder = 'Search column…';
    sw.appendChild(si);
    const dd = document.createElement('div'); dd.className = 'sf-col-dropdown'; dd.style.display = 'none';
    sw.appendChild(dd);

    function buildDd(term) {
      dd.innerHTML = '';
      const t = term.toLowerCase();
      const avail = columns.filter(c => !filterCols.includes(c) && (!t || c.toLowerCase().includes(t)));
      if (!avail.length) { dd.style.display = 'none'; return; }
      avail.forEach(col => {
        const ct = colTypes[col] || 'string';
        const opt = document.createElement('div'); opt.className = 'sf-col-opt';
        const ns = document.createElement('span'); ns.className = 'sf-col-name'; ns.textContent = col;
        const ts = document.createElement('span'); ts.className = 'sf-col-type-badge ' + (ct === 'numeric' ? 'num' : ct === 'date' ? 'dat' : 'str'); ts.textContent = ct;
        opt.appendChild(ns); opt.appendChild(ts);
        opt.addEventListener('mousedown', e => {
          e.preventDefault();
          if (!filterCols.includes(col)) filterCols.push(col);
          if (!filters[col]) filters[col] = {};
          si.value = '';
          renderSearchTable(block, outputEl);
        });
        dd.appendChild(opt);
      });
      dd.style.display = 'block';
    }
    si.addEventListener('input',  () => buildDd(si.value));
    si.addEventListener('focus',  () => buildDd(si.value));
    si.addEventListener('blur',   () => setTimeout(() => { dd.style.display = 'none'; }, 160));
    addRow.appendChild(sw);
    panel.appendChild(addRow);
    outputEl.appendChild(panel);
  }

  // ── Row count status ──────────────────────────────────────────────────────
  if (total != null) {
    const info = document.createElement('div');
    info.style.cssText = 'font-size:11px;color:var(--text2);padding:3px 4px 4px;';
    info.textContent = total === showing
      ? `${total.toLocaleString()} rows`
      : `Showing ${showing.toLocaleString()} of ${total.toLocaleString()} rows`;
    outputEl.appendChild(info);
  }

  // ── Data table ────────────────────────────────────────────────────────────
  let displayRows = rows;
  if (sort.colIdx !== null) {
    displayRows = [...rows].sort((a, b) => {
      const av = a[sort.colIdx], bv = b[sort.colIdx];
      if (av === null || av === undefined) return 1;
      if (bv === null || bv === undefined) return -1;
      const an = Number(av), bn = Number(bv);
      return ((!isNaN(an) && !isNaN(bn)) ? an - bn : String(av).localeCompare(String(bv))) * sort.dir;
    });
  }

  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const headerRow = document.createElement('tr');
  columns.forEach((col, i) => {
    const th = document.createElement('th');
    const isActive = sort.colIdx === i;
    th.className = 'story-sortable-th' + (isActive ? ' story-sort-active' : '');
    th.innerHTML = col + (isActive ? `<span style="opacity:0.65;margin-left:4px">${sort.dir === 1 ? '▴' : '▾'}</span>` : '');
    th.title = 'Sort by ' + col;
    th.addEventListener('click', () => {
      if (sort.colIdx === i) sort.dir *= -1; else { sort.colIdx = i; sort.dir = 1; }
      block._searchSort = sort;
      renderSearchTable(block, outputEl);
    });
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  displayRows.forEach(row => {
    const r = document.createElement('tr');
    row.forEach(cell => {
      const td = document.createElement('td');
      if (cell === null || cell === undefined) { td.textContent = 'NULL'; td.className = 'null-val'; }
      else td.textContent = String(cell);
      r.appendChild(td);
    });
    tbody.appendChild(r);
  });
  table.appendChild(tbody);
  makeTableResizable(table);
  outputEl.appendChild(table);

  _addResizeHandle(outputEl, block);
}

function renderStoryOutput(type, data, outputEl, block) {
  if (type === 'python_exec') {
    outputEl.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'story-py-output-wrap';
    if (data.error) {
      const errEl = document.createElement('div');
      errEl.className = 'story-output-error';
      errEl.textContent = data.error;
      wrap.appendChild(errEl);
    }
    if (data.output && data.output.trim()) {
      const pre = document.createElement('pre');
      pre.className = 'story-py-output-text';
      pre.textContent = data.output;
      wrap.appendChild(pre);
    }
    if (!data.error && !data.output?.trim()) {
      const info = document.createElement('div');
      info.className = 'story-output-running';
      info.textContent = 'No output. Use print() to show results.';
      wrap.appendChild(info);
    }
    outputEl.appendChild(wrap);
    _addResizeHandle(outputEl, block);
    return;
  }
  if (type === 'shape') {
    outputEl.innerHTML = `<div class="shape-grid">
      <span class="shape-key">Rows</span><span class="shape-val">${data.rows.toLocaleString()}</span>
      <span class="shape-key">Columns</span><span class="shape-val">${data.columns}</span>
    </div>`;
  } else if (type === 'preview') {
    block._lastData = data;
    block._previewSort = block._previewSort || { colIdx: null, dir: 1 };
    renderPreviewTable(block, outputEl);
  } else if (type === 'search') {
    block._lastData = data;
    block._searchSort = block._searchSort || { colIdx: null, dir: 1 };
    if (data.col_types) block._colTypes = data.col_types;
    if (!block.params.filters) block.params.filters = {};
    renderSearchTable(block, outputEl);
  } else if (type === 'describe') {
    block._lastData = data;
    renderDescribeTable(block);
  } else if (type === 'histogram') {
    const { histogram, column } = data;
    if (!histogram.length) { outputEl.innerHTML = '<div class="story-output-error">No data to plot.</div>'; return; }
    const W = block.params.width || 480, H = block.params.height || 480;
    const xRot = -(+block.params.x_rot || 0), yRot = -(+block.params.y_rot || 0);
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    renderEChart(outputEl, {
      backgroundColor: '#ffffff',
      grid: { left: 56, right: 16, top: 16, bottom: xRot ? 72 : 44 },
      tooltip: { ..._ecTooltip(), trigger: 'axis', axisPointer: { type: 'shadow' },
        formatter: p => `${p[0].name}: ${p[0].value.toLocaleString()}` },
      xAxis: { ..._ecAxis(column, xRot), type: 'category', data: histogram.map(b => b.label) },
      yAxis: { ..._ecAxis('Count', yRot), type: 'value' },
      series: [{ type: 'bar', data: histogram.map(b => b.count),
        itemStyle: { color: accent, opacity: 0.82 }, barCategoryGap: '8%' }],
    }, W, H);
  } else if (type === 'col_describe') {
    const d = data;
    const dtype = d.nulls === d.total ? 'No data' : d.dtype;
    const color = dtypeColor(dtype);
    const nullHi = d.null_pct > 10;
    let statsHtml = `
      <div class="coldesc-stat"><span class="coldesc-key">Total</span><span class="coldesc-val">${d.total.toLocaleString()}</span></div>
      <div class="coldesc-stat"><span class="coldesc-key">Non-null</span><span class="coldesc-val">${d.non_null.toLocaleString()}</span></div>
      <div class="coldesc-stat"><span class="coldesc-key">Nulls</span><span class="coldesc-val${nullHi ? ' describe-null-hi' : ''}">${d.nulls.toLocaleString()} (${d.null_pct.toFixed(1)}%)</span></div>`;
    if (d.kind === 'numeric') {
      const biasColor = d.bias > 0.05 ? '#ce9178' : d.bias < -0.05 ? '#569cd6' : '#4ec9b0';
      statsHtml += `
        <div class="coldesc-stat"><span class="coldesc-key">Min</span><span class="coldesc-val">${fmtNum(d.min)}</span></div>
        <div class="coldesc-stat"><span class="coldesc-key">Max</span><span class="coldesc-val">${fmtNum(d.max)}</span></div>
        <div class="coldesc-stat"><span class="coldesc-key">Mean</span><span class="coldesc-val">${fmtNum(d.mean)}</span></div>
        <div class="coldesc-stat"><span class="coldesc-key">Median</span><span class="coldesc-val">${fmtNum(d.q50)}</span></div>
        <div class="coldesc-stat"><span class="coldesc-key">Std</span><span class="coldesc-val">${fmtNum(d.std)}</span></div>
        <div class="coldesc-stat"><span class="coldesc-key">Q25</span><span class="coldesc-val">${fmtNum(d.q25)}</span></div>
        <div class="coldesc-stat"><span class="coldesc-key">Q75</span><span class="coldesc-val">${fmtNum(d.q75)}</span></div>
        <div class="coldesc-stat"><span class="coldesc-key">Bias</span><span class="coldesc-val" style="color:${biasColor}" title="(mean − median) / range">${d.bias != null ? d.bias.toFixed(4) : '—'}</span></div>`;
    } else {
      statsHtml += `<div class="coldesc-stat"><span class="coldesc-key">Distinct</span><span class="coldesc-val">${(d.distinct||0).toLocaleString()}</span></div>`;
    }
    let topHtml = '';
    if (d.kind === 'categorical' && d.top && d.top.length) {
      const maxCnt = d.top[0].count;
      topHtml = `<div class="coldesc-top"><div class="coldesc-top-label">Top values</div>` +
        d.top.map(t => `<div class="coldesc-top-row">
          <span class="coldesc-top-val" title="${t.value}">${t.value}</span>
          <div class="coldesc-bar-wrap"><div class="coldesc-bar" style="width:${Math.max(2, Math.round(t.count/maxCnt*100))}%"></div></div>
          <span class="coldesc-count">${t.count.toLocaleString()}</span>
        </div>`).join('') + `</div>`;
    }
    outputEl.innerHTML = `<div>
      <div class="coldesc-header">
        <span class="coldesc-name">${d.column}</span>
        <span class="coldesc-badge" style="color:${color}">${dtype}</span>
      </div>
      <div class="coldesc-stats">${statsHtml}</div>
      ${topHtml}
    </div>`;

    // Distribution + boxplot chart for numeric columns
    if (d.kind === 'numeric' && d.histogram?.length) {
      const W = block.params.width || 480;
      const chartH = 220; // total height for both grids
      const distH = 0.68; // fraction for histogram grid
      const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();

      const bins = d.histogram;
      const xMin = d.min;
      const xMax = d.max;
      const binW = bins[0].x1 - bins[0].x0;
      // bar data: each bin centre + count
      const barData = bins.map(b => [b.x0 + binW / 2, b.count]);

      const distWrap = document.createElement('div');
      distWrap.className = 'coldesc-dist-wrap';
      outputEl.querySelector('div').appendChild(distWrap);

      renderEChart(distWrap, {
        backgroundColor: '#ffffff',
        grid: [
          { left: 48, right: 16, top: 12, bottom: Math.round(chartH * (1 - distH)) + 28 },
          { left: 48, right: 16, top: Math.round(chartH * distH) + 4, bottom: 28 },
        ],
        xAxis: [
          { gridIndex: 0, type: 'value', min: xMin, max: xMax, show: false },
          { gridIndex: 1, type: 'value', min: xMin, max: xMax,
            ..._ecAxis(d.column, 0),
            axisLabel: { fontSize: 12 },
          },
        ],
        yAxis: [
          { gridIndex: 0, type: 'value', ..._ecAxis('count', 0),
            axisLabel: { fontSize: 11 }, splitLine: { lineStyle: { color: 'rgba(128,128,128,0.12)' } } },
          { gridIndex: 1, type: 'category', data: [''], axisLabel: { show: false },
            axisTick: { show: false }, axisLine: { show: false } },
        ],
        tooltip: {
          ..._ecTooltip(),
          trigger: 'item',
          formatter: p => {
            if (p.seriesType === 'bar') {
              const b = bins[p.dataIndex];
              return `[${fmtNum(b.x0)}, ${fmtNum(b.x1)})<br>count: <b>${p.value[1]}</b>`;
            }
            if (p.seriesType === 'boxplot') {
              const [lo, q1, med, q3, hi] = p.data;
              return `Min: ${fmtNum(lo)}<br>Q25: ${fmtNum(q1)}<br>Median: ${fmtNum(med)}<br>Q75: ${fmtNum(q3)}<br>Max: ${fmtNum(hi)}`;
            }
            return '';
          },
        },
        series: [
          // Histogram bars
          {
            type: 'bar', name: 'count',
            xAxisIndex: 0, yAxisIndex: 0,
            data: barData,
            barWidth: '96%',
            itemStyle: { color: accent, opacity: 0.75 },
            markLine: {
              silent: true,
              symbol: 'none',
              lineStyle: { width: 1.5 },
              label: { fontSize: 12, position: 'insideEndTop' },
              data: [
                { xAxis: d.mean,  lineStyle: { color: '#f44747', type: 'solid' },  label: { formatter: `mean`, color: '#f44747' } },
                { xAxis: d.q50,   lineStyle: { color: '#ce9178', type: 'dashed' }, label: { formatter: `median`, color: '#ce9178' } },
              ],
            },
          },
          // Boxplot
          {
            type: 'boxplot', name: 'box',
            xAxisIndex: 1, yAxisIndex: 1,
            layout: 'horizontal',
            data: [[d.whisker_lo, d.q25, d.q50, d.q75, d.whisker_hi]],
            itemStyle: { color: 'rgba(86,156,214,0.25)', borderColor: '#569cd6', borderWidth: 1.5 },
            boxWidth: ['40%', '60%'],
          },
          // Mean dot on boxplot row
          {
            type: 'scatter', name: 'mean',
            xAxisIndex: 1, yAxisIndex: 1,
            data: [[d.mean, '']],
            symbolSize: 7,
            itemStyle: { color: '#f44747' },
            tooltip: { formatter: () => `mean: ${fmtNum(d.mean)}` },
          },
        ],
      }, W, chartH);
    }
  } else if (type === 'scatter') {
    const W = block.params.width || 480, H = block.params.height || 480;
    const xRot = -(+block.params.x_rot || 0), yRot = -(+block.params.y_rot || 0);
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    const scSeries = data.grouped
      ? data.series.map((s, i) => ({
          type: 'scatter', name: String(s.label),
          data: s.x.map((x, j) => [x, s.y[j]]),
          symbolSize: 5, itemStyle: { color: PLOT_COLORS[i % PLOT_COLORS.length], opacity: 0.7 },
        }))
      : [{ type: 'scatter', name: '', data: (data.x || []).map((x, j) => [x, (data.y || [])[j]]),
           symbolSize: 5, itemStyle: { color: accent, opacity: 0.7 } }];
    renderEChart(outputEl, {
      backgroundColor: '#ffffff',
      grid: { left: 60, right: data.grouped ? 130 : 20, top: 16, bottom: xRot ? 72 : 44 },
      tooltip: { ..._ecTooltip(), trigger: 'item',
        formatter: p => `${data.x_col}: ${p.value[0]}<br>${data.y_col}: ${p.value[1]}` },
      legend: _ecLegend(!!data.grouped),
      xAxis: { ..._ecAxis(data.x_col, xRot), type: 'value' },
      yAxis: { ..._ecAxis(data.y_col, yRot), type: 'value' },
      series: scSeries,
    }, W, H);
  } else if (type === 'lineplot') {
    const W = block.params.width || 480, H = block.params.height || 480;
    const xRot = -(+block.params.x_rot || 0), yRot = -(+block.params.y_rot || 0);
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    const lnXtype = data.x && data.x.length && typeof data.x[0] === 'number' ? 'value' : 'category';
    const lnSeries = data.grouped
      ? data.series.map((s, i) => ({
          type: 'line', name: String(s.label),
          data: lnXtype === 'value' ? s.x.map((x, j) => [x, s.y[j]]) : s.y,
          lineStyle: { color: PLOT_COLORS[i % PLOT_COLORS.length], width: 1.8 },
          itemStyle: { color: PLOT_COLORS[i % PLOT_COLORS.length] },
          symbol: 'none',
        }))
      : [{ type: 'line', name: '',
           data: lnXtype === 'value' ? data.x.map((x, j) => [x, data.y[j]]) : data.y,
           lineStyle: { color: accent, width: 1.8 }, itemStyle: { color: accent }, symbol: 'none' }];
    const lnXAxis = lnXtype === 'category'
      ? { ..._ecAxis(data.x_col, xRot), type: 'category', data: data.grouped ? data.series[0]?.x : data.x }
      : { ..._ecAxis(data.x_col, xRot), type: 'value' };
    renderEChart(outputEl, {
      backgroundColor: '#ffffff',
      grid: { left: 60, right: data.grouped ? 130 : 20, top: 16, bottom: xRot ? 72 : 44 },
      tooltip: { ..._ecTooltip(), trigger: 'axis' },
      legend: _ecLegend(!!data.grouped),
      xAxis: lnXAxis,
      yAxis: { ..._ecAxis(data.y_col, yRot), type: 'value' },
      series: lnSeries,
    }, W, H);
  } else if (type === 'boxplot') {
    block._lastData = data;
    renderBoxplot(block);
    return;
  } else if (type === 'outlier_detect') {
    block._lastData = data;
    renderOutlierChart(block);
    return;
  } else if (type === 'linreg') {
    block._lastData = data;
    renderLinReg(block);
    return;
  } else if (type === 'hypo_test') {
    block._lastData = data;
    renderHypoTest(block);
    return;
  } else if (type === 'barplot') {
    block._lastData = data;
    renderBarplot(block);
    return;
  } else if (type === 'corr_matrix') {
    block._lastData = data;
    renderCorrMatrix(block);
    return;
  } else if (type === 'feature_importance') {
    block._lastData = data;
    renderFeatureImportance(block);
    return;
  } else if (type === 'predict_model') {
    block._lastData = data;
    renderPredictModel(block);
    return;
  } else if (type === 'data_split') {
    block._lastData = data;
    renderDataSplit(block);
    return;
  } else if (type === 'sql_query') {
    if (!data) return;
    const { columns, rows, totalRows } = data;
    if (!rows || !rows.length) {
      outputEl.innerHTML = '<div class="story-output-error">0 rows returned.</div>';
      return;
    }
    const wrap = document.createElement('div');
    wrap.className = 'lq-table-wrap';
    const tableWrap = document.createElement('div');
    tableWrap.className = 'lq-table-scroll';
    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    const _sm = schemaMap(data.schema);
    const _sqIdxTh = document.createElement('th'); _sqIdxTh.className = 'tbl-idx-th'; _sqIdxTh.textContent = '#'; hr.appendChild(_sqIdxTh);
    columns.forEach(c => {
      const th = document.createElement('th');
      th.textContent = c;
      addTypeIcon(th, _sm[c]);
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    table.appendChild(thead);
    const tbody = document.createElement('tbody');
    rows.forEach((row, ri) => {
      const tr = document.createElement('tr');
      const _sqIdxTd = document.createElement('td'); _sqIdxTd.className = 'tbl-idx-td'; _sqIdxTd.textContent = ri + 1; tr.appendChild(_sqIdxTd);
      row.forEach(val => {
        const td = document.createElement('td');
        td.textContent = val === null || val === undefined ? '' : val;
        if (val === null || val === undefined) td.className = 'null-cell';
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    makeTableResizable(table);
    wrap.appendChild(makeLqTableHeader(`${totalRows.toLocaleString()} row${totalRows !== 1 ? 's' : ''}`, table));
    wrap.appendChild(tableWrap);
    outputEl.innerHTML = '';
    outputEl.appendChild(wrap);
    _addResizeHandle(outputEl, block);
    return;
  } else if (type === 'edit_add_row') {
    renderEditAddRow(block);
    return;
  } else if (type === 'edit_add_column') {
    renderEditAddColumn(block);
    return;
  } else if (type === 'value_count') {
    const { column, values, total } = data;
    if (!values || !values.length) { outputEl.innerHTML = '<div class="story-output-error">No data.</div>'; return; }
    const nullColor = '#f48fb1';
    const barColor = '#4dd0e1';
    const maxCount = values[0].count;
    let rows = values.map(v => {
      const isNull = v.value === null;
      const pct = total > 0 ? (v.count / total * 100).toFixed(1) : '0.0';
      const barW = maxCount > 0 ? Math.max(2, Math.round(v.count / maxCount * 100)) : 0;
      const valLabel = isNull ? '<span style="color:' + nullColor + ';font-style:italic">NULL</span>' : _escHtml(String(v.value));
      return `<tr>
        <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${valLabel}</td>
        <td style="text-align:right;padding-right:8px">${v.count.toLocaleString()}</td>
        <td style="text-align:right;padding-right:8px;color:var(--text-dim)">${pct}%</td>
        <td style="width:120px;padding-right:8px"><div style="background:${isNull ? nullColor : barColor};height:8px;border-radius:4px;width:${barW}%;opacity:0.75"></div></td>
      </tr>`;
    }).join('');
    outputEl.innerHTML = `<div class="value-count-wrap">
      <div style="font-size:11px;color:var(--text-dim);margin-bottom:6px">Column: <b style="color:var(--text)">${_escHtml(column)}</b> — ${total.toLocaleString()} total rows</div>
      <div class="lq-table-scroll"><table><thead><tr><th>Value</th><th style="text-align:right">Count</th><th style="text-align:right">%</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>`;
    makeTableResizable(outputEl.querySelector('table'));
    _addResizeHandle(outputEl, block);
    return;
  }
  _addResizeHandle(outputEl, block);
}

function renderBarplot(block) {
  const blockEl = document.querySelector(`.story-block[data-id="${block.id}"]`);
  if (!blockEl || !block._lastData) return;
  const outputEl = blockEl.querySelector('.story-output');
  const d = block._lastData;
  if (!d.categories || !d.categories.length) {
    outputEl.innerHTML = '<div class="story-output-error">No data.</div>'; return;
  }
  const W     = block.params.width  || 480;
  const H     = block.params.height || 480;
  const xRot  = +block.params.x_rot || 0;
  const horiz = block.params.orientation === 'horizontal';
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();

  const hasLegend = !!d.grouped;
  const gridRight = hasLegend ? 130 : 20;

  let series;
  if (d.grouped) {
    series = d.series.map((s, i) => ({
      type: 'bar', name: String(s.label), data: s.values,
      itemStyle: { color: PLOT_COLORS[i % PLOT_COLORS.length] },
      barMaxWidth: 40,
    }));
  } else {
    series = [{
      type: 'bar', data: d.values,
      itemStyle: { color: accent, opacity: 0.85 },
      barMaxWidth: 40,
    }];
  }

  const catAxis = {
    type: 'category', data: d.categories,
    axisLine: { lineStyle: { color: '#ccc' } },
    axisLabel: { color: '#555', fontSize: 12, rotate: horiz ? 0 : xRot },
    splitLine: { show: false },
  };
  const valAxis = {
    ..._ecAxis(d.y_label),
    type: 'value',
  };

  renderEChart(outputEl, {
    backgroundColor: '#ffffff',
    grid: {
      left:   horiz ? 90  : 56,
      right:  gridRight,
      top:    16,
      bottom: (!horiz && xRot) ? 72 : 44,
    },
    tooltip: {
      ..._ecTooltip(),
      trigger: 'axis',
      axisPointer: { type: 'shadow' },
    },
    legend: _ecLegend(hasLegend),
    xAxis: horiz ? valAxis : catAxis,
    yAxis: horiz ? catAxis : valAxis,
    series,
  }, W, H);
  _addResizeHandle(outputEl, block);
}

function _simpleLinReg(xs, ys) {
  const n = xs.length;
  if (n < 2) return { slope: 0, intercept: ys[0] || 0 };
  let sx=0, sy=0, sxy=0, sx2=0;
  for (let i=0; i<n; i++) { sx+=xs[i]; sy+=ys[i]; sxy+=xs[i]*ys[i]; sx2+=xs[i]*xs[i]; }
  const mx=sx/n, my=sy/n;
  const num=sxy/n-mx*my, den=sx2/n-mx*mx;
  return { slope: den===0?0:num/den, intercept: my-(den===0?0:num/den)*mx };
}

function renderCorrMatrix(block) {
  const blockEl = document.querySelector(`.story-block[data-id="${block.id}"]`);
  if (!blockEl || !block._lastData) return;
  const outputEl = blockEl.querySelector('.story-output');
  const { columns, matrix, raw_data } = block._lastData;
  if (!columns || columns.length < 2) {
    outputEl.innerHTML = '<div class="story-output-error">Need at least 2 numeric columns.</div>'; return;
  }
  if (!matrix) {
    outputEl.innerHTML = '<div class="story-output-error">No correlation data.</div>'; return;
  }
