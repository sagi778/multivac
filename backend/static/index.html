  const n = columns.length;
  const W = block.params.width  || 520;
  const H = block.params.height || 480;

  if (display === 'scatter' && raw_data) {
    // ── Pair plot using Plotly.js ─────────────────────────────────────────────
    const _renderPlotlySM = () => {
      const trace = {
        type: 'splom',
        dimensions: columns.map(col => ({
          label: col,
          values: (raw_data[col] || []).map(v => (v === null ? null : +v))
        })),
        marker: { color: 'rgba(80,130,200,0.45)', size: 3, line: { width: 0 } },
        diagonal: { visible: true },
        showupperhalf: true,
        showlowerhalf: true,
        unselected: { marker: { opacity: 0.05 } },
      };

      const layout = {
        width: W, height: H,
        showlegend: false,
        paper_bgcolor: '#ffffff',
        dragmode: 'select',
        hovermode: 'closest',
        margin: { l: 80, r: 10, t: 10, b: 80 },
      };

      // Top correlations table
      const _smPairs = matrix.filter(([i,j]) => i < j).sort((a,b) => Math.abs(b[2]) - Math.abs(a[2]));
      const _smTopN  = _smPairs.slice(0, Math.min(12, _smPairs.length));
      const _smTbl   = document.createElement('table');
      _smTbl.className = 'linreg-group-tbl';
      const _smThead = _smTbl.createTHead();
      const _smHrow  = _smThead.insertRow();
      ['Col A','Col B','r','r²'].forEach(h => { const th=document.createElement('th'); th.textContent=h; _smHrow.appendChild(th); });
      const _smTbody = _smTbl.createTBody();
      _smTopN.forEach(([i,j,r]) => {
        const tr = _smTbody.insertRow();
        if (isFinite(r) && Math.abs(r) >= 0.7) tr.className = 'lr-g-hi';
        tr.insertCell().textContent = columns[i];
        tr.insertCell().textContent = columns[j];
        tr.insertCell().textContent = isFinite(r) ? r.toFixed(4) : '—';
        tr.insertCell().textContent = isFinite(r) ? (r*r).toFixed(3) : '—';
      });

      const _smPlotWrap = document.createElement('div');
      _smPlotWrap.style.cssText = `width:${W}px;height:${H}px;flex-shrink:0`;
      const _smWrap = document.createElement('div');
      _smWrap.className = 'linreg-wrap';
      _smWrap.appendChild(_smPlotWrap);
      const _smScroll = document.createElement('div');
      _smScroll.className = 'lq-table-scroll';
      _smScroll.style.alignSelf = 'flex-start';
      _smScroll.appendChild(_smTbl);
      _smWrap.appendChild(_smScroll);
      outputEl.innerHTML = '';
      outputEl.appendChild(_smWrap);

      Plotly.newPlot(_smPlotWrap, [trace], layout, { displayModeBar: false, responsive: false });
    };

    if (window.Plotly) {
      _renderPlotlySM();
    } else {
      outputEl.innerHTML = '<div style="padding:16px;color:#999;font-size:12px;">Loading Plotly.js…</div>';
      const _pls = document.createElement('script');
      _pls.src = 'https://cdn.plot.ly/plotly-cartesian-2.35.2.min.js';
      _pls.onload = _renderPlotlySM;
      _pls.onerror = () => { outputEl.innerHTML = '<div class="story-output-error">Failed to load Plotly.js from CDN.</div>'; };
      document.head.appendChild(_pls);
    }

  } else {
    // ── r² heatmap ────────────────────────────────────────────────────────
    const rev = [...columns].reverse();
    const heatData = matrix.map(([i,j,v]) => [j, n-1-i, +(v*v).toFixed(4)]);

    // Top correlations table (linreg-group-tbl style)
    const _cmPairs = matrix.filter(([i,j]) => i < j).sort((a,b) => Math.abs(b[2]) - Math.abs(a[2]));
    const _cmTopN = _cmPairs.slice(0, Math.min(12, _cmPairs.length));
    const _cmTbl = document.createElement('table');
    _cmTbl.className = 'linreg-group-tbl';
    const _cmThead = _cmTbl.createTHead();
    const _cmHrow = _cmThead.insertRow();
    ['Col A', 'Col B', 'r', 'r²'].forEach(h => {
      const th = document.createElement('th'); th.textContent = h; _cmHrow.appendChild(th);
    });
    const _cmTbody = _cmTbl.createTBody();
    _cmTopN.forEach(([i, j, r]) => {
      const tr = _cmTbody.insertRow();
      if (isFinite(r) && Math.abs(r) >= 0.7) tr.className = 'lr-g-hi';
      tr.insertCell().textContent = columns[i];
      tr.insertCell().textContent = columns[j];
      tr.insertCell().textContent = isFinite(r) ? r.toFixed(4) : '—';
      tr.insertCell().textContent = isFinite(r) ? (r * r).toFixed(3) : '—';
    });

    const _cmPlotWrap = document.createElement('div');
    _cmPlotWrap.style.flexShrink = '0';
    const _cmWrap = document.createElement('div');
    _cmWrap.className = 'linreg-wrap';
    _cmWrap.appendChild(_cmPlotWrap);
    const _cmScroll = document.createElement('div');
    _cmScroll.className = 'lq-table-scroll';
    _cmScroll.style.alignSelf = 'flex-start';
    _cmScroll.appendChild(_cmTbl);
    _cmWrap.appendChild(_cmScroll);
    outputEl.innerHTML = '';
    outputEl.appendChild(_cmWrap);
    renderEChart(_cmPlotWrap, {
      backgroundColor: '#ffffff',
      grid: { left:80, right:20, top:20, bottom:80 },
      tooltip: {
        ..._ecTooltip(),
        formatter: p => {
          const r = matrix.find(m=>m[0]===(n-1-p.data[1])&&m[1]===p.data[0]);
          const rVal = r && isFinite(r[2]) ? r[2].toFixed(3) : '—';
          return `${columns[p.data[0]]} × ${rev[p.data[1]]}<br/>r² = <b>${p.data[2].toFixed(3)}</b><br/>r = ${rVal}`;
        },
      },
      xAxis: { type:'category', data:columns, axisLabel:{rotate:45,color:'#555',fontSize:12}, axisLine:{lineStyle:{color:'#ccc'}}, splitArea:{show:true} },
      yAxis: { type:'category', data:rev, axisLabel:{color:'#555',fontSize:12}, axisLine:{lineStyle:{color:'#ccc'}}, splitArea:{show:true} },
      visualMap: { min:0, max:1, calculable:true, orient:'horizontal', left:'center', bottom:2, itemHeight:100, textStyle:{color:'#555',fontSize:11}, inRange:{color:['#f7f7f7','#fddbc7','#f4a582','#d6604d','#b2182b']} },
      series: [{ type:'heatmap', data:heatData, label:{show:n<=12, formatter:p=>p.data[2].toFixed(2), fontSize:n<=8?12:10, color:'#333'}, emphasis:{itemStyle:{shadowBlur:6,shadowColor:'rgba(0,0,0,0.3)'}} }],
    }, W, H);
  }
  _addResizeHandle(outputEl, block);
}

function renderFeatureImportance(block) {
  const blockEl = document.querySelector(`.story-block[data-id="${block.id}"]`);
  if (!blockEl || !block._lastData) return;
  const outputEl = blockEl.querySelector('.story-output');
  const { features, y_col, model_fit, model: modelName } = block._lastData;
  if (!features || !features.length) { outputEl.innerHTML = '<div class="story-output-error">No data.</div>'; return; }

  const W = block.params.width  || 480;
  const H = Math.max(block.params.height || 480, features.length * 34 + 60);
  const names = features.map(f => f.feature);
  const vals  = features.map(f => f.importance);

  outputEl.innerHTML = '';

  // ── Model fit stats strip ────────────────────────────────────────────────
  if (model_fit) {
    const strip = document.createElement('div');
    strip.style.cssText = 'display:flex;align-items:center;gap:12px;padding:5px 12px;background:#f7f8fa;border-bottom:1px solid #e4e5e7;font-size:11px;flex-wrap:wrap;';
    const taskBadge = document.createElement('span');
    taskBadge.style.cssText = 'font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#666;padding:1px 6px;background:#e8e9eb;border-radius:3px;';
    taskBadge.textContent = model_fit.task;
    strip.appendChild(taskBadge);
    if (modelName) {
      const mb = document.createElement('span');
      mb.style.cssText = 'font-size:10px;color:#888;font-style:italic;';
      mb.textContent = modelName.replace(/_/g,' ');
      strip.appendChild(mb);
    }

    function addStat(label, value) {
      const s = document.createElement('span');
      s.style.cssText = 'color:#555;';
      s.innerHTML = `${label}: <b style="color:#333;font-family:monospace">${value}</b>`;
      strip.appendChild(s);
    }

    const fmtNum = v => Math.abs(v) >= 10000 || (Math.abs(v) < 0.001 && v !== 0) ? v.toExponential(2) : parseFloat(v.toFixed(4)).toString();

    if (model_fit.task === 'regression') {
      if (model_fit.r2   != null) addStat('R²',   model_fit.r2.toFixed(3));
      if (model_fit.rmse != null) addStat('RMSE', fmtNum(model_fit.rmse));
    } else {
      if (model_fit.accuracy  != null) addStat('Accuracy',  (model_fit.accuracy * 100).toFixed(1) + '%');
      if (model_fit.precision != null) addStat('Precision', (model_fit.precision * 100).toFixed(1) + '%');
      if (model_fit.n_classes) addStat('Classes', model_fit.n_classes);
    }
    outputEl.appendChild(strip);
  }

  // ── Bar chart ────────────────────────────────────────────────────────────
  const chartDiv = document.createElement('div');
  chartDiv.style.cssText = `width:${W}px;height:${H}px`;
  outputEl.appendChild(chartDiv);
  echarts.init(chartDiv, null, {}).setOption({
    backgroundColor: '#ffffff',
    grid: { left:130, right:70, top:30, bottom:20 },
    tooltip: {
      ..._ecTooltip(),
      formatter: p => {
        const f = features[features.length-1-p.dataIndex];
        let s = `<b>${f.feature}</b><br/>Importance: <b>${isFinite(f.importance) ? f.importance.toFixed(3) : '—'}</b>`;
        if (f.r !== null && f.r !== undefined) s += `<br/>r = ${f.r.toFixed(3)}`;
        if (f.p_value !== null && f.p_value !== undefined) s += `<br/>p = ${f.p_value<0.001?'<0.001':f.p_value.toFixed(3)}`;
        s += `<br/>Type: ${f.type}`;
        return s;
      },
    },
    xAxis: { type:'value', min:0, max:1, name:`r² / η²  →  ${y_col}`, nameLocation:'middle', nameGap:28, nameTextStyle:{color:'#888',fontSize:12}, axisLabel:{color:'#555',fontSize:12}, axisLine:{lineStyle:{color:'#ccc'}}, splitLine:{lineStyle:{color:'#eee'}} },
    yAxis: { type:'category', data:[...names].reverse(), axisLabel:{color:'#444',fontSize:12} },
    series: [{
      type: 'bar', barCategoryGap: '25%',
      data: [...vals].reverse().map(v => ({ value:v, itemStyle:{ color: v>0.5?'#d73027':v>0.25?'#f4a582':v>0.1?'#4ec9b0':'#aaa' } })),
      label: { show:true, position:'right', formatter:p=>p.value.toFixed(3), fontSize:12, color:'#555' },
    }],
  });
  _addResizeHandle(outputEl, block);
}

function _rebuildResultsTable(ws) {

function renderPredictModel(block) {
  const blockEl = document.querySelector(`.story-block[data-id="${block.id}"]`);
  if (!blockEl || !block._lastData) return;
  const outputEl = blockEl.querySelector('.story-output');
  const d = block._lastData;
  const { y_col, model: modelName, is_classif, is_split,
          predictions, actuals, row_indices,
          predictions_train, actuals_train, row_indices_train,
          model_fit, model_fit_train, n_samples, n_test } = d;
  outputEl.innerHTML = '';

  const fmt = v => Math.abs(v) >= 10000 || (Math.abs(v) < 0.001 && v !== 0) ? v.toExponential(2) : parseFloat(v.toFixed(4)).toString();
  const pctFmt = v => v != null ? (v * 100).toFixed(1) + '%' : '—';

  // ── Chart + metrics side-by-side ─────────────────────────────────────────
  const W = block.params.width  || 480;
  const H = block.params.height || 480;
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;padding:10px 14px 6px;';

  // left: chart
  const chartDiv = document.createElement('div');
  chartDiv.style.cssText = `width:${W}px;height:${H}px;flex:0 0 auto;`;
  row.appendChild(chartDiv);

  // right: metrics table
  if (model_fit) {
    const tblWrap = document.createElement('div');
    tblWrap.style.cssText = 'flex:1;min-width:160px;max-width:260px;';

    // Header: task badge + model name
    const hdr = document.createElement('div');
    hdr.style.cssText = 'display:flex;align-items:center;gap:7px;margin-bottom:8px;';
    const taskBadge = document.createElement('span');
    taskBadge.style.cssText = 'font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);padding:2px 7px;background:var(--bg3);border:1px solid var(--border);border-radius:3px;';
    taskBadge.textContent = model_fit.task;
    hdr.appendChild(taskBadge);
    const mb = document.createElement('span');
    mb.style.cssText = 'font-size:11px;color:var(--text-dim);font-style:italic;';
    mb.textContent = modelName.replace(/_/g, ' ');
    hdr.appendChild(mb);
    tblWrap.appendChild(hdr);

    // Build rows
    const rows = [];
    if (model_fit.task === 'regression') {
      rows.push({ label: 'R²',
        trainVal: model_fit_train?.r2   != null ? model_fit_train.r2.toFixed(4) : null,
        testVal:  model_fit?.r2         != null ? model_fit.r2.toFixed(4)        : null,
        hiTrain:  model_fit_train?.r2   != null && model_fit_train.r2 >= 0.7,
        hiTest:   model_fit?.r2         != null && model_fit.r2 >= 0.7 });
      rows.push({ label: 'RMSE',
        trainVal: model_fit_train?.rmse != null ? fmt(model_fit_train.rmse) : null,
        testVal:  model_fit?.rmse       != null ? fmt(model_fit.rmse)       : null });
      rows.push({ label: 'MAE',
        trainVal: model_fit_train?.mae  != null ? fmt(model_fit_train.mae)  : null,
        testVal:  model_fit?.mae        != null ? fmt(model_fit.mae)        : null });
    } else {
      rows.push({ label: 'Accuracy',
        trainVal: pctFmt(model_fit_train?.accuracy),
        testVal:  pctFmt(model_fit?.accuracy),
        hiTrain:  model_fit_train?.accuracy != null && model_fit_train.accuracy >= 0.9,
        hiTest:   model_fit?.accuracy       != null && model_fit.accuracy >= 0.9 });
      rows.push({ label: 'Precision',
        trainVal: pctFmt(model_fit_train?.precision),
        testVal:  pctFmt(model_fit?.precision) });
      rows.push({ label: 'Recall',
        trainVal: pctFmt(model_fit_train?.recall),
        testVal:  pctFmt(model_fit?.recall) });
      rows.push({ label: 'F1',
        trainVal: pctFmt(model_fit_train?.f1),
        testVal:  pctFmt(model_fit?.f1),
        hiTrain:  model_fit_train?.f1 != null && model_fit_train.f1 >= 0.9,
        hiTest:   model_fit?.f1       != null && model_fit.f1 >= 0.9 });
    }
    // n rows — always explicit
    if (is_split && model_fit_train) {
      rows.push({ label: 'n (train)', trainVal: n_samples != null ? (+n_samples).toLocaleString() : '—', testVal: null,   dim: true });
      rows.push({ label: 'n (test)',  trainVal: null,   testVal: n_test != null ? (+n_test).toLocaleString() : '—', dim: true });
    } else {
      rows.push({ label: 'n', trainVal: n_samples != null ? (+n_samples).toLocaleString() : '—', testVal: null, dim: true });
    }

    // lq-table-scroll wrapper
    const scroll = document.createElement('div');
    scroll.className = 'lq-table-scroll';
    scroll.style.cssText = 'max-height:none;width:100%;';

    const tbl = document.createElement('table');
    tbl.style.cssText = 'width:100%;';

    // thead
    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    const cols = is_split && model_fit_train
      ? [['Metric', ''], ['Train', '#4a90d9'], ['Test', '#e05858']]
      : [['Metric', ''], ['Value', '']];
    cols.forEach(([txt, color]) => {
      const th = document.createElement('th');
      th.textContent = txt;
      if (color) th.style.color = color;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    tbl.appendChild(thead);

    // tbody
    const tbody = document.createElement('tbody');
    rows.forEach(r => {
      const tr = document.createElement('tr');

      const labelTd = document.createElement('td');
      labelTd.textContent = r.label;
      if (r.dim) labelTd.style.color = 'var(--text-dim)';
      tr.appendChild(labelTd);

      const makeValTd = (val, hi) => {
        const td = document.createElement('td');
        td.style.cssText = `text-align:right;font-family:monospace;${r.dim ? 'color:var(--text-dim);' : hi ? 'color:#1e7a4a;font-weight:700;' : ''}`;
        td.textContent = val ?? '—';
        return td;
      };

      if (is_split && model_fit_train) {
        tr.appendChild(makeValTd(r.trainVal, r.hiTrain));
        tr.appendChild(makeValTd(r.testVal,  r.hiTest));
      } else {
        tr.appendChild(makeValTd(r.trainVal ?? r.testVal, r.hiTest));
      }
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    scroll.appendChild(tbl);
    tblWrap.appendChild(scroll);
    row.appendChild(tblWrap);
  }

  outputEl.appendChild(row);

  // ── Chart render ─────────────────────────────────────────────────────────
  if (is_classif) {
    const classes = model_fit?.classes;
    const cm = model_fit?.confusion_matrix;
    const n = classes ? classes.length : 0;
    if (n < 2) {
      chartDiv.style.cssText += ';display:flex;align-items:center;justify-content:center;color:#888;font-size:12px;';
      chartDiv.textContent = 'Confusion matrix requires at least 2 classes.';
    } else {
      const heatData = [];
      let maxVal = 0;
      for (let r = 0; r < n; r++)
        for (let c = 0; c < n; c++) {
          heatData.push([c, n - 1 - r, cm[r][c]]);
          if (cm[r][c] > maxVal) maxVal = cm[r][c];
        }
      echarts.init(chartDiv, null, {}).setOption({
        backgroundColor: '#ffffff',
        title: { text: `Confusion Matrix${is_split ? ' (Test)' : ''}`, left: 'center', top: 8, textStyle: { fontSize: 13, color: '#555' } },
        tooltip: { ..._ecTooltip(), formatter: p => `Actual: <b>${classes[n-1-p.data[1]]}</b><br>Predicted: <b>${classes[p.data[0]]}</b><br>Count: <b>${p.data[2]}</b>` },
        grid: { left: 60, right: 80, top: 44, bottom: 56 },
        xAxis: { type: 'category', data: classes.map(String), name: 'Predicted', nameLocation: 'middle', nameGap: 32, axisLabel: { color: '#555', fontSize: 12 } },
        yAxis: { type: 'category', data: [...classes].reverse().map(String), name: 'Actual', nameLocation: 'middle', nameGap: 38, axisLabel: { color: '#555', fontSize: 12 } },
        visualMap: { min: 0, max: maxVal || 1, calculable: true, orient: 'vertical', right: 6, top: 44, inRange: { color: ['#f7f7f7', '#2166ac'] }, textStyle: { color: '#666', fontSize: 11 } },
        series: [{ type: 'heatmap', data: heatData, label: { show: true, formatter: p => String(p.data[2]), fontSize: 13, color: '#333' }, itemStyle: { borderWidth: 1, borderColor: '#e0e0e0' } }],
      });
    }
  } else {
    const testPairs  = (actuals || []).map((a, i) => [a, (predictions || [])[i]]).filter(([a, p]) => a != null && p != null && isFinite(+a) && isFinite(+p));
    const trainPairs = is_split ? (actuals_train || []).map((a, i) => [a, (predictions_train || [])[i]]).filter(([a, p]) => a != null && p != null && isFinite(+a) && isFinite(+p)) : [];
    const allPairs   = [...testPairs, ...trainPairs];
    if (!allPairs.length) {
      chartDiv.style.cssText += ';display:flex;align-items:center;justify-content:center;color:#888;font-size:12px;';
      chartDiv.textContent = 'No valid data points.';
    } else {
      const allVals = allPairs.flat();
      const minV = allVals.reduce((acc, v) => Math.min(acc, v), Infinity);
      const maxV = allVals.reduce((acc, v) => Math.max(acc, v), -Infinity);
      const pad  = (maxV - minV) * 0.05 || 1;
      const series = [];
      if (is_split) {
        series.push({ type: 'scatter', name: 'Train', data: trainPairs, symbolSize: 4, itemStyle: { color: '#4a90d9', opacity: 0.45 }, large: true, largeThreshold: 2000 });
        series.push({ type: 'scatter', name: 'Test',  data: testPairs,  symbolSize: 6, itemStyle: { color: '#e05858', opacity: 0.85 }, large: true, largeThreshold: 2000 });
      } else {

  const text2  = cs.getPropertyValue('--text2').trim();
  const border = cs.getPropertyValue('--border').trim();

  // ECharts expects boxplot data as [min, Q1, median, Q3, max] (the whisker extents)
  const boxData   = boxes.map(b => [b.lo, b.q25, b.q50, b.q75, b.hi]);
  const labels    = boxes.map(b => String(b.label));

  // Scatter series: jittered points — uses xAxis[1] (value type) so x = i ± jitter

      const isOutlier = p < b.lo || p > b.hi;
      scatterData.push({
        value: [i + (Math.random() - 0.5) * 0.55, p],
        itemStyle: { color: isOutlier ? '#f44747' : PLOT_COLORS[i % PLOT_COLORS.length], opacity: isOutlier ? 1 : 0.6 },
      });
    });
  });

  // Mean markers as a separate scatter series
  const meanData = boxes.map((b, i) => ({
    value: [i, b.mean],
    symbol: 'diamond',
    symbolSize: ptSize + 2,
    itemStyle: { color: '#fff', borderColor: '#888', borderWidth: 1.5 },
    tooltip: { formatter: () => `mean: ${b.mean != null && isFinite(b.mean) ? b.mean.toFixed(4) : '—'}` },
  }));

  const markLines = showOverallMean && isFinite(overall_mean) ? [{
    silent: true,
    lineStyle: { color: '#f44747', type: 'dashed', width: 1.5 },
    data: [{ yAxis: overall_mean }],
    label: { formatter: `overall mean: ${overall_mean.toFixed(2)}`, position: 'insideEndTop', fontSize: 12 },
  }] : [];

  outputEl.innerHTML = '';
  const div = document.createElement('div');
  div.style.width  = W + 'px';
  div.style.height = H + 'px';
  outputEl.appendChild(div);

  const chart = echarts.init(div, null, {});
  chart.setOption({
    backgroundColor: '#ffffff',
    grid: { left: 58, right: 20, top: 24, bottom: xRot > 0 ? 72 : 48 },
    // xAxis[0]: category for boxplot; xAxis[1]: numeric value range for jittered scatter
    xAxis: [
      {
        type: 'category', data: labels,
        axisLine:  { lineStyle: { color: '#ccc' } },
        axisLabel: { color: '#555', fontSize: 12, rotate: xRot },
        splitLine: { show: false },
      },
      {
        type: 'value', min: -0.5, max: boxes.length - 0.5,
        show: false, gridIndex: 0,
      },
    ],
    yAxis: {
      type: 'value', name: y_col,
      nameTextStyle: { color: '#444', fontSize: 13 },
      axisLine:  { lineStyle: { color: '#ccc' } },
      axisLabel: { color: '#555', fontSize: 12 },
      splitLine: { lineStyle: { color: '#eee' } },
    },
    tooltip: {
      trigger: 'item',
      backgroundColor: '#fff', borderColor: '#ddd',
      textStyle: { color: '#333', fontSize: 13 },
      formatter(p) {
        if (p.seriesType === 'boxplot') {
          const b = boxes[p.dataIndex];
          const f4 = v => v != null && isFinite(v) ? v.toFixed(4) : '—';
          return [
            `<b>${labels[p.dataIndex]}</b>`,
            `max: ${f4(b.hi)}`, `Q3:  ${f4(b.q75)}`,
            `med: ${f4(b.q50)}`, `Q1:  ${f4(b.q25)}`,
            `min: ${f4(b.lo)}`, `mean: ${f4(b.mean)}`,
          ].join('<br>');
        }
        return null;
      },
    },
    series: [
      {
        type: 'boxplot', data: boxData, xAxisIndex: 0,
        itemStyle: { color: 'rgba(0,0,0,0.06)', borderColor: '#333', borderWidth: 1.5 },
        boxWidth: ['20%', '40%'],
        markLine: markLines.length ? markLines[0] : undefined,

      {
        type: 'scatter', data: scatterData, xAxisIndex: 1,

      {

        symbolSize: ptSize + 2, z: 3,
      },
    ],
  });
  _addResizeHandle(outputEl, block);
}

function renderOutlierChart(block) {
  const blockEl = document.querySelector(`.story-block[data-id="${block.id}"]`);
  if (!blockEl || !block._lastData) return;
  const outputEl = blockEl.querySelector('.story-output');
  const d = block._lastData;
  const { chart_values, chart_flags, lower, upper, column, method,
          n_outliers, n_valid, n_null, outlier_pct, stats, sampled } = d;
  if (!chart_values || !chart_values.length) {
    outputEl.innerHTML = '<div class="story-output-error">No data.</div>';
    return;
  }
  const W = block.params.width  || 480;
  const H = block.params.height || 480;
  const cs  = getComputedStyle(document.documentElement);
  const accent  = cs.getPropertyValue('--accent').trim();
  const errCol  = cs.getPropertyValue('--error-color').trim();
  const warnCol = cs.getPropertyValue('--warn-color').trim();
  const text2   = cs.getPropertyValue('--text2').trim();

  // Stats table (linreg style)
  const fmt = n => (typeof n === 'number') ? n.toLocaleString(undefined, {maximumFractionDigits: 4}) : n;
  const _oStatRows = [
    ['Method',   method,                                                              false],
    ['Points',   (n_valid ?? 0).toLocaleString() + (n_null ? ` +${n_null} null` : ''),    false],
    ['Outliers', `${n_outliers.toLocaleString()} (${outlier_pct}%)`,               n_outliers > 0],
    ['Lower',    fmt(lower),                                                          false],
    ['Upper',    fmt(upper),                                                          false],
    ...Object.entries(stats).map(([k, v]) => [k, fmt(v), false]),
    ...(sampled ? [['Chart', 'sampled', false]] : []),
  ];
  const _oTbl = document.createElement('table');
  _oTbl.className = 'linreg-stats-tbl';
  _oStatRows.forEach(([lbl, val, hi]) => {
    const tr = document.createElement('tr');
    if (hi) tr.className = 'lr-hi';
    tr.innerHTML = `<td>${lbl}</td><td>${val}</td>`;
    _oTbl.appendChild(tr);
  });

  // Horizontal jitter strip: value on X, jitter on Y
  const normData = [], outData = [];
  chart_values.forEach((v, i) => {
    const jy = (Math.random() - 0.5) * 0.9;
    if (chart_flags[i]) outData.push([v, jy]);
    else normData.push([v, jy]);
  });

  // KDE — Gaussian kernel with Silverman's bandwidth
  // Cap KDE sample at 2000 to keep computation fast (KDE doesn't need all points)
  const n = chart_values.length;
  const KDE_MAX = 2000;
  const kdeSample = n <= KDE_MAX ? chart_values : (() => {
    const step = n / KDE_MAX;
    return Array.from({ length: KDE_MAX }, (_, i) => chart_values[Math.floor(i * step)]);
  })();
  const kn = kdeSample.length;
  const cvMean = kdeSample.reduce((a, b) => a + b, 0) / kn;
  const cvStd  = Math.sqrt(kdeSample.reduce((a, v) => a + (v - cvMean) ** 2, 0) / kn) || 1;
  const bwKde  = 1.06 * cvStd * Math.pow(kn, -0.2);
  const kdeN   = 200;
  const vMin = chart_values.reduce((a, b) => Math.min(a, b), Infinity);
  const vMax = chart_values.reduce((a, b) => Math.max(a, b), -Infinity);
  const step   = (vMax - vMin) / (kdeN - 1) || 1;
  const kdeData = Array.from({ length: kdeN }, (_, i) => {
    const x = vMin + i * step;
    let sum = 0;
    for (let j = 0; j < kn; j++) {
      const u = (x - kdeSample[j]) / bwKde;
      sum += Math.exp(-0.5 * u * u);
    }
    return [x, sum / (kn * bwKde * Math.sqrt(2 * Math.PI))];
  });

  // Shared x domain — extend slightly beyond data and limit lines
  const allX = [...chart_values, lower, upper].filter(v => v != null && isFinite(v));
  const xMin = allX.reduce((a, b) => Math.min(a, b), Infinity);
  const xMax = allX.reduce((a, b) => Math.max(a, b), -Infinity);
  const xPad = ((xMax - xMin) * 0.05) || 1;
  const xLo = xMin - xPad, xHi = xMax + xPad;


  // Threshold markLine — xAxis-based (vertical lines on horizontal chart)
  const threshML = (lower != null || upper != null) ? {
    silent: true, symbol: ['none', 'none'],
    lineStyle: { color: warnCol, type: 'dashed', width: 1.5 },
    label: { show: true, position: 'insideEndTop', fontSize: 11, color: warnCol,
             formatter: p => p.name },
    data: [
      ...(upper != null ? [{ xAxis: upper, name: `▲ ${fmt(upper)}` }] : []),
      ...(lower != null ? [{ xAxis: lower, name: `▼ ${fmt(lower)}` }] : []),
    ],
  } : undefined;

  const stripH = Math.round(H * 0.38);
  const histTop = Math.round(H * 0.52);

  outputEl.innerHTML = '';
  const plotWrap = document.createElement('div');
  plotWrap.style.flexShrink = '0';
  const _oWrap = document.createElement('div');
  _oWrap.className = 'linreg-wrap';
  _oWrap.appendChild(plotWrap);
  const _oScroll = document.createElement('div');
  _oScroll.className = 'lq-table-scroll';
  _oScroll.style.alignSelf = 'flex-start';
  _oScroll.appendChild(_oTbl);
  _oWrap.appendChild(_oScroll);
  outputEl.appendChild(_oWrap);

  renderEChart(plotWrap, {
    grid: [
      { left: 60, right: 140, top: 20, height: stripH,             containLabel: false },
      { left: 60, right: 140, top: histTop, bottom: 36,            containLabel: false },
    ],
    tooltip: {
      ..._ecTooltip(), trigger: 'item',
      formatter: p => p.seriesType === 'line'
        ? `${column}: ${fmt(p.value[0])}<br/>Density: ${p.value[1].toExponential(3)}`
        : `${column}: ${fmt(p.value[0])}`,
    },
    legend: { ..._ecLegend(true), top: 20, data: ['Normal', `Outlier (${n_outliers})`] },
    axisPointer: { link: [{ xAxisIndex: 'all' }] },
    xAxis: [
      { gridIndex: 0, type: 'value', min: xLo, max: xHi, show: false },
      { gridIndex: 1, type: 'value', min: xLo, max: xHi, ..._ecAxis(column),
        nameLocation: 'middle', nameGap: 28 },
    ],
    yAxis: [
      { gridIndex: 0, type: 'value', min: -1, max: 1, show: false },
      { gridIndex: 1, type: 'value', ..._ecAxis('Density'), nameLocation: 'end', nameGap: 6, axisLabel: { show: false } },
    ],
    series: [
      {
        type: 'scatter', name: 'Normal', data: normData, xAxisIndex: 0, yAxisIndex: 0, z: 2,
        symbolSize: 5, itemStyle: { color: accent, opacity: 0.45 },
        markLine: threshML,
      },
      {
        type: 'scatter', name: `Outlier (${n_outliers})`, data: outData, xAxisIndex: 0, yAxisIndex: 0, z: 3,
        symbolSize: 7, symbol: 'diamond', itemStyle: { color: errCol, opacity: 0.85 },
      },
      {
        type: 'line', name: 'Distribution', data: kdeData, xAxisIndex: 1, yAxisIndex: 1,
        symbol: 'none', smooth: false,
        lineStyle: { color: accent, width: 2 },
        areaStyle: { color: accent, opacity: 0.4 },
        markLine: threshML,
      },
    ],
  }, W, H);

  // "Add outlier column" button
  if (d.row_indices && d.outlier_flags) {
    const btnWrap = document.createElement('div');
    btnWrap.style.cssText = 'padding:6px 0 2px;';
    const addColBtn = document.createElement('button');
    addColBtn.className = 'story-edit-btn primary';
    addColBtn.style.fontSize = '11px';
    addColBtn.textContent = `+ Add column "${column}_outlier" (0/1)`;
    const msg = document.createElement('span');
    msg.style.cssText = 'margin-left:10px;font-size:11px;color:var(--accent);';
    addColBtn.addEventListener('click', () => {
      const ws = _workspaces.find(w => w.id === _activeWsId);
      if (!ws || !ws.lastQueryData) { msg.textContent = 'No query results.'; return; }
      const colName = column + '_outlier';
      if (ws.lastQueryData.columns.includes(colName)) { msg.textContent = 'Column already added.'; return; }
      const flagMap = new Map();
      d.row_indices.forEach((rowIdx, i) => flagMap.set(rowIdx, d.outlier_flags[i] ? 1 : 0));
      ws.lastQueryData.columns.push(colName);
      ws.lastQueryData.rows.forEach((row, ri) => row.push(flagMap.has(ri) ? flagMap.get(ri) : null));
      _rebuildResultsTable(ws);
      _updateDownloadBtn();
      msg.textContent = `Column "${colName}" added.`;
      addColBtn.disabled = true;
    });
    btnWrap.appendChild(addColBtn);
    btnWrap.appendChild(msg);
    outputEl.appendChild(btnWrap);
  }
  _addResizeHandle(outputEl, block);
}

function renderLinReg(block) {
  const blockEl = document.querySelector(`.story-block[data-id="${block.id}"]`);
  if (!blockEl || !block._lastData) return;
  const outputEl = blockEl.querySelector('.story-output');
  const d = block._lastData;
  const W = block.params.width  || 480;
  const H = block.params.height || 480;
  const cs     = getComputedStyle(document.documentElement);
  const accent = cs.getPropertyValue('--accent').trim();

  const fmtP = p => p < 0.001 ? '<0.001' : p < 0.01 ? p.toFixed(4) : p.toFixed(3);
  const fmtN = (v, dp) => v.toLocaleString(undefined, {maximumFractionDigits: dp ?? 6});

  const _lrXAxis = (xCol, xRotate) => ({
    type: 'value', name: xCol, nameLocation: 'middle',
    nameGap: xRotate > 0 ? 46 : 28,
    nameTextStyle: { color: '#555', fontSize: 12.5 },
    axisLabel: { rotate: xRotate, color: '#555', fontSize: 12.5 },
    axisLine: { lineStyle: { color: '#ccc' } },
    axisTick: { lineStyle: { color: '#ccc' } },
    splitLine: { lineStyle: { color: '#eee' } },
  });
  const _lrYAxis = (yCol) => ({
    type: 'value', name: yCol, nameLocation: 'middle', nameRotate: 90, nameGap: 52,
    nameTextStyle: { color: '#555', fontSize: 12.5 },
    axisLabel: { color: '#555', fontSize: 12.5 },
    axisLine: { lineStyle: { color: '#ccc' } },
    axisTick: { lineStyle: { color: '#ccc' } },
    splitLine: { lineStyle: { color: '#eee' } },
  });

  outputEl.innerHTML = '';

  // ── Grouped mode ──────────────────────────────────────────────────────────
  if (d.is_grouped && d.groups) {
    const PALETTE = ['#4a90d9','#e05858','#4ec9b0','#ce9178','#a78bfa','#f59e0b','#34d399','#f472b6','#60a5fa','#fb923c','#a3e635','#c084fc'];

    // Stats table: rows = groups, columns = params
    const groupTbl = document.createElement('table');
    groupTbl.className = 'linreg-group-tbl';
    const thead = groupTbl.createTHead();
    const hrow = thead.insertRow();
    ['Group', 'n', 'R²', 'r', 'p-value', 'Slope', 'Intercept', 'Std Err'].forEach(h => {
      const th = document.createElement('th'); th.textContent = h; hrow.appendChild(th);
    });
    const tbody = groupTbl.createTBody();
    d.groups.forEach(g => {
      const tr = tbody.insertRow();
      const r2hi = g.r2 != null && g.r2 >= 0.7, phi = g.p_value != null && g.p_value < 0.05;
      tr.insertCell().textContent = g.group;
      tr.insertCell().textContent = g.n.toLocaleString();
      const r2td = tr.insertCell(); r2td.textContent = g.r2 != null ? g.r2.toFixed(4) : '—'; if (r2hi) r2td.className = 'lr-g-hi';
      tr.insertCell().textContent = g.r != null ? g.r.toFixed(4) : '—';
      const ptd = tr.insertCell(); ptd.textContent = g.p_value != null ? fmtP(g.p_value) : '—'; if (phi) ptd.className = 'lr-g-hi';
      tr.insertCell().textContent = fmtN(g.slope);
      tr.insertCell().textContent = fmtN(g.intercept);
      tr.insertCell().textContent = fmtN(g.std_err);
    });
    // Chart: one scatter + one fit line per group
    const allScX = d.groups.flatMap(g => g.sc_x);
    const xAbsMax = allScX.length ? allScX.reduce((acc, v) => Math.max(acc, Math.abs(v)), 0) : 0;
    const xRotate = xAbsMax.toLocaleString().length > 7 ? 45 : 0;
    const xBottomPad = xRotate > 0 ? 64 : 44;
    // Estimate legend width: icon(10) + gap(8) + text(8px/char), minimum 60
    const maxLabelLen = Math.max(...d.groups.map(g => g.group.length));
    const legendLeft = Math.max(60, 18 + maxLabelLen * 8);
    const series = [];
    d.groups.forEach((g, gi) => {
      const col = PALETTE[gi % PALETTE.length];
      series.push({
        type: 'scatter', name: g.group,
        data: g.sc_x.map((x, j) => [x, g.sc_y[j]]),
        symbolSize: 4, itemStyle: { color: col, opacity: 0.5 },
        tooltip: { formatter: p => `${g.group}<br>${d.x_col}: ${p.value[0]}<br>${d.y_col}: ${p.value[1]}` },
      });
      series.push({
        type: 'line', name: g.group + ' fit',
        data: g.line_x.map((x, j) => [x, g.line_y[j]]),
        lineStyle: { color: col, width: 2 }, symbol: 'none', showInLegend: false,
        tooltip: { formatter: () => `${g.group}: y = ${fmtN(g.slope)}x + ${fmtN(g.intercept)}` },
      });
    });
    const plotWrap = document.createElement('div');
    plotWrap.style.flexShrink = '0';
    const groupWrap = document.createElement('div');
    groupWrap.className = 'linreg-wrap';
    groupWrap.appendChild(plotWrap);
    const groupScroll = document.createElement('div');
    groupScroll.className = 'lq-table-scroll';
    groupScroll.style.alignSelf = 'flex-start';
    groupScroll.appendChild(groupTbl);
    groupWrap.appendChild(groupScroll);
    outputEl.appendChild(groupWrap);
    renderEChart(plotWrap, {
      backgroundColor: '#ffffff',
      grid: { left: legendLeft + 10, right: 20, top: 16, bottom: xBottomPad, containLabel: true },
      tooltip: { ..._ecTooltip(), trigger: 'item' },
      legend: { orient: 'vertical', left: 8, top: 'middle', textStyle: { color: '#555', fontSize: 12 }, icon: 'circle', itemWidth: 10, itemHeight: 10, data: d.groups.map(g => g.group) },
      xAxis: _lrXAxis(d.x_col, xRotate),
      yAxis: _lrYAxis(d.y_col),
      series,
    }, W, H);
    return;
  }

  // ── Ungrouped mode ────────────────────────────────────────────────────────
  const statsRows = [
    ['n', d.n.toLocaleString(), false],
    ['R²', d.r2 != null ? d.r2.toFixed(4) : '—', d.r2 != null && d.r2 >= 0.7],
    ['r', d.r != null ? d.r.toFixed(4) : '—', false],
    ['p-value', d.p_value != null ? fmtP(d.p_value) : '—', d.p_value != null && d.p_value < 0.05],
    ['Slope', fmtN(d.slope), false],
    ['Intercept', fmtN(d.intercept), false],
    ['Std Err', fmtN(d.std_err), false],
  ];
  if (d.sampled) statsRows.push(['Chart', 'sampled', false]);
  const tbl = document.createElement('table');
  tbl.className = 'linreg-stats-tbl';
  statsRows.forEach(([lbl, val, hi]) => {
    const tr = document.createElement('tr');
    if (hi) tr.className = 'lr-hi';
    tr.innerHTML = `<td>${lbl}</td><td>${val}</td>`;
    tbl.appendChild(tr);
  });

  const lrSeries = [];
  lrSeries.push({
    type: 'scatter', name: 'Data',
    data: d.sc_x.map((x, j) => [x, d.sc_y[j]]),
    symbolSize: 4, itemStyle: { color: accent, opacity: 0.45 },
    tooltip: { formatter: p => `${d.x_col}: ${p.value[0]}<br>${d.y_col}: ${p.value[1]}` },
  });
  if (d.ci_lo && d.ci_hi) {
    lrSeries.push({
      type: 'line', name: 'ci_base', data: d.line_x.map((x, j) => [x, d.ci_lo[j]]),
      lineStyle: { width: 0 }, symbol: 'none', stack: 'ci',
      areaStyle: { opacity: 0 }, showInLegend: false, tooltip: { show: false },
    });
    lrSeries.push({
      type: 'line', name: '95% CI', data: d.line_x.map((x, j) => [x, d.ci_hi[j] - d.ci_lo[j]]),
      lineStyle: { width: 0 }, symbol: 'none', stack: 'ci',
      areaStyle: { color: accent, opacity: 0.15 }, showInLegend: false, tooltip: { show: false },
    });
  }
  lrSeries.push({
    type: 'line', name: 'Fit',
    data: d.line_x.map((x, j) => [x, d.line_y[j]]),
    lineStyle: { color: accent, width: 2 }, symbol: 'none',
    tooltip: { formatter: () => `y = ${fmtN(d.slope)}x + ${fmtN(d.intercept)}` },
  });

  const xAbsMax = d.sc_x && d.sc_x.length ? d.sc_x.reduce((acc, v) => Math.max(acc, Math.abs(v)), 0) : 0;
  const xRotate = xAbsMax.toLocaleString().length > 7 ? 45 : 0;
  const xBottomPad = xRotate > 0 ? 64 : 44;

  const plotWrap = document.createElement('div');
  plotWrap.style.flexShrink = '0';
  const wrap = document.createElement('div');
  wrap.className = 'linreg-wrap';
  wrap.appendChild(plotWrap);
  const tblScroll = document.createElement('div');
  tblScroll.className = 'lq-table-scroll';
  tblScroll.style.alignSelf = 'flex-start';
  tblScroll.appendChild(tbl);
  wrap.appendChild(tblScroll);
  outputEl.appendChild(wrap);

  renderEChart(plotWrap, {
    backgroundColor: '#ffffff',
    grid: { left: 60, right: 20, top: 16, bottom: xBottomPad, containLabel: true },
    tooltip: { ..._ecTooltip(), trigger: 'item' },
    legend: { show: false },
    xAxis: _lrXAxis(d.x_col, xRotate),
    yAxis: _lrYAxis(d.y_col),
    series: lrSeries,
  }, W, H);

  // Prediction column button (ungrouped only)
  if (d.pred_values && d.pred_values.length) {
    const predSection = document.createElement('div');
    predSection.style.cssText = 'padding:8px 0 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;';
    const addPredBtn = document.createElement('button');
    addPredBtn.className = 'story-edit-btn primary';
    addPredBtn.style.fontSize = '11px';
    const predColName = block.params.pred_col || 'lin_reg_prediction';
    addPredBtn.textContent = `+ Add prediction column "${predColName}"`;
    const predMsg = document.createElement('span');
    predMsg.style.cssText = 'font-size:11px;color:var(--accent);';
    addPredBtn.addEventListener('click', () => {
      const ws = _workspaces.find(w => w.id === _activeWsId);
      if (!ws || !ws.lastQueryData) { predMsg.textContent = 'No query results.'; return; }
      const colName = block.params.pred_col || 'lin_reg_prediction';
      const saveAs = (block.params.output_table || '').trim();
      const tableParam = block.params.table || 'df';
      let srcData, srcSheetName = null;
      if (tableParam !== 'df' && ws._dataSheets) {
        const sn = tableParam.startsWith('df.') ? tableParam.slice(3) : null;
        if (sn && ws._dataSheets[sn]) { srcData = ws._dataSheets[sn]; srcSheetName = sn; }
      }
      if (!srcData) srcData = ws.lastQueryData;
      const currentName = srcSheetName || 'df';
      const targetName = saveAs || currentName;
      if (targetName === currentName) {
        if (srcData.columns.includes(colName)) { predMsg.textContent = 'Column already added.'; return; }
        srcData.columns.push(colName);
        srcData.rows.forEach((row, ri) => row.push(d.pred_values[ri] ?? null));
        if (!srcSheetName) { _rebuildResultsTable(ws); _updateDownloadBtn(); }
        predMsg.textContent = `Column "${colName}" added.`;
      } else {
        ws._dataSheets = ws._dataSheets || {};
        if (ws._dataSheets[targetName]) { predMsg.textContent = `Table "${targetName}" already exists.`; return; }
        const newColumns = [...srcData.columns, colName];
        const newRows = srcData.rows.map((row, ri) => [...row, d.pred_values[ri] ?? null]);
        const newSchema = [...(srcData.schema || srcData.bq_schema || [])];
        ws._dataSheets[targetName] = { tableName: targetName, columns: newColumns, rows: newRows, schema: newSchema };
        predMsg.textContent = `New table "df.${targetName}" created.`;
      }
      addPredBtn.disabled = true;
      setTimeout(() => { const _ws = _workspaces.find(w => w.id === _activeWsId); if (_ws) renderStoryBlocks(_ws); }, 0);
    });
    predSection.appendChild(addPredBtn);
    predSection.appendChild(predMsg);
    outputEl.appendChild(predSection);
  }
  _addResizeHandle(outputEl, block);
}

function renderHypoTest(block) {
  const blockEl = document.querySelector(`.story-block[data-id="${block.id}"]`);
  if (!blockEl || !block._lastData) return;
  const outputEl = blockEl.querySelector('.story-output');
  const d = block._lastData;
  const W = block.params.width  || 480;
  const H = block.params.height || 480;
  const cs        = getComputedStyle(document.documentElement);
  const lineColor = cs.getPropertyValue('--text2').trim();

  outputEl.innerHTML = '';

  // ── Test stats table (linreg-stats-tbl style) ─────────────────────────────
  const fmtP = p => p < 0.001 ? '<0.001' : p < 0.01 ? p.toFixed(4) : p.toFixed(3);
  const _htStatsTbl = document.createElement('table');
  _htStatsTbl.className = 'linreg-stats-tbl';
  const _htStatRows = [
    ['Test',  d.test_used,                              false],
    ['Stat',  d.statistic != null ? d.statistic.toFixed(4) : '—',   d.significant],
    ['p',     fmtP(d.p_value),                          d.significant],
    ['α', String(d.alpha),                          false],
    ['Sig.',  d.significant ? 'Yes ✓' : 'No',      d.significant],
    ...(d.effect_size != null && isFinite(d.effect_size) ? [['Effect', `${d.effect_size.toFixed(3)} (${d.effect_label})`, d.effect_size >= 0.5]] : []),
  ];
  _htStatRows.forEach(([lbl, val, hi]) => {
    const tr = document.createElement('tr');
    if (hi) tr.className = 'lr-hi';
    tr.innerHTML = `<td>${lbl}</td><td>${val}</td>`;
    _htStatsTbl.appendChild(tr);
  });

  // ── Group stats table (linreg-group-tbl style) ────────────────────────────
  const _htGroupTbl = document.createElement('table');
  _htGroupTbl.className = 'linreg-group-tbl';
  const _htGThead = _htGroupTbl.createTHead();
  const _htGHrow = _htGThead.insertRow();
  ['Group', 'n', 'mean', 'std', 'median'].forEach(h => {
    const th = document.createElement('th'); th.textContent = h; _htGHrow.appendChild(th);
  });
  const _htGTbody = _htGroupTbl.createTBody();
  (d.group_stats || []).forEach(g => {
    const tr = _htGTbody.insertRow();
    tr.insertCell().textContent = g.group;
    tr.insertCell().textContent = g.n.toLocaleString();
    tr.insertCell().textContent = g.mean   != null ? g.mean.toFixed(4)   : '—';
    tr.insertCell().textContent = g.std    != null ? g.std.toFixed(4)    : '—';
    tr.insertCell().textContent = g.median != null ? g.median.toFixed(4) : '—';
  });

  const _htStatsScroll = document.createElement('div');
  _htStatsScroll.className = 'lq-table-scroll';
  _htStatsScroll.appendChild(_htStatsTbl);
  const _htGroupScroll = document.createElement('div');
  _htGroupScroll.className = 'lq-table-scroll';
  _htGroupScroll.appendChild(_htGroupTbl);
  const _htRightCol = document.createElement('div');
  _htRightCol.style.cssText = 'display:flex;flex-direction:column;gap:8px;align-self:flex-start;';
  _htRightCol.appendChild(_htStatsScroll);
  _htRightCol.appendChild(_htGroupScroll);

  // ── Boxplot with jitter + stats side by side ──────────────────────────────
  if (d.boxes && d.boxes.length) {
    const htLabels  = d.boxes.map(b => String(b.label));
    const htBoxData = d.boxes.map(b => [b.lo, b.q25, b.q50, b.q75, b.hi]);
    const htScatter = [];
    d.boxes.forEach((b, i) => {
      (b.points || []).forEach(p => htScatter.push({
        value: [i + (Math.random() - 0.5) * 0.55, p],
        itemStyle: { color: PLOT_COLORS[i % PLOT_COLORS.length], opacity: 0.55 },
      }));
    });
    const boxWrap = document.createElement('div');
    boxWrap.style.flexShrink = '0';
    const _htWrap = document.createElement('div');
    _htWrap.className = 'linreg-wrap';
    _htWrap.appendChild(boxWrap);
    _htWrap.appendChild(_htRightCol);
    outputEl.appendChild(_htWrap);
    renderEChart(boxWrap, {
      backgroundColor: '#ffffff',
      grid: { left: 60, right: 20, top: 16, bottom: 44 },
      tooltip: {
        ..._ecTooltip(), trigger: 'item',
        formatter(p) {
          if (p.seriesType === 'boxplot') {
            const b = d.boxes[p.dataIndex];
            const f4 = v => v != null && isFinite(v) ? v.toFixed(4) : '—';
            return `<b>${htLabels[p.dataIndex]}</b><br>max: ${f4(b.hi)}<br>Q3: ${f4(b.q75)}<br>med: ${f4(b.q50)}<br>Q1: ${f4(b.q25)}<br>min: ${f4(b.lo)}`;
          }
          return null;
        },
      },
      xAxis: [
        { type: 'category', data: htLabels,
          name: d.group_col, nameLocation: 'middle', nameGap: 30,
          nameTextStyle: { color: '#444', fontSize: 13 },
          axisLine: { lineStyle: { color: '#ccc' } },
          axisLabel: { color: '#555', fontSize: 12 }, splitLine: { show: false } },
        { type: 'value', min: -0.5, max: d.boxes.length - 0.5, show: false, gridIndex: 0 },
      ],
      yAxis: { ..._ecAxis(d.value_col), type: 'value' },
      series: [
        { type: 'boxplot', data: htBoxData, xAxisIndex: 0,
          itemStyle: { color: 'rgba(0,0,0,0.06)', borderColor: '#333', borderWidth: 1.5 },
          boxWidth: ['20%', '40%'] },
        { type: 'scatter', data: htScatter, xAxisIndex: 1, symbolSize: 4, z: 2, tooltip: { show: false } },
      ],
    }, W, H);
  } else {
    outputEl.appendChild(_htRightCol);
  }

  // ── KDE distribution (full width below) ───────────────────────────────────
  if (d.dists && d.dists.length > 0) {
    const kdeSeries = d.dists.map((dist, i) => ({
      type: 'line', name: String(dist.label),
      data: dist.x.map((x, j) => [x, dist.y[j]]),
      lineStyle: { color: PLOT_COLORS[i % PLOT_COLORS.length], width: 2 },
      itemStyle: { color: PLOT_COLORS[i % PLOT_COLORS.length] },
      areaStyle: { color: PLOT_COLORS[i % PLOT_COLORS.length], opacity: 0.08 },
      symbol: 'none',
    }));
    const distWrap = document.createElement('div');
    outputEl.appendChild(distWrap);
    renderEChart(distWrap, {
      backgroundColor: '#ffffff',
      grid: { left: 60, right: d.dists.length > 1 ? 130 : 20, top: 16, bottom: 44 },
      tooltip: { ..._ecTooltip(), trigger: 'axis' },
      legend: _ecLegend(d.dists.length > 1),
      xAxis: { ..._ecAxis(d.value_col), type: 'value' },
      yAxis: { ..._ecAxis('Density'), type: 'value' },
      series: kdeSeries,
    }, W, H);
  }
  _addResizeHandle(outputEl, block);
}

function renderEditAddRow(block) {
  const blockEl = document.querySelector(`.story-block[data-id="${block.id}"]`);
  if (!blockEl) return;
  const outputEl = blockEl.querySelector('.story-output');
  const ws = _workspaces.find(w => w.id === _activeWsId);
  if (!ws || !ws.lastQueryData) return;

  function _buildAddRowTable() {
    const { columns, rows } = ws.lastQueryData;
    outputEl.innerHTML = '';

    const wrap = document.createElement('div');
    wrap.className = 'story-edit-form';

    const table = document.createElement('table');
    table.className = 'story-edit-table';

    // header
    const thead = document.createElement('thead');
    const htr = document.createElement('tr');
    const thIdx = document.createElement('th');
    thIdx.textContent = '#';
    htr.appendChild(thIdx);
    columns.forEach(col => {
      const th = document.createElement('th');
      th.textContent = col;
      htr.appendChild(th);
    });
    thead.appendChild(htr);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');

    // last 5 existing rows (read-only)
    const tail = rows.slice(-5);
    const startIdx = rows.length - tail.length;
    tail.forEach((row, ri) => {
      const tr = document.createElement('tr');
      const tdIdx = document.createElement('td');
      tdIdx.textContent = startIdx + ri + 1;
      tdIdx.style.cssText = 'color:var(--text2);text-align:right;padding-right:6px;';
      tr.appendChild(tdIdx);
      row.forEach(cell => {
        const td = document.createElement('td');
        if (cell === null || cell === undefined) { td.textContent = 'NULL'; td.className = 'null-val'; }
        else td.textContent = String(cell);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    // new editable row
    const newTr = document.createElement('tr');
    newTr.style.background = 'var(--bg3)';
    const newTdIdx = document.createElement('td');
    newTdIdx.textContent = rows.length + 1;
    newTdIdx.style.cssText = 'color:var(--accent);text-align:right;padding-right:6px;font-weight:600;';
    newTr.appendChild(newTdIdx);
    const inputs = [];
    columns.forEach(() => {
      const td = document.createElement('td');
      const inp = document.createElement('input');
      inp.className = 'story-edit-input';
      inp.placeholder = 'NULL';
      inp.style.width = '100%';
      inputs.push(inp);
      td.appendChild(inp);
      newTr.appendChild(td);
    });
    tbody.appendChild(newTr);
    table.appendChild(tbody);

    // action row
    const actionDiv = document.createElement('div');
    actionDiv.style.cssText = 'display:flex;align-items:center;gap:10px;margin-top:6px;';
    const btn = document.createElement('button');
    btn.className = 'story-edit-btn primary';
    btn.textContent = '+ Add Row';
    const msg = document.createElement('div');
    msg.className = 'story-edit-success';
    actionDiv.appendChild(btn);
    actionDiv.appendChild(msg);

    wrap.appendChild(table);
    wrap.appendChild(actionDiv);
    outputEl.appendChild(wrap);

    inputs[0]?.focus();

    btn.addEventListener('click', () => {
      const newRow = inputs.map(inp => inp.value.trim() === '' ? null : inp.value.trim());
      ws.lastQueryData.rows.push(newRow);
      _rebuildResultsTable(ws);
      _updateDownloadBtn();
      msg.textContent = `Row ${ws.lastQueryData.rows.length} added.`;
      setTimeout(() => { msg.textContent = ''; _buildAddRowTable(); }, 1200);
    });

    // Enter key on last input triggers add
    if (inputs.length) {
      inputs[inputs.length - 1].addEventListener('keydown', e => {
        if (e.key === 'Enter') btn.click();
      });
    }
  }

  _buildAddRowTable();
}

function renderEditAddColumn(block) {
  const blockEl = document.querySelector(`.story-block[data-id="${block.id}"]`);
  if (!blockEl) return;
  const outputEl = blockEl.querySelector('.story-output');
  const ws = _workspaces.find(w => w.id === _activeWsId);
  if (!ws || !ws.lastQueryData) return;

  const wrap = document.createElement('div');
  wrap.className = 'story-edit-form';
  const rowDiv = document.createElement('div');
  rowDiv.className = 'story-edit-row';

  const nameField = document.createElement('div');
  nameField.className = 'story-edit-field';
  const nameLbl = document.createElement('label');
  nameLbl.textContent = 'Column name';
  const nameInp = document.createElement('input');
  nameInp.className = 'story-edit-input';
  nameInp.placeholder = 'new_column';
  nameField.appendChild(nameLbl);
  nameField.appendChild(nameInp);

  const valField = document.createElement('div');
  valField.className = 'story-edit-field';
  const valLbl = document.createElement('label');
  valLbl.textContent = 'Default value';
  const valInp = document.createElement('input');
  valInp.className = 'story-edit-input';
  valInp.placeholder = 'NULL';
  valField.appendChild(valLbl);
  valField.appendChild(valInp);

  const btn = document.createElement('button');
  btn.className = 'story-edit-btn primary';
  btn.textContent = 'Add Column';
  const msg = document.createElement('div');
  msg.className = 'story-edit-success';

  rowDiv.appendChild(nameField);
  rowDiv.appendChild(valField);
  wrap.appendChild(rowDiv);
  wrap.appendChild(btn);
  wrap.appendChild(msg);
  outputEl.innerHTML = '';
  outputEl.appendChild(wrap);

  btn.addEventListener('click', () => {
    const colName = nameInp.value.trim();
    if (!colName) { msg.style.color = 'var(--error-color)'; msg.textContent = 'Column name is required.'; return; }
    if (ws.lastQueryData.columns.includes(colName)) { msg.style.color = 'var(--error-color)'; msg.textContent = 'Column already exists.'; return; }
    const defVal = valInp.value.trim() === '' ? null : valInp.value.trim();
    ws.lastQueryData.columns.push(colName);
    ws.lastQueryData.rows.forEach(row => row.push(defVal));
    _rebuildResultsTable(ws);
    _updateDownloadBtn();
    nameInp.value = '';
    valInp.value = '';
    msg.style.color = 'var(--accent)';
    msg.textContent = `Column "${colName}" added.`;
    setTimeout(() => msg.textContent = '', 2500);
  });
}
