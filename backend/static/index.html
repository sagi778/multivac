function _filterTypeGroup(bqType) {
  const t = (bqType || '').toUpperCase().replace(/[<( ].*/,'');
  if (/^(INT|INT64|INTEGER|SMALLINT|BIGINT|TINYINT|BYTEINT|FLOAT|FLOAT64|NUMERIC|BIGNUMERIC|DECIMAL|BIGDECIMAL)$/.test(t)) return 'numeric';
  if (/^(DATE|DATETIME|TIMESTAMP|TIME|INTERVAL)$/.test(t)) return 'date';
  if (/^(BOOL|BOOLEAN)$/.test(t)) return 'bool';
  return 'string';
}

function insertFilterLine(filterText, tableFqn) {
  if (!window._monacoEditor || !window._monacoInstance) {
    EditorAPI.insertText('\n' + filterText);
    return;
  }
  const editor    = window._monacoEditor;
  const monaco    = window._monacoInstance;
  const model     = editor.getModel();
  const lineCount = model.getLineCount();

  // Resolve alias + FROM line for the table so we search the right query block
  let alias    = '';
  let fromLine = 1;
  if (tableFqn) {
    const normFqn  = tableFqn.replace(/`/g, '').toLowerCase();
    const aliasMap = parseAliasMap(model.getValue());
    for (const [a, fqn] of aliasMap) { if (fqn === normFqn) { alias = a; break; } }
    if (alias) {
      const aliasRe = new RegExp(`\\b(?:FROM|JOIN)\\s+\\S+\\s+(?:AS\\s+)?${alias}\\b`, 'i');
      for (let ln = 1; ln <= lineCount; ln++) {
        if (aliasRe.test(model.getLineContent(ln))) { fromLine = ln; break; }
      }
    }
  }

  // Scan forward from fromLine to find WHERE clause
  let whereLine = -1;
  for (let ln = fromLine; ln <= lineCount; ln++) {
    const t = model.getLineContent(ln);
    if (/^\s*WHERE\b/i.test(t)) { whereLine = ln; break; }
    if (ln > fromLine && /^\s*(GROUP\s+BY|ORDER\s+BY|HAVING|LIMIT|UNION)\b/i.test(t)) break;
  }

  if (whereLine !== -1) {
    // Find the last non-empty line of the WHERE block
    let lastWhereLine = whereLine;
    for (let ln = whereLine + 1; ln <= lineCount; ln++) {
      if (/^\s*(GROUP\s+BY|ORDER\s+BY|HAVING|LIMIT|UNION|;)\b/i.test(model.getLineContent(ln))) break;
      if (model.getLineContent(ln).trim()) lastWhereLine = ln;
    }
    const baseIndent = model.getLineContent(whereLine).match(/^(\s*)/)?.[1] || '';
    const col        = model.getLineLength(lastWhereLine) + 1;
    editor.executeEdits('bq-slave', [{
      range: new monaco.Range(lastWhereLine, col, lastWhereLine, col),
      text:  '\n' + baseIndent + '    ' + filterText,
      forceMoveMarkers: true,
    }]);
    editor.focus();
    return;
  }

  // No WHERE found — insert before GROUP BY / ORDER BY / HAVING / LIMIT, or at end of SQL
  let insertBeforeLine = -1;
  for (let ln = fromLine + 1; ln <= lineCount; ln++) {
    if (/^\s*(GROUP\s+BY|ORDER\s+BY|HAVING|LIMIT)\b/i.test(model.getLineContent(ln))) {
      insertBeforeLine = ln; break;
    }
  }
  if (insertBeforeLine !== -1) {
    const baseIndent = model.getLineContent(insertBeforeLine).match(/^(\s*)/)?.[1] || '';
    editor.executeEdits('bq-slave', [{
      range: new monaco.Range(insertBeforeLine, 1, insertBeforeLine, 1),
      text:  baseIndent + 'WHERE 1=1\n' + baseIndent + '    ' + filterText + '\n',
      forceMoveMarkers: true,
    }]);
  } else {
    let lastLine = lineCount;
    while (lastLine > 1 && !model.getLineContent(lastLine).trim()) lastLine--;
    const col = model.getLineLength(lastLine) + 1;
    editor.executeEdits('bq-slave', [{
      range: new monaco.Range(lastLine, col, lastLine, col),
      text:  '\nWHERE 1=1\n    ' + filterText,
      forceMoveMarkers: true,
    }]);
  }
  editor.focus();
}

function insertGroupByAll() {
  if (!window._monacoEditor || !window._monacoInstance) {
    const ta = document.getElementById('editor-fallback');
    if (!/\bGROUP\s+BY\b/i.test(ta.value)) ta.value = ta.value.trimEnd() + '\nGROUP BY ALL';
    return;
  }
  const editor = window._monacoEditor;
  const monaco = window._monacoInstance;
  const model  = editor.getModel();
  if (/\bGROUP\s+BY\b/i.test(model.getValue())) return;
  const cursor    = editor.getPosition();
  const lineCount = model.getLineCount();
  // Scan forward for ORDER BY / LIMIT / HAVING — insert before that line
  for (let ln = cursor.lineNumber + 1; ln <= lineCount; ln++) {
    if (/^\s*(ORDER\s+BY|LIMIT|HAVING)\b/i.test(model.getLineContent(ln))) {
      editor.executeEdits('bq-slave', [{
        range: new monaco.Range(ln, 1, ln, 1),
        text: 'GROUP BY ALL\n', forceMoveMarkers: true,
      }]);
      editor.focus();
      return;
    }
  }
  // No clause found — append after the last non-empty line from cursor onward
  let lastLine = lineCount;
  while (lastLine > cursor.lineNumber && !model.getLineContent(lastLine).trim()) lastLine--;
  const col = model.getLineLength(lastLine) + 1;
  editor.executeEdits('bq-slave', [{
    range: new monaco.Range(lastLine, col, lastLine, col),
    text: '\nGROUP BY ALL', forceMoveMarkers: true,
  }]);
  editor.focus();
}

function _uniqueAlias(tableName, existingAliasMap) {
  const parts = tableName.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
  const base = parts.map(p => p[0]).join('') || 't';
  if (!existingAliasMap.has(base)) return base;
  for (let i = 2; i < 10; i++) if (!existingAliasMap.has(base + i)) return base + i;
  return base + Date.now().toString().slice(-3);
}

function _joinInsertPos(sql) {
  // Returns char offset just before the first depth-0 terminating clause
  // Replace string literals/comments with same-length spaces to preserve offsets
  let s = sql
    .replace(/`[^`]*`/g,           m => ' '.repeat(m.length))
    .replace(/'(?:[^'\\]|\\.)*'/g, m => ' '.repeat(m.length))
    .replace(/"(?:[^"\\]|\\.)*"/g, m => ' '.repeat(m.length))
    .replace(/--[^\n]*/g,          m => ' '.repeat(m.length))
    .replace(/\/\*[\s\S]*?\*\//g,  m => ' '.repeat(m.length));
  let depth = 0;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (c === '(') { depth++; continue; }
    if (c === ')') { depth--; continue; }
    if (depth !== 0 || !/[A-Za-z]/.test(c) || (i > 0 && /\w/.test(s[i - 1]))) continue;
    if (/^(WHERE|HAVING|QUALIFY|LIMIT|UNION(\s+ALL)?|EXCEPT|INTERSECT|GROUP\s+BY|ORDER\s+BY)(?!\w)/i.test(s.slice(i))) {
      let pos = i;
      while (pos > 0 && /[ \t]/.test(sql[pos - 1])) pos--;
      return pos;
    }
  }
  return sql.trimEnd().length;
}

function addTableJoin(fqn, tableId, childrenEl) {
  const sql = EditorAPI.getValue().trim();
  if (!sql) { addTableMain(fqn, childrenEl); return; }

  const rawName = (tableId || fqn.replace(/`/g, '').split('.').pop()).replace(/[^a-zA-Z0-9]/g, '_');
  const alias = _uniqueAlias(rawName, parseAliasMap(sql));

  const joinLine = 'LEFT JOIN ' + fqn + ' AS ' + alias + ' ON ' + alias + '. = ';
  const pos = _joinInsertPos(sql);
  const newSql = sql.slice(0, pos) + '\n' + joinLine + sql.slice(pos);

  EditorAPI.setValue(newSql);

  // Position cursor right after "alias." so the user can type the join column
  if (window._monacoEditor) {
    const needle = 'ON ' + alias + '.';
    const lines = newSql.split('\n');
    for (let li = 0; li < lines.length; li++) {
      const col = lines[li].indexOf(needle);
      if (col >= 0) {
        window._monacoEditor.setPosition({ lineNumber: li + 1, column: col + needle.length + 1 });
        window._monacoEditor.focus();
        break;
      }
    }
  }

  markTableAdded(fqn, childrenEl);
}

function markTableAdded(fqn, childrenEl) {
  addedTables.add(fqn);
  if (childrenEl) childrenEl.classList.add('table-added');
  document.querySelectorAll('.col-list').forEach(el => {
    if (el.dataset.tableFqn === fqn) el.classList.add('table-added');
  });
}

    tItems.appendChild(buildFolderSection(_favorites.tableFolders, _favorites.tables, 'table'));
    const ungrouped = _favorites.tables.filter(t => !t.folderId);
    if (!ungrouped.length && !_favorites.tables.length && !_favCreatingTableFolder) {
      tItems.innerHTML += '<div class="fav-empty">No tables — click ☆ on any table to add</div>';
    } else {
      ungrouped.forEach(t => tItems.appendChild(buildItemRow(t, 'table', _favorites.tableFolders)));
    }
    body.appendChild(tItems);
  }

  el.appendChild(body);
}

async function _waitForTreeLoad(el, ms = 3000) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) {
    if (!el.querySelector('.info-node')?.textContent.includes('Loading')) return;
    await new Promise(r => setTimeout(r, 60));
  }
}

async function revealTableInTree(fqn) {
  // fqn: `project.dataset.table`
  const parts = fqn.replace(/`/g, '').split('.');
  if (parts.length !== 3) return;
  const [project, dataset, table] = parts;

  const tree = document.getElementById('sidebar-tree');

  // Expand project
  const projRow = tree.querySelector(`[data-project-id="${project}"]`);
  if (!projRow) return;
  const projChevron = projRow.querySelector('.chevron');
  if (!projChevron?.classList.contains('open')) projRow.click();
  const projChildren = projRow.nextElementSibling;
  await _waitForTreeLoad(projChildren);

  // Expand dataset
  const dsRow = projChildren.querySelector(`[data-dataset-id="${dataset}"][data-project-id="${project}"]`);
  if (!dsRow) return;
  const dsChevron = dsRow.querySelector('.chevron');
  if (!dsChevron?.classList.contains('open')) dsRow.click();
  const dsChildren = dsRow.nextElementSibling;
  await _waitForTreeLoad(dsChildren);

  // Find and highlight table
  const tableRow = dsChildren.querySelector(`[data-table-fqn="${fqn}"]`);
  if (!tableRow) return;
  tableRow.classList.remove('tree-highlight');
  void tableRow.offsetWidth; // force reflow to restart animation
  tableRow.classList.add('tree-highlight');
  tableRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  tableRow.addEventListener('animationend', () => tableRow.classList.remove('tree-highlight'), { once: true });
}

// ── Keybindings ───────────────────────────────────────────────────────────────
const DEFAULT_KEYBINDINGS = {
  runQuery:     { key: 'Enter',      ctrlCmd: true,  shift: false, alt: false },
  stopQuery:    { key: null,         ctrlCmd: false, shift: false, alt: false },
  treeDown:     { key: 'ArrowDown',  ctrlCmd: false, shift: false, alt: false },
  treeUp:       { key: 'ArrowUp',    ctrlCmd: false, shift: false, alt: false },
  treeExpand:   { key: 'ArrowRight', ctrlCmd: false, shift: false, alt: false },
  treeCollapse: { key: 'ArrowLeft',  ctrlCmd: false, shift: false, alt: false },
  treeSelect:   { key: 'Enter',      ctrlCmd: false, shift: false, alt: false },
};
const KEYBINDING_LABELS = {
  runQuery: 'Run query', stopQuery: 'Stop query',
  treeDown: 'Move down', treeUp: 'Move up', treeExpand: 'Expand', treeCollapse: 'Collapse', treeSelect: 'Select',
};
const KEYBINDING_GROUPS = [
  { label: 'Editor', keys: ['runQuery', 'stopQuery'] },
  { label: 'Tree',   keys: ['treeDown', 'treeUp', 'treeExpand', 'treeCollapse', 'treeSelect'] },
];
const _isMac = /Mac|iPhone|iPad/.test(navigator.platform);

function getKeybinding(action) {
  try {
    const stored = JSON.parse(localStorage.getItem('bqs-keybindings') || '{}');
    return stored[action] ?? DEFAULT_KEYBINDINGS[action];
  } catch { return DEFAULT_KEYBINDINGS[action]; }
}

function saveKeybinding(action, binding) {
  try {
    const stored = JSON.parse(localStorage.getItem('bqs-keybindings') || '{}');
    stored[action] = binding;
    localStorage.setItem('bqs-keybindings', JSON.stringify(stored));
  } catch {}
}

function formatKeybinding(b) {
  if (!b || !b.key) return '—';
  const parts = [];
  if (b.ctrlCmd) parts.push(_isMac ? '⌘' : 'Ctrl');
  if (b.shift)   parts.push(_isMac ? '⇧' : 'Shift');
  if (b.alt)     parts.push(_isMac ? '⌥' : 'Alt');
  parts.push(b.key === ' ' ? 'Space' : b.key.length === 1 ? b.key.toUpperCase() : b.key);
  return parts.join('+');
}

function matchKeybinding(e, action) {
  const b = getKeybinding(action);
  if (!b || !b.key) return false;
  const ctrlMatch = b.ctrlCmd ? (e.ctrlKey || e.metaKey) : (!e.ctrlKey && !e.metaKey);
  return e.key === b.key && ctrlMatch && !!e.shiftKey === b.shift && !!e.altKey === b.alt;
}

function buildKeybindingList() {
  const list = document.getElementById('keybinding-list');
  if (!list) return;
  list.innerHTML = '';
  let cancelRecording = null;

  KEYBINDING_GROUPS.forEach(group => {
    const groupEl = document.createElement('div');
    groupEl.className = 'keybinding-group-label';
    groupEl.textContent = group.label;
    list.appendChild(groupEl);
    group.keys.forEach(action => {
    const row = document.createElement('div');
    row.className = 'keybinding-row';

    const labelEl = document.createElement('span');
    labelEl.className = 'keybinding-label';
    labelEl.textContent = KEYBINDING_LABELS[action];

    const keyEl = document.createElement('span');
    keyEl.className = 'keybinding-key';
    keyEl.title = 'Click to change · Esc to cancel';
    keyEl.textContent = formatKeybinding(getKeybinding(action));

    const resetBtn = document.createElement('button');
    resetBtn.className = 'keybinding-reset';
    resetBtn.title = 'Reset to default';
    resetBtn.textContent = '↩';

    keyEl.addEventListener('click', () => {
      if (cancelRecording) cancelRecording(); // cancel any other active recording
      keyEl.textContent = 'Press shortcut…';
      keyEl.classList.add('recording');

      function onKeyDown(e) {
        if (['Control', 'Meta', 'Shift', 'Alt'].includes(e.key)) return; // wait for non-modifier
        e.preventDefault();
        e.stopPropagation();
        if (e.key !== 'Escape') {
          saveKeybinding(action, { key: e.key, ctrlCmd: e.ctrlKey || e.metaKey, shift: e.shiftKey, alt: e.altKey });
        }
        stop();
      }
      function stop() {
        document.removeEventListener('keydown', onKeyDown, true);
        keyEl.classList.remove('recording');
        keyEl.textContent = formatKeybinding(getKeybinding(action));
        cancelRecording = null;
      }
      cancelRecording = stop;
      document.addEventListener('keydown', onKeyDown, true);
    });

    resetBtn.addEventListener('click', e => {
      e.stopPropagation();
      if (cancelRecording) cancelRecording();
      saveKeybinding(action, DEFAULT_KEYBINDINGS[action]);
      keyEl.textContent = formatKeybinding(DEFAULT_KEYBINDINGS[action]);
    });

    row.appendChild(labelEl);
    row.appendChild(keyEl);
    row.appendChild(resetBtn);
    list.appendChild(row);
    }); // end group.keys
  }); // end KEYBINDING_GROUPS
}

async function doSidebarSearch(query) {
  const resultsEl = document.getElementById('sidebar-search-results');
  const tree = document.getElementById('sidebar-tree');
  const q = query.trim();
  if (!q) {
    resultsEl.style.display = 'none';
    resultsEl.innerHTML = '';
    return;
  }

  // ALL-CAPS query → search loaded column nodes by type
  if (q === q.toUpperCase() && /^[A-Z][A-Z0-9_]*$/.test(q)) {
    const matched = [...tree.querySelectorAll('.col-list .tree-node')].filter(row => {
      const badge = row.querySelector('.type-badge');
      return badge && badge.textContent.toUpperCase().includes(q);
    });
    resultsEl.style.display = 'block';
    if (!matched.length) {
      resultsEl.innerHTML = `<div class="info-node">No loaded columns of type ${q} — expand tables first</div>`;
      return;
    }
    resultsEl.innerHTML = '';
    matched.forEach(row => {
      const colList = row.closest('.col-list');
      const tableFqn = colList?.dataset?.tableFqn || '';
      const shortTable = tableFqn.replace(/`/g, '').split('.').pop();
      const colName = row.querySelector('.label')?.textContent || '';
      const colType = row.querySelector('.type-badge')?.textContent || '';
      const resultRow = document.createElement('div');
      resultRow.className = 'tree-node';
      const iconEl = document.createElement('span'); iconEl.className = 'icon'; iconEl.innerHTML = ICONS['column'] || '';
      const nameEl = document.createElement('span'); nameEl.className = 'label'; nameEl.textContent = colName;
      const typeEl = document.createElement('span'); typeEl.className = 'type-badge'; typeEl.textContent = colType;
      const dsEl = document.createElement('span'); dsEl.className = 'search-result-ds'; dsEl.textContent = shortTable;
      resultRow.appendChild(iconEl); resultRow.appendChild(nameEl); resultRow.appendChild(typeEl); resultRow.appendChild(dsEl);
      resultRow.addEventListener('click', () => {
        // Scroll to and highlight the original column row
        row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        row.style.background = 'var(--node-hover)';
        setTimeout(() => { row.style.background = ''; }, 1200);
      });
      resultsEl.appendChild(resultRow);
    });
    return;
  }

  resultsEl.style.display = 'block';
  resultsEl.innerHTML = '<div class="info-node">Searching…</div>';
  try {
    const all = [];
    await Promise.all(_sidebarProjects.map(async p => {
      const tables = await api(`/api/projects/${enc(p.id)}/tables/search?q=${enc(q)}`);
      all.push(...tables);
    }));
    if (!all.length) {
      resultsEl.innerHTML = '<div class="info-node">No tables found</div>';
      return;
    }
    resultsEl.innerHTML = '';
    all.forEach(t => {
      const fqn = '`' + t.project + '.' + t.dataset + '.' + t.id + '`';
      const row = document.createElement('div');
      row.className = 'tree-node';
      const iconEl = document.createElement('span');
      iconEl.className = 'icon';
      iconEl.innerHTML = ICONS['table'] || '';
      const nameEl = document.createElement('span');
      nameEl.className = 'label';
      nameEl.textContent = t.id;
      nameEl.style.color = 'var(--table-label)';
      const dsEl = document.createElement('span');
      dsEl.className = 'search-result-ds';
      dsEl.textContent = t.dataset;
      const cteBtn  = makeAddBtn('+ cte',  () => addTableCTE(fqn, t.id, null));
      const mainBtn = makeAddBtn('+ main', () => addTableMain(fqn, null));
      const joinBtn = makeAddBtn('+ join', () => addTableJoin(fqn, t.id, null));
      joinBtn.classList.add('join-btn');
      row.appendChild(iconEl);
      row.appendChild(nameEl);
      row.appendChild(dsEl);
      row.appendChild(cteBtn);
      row.appendChild(mainBtn);
      row.appendChild(joinBtn);
      resultsEl.appendChild(row);
    });
  } catch(e) {
    resultsEl.innerHTML = `<div class="error-node">${e.message}</div>`;
  }
}

// ── Query runner ──────────────────────────────────────────────────────────────
const PREVIEW_ROW_LIMIT = 1000;
const SLOW_QUERY_MS     = 15000;

let _slowRerunLimited = false;

function stopQuery() {
  const ws = _workspaces.find(w => w.id === _activeWsId);
  if (ws && ws.abortCtrl) ws.abortCtrl.abort();
}

async function runQuery({ limitRows = null } = {}) {
  const sql = EditorAPI.getValue().trim();
  if (!sql) return;

  // Capture which workspace this run belongs to
  const runningWsId = _activeWsId;
  const ws = _workspaces.find(w => w.id === runningWsId);
  if (!ws) return;
  ws.sql = sql;

  const isActive = () => _activeWsId === runningWsId;
  // Update DOM only when this workspace is still shown
  function setDOM(fn) { if (isActive()) fn(); }

  const runBtn       = document.getElementById('run-btn');
  const stopBtn      = document.getElementById('stop-btn');
  const overlay      = document.getElementById('loading-overlay');
  const slowNotice   = document.getElementById('slow-query-notice');
  const errorBanner  = document.getElementById('error-banner');
  const resultsScroll = document.getElementById('results-scroll');
  const statusText   = document.getElementById('status-text');
  const statusWarn   = document.getElementById('status-warn');
  const statusJobId  = document.getElementById('status-jobid');

  ws.abortCtrl      = new AbortController();
  ws.isRunning      = true;
  _slowRerunLimited = false;
  _renderWsBar();

  setDOM(() => {
    runBtn.disabled = true;
    runBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg> Running…`;
    stopBtn.style.display = 'flex';
    overlay.style.display = 'flex';
    slowNotice.style.display = 'none';
    errorBanner.style.display = 'none';
    resultsScroll.innerHTML = '';
    statusText.textContent = 'Running…';
    statusWarn.style.display = 'none';
    statusJobId.style.display = 'none';
  });

  const slowTimer = setTimeout(() => { setDOM(() => { slowNotice.style.display = ''; }); }, SLOW_QUERY_MS);

  try {
    const _queryT0 = Date.now();
    const reqBody = { sql, project: '' };
    if (limitRows) reqBody.limit_rows = limitRows;
    const res = await fetch('/api/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(reqBody),
      signal: ws.abortCtrl.signal,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);

    // Save results to workspace state
    ws.lastQueryContext  = { sql, project: '' };
    ws.lastQueryColumns  = data.columns;
    ws.lastQuerySchema   = data.schema || [];
    ws.lastQueryData     = { columns: data.columns, schema: data.schema || [], rows: data.rows };

    // Update global state if still active
    if (isActive()) {
      _lastQueryContext = ws.lastQueryContext;
      _lastQueryColumns = ws.lastQueryColumns;
      _lastQuerySchema  = ws.lastQuerySchema;
      // Refresh any open story column pickers
      document.querySelectorAll('.story-col-picker').forEach(pickerEl => {
        const blockEl = pickerEl.closest('.story-block');
        if (!blockEl) return;
        const block = _storyBlocks.find(b => b.id === blockEl.dataset.id);
        if (block) refreshColPicker(pickerEl, block, STORY_BLOCK_DEFS[block.type]?.colPickerLabel);
      });
      document.querySelectorAll('.story-single-col').forEach(pickerEl => {
        const blockEl = pickerEl.closest('.story-block');
        if (!blockEl) return;
        const block = _storyBlocks.find(b => b.id === blockEl.dataset.id);
        if (block) refreshSingleColPicker(pickerEl, block);
      });
      document.querySelectorAll('.story-col-pickers-row').forEach(rowEl => {
        const blockEl = rowEl.closest('.story-block');
        if (!blockEl) return;
        const block = _storyBlocks.find(b => b.id === blockEl.dataset.id);
        if (block) {
          const def = STORY_BLOCK_DEFS[block.type];
          if (def && def.colPickers) refreshColPickersRow(rowEl, block, def.colPickers);
        }
      });
    }

    const totalRows   = data.totalRows ?? data.rows.length;
    const displayRows = data.rows.slice(0, PREVIEW_ROW_LIMIT);

    // Build result table HTML into a temp container so we can save it
    const tempDiv = document.createElement('div');
    tempDiv.className = 'lq-table-scroll';
    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    const _schMap = schemaMap(data.schema);
    const _idxTh = document.createElement('th'); _idxTh.className = 'tbl-idx-th'; _idxTh.textContent = '#'; hr.appendChild(_idxTh);
    data.columns.forEach(col => {
      const th = document.createElement('th');
      th.textContent = col;
      addTypeIcon(th, _schMap[col]);
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    table.appendChild(thead);
    const tbody = document.createElement('tbody');
    displayRows.forEach((row, ri) => {
      const tr = document.createElement('tr');
      const _idxTd = document.createElement('td'); _idxTd.className = 'tbl-idx-td'; _idxTd.textContent = ri + 1; tr.appendChild(_idxTd);
      row.forEach(cell => {
        const td = document.createElement('td');
        if (cell === null || cell === undefined) { td.textContent = 'NULL'; td.className = 'null-val'; }
        else td.textContent = String(cell);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tempDiv.appendChild(table);

    // Build status values
    const _queryElapsed = ((Date.now() - _queryT0) / 1000).toFixed(1);
    const newStatusText = `${totalRows.toLocaleString()} row${totalRows !== 1 ? 's' : ''} returned · ${_queryElapsed}s`;
    let newWarnText = '', newWarnVisible = false;
    if (data.rows.length > PREVIEW_ROW_LIMIT) {
      newWarnText = `(showing first ${PREVIEW_ROW_LIMIT.toLocaleString()})`;
      newWarnVisible = true;
    } else if (limitRows && totalRows > data.rows.length) {
      newWarnText = `(limited to ${data.rows.length.toLocaleString()} of ${totalRows.toLocaleString()})`;
      newWarnVisible = true;
    }
    const newJobIdText = 'Job: ' + data.jobId;

    // Save to workspace
    ws.resultsHtml       = tempDiv.innerHTML;
    ws.statusText        = newStatusText;
    ws.statusWarnText    = newWarnText;
    ws.statusWarnVisible = newWarnVisible;
    ws.statusJobIdText   = newJobIdText;
    ws.statusJobIdVisible = true;
    ws.errorBannerText    = '';
    ws.errorBannerVisible = false;
    _schedSave();

    setDOM(() => {
      statusText.textContent = newStatusText;
      if (newWarnVisible) { statusWarn.textContent = newWarnText; statusWarn.style.display = ''; }
      statusJobId.textContent = newJobIdText;
      statusJobId.style.display = '';
      resultsScroll.innerHTML = ws.resultsHtml;
      const _rt = resultsScroll.querySelector('table');
      if (_rt) makeTableResizable(_rt);
      _updateDownloadBtn();
    });

  } catch(e) {
    if (e.name === 'AbortError') {
      const msg = _slowRerunLimited ? 'Re-running with row limit…' : 'Query cancelled';
      ws.statusText = msg;
      setDOM(() => { statusText.textContent = msg; });
    } else {
      ws.statusText = 'Query failed';
      ws.errorBannerText = e.message;
      ws.errorBannerVisible = true;
      setDOM(() => {
        errorBanner.textContent = e.message;
        errorBanner.style.display = 'block';
        statusText.textContent = 'Query failed';
      });
    }
  } finally {
    clearTimeout(slowTimer);
    setDOM(() => { slowNotice.style.display = 'none'; });
    ws.abortCtrl = null;
    ws.isRunning = false;
    _renderWsBar();
    setDOM(() => {
      runBtn.disabled = false;
      runBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg> Run`;
      stopBtn.style.display = 'none';
      overlay.style.display = 'none';
    });
    if (_slowRerunLimited && isActive()) {
      _slowRerunLimited = false;
      runQuery({ limitRows: PREVIEW_ROW_LIMIT });
    } else {
      _slowRerunLimited = false;
    }
  }
}

// ── File save helper (File System Access API with <a> fallback) ───────────────
async function _saveFile(content, filename, mime) {
  // If file explorer has an open folder, save directly there via backend
  const feRoot = window._feGetRoot && window._feGetRoot();
  if (feRoot) {
    const text = content instanceof Blob ? await content.text() : content;
    try {
      const r = await fetch('/api/fs/write', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: feRoot + '/' + filename, content: text }),
      });
      if (!r.ok) {
        const err = await r.json().catch(() => ({ detail: 'Write failed' }));
        throw new Error(err.detail || 'Write failed');
      }
      // Refresh file tree
      if (window._feRefresh) window._feRefresh();
      return;
    } catch (e) {
      // fall through to browser download
    }
  }
  if (window.showSaveFilePicker) {
    const ext = filename.split('.').pop().toLowerCase();
    const typeMap = {
      csv:  { description: 'CSV file',  accept: { 'text/csv': ['.csv'] } },
      tsv:  { description: 'TSV file',  accept: { 'text/tab-separated-values': ['.tsv'] } },
      json: { description: 'JSON file', accept: { 'application/json': ['.json'] } },
      html: { description: 'HTML file', accept: { 'text/html': ['.html'] } },
    };
    const fileType = typeMap[ext] || { description: 'File', accept: { [mime]: ['.' + ext] } };
    try {
      const handle = await window.showSaveFilePicker({ suggestedName: filename, types: [fileType] });
      const writable = await handle.createWritable();
      await writable.write(content instanceof Blob ? content : new Blob([content], { type: mime }));
      await writable.close();
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  Object.assign(document.createElement('a'), { href: url, download: filename }).click();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
}

function _extractBqProject(sql) {
  if (!sql) return null;
  let m = sql.match(/`([a-z0-9_][a-z0-9_-]*)\.[^`]+`/i);
  if (m) return m[1];
  m = sql.match(/\b(?:FROM|JOIN)\s+([a-z][a-z0-9_-]*)\.[a-z0-9_.`-]+/i);
  return m ? m[1] : null;
}

function showExportPicker(anchorEl, options) {
  document.querySelectorAll('.cast-type-picker').forEach(p => p.remove());
  const picker = document.createElement('div');
  picker.className = 'cast-type-picker';
  picker.style.minWidth = '160px';
  options.forEach(({ label, action }) => {
    const item = document.createElement('div');
    item.className = 'cast-type-item';
    item.textContent = label;
    item.addEventListener('mousedown', e => { e.preventDefault(); picker.remove(); action(); });
    picker.appendChild(item);
  });
  document.body.appendChild(picker);
  const rect = anchorEl.getBoundingClientRect();
  picker.style.left = Math.min(rect.left, window.innerWidth - 170) + 'px';
  picker.style.top  = (rect.bottom + 4 + window.scrollY) + 'px';
  setTimeout(() => document.addEventListener('click', () => picker.remove(), { once: true }), 0);
}

function _makeCodeCell(sourceLines) {
  return { cell_type: 'code', metadata: {}, source: sourceLines, outputs: [], execution_count: null };
}
function _makeMarkdownCell(sourceLines) {
  return { cell_type: 'markdown', metadata: {}, source: sourceLines };
}

function _blockToNotebookCode(block) {
  const p   = block.params || {};
  const tbl = 'df';

  function _P(vars) {
    const lines = ['# Parameters\n'];
    for (const [k, v] of Object.entries(vars)) lines.push(`${k} = ${v}\n`);
    lines.push('\n');
    return lines;
  }

  switch (block.type) {
    case 'shape':
      return [
        `print("Shape:", ${tbl}.shape)\n`,
        `print("\\nDtypes:")\n`,
        `print(${tbl}.dtypes)\n`,
      ];

    case 'preview': {
      const n    = p.amount || 5;
      const mode = p.mode || 'head';
      const cols = (p.columns && p.columns.length) ? `[${p.columns.map(c => `'${c}'`).join(', ')}]` : '[]';
      return [
        ..._P({
          n:       String(n),
          mode:    `'${mode}'  # 'head', 'tail', 'random'`,
          columns: `${cols}  # subset of columns, or [] for all`,
        }),
        `_tbl = ${tbl}[columns] if columns else ${tbl}\n`,
        `{'tail': _tbl.tail, 'random': lambda k: _tbl.sample(k, random_state=42)}.get(mode, _tbl.head)(n)\n`,
      ];
    }

    case 'describe':
      return [
        `null_pct = (${tbl}.isnull().sum() / len(${tbl}) * 100).round(2)\n`,
        `pd.DataFrame({'column': ${tbl}.columns, 'dtype': ${tbl}.dtypes.astype(str).values,\n`,
        `              'nulls': ${tbl}.isnull().sum().values, 'null_pct': null_pct.values})\n`,
      ];

    case 'col_describe': {
      const col = p.column || (p.columns && p.columns[0]) || 'my_column';
      return [
        ..._P({ column: `'${col}'` }),
        `print(${tbl}[column].describe())\n`,
        `print("\\nTop values:")\n`,
        `print(${tbl}[column].value_counts().head(20))\n`,
      ];
    }

    case 'value_count': {
      const col   = p.column || (p.columns && p.columns[0]) || 'my_column';
      const top_n = p.top_n || 20;
      return [
        ..._P({ column: `'${col}'`, top_n: String(top_n) }),
        `${tbl}[column].value_counts().head(top_n).to_frame()\n`,
      ];
    }

    case 'histogram': {
      const col  = p.column || (p.columns && p.columns[0]) || 'my_column';
      const bins = p.bins || 20;
      return [
        ..._P({ column: `'${col}'`, bins: String(bins) }),
        'import plotly.express as px\n',
        `px.histogram(${tbl}, x=column, nbins=bins).show()\n`,
      ];
    }

    case 'scatter': {
      const x_col   = p.x_col || 'col_x';
      const y_col   = p.y_col || 'col_y';
      const group_by = p.group_by ? `'${p.group_by}'` : 'None';
      return [
        ..._P({
          x_col:    `'${x_col}'`,
          y_col:    `'${y_col}'`,
          group_by: `${group_by}  # or 'column_name'`,
        }),
        'import plotly.express as px\n',
        `px.scatter(${tbl}, x=x_col, y=y_col, color=group_by).show()\n`,
      ];
    }

    case 'lineplot': {
      const x_col    = p.x_col || 'col_x';
      const y_col    = p.y_col || 'col_y';
      const group_by = p.group_by ? `'${p.group_by}'` : 'None';
      return [
        ..._P({
          x_col:    `'${x_col}'`,
          y_col:    `'${y_col}'`,
          group_by: `${group_by}  # or 'column_name'`,
        }),
        'import plotly.express as px\n',
        `px.line(${tbl}, x=x_col, y=y_col, color=group_by).show()\n`,
      ];
    }

    case 'boxplot': {
      const y_col    = p.y_col || 'col_y';
      const group_col = p.group_col ? `'${p.group_col}'` : 'None';
      return [
        ..._P({
          y_col:     `'${y_col}'`,
          group_col: `${group_col}  # or 'column_name'`,
        }),
        'import plotly.express as px\n',
        `px.box(${tbl}, y=y_col, x=group_col).show()\n`,
      ];
    }

    case 'barplot': {
      const x_col    = p.x_col || 'col_x';
      const y_col    = p.y_col ? `'${p.y_col}'` : 'None';
      const agg      = p.agg || 'count';
      const orient   = p.orientation === 'horizontal' ? 'h' : 'v';
      const group_col = p.group_col ? `'${p.group_col}'` : 'None';
      return [
        ..._P({
          x_col:       `'${x_col}'`,
          y_col:       `${y_col}  # used when agg != 'count'`,
          agg:         `'${agg}'  # 'count', 'sum', 'mean', 'median', 'max', 'min'`,
          orientation: `'${orient}'  # 'v' or 'h'`,
          group_col:   `${group_col}  # or 'column_name'`,
        }),
        'import plotly.express as px\n',
        `if agg == 'count':\n`,
        `    _agg = ${tbl}.groupby(x_col).size().reset_index(name='count')\n`,
        `    px.bar(_agg, x=x_col, y='count', color=group_col, orientation=orientation).show()\n`,
        `else:\n`,
        `    _y = y_col or ${tbl}.select_dtypes('number').columns[0]\n`,
        `    _agg = ${tbl}.groupby(x_col)[_y].agg(agg).reset_index()\n`,
        `    px.bar(_agg, x=x_col, y=_y, color=group_col, orientation=orientation).show()\n`,
      ];
    }

    case 'linreg': {
      const x_col = p.x_col || 'col_x';
      const y_col = p.y_col || 'col_y';
      return [
        ..._P({ x_col: `'${x_col}'`, y_col: `'${y_col}'` }),
        'import numpy as np\n',
        'import plotly.express as px\n',
        'from sklearn.linear_model import LinearRegression\n',
        `_d = ${tbl}[[x_col, y_col]].dropna()\n`,
        `_m = LinearRegression().fit(_d[[x_col]], _d[y_col])\n`,
        `print(f"R²={_m.score(_d[[x_col]], _d[y_col]):.4f}  slope={_m.coef_[0]:.4f}  intercept={_m.intercept_:.4f}")\n`,
        `_d = _d.copy(); _d['_pred'] = _m.predict(_d[[x_col]])\n`,
        `fig = px.scatter(_d, x=x_col, y=y_col)\n`,
        `fig.add_scatter(x=_d[x_col], y=_d['_pred'], mode='lines', name='Fit')\n`,
        `fig.show()\n`,
      ];
    }

    case 'hypo_test': {
      const value_col = p.value_col || 'value_col';
      const group_col = p.group_col || 'group_col';
      const test  = p.test || 'auto';
      const alpha = p.alpha || 0.05;
      return [
        ..._P({
          value_col: `'${value_col}'`,
          group_col: `'${group_col}'`,
          test:      `'${test}'  # 'auto', 't-test', 'mann-whitney', 'anova', 'kruskal'`,
          alpha:     String(alpha),
        }),
        'from scipy import stats\n',
        `_grps = [g[value_col].dropna().values for _, g in ${tbl}.groupby(group_col)]\n`,
        `_n = len(_grps)\n`,
        `if test in ('t-test', 'auto') and _n == 2:\n`,
        `    stat, p_val = stats.ttest_ind(*_grps); print(f"t-test t={stat:.4f} p={p_val:.4f} sig={p_val<alpha}")\n`,
        `elif test in ('mann-whitney', 'auto') and _n == 2:\n`,
        `    stat, p_val = stats.mannwhitneyu(*_grps); print(f"Mann-Whitney U={stat:.4f} p={p_val:.4f} sig={p_val<alpha}")\n`,
        `elif _n > 2:\n`,
        `    stat, p_val = stats.f_oneway(*_grps) if test == 'anova' else stats.kruskal(*_grps)\n`,
        `    print(f"stat={stat:.4f} p={p_val:.4f} sig={p_val<alpha}")\n`,
      ];
    }

    case 'corr_matrix': {
      const cols = (p.columns && p.columns.length) ? `[${p.columns.map(c => `'${c}'`).join(', ')}]` : '[]';
      return [
        ..._P({ columns: `${cols}  # or [] for all numeric columns` }),
        'import plotly.express as px\n',
        `_num = (${tbl}[columns] if columns else ${tbl}).select_dtypes(include='number')\n`,
        `px.imshow(_num.corr(), text_auto='.2f', color_continuous_scale='RdBu_r', zmin=-1, zmax=1).show()\n`,
      ];
    }

    case 'feature_importance': {
      const y_col = p.y_col || 'target_col';
      const cols  = (p.columns && p.columns.length) ? `[${p.columns.map(c => `'${c}'`).join(', ')}]` : '[]';
      const model = p.model || 'decision_tree';
      return [
        ..._P({
          y_col:   `'${y_col}'`,
          columns: `${cols}  # feature columns; [] = all numeric except y_col`,
          model:   `'${model}'  # 'decision_tree', 'random_forest', 'xgboost', 'linear'`,
        }),
        'import numpy as np\n',
        'import plotly.express as px\n',
        `if model == 'random_forest':\n`,
        `    from sklearn.ensemble import RandomForestRegressor as _M\n`,
        `elif model == 'xgboost':\n`,
        `    from xgboost import XGBRegressor as _M\n`,
        `elif model == 'linear':\n`,
        `    from sklearn.linear_model import Ridge as _M\n`,
        `else:\n`,
        `    from sklearn.tree import DecisionTreeRegressor as _M\n`,
        `_fc = columns or [c for c in ${tbl}.select_dtypes(include='number').columns if c != y_col]\n`,
        `_d = ${tbl}[_fc + [y_col]].dropna()\n`,
        `_mod = _M().fit(_d[_fc], _d[y_col])\n`,
        `_imp = getattr(_mod, 'feature_importances_', None) or np.abs(_mod.coef_)\n`,
        `px.bar(x=_imp, y=_fc, orientation='h', title='Feature Importance').show()\n`,
      ];
    }

    case 'predict_model': {
      const y_col = p.y_col || 'target_col';
      const cols  = (p.columns && p.columns.length) ? `[${p.columns.map(c => `'${c}'`).join(', ')}]` : '[]';
      const model = p.model || 'decision_tree';
      return [
        ..._P({
          y_col:   `'${y_col}'`,
          columns: `${cols}  # feature columns; [] = all numeric except y_col`,
          model:   `'${model}'  # 'decision_tree', 'random_forest', 'xgboost', 'linear'`,
        }),
        'import numpy as np\n',
        'import plotly.express as px\n',
        'from sklearn.model_selection import train_test_split\n',
        'from sklearn.metrics import r2_score, mean_absolute_error\n',
        `if model == 'random_forest':\n`,
        `    from sklearn.ensemble import RandomForestRegressor as _M\n`,
        `elif model == 'xgboost':\n`,
        `    from xgboost import XGBRegressor as _M\n`,
        `elif model == 'linear':\n`,
        `    from sklearn.linear_model import Ridge as _M\n`,
        `else:\n`,
        `    from sklearn.tree import DecisionTreeRegressor as _M\n`,
        `_fc = columns or [c for c in ${tbl}.select_dtypes(include='number').columns if c != y_col]\n`,
        `_d = ${tbl}[_fc + [y_col]].dropna()\n`,
        `X_tr, X_te, y_tr, y_te = train_test_split(_d[_fc].values, _d[y_col].values, test_size=0.2, random_state=42)\n`,
        `_mod = _M().fit(X_tr, y_tr); _pred = _mod.predict(X_te)\n`,
        `print(f"R²={r2_score(y_te, _pred):.4f}  MAE={mean_absolute_error(y_te, _pred):.4f}")\n`,
        `px.scatter(x=y_te, y=_pred, labels={'x': 'Actual', 'y': 'Predicted'}).show()\n`,
      ];
    }

    case 'outlier_detect': {
      const col    = p.column || (p.columns && p.columns[0]) || 'my_column';
      const method = p.method || 'IQR';
      const thr    = p.threshold || 1.5;
      return [
        ..._P({
          column:    `'${col}'`,
          method:    `'${method}'  # 'IQR', 'Z-Score', 'Mod-Z', 'Percentile'`,
          threshold: String(thr),
        }),
        'import numpy as np\n',
        'import plotly.express as px\n',
        `_s = ${tbl}[column].dropna()\n`,
        `if method == 'IQR':\n`,
        `    Q1, Q3 = _s.quantile(0.25), _s.quantile(0.75); IQR = Q3 - Q1\n`,
        `    _mask = (_s < Q1 - threshold * IQR) | (_s > Q3 + threshold * IQR)\n`,
        `elif method == 'Z-Score':\n`,
        `    _mask = ((_s - _s.mean()) / _s.std()).abs() > threshold\n`,
        `elif method == 'Mod-Z':\n`,
        `    _med = _s.median(); _mad = (_s - _med).abs().median()\n`,
        `    _mask = (0.6745 * (_s - _med) / _mad).abs() > threshold\n`,
        `else:  # Percentile\n`,
        `    _lo, _hi = _s.quantile(threshold / 100), _s.quantile(1 - threshold / 100)\n`,
        `    _mask = (_s < _lo) | (_s > _hi)\n`,
        `print(f"Outliers ({method}, thr={threshold}): {_mask.sum()} / {len(_s)}")\n`,
        `px.box(${tbl}, y=column).show()\n`,
      ];
    }

    default:
      return [`# Block type '${block.type}' not supported for notebook export\n`];
  }
}

// ── Download results ──────────────────────────────────────────────────────────
async function downloadResults(format) {
  const ws = _workspaces.find(w => w.id === _activeWsId);
  if (!ws || !ws.lastQueryData) return;
  const { columns, rows } = ws.lastQueryData;
  let content, mime, ext;

  if (format === 'csv') {
    const esc = v => {
      if (v === null || v === undefined) return '';
      const s = String(v);
      return (s.includes(',') || s.includes('"') || s.includes('\n') || s.includes('\r'))
        ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const lines = [columns.map(esc).join(',')];
    rows.forEach(row => lines.push(row.map(esc).join(',')));
    content = lines.join('\r\n');
    mime = 'text/csv'; ext = 'csv';
  } else if (format === 'tsv') {
    const esc = v => (v === null || v === undefined) ? '' : String(v).replace(/[\t\n\r]/g, ' ');
    const lines = [columns.map(esc).join('\t')];
    rows.forEach(row => lines.push(row.map(esc).join('\t')));
    content = lines.join('\r\n');
    mime = 'text/tab-separated-values'; ext = 'tsv';
  } else if (format === 'json') {
    const objects = rows.map(row => Object.fromEntries(columns.map((c, i) => [c, row[i]])));
    content = JSON.stringify(objects, null, 2);
    mime = 'application/json'; ext = 'json';
  } else {
    return;
  }

  const safeName = (ws.name || 'query_results').replace(/[\\/:*?"<>|]/g, '_');
  await _saveFile(content, safeName + '.' + ext, mime);
}

// ── Copy table as text ────────────────────────────────────────────────────────
async function copyTableAsText() {
  const ws = _workspaces.find(w => w.id === _activeWsId);
  if (!ws || !ws.lastQueryData) return;
  const { columns, rows } = ws.lastQueryData;
  if (rows.length > 100) return;

  const str = v => (v === null || v === undefined) ? '' : String(v);
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // HTML table — pastes as a real table in JIRA, Word, Confluence, Google Docs
  const thStyle = 'border:1px solid #ccc;padding:4px 8px;background:#f0f0f0;font-weight:bold';
  const tdStyle = 'border:1px solid #ccc;padding:4px 8px';
  const htmlHeader = '<tr>' + columns.map(c => `<th style="${thStyle}">${esc(c)}</th>`).join('') + '</tr>';
  const htmlRows = rows.map(row =>
    '<tr>' + row.map(v => `<td style="${tdStyle}">${esc(str(v))}</td>`).join('') + '</tr>'
  ).join('');
  const htmlTable = `<table style="border-collapse:collapse;font-size:13px;font-family:sans-serif"><thead>${htmlHeader}</thead><tbody>${htmlRows}</tbody></table>`;

  // TSV — pastes as cells in Excel / plain text editors
  const tsvLines = [columns.join('\t'), ...rows.map(row => row.map(v => str(v).replace(/[\t\n\r]/g, ' ')).join('\t'))];
  const tsv = tsvLines.join('\n');

  try {
    await navigator.clipboard.write([
      new ClipboardItem({
        'text/html':  new Blob([htmlTable], { type: 'text/html' }),
        'text/plain': new Blob([tsv],       { type: 'text/plain' }),
      }),
    ]);
  } catch {
    await navigator.clipboard.writeText(tsv);
  }

  const btn = document.getElementById('copy-table-btn');
  const origHTML = btn.innerHTML;
  btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  btn.style.cssText += ';color:var(--accent);border-color:var(--accent)';
  setTimeout(() => { btn.innerHTML = origHTML; btn.style.color = ''; btn.style.borderColor = ''; }, 1500);
}

document.getElementById('copy-table-btn').addEventListener('click', copyTableAsText);

// ── Sidebar tree keyboard navigation ─────────────────────────────────────────
let _treeFocusedNode = null;

function getVisibleTreeNodes() {
  const searchResults = document.getElementById('sidebar-search-results');
  if (searchResults.style.display === 'block') {
    return Array.from(searchResults.querySelectorAll('.tree-node'));
  }
  const tree = document.getElementById('sidebar-tree');
  const nodes = [];
  function walk(container) {
    for (const child of container.children) {
      if (child.classList.contains('tree-node') && !child.classList.contains('search-hidden')) {
        nodes.push(child);
      } else if (!child.classList.contains('tree-node') && child.style.display !== 'none') {
        walk(child);
      }
    }
  }
  walk(tree);
  return nodes;
}

function setTreeFocus(node) {
  if (_treeFocusedNode) _treeFocusedNode.classList.remove('keyboard-focus');
  _treeFocusedNode = node;
  if (node) {
    node.classList.add('keyboard-focus');
    node.scrollIntoView({ block: 'nearest' });
  }
}

document.getElementById('sidebar-tree').addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const treeActions = ['treeDown','treeUp','treeExpand','treeCollapse','treeSelect'];
  const action = treeActions.find(a => matchKeybinding(e, a));
  if (!action && e.key !== 'Escape') return;

  const nodes = getVisibleTreeNodes();
  if (!nodes.length) return;

  // If nothing focused yet, start at the first node
  if (!_treeFocusedNode || !nodes.includes(_treeFocusedNode)) {
    e.preventDefault();
    setTreeFocus(nodes[0]);
    return;
  }

  const idx = nodes.indexOf(_treeFocusedNode);

  if (action === 'treeDown') {
    e.preventDefault();
    setTreeFocus(nodes[idx < nodes.length - 1 ? idx + 1 : 0]);
  } else if (action === 'treeUp') {
    e.preventDefault();
    setTreeFocus(nodes[idx > 0 ? idx - 1 : nodes.length - 1]);
  } else if (action === 'treeExpand') {
    e.preventDefault();
    const chevron = _treeFocusedNode.querySelector('.chevron');
    if (chevron && chevron.innerHTML && !chevron.classList.contains('open')) {
      _treeFocusedNode.click();
    } else {
      const updated = getVisibleTreeNodes();
      const newIdx = updated.indexOf(_treeFocusedNode);
      if (newIdx < updated.length - 1) setTreeFocus(updated[newIdx + 1]);
    }
  } else if (action === 'treeCollapse') {
    e.preventDefault();
    const chevron = _treeFocusedNode.querySelector('.chevron');
    if (chevron && chevron.classList.contains('open')) {
      _treeFocusedNode.click();
    } else {
      const parentNode = _treeFocusedNode.parentElement?.previousElementSibling;
      if (parentNode?.classList.contains('tree-node')) setTreeFocus(parentNode);
    }
  } else if (action === 'treeSelect') {
    e.preventDefault();
    _treeFocusedNode.click();
  } else if (e.key === 'Escape') {
    setTreeFocus(null);
  }
});

// Sync keyboard focus when clicking a node
document.getElementById('sidebar-tree').addEventListener('mousedown', e => {
  const node = e.target.closest('.tree-node');
  if (node) setTreeFocus(node);
});
document.getElementById('sidebar-search-results').addEventListener('mousedown', e => {
  const node = e.target.closest('.tree-node');
  if (node) setTreeFocus(node);
});

let _storyDragSrc = null;

function addStoryBlock(type) {
  const def = STORY_BLOCK_DEFS[type];
  if (!def) return;
  const params = {};
  def.params.forEach(p => { params[p.key] = p.default; });
  _storyBlocks.push({ id: 'sb_' + Date.now(), type, params, comment: '' });
  renderStoryBlocks();
  _schedSave();
}

function renderStoryBlocks() {
  const container = document.getElementById('story-blocks');
  document.getElementById('story-empty').style.display = _storyBlocks.length ? 'none' : '';
  // Dispose any live mini editors before wiping DOM
  _storyBlocks.forEach(b => {
    if (b._miniEditor) { b._miniEditor.dispose(); b._miniEditor = null; }
    if (b._pyEditor)   { b._pyEditor.dispose();   b._pyEditor   = null; }
  });
  [...container.children].forEach(c => { if (c.id !== 'story-empty') c.remove(); });
  _storyBlocks.forEach(b => {
    const el = buildStoryBlock(b);
    container.appendChild(el);
    // Init mini Monaco editor for sql_query blocks (needs to be in DOM first)
    if (b.type === 'sql_query') {
      const host = el.querySelector('.story-mini-editor-host');
      if (host) _initMiniEditor(b, host);
    }
    // Init Python editor for python_exec blocks
    if (b.type === 'python_exec') {
      const host = el.querySelector('.story-py-editor-host');
      if (host) _initPyEditor(b, host);
      if (b._lastPyResult !== undefined) {
        const outputEl = el.querySelector('.story-output');
        outputEl.className = 'story-output visible';
        renderStoryOutput('python_exec', b._lastPyResult, outputEl, b);
        if (b.folded) outputEl.style.display = 'none';
      }
    }
    // Restore describe output (needs DOM insertion first for renderDescribeTable to work)
    if (b.type === 'describe' && b._lastData) {
      const outputEl = el.querySelector('.story-output');
      outputEl.className = 'story-output visible';
      renderDescribeTable(b);
      if (b.folded) outputEl.style.display = 'none';
    }
    // Restore preview output
    if (b.type === 'preview' && b._lastData) {
      const outputEl = el.querySelector('.story-output');
      outputEl.className = 'story-output visible';
      renderPreviewTable(b, outputEl);
      if (b.folded) outputEl.style.display = 'none';
    }
    // Restore search output
    if (b.type === 'search' && b._lastData) {
      const outputEl = el.querySelector('.story-output');
      outputEl.className = 'story-output visible';
      renderSearchTable(b, outputEl);
      if (b.folded) outputEl.style.display = 'none';
    }
    // Restore boxplot output
    if (b.type === 'boxplot' && b._lastData) {
      const outputEl = el.querySelector('.story-output');
      outputEl.className = 'story-output visible plot-output';
      renderBoxplot(b);
      if (b.folded) outputEl.style.display = 'none';
    }
    // Restore outlier detect output (deferred to avoid blocking page paint on large datasets)
    if (b.type === 'outlier_detect' && b._lastData) {
      const outputEl = el.querySelector('.story-output');
      outputEl.className = 'story-output visible plot-output';
      const _bRef = b;
      const _folded = b.folded;
      setTimeout(() => { renderOutlierChart(_bRef); if (_folded) outputEl.style.display = 'none'; }, 0);
    }
    // Restore linear regression output
    if (b.type === 'linreg' && b._lastData) {
      const outputEl = el.querySelector('.story-output');
      outputEl.className = 'story-output visible plot-output';
      renderLinReg(b);
      if (b.folded) outputEl.style.display = 'none';
    }
    // Restore barplot output
    if (b.type === 'barplot' && b._lastData) {
      const outputEl = el.querySelector('.story-output');
      outputEl.className = 'story-output visible plot-output';
      renderBarplot(b);
      if (b.folded) outputEl.style.display = 'none';
    }
    // Restore hypothesis test output
    if (b.type === 'hypo_test' && b._lastData) {
      const outputEl = el.querySelector('.story-output');
      outputEl.className = 'story-output visible plot-output';
      renderHypoTest(b);
      if (b.folded) outputEl.style.display = 'none';
    }
    // Generic fallback: restore output for all other block types that have _lastData
    const _handledTypes = new Set(['python_exec','describe','preview','search','boxplot','outlier_detect','linreg','barplot','hypo_test']);
    if (!_handledTypes.has(b.type) && b._lastData) {
      const outputEl = el.querySelector('.story-output');
      const _isPlot = ['histogram','scatter','lineplot','feature_importance','predict_model','corr_matrix'].includes(b.type);
      outputEl.className = 'story-output visible' + (_isPlot ? ' plot-output' : '');
      try { renderStoryOutput(b.type, b._lastData, outputEl, b); } catch(e) {}
      if (b.folded) outputEl.style.display = 'none';
    }
  });
  const _ipynbBtn = document.getElementById('story-export-ipynb-btn');
  if (_ipynbBtn) {
    const _has = _storyBlocks.some(b => !['edit_add_row','edit_add_column','sql_query','python_exec','search'].includes(b.type));
    _ipynbBtn.disabled = !_has;
    _ipynbBtn.style.opacity = _has ? '1' : '0.45';
    _ipynbBtn.style.cursor  = _has ? 'pointer' : 'not-allowed';
  }
}

function dtypeColor(dtype) {
  if (!dtype || dtype === 'No data') return 'var(--text2)';
  const d = dtype.toLowerCase();
  if (/^(int|uint|float|decimal|numeric|double)/.test(d)) return '#4ec9b0';   // teal  — numeric
  if (/^(utf8|str|varchar|char|byte|binary|blob|large)/.test(d)) return '#c586c0'; // purple — string
  if (/^bool/.test(d)) return '#ce9178';                                         // orange — boolean
  if (/^(date|time|timestamp|datetime|duration)/.test(d)) return '#f44747';      // red    — temporal
  if (/^(list|array|struct|object)/.test(d)) return '#dcdcaa';                   // yellow — nested
  if (/^(cat|enum)/.test(d)) return '#569cd6';                                   // blue   — categorical
  return 'var(--text2)';
}

// Build a schema lookup map: column name → type string
function schemaMap(schema) {
  const m = {};
  (schema || []).forEach(s => { m[s.name] = s.type; });
  return m;
}

// Append a colored type sub-label to a <th> element

// Map a type string to a dedup key + semantic label (used for legend grouping)
function dtypeIconChar(dtype) {
  if (!dtype) return { char: '?', label: 'unknown' };
  const d = dtype.toLowerCase();
  if (/^(int|uint|float|decimal|numeric|double|number|bigint|smallint|tinyint|byteint|bit)/.test(d))
    return { char: '#', label: 'numeric' };
  if (/^(utf8|str|varchar|char|text|string|large_utf8|large_str|bytes|binary|blob)/.test(d))
    return { char: 'T', label: 'text' };
  if (/^bool/.test(d))
    return { char: 'B', label: 'boolean' };
  if (/^(date|time|timestamp|datetime|duration)/.test(d))
    return { char: 'D', label: 'datetime' };
  if (/^(list|array)/.test(d))
    return { char: 'L', label: 'list' };
  if (/^(struct|object)/.test(d))
    return { char: 'S', label: 'struct' };
  if (/^(cat|enum|categorical)/.test(d))
    return { char: 'C', label: 'categorical' };
  return { char: '?', label: dtype };
}

// Return a clean inline SVG for each data type (12×12, uses currentColor)
function dtypeIconSvg(dtype) {
  const _b = `fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"`;
  if (!dtype) return `<svg viewBox="0 0 12 12" width="12" height="12" ${_b} stroke-width="1.3"><path d="M4.5 4.5A1.5 1.5 0 016 3a1.5 1.5 0 011.5 1.5c0 .8-.5 1.1-1.5 1.5V7"/><circle cx="6" cy="9.5" r=".8" fill="currentColor" stroke="none"/></svg>`;
  const d = dtype.toLowerCase();
  if (/^(int|uint|float|decimal|numeric|double|number|bigint|smallint|tinyint|byteint|bit)/.test(d))
    // hash #
    return `<svg viewBox="0 0 12 12" width="12" height="12" ${_b} stroke-width="1.4"><line x1="4" y1="2" x2="4" y2="10"/><line x1="8" y1="2" x2="8" y2="10"/><line x1="2" y1="4.5" x2="10" y2="4.5"/><line x1="2" y1="7.5" x2="10" y2="7.5"/></svg>`;
  if (/^(utf8|str|varchar|char|text|string|large_utf8|large_str|bytes|binary|blob)/.test(d))
    // capital T
    return `<svg viewBox="0 0 12 12" width="12" height="12" ${_b} stroke-width="1.5"><line x1="2" y1="2.5" x2="10" y2="2.5"/><line x1="6" y1="2.5" x2="6" y2="10.5"/></svg>`;
  if (/^bool/.test(d))
    // toggle switch
    return `<svg viewBox="0 0 12 12" width="12" height="12" ${_b}><rect x="1.5" y="3.5" width="9" height="5" rx="2.5" stroke-width="1.2"/><circle cx="8" cy="6" r="1.7" fill="currentColor" stroke="none"/></svg>`;
  if (/^(date|time|timestamp|datetime|duration)/.test(d))
    // clock face
    return `<svg viewBox="0 0 12 12" width="12" height="12" ${_b}><circle cx="6" cy="6" r="4.5" stroke-width="1.2"/><polyline points="6,3.5 6,6 8.2,7.4" stroke-width="1.4"/></svg>`;
  if (/^(list|array)/.test(d))
    // square brackets
    return `<svg viewBox="0 0 12 12" width="12" height="12" ${_b} stroke-width="1.5"><path d="M5 2H3.5v8H5"/><path d="M7 2h1.5v8H7"/></svg>`;
  if (/^(struct|object)/.test(d))
    // curly braces
    return `<svg viewBox="0 0 12 12" width="12" height="12" ${_b} stroke-width="1.2"><path d="M5.5 2c-1 0-1.5.5-1.5 1.5v1c0 .8-.4 1.3-.8 1.5.4.2.8.7.8 1.5v1c0 1 .5 1.5 1.5 1.5"/><path d="M6.5 2c1 0 1.5.5 1.5 1.5v1c0 .8.4 1.3.8 1.5-.4.2-.8.7-.8 1.5v1c0 1-.5 1.5-1.5 1.5"/></svg>`;
  if (/^(cat|enum|categorical)/.test(d))
    // price tag
    return `<svg viewBox="0 0 12 12" width="12" height="12" ${_b} stroke-width="1.2"><path d="M1.5 6.5V2.5A.5.5 0 012 2h4a.5.5 0 01.35.15l4 4a.5.5 0 010 .7l-3.5 3.5a.5.5 0 01-.7 0z"/><circle cx="4.5" cy="4.5" r=".9" fill="currentColor" stroke="none"/></svg>`;
  return `<svg viewBox="0 0 12 12" width="12" height="12" ${_b} stroke-width="1.3"><path d="M4.5 4.5A1.5 1.5 0 016 3a1.5 1.5 0 011.5 1.5c0 .8-.5 1.1-1.5 1.5V7"/><circle cx="6" cy="9.5" r=".8" fill="currentColor" stroke="none"/></svg>`;
}

function copyLqTableToClipboard(table, btn) {
  const ths = Array.from(table.querySelectorAll('thead th')).filter(th => !th.classList.contains('tbl-idx-th'));
  const cols = ths.map(th => (th.querySelector('span')?.textContent || th.textContent).replace(/\s*[▴▾]$/, '').trim());
  const trs = Array.from(table.querySelectorAll('tbody tr'));
  const rowData = trs.map(tr =>
    Array.from(tr.querySelectorAll('td')).filter(td => !td.classList.contains('tbl-idx-td')).map(td => td.textContent.trim())
  );
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const thS = 'border:1px solid #ccc;padding:4px 8px;background:#f0f0f0;font-weight:bold;font-size:12px;font-family:Arial,sans-serif';
  const tdS = 'border:1px solid #ccc;padding:4px 8px;font-size:12px;font-family:Arial,sans-serif';
  const htmlStr = `<table style="border-collapse:collapse"><thead><tr>${cols.map(c=>`<th style="${thS}">${esc(c)}</th>`).join('')}</tr></thead><tbody>${rowData.map(row=>`<tr>${row.map(v=>`<td style="${tdS}">${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  const tsvStr = [cols.join('\t'), ...rowData.map(row => row.map(v => v.replace(/[\t\n\r]/g,' ')).join('\t'))].join('\n');
  const flash = () => {
    const orig = btn.innerHTML;
    btn.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Copied';
    btn.style.color = 'var(--accent)'; btn.style.borderColor = 'var(--accent)';
    setTimeout(() => { btn.innerHTML = orig; btn.style.color = ''; btn.style.borderColor = ''; }, 1500);
  };
  navigator.clipboard.write([new ClipboardItem({
    'text/html': new Blob([htmlStr], { type:'text/html' }),
    'text/plain': new Blob([tsvStr], { type:'text/plain' }),
  })]).then(flash).catch(() => navigator.clipboard.writeText(tsvStr).then(flash).catch(()=>{}));
}

function makeLqTableHeader(rowCountText, table) {

function renderDescribeTable(block) {
  const blockEl = document.querySelector(`.story-block[data-id="${block.id}"]`);
  if (!blockEl || !block._lastData) return;
  const outputEl = blockEl.querySelector('.story-output');
  const { describe: rows, total_rows } = block._lastData;
  if (!block._descSortDir)    block._descSortDir    = {};
  if (!block._descTypeFilter) block._descTypeFilter = 'all';
  const sortBy  = block.params.sort_by || 'column';
  const sortDir = block._descSortDir[sortBy] || 1;

  // dtype → display category
  function dtypeCat(dtype) {
    const d = (dtype || '').toLowerCase();
    if (/int|uint|float|decimal|numeric|double|real|number/.test(d)) return 'numeric';
    if (/str|utf|varchar|char|large_utf|string|text|bytes|json/.test(d)) return 'string';
    if (/date|time|duration/.test(d)) return 'date';
    if (/bool/.test(d)) return 'boolean';
    return 'other';
  }

  const presentCats = new Set(rows.map(r => dtypeCat(r.dtype)));
  const ALL_CATS = [['all','All'],['numeric','Numeric'],['string','String'],['date','Date'],['boolean','Boolean'],['other','Other']];

  // Apply type filter, then sort
  const typeFiltered = block._descTypeFilter === 'all' ? rows : rows.filter(r => dtypeCat(r.dtype) === block._descTypeFilter);
  const sorted = [...typeFiltered].sort((a, b) => {
    let cmp = 0;
    if (sortBy === 'nulls')            cmp = a.null_pct - b.null_pct;
    else if (sortBy === 'nulls_count') cmp = a.nulls - b.nulls;
    else if (sortBy === 'dtype')       cmp = (a.dtype || '').localeCompare(b.dtype || '');
    else                               cmp = a.column.localeCompare(b.column);
    return cmp * sortDir;
  });

  const wrap = document.createElement('div');
  wrap.className = 'describe-output-wrap';

  // ── Type filter chips ────────────────────────────────────────────────────
  const typeRow = document.createElement('div');
  typeRow.className = 'desc-type-filter-row';
  ALL_CATS.filter(([k]) => k === 'all' || presentCats.has(k)).forEach(([key, label]) => {
    const btn = document.createElement('button');
    btn.className = 'desc-type-chip' + (block._descTypeFilter === key ? ' active' : '');
    const cnt = key === 'all' ? rows.length : rows.filter(r => dtypeCat(r.dtype) === key).length;
    btn.textContent = `${label} (${cnt})`;
    btn.addEventListener('click', () => { block._descTypeFilter = key; renderDescribeTable(block); });
    typeRow.appendChild(btn);
  });
  wrap.appendChild(typeRow);

  // ── Column name search ───────────────────────────────────────────────────
  const filterWrap = document.createElement('div');
  filterWrap.className = 'desc-filter-wrap';
  const filterInp = document.createElement('input');
  filterInp.type = 'text'; filterInp.className = 'desc-filter-input';
  filterInp.placeholder = 'Filter columns…'; filterInp.value = block._descFilter || '';
  filterWrap.appendChild(filterInp);
  wrap.appendChild(filterWrap);

  // ── Table ────────────────────────────────────────────────────────────────
  const tableWrap = document.createElement('div');
  tableWrap.className = 'desc-table-wrap';
  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const headerRow = document.createElement('tr');

  [['Column','column'],['Type','dtype'],['Nulls','nulls_count'],['Null %','nulls'],['Top values',null]].forEach(([label, key]) => {
    const th = document.createElement('th');
    if (key) {
      const isActive = key === sortBy;
      const dir = block._descSortDir[key] || 1;
      th.className = 'sortable' + (isActive ? ' sort-active' : '');
      th.innerHTML = `${label}<span style="opacity:0.55;margin-left:4px">${isActive ? (dir === 1 ? '▴' : '▾') : ''}</span>`;
      th.addEventListener('click', () => {
        if (block.params.sort_by === key) {
          block._descSortDir[key] = (block._descSortDir[key] || 1) * -1;
        } else {
          block.params.sort_by = key;
          if (!block._descSortDir[key]) block._descSortDir[key] = 1;
          const parSel = blockEl.querySelector('.story-params select[data-param-key="sort_by"]');
          if (parSel) parSel.value = key;
        }
        renderDescribeTable(block);
      });
    } else {
      th.textContent = label;
    }
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  sorted.forEach(r => {
    const allNull = total_rows > 0 && r.nulls === total_rows;
    const dtype = allNull ? 'No data' : r.dtype;
    const hi = r.null_pct > 10;
    const tr = document.createElement('tr');

    const tdCol = document.createElement('td');
    tdCol.className = 'col-name'; tdCol.textContent = r.column; tr.appendChild(tdCol);

    const tdType = document.createElement('td');
    tdType.className = 'col-type'; tdType.textContent = dtype; tdType.style.color = dtypeColor(dtype);
    tr.appendChild(tdType);

    const tdNulls = document.createElement('td');
    if (hi) tdNulls.className = 'describe-null-hi';
    tdNulls.textContent = r.nulls.toLocaleString(); tr.appendChild(tdNulls);

    const tdPct = document.createElement('td');
    if (hi) tdPct.className = 'describe-null-hi';
    tdPct.textContent = r.null_pct.toFixed(1) + '%'; tr.appendChild(tdPct);

    const tdSamples = document.createElement('td');
    if (r.samples && r.samples.length) {
      const sampWrap = document.createElement('div');
      sampWrap.className = 'desc-samples';
      r.samples.forEach(s => {
        const chip = document.createElement('span');
        chip.className = 'desc-sample';
        const valText = String(s.value).length > 14 ? String(s.value).slice(0, 14) + '…' : s.value;
        chip.title = `${s.value} — ${s.count.toLocaleString()} occurrences`;
        const valSpan = document.createElement('span'); valSpan.className = 'desc-sample-val'; valSpan.textContent = valText;
        const cntSpan = document.createElement('span'); cntSpan.className = 'desc-sample-count'; cntSpan.textContent = `×${s.count >= 1000 ? fmtNum(s.count) : s.count}`;
        chip.appendChild(valSpan); chip.appendChild(cntSpan); sampWrap.appendChild(chip);
      });
      tdSamples.appendChild(sampWrap);
    } else {
      tdSamples.style.color = 'var(--text2)'; tdSamples.style.fontSize = '10px';
      tdSamples.textContent = allNull ? '—' : '';
    }
    tr.appendChild(tdSamples);
    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  makeTableResizable(table);
  tableWrap.appendChild(table);
  wrap.appendChild(tableWrap);
  outputEl.innerHTML = '';
  outputEl.appendChild(wrap);

  // Text filter: DOM-only show/hide (preserves focus on every keystroke)
  function applyDescFilter(term) {
    block._descFilter = term;
    const t = term.toLowerCase();
    tbody.querySelectorAll('tr').forEach(tr => {
      const colName = tr.querySelector('.col-name')?.textContent || '';
      tr.style.display = (t && !colName.toLowerCase().includes(t)) ? 'none' : '';
    });
  }
  filterInp.addEventListener('input', () => applyDescFilter(filterInp.value));
  if (block._descFilter) applyDescFilter(block._descFilter);
  _addResizeHandle(outputEl, block);
}

const PLOT_COLORS = ['#569cd6','#4ec9b0','#c586c0','#ce9178','#dcdcaa','#6a9955','#f44747','#9cdcfe','#d7ba7d','#4fc1ff'];

function filteredColumns(typeFilter, cols, schema) {
  cols   = cols   || _lastQueryColumns;
  schema = schema || _lastQuerySchema;
  if (!typeFilter || !schema.length) return cols;
  // Normalise: uppercase + trim, handles null/undefined/Polars title-case
  const n = s => (s || '').toString().toUpperCase().trim();
  const isNum  = s => /^(INT|UINT|FLOAT|NUMERIC|BIGNUMERIC|DECIMAL|BIGDECIMAL|DOUBLE|REAL|INTEGER|SMALLINT|BIGINT|BYTEINT|TINYINT|NUMBER)/.test(n(s));
  const isInt  = s => /^(INT|UINT|INTEGER|SMALLINT|BIGINT|BYTEINT|TINYINT)/.test(n(s));
  const isDate = s => /^(DATE|TIMESTAMP|DATETIME|TIME)/.test(n(s));
  const isStr  = s => /^(STRING|BYTES|VARCHAR|TEXT|CHAR|JSON|UTF)/.test(n(s));
  let test;
  if      (typeFilter === 'numeric')      test = f => isNum(f.type);
  else if (typeFilter === 'numeric_date') test = f => isNum(f.type) || isDate(f.type);
  else if (typeFilter === 'string')       test = f => isStr(f.type);
  else if (typeFilter === 'category')     test = f => isStr(f.type) || isInt(f.type);
  else return cols;
  const names = new Set(schema.filter(test).map(f => f.name));
  return cols.filter(c => names.has(c));
}

function fmtNum(v) {
  if (!isFinite(v)) return String(v);
  const a = Math.abs(v);
  if (a >= 1e9)  return (v / 1e9).toFixed(2) + 'B';
  if (a >= 1e6)  return (v / 1e6).toFixed(2) + 'M';
  if (a >= 1e4)  return (v / 1e3).toFixed(1) + 'k';
  if (a < 0.001 && a > 0) return v.toExponential(2);
  return parseFloat(v.toFixed(3)).toString();
}
