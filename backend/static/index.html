// ── Editor abstraction (works with Monaco or textarea fallback) ──────────────
const EditorAPI = {
  getValue() {
    if (window._monacoEditor) return window._monacoEditor.getValue();
    return document.getElementById('editor-fallback').value;
  },
  insertText(text) {
    if (window._monacoEditor && window._monacoInstance) {
      const editor = window._monacoEditor;
      const monaco = window._monacoInstance;
      const sel = editor.getSelection();
      editor.executeEdits('bq-slave', [{ range: sel, text, forceMoveMarkers: true }]);
      editor.focus();
      return;
    }
    // Fallback: insert at cursor in textarea
    const ta = document.getElementById('editor-fallback');
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    ta.value = ta.value.slice(0, start) + text + ta.value.slice(end);
    ta.selectionStart = ta.selectionEnd = start + text.length;
    ta.focus();
  },
  setValue(text) {
    if (window._monacoEditor) {
      window._monacoEditor.setValue(text);
      return;
    }
    document.getElementById('editor-fallback').value = text;
  },
};

// ── SQL Query Parser ──────────────────────────────────────────────────────────
function parseSQL(sql) {
  function skipString(s, i) {
    const q = s[i]; i++;
    while (i < s.length) { if (s[i] === '\\') { i += 2; continue; } if (s[i] === q) return i+1; i++; }
    return i;
  }
  function skipComment(s, i) {
    if (s[i]==='-'&&s[i+1]==='-') { while (i<s.length&&s[i]!=='\n') i++; return i; }
    if (s[i]==='/'&&s[i+1]==='*') { i+=2; while (i<s.length-1) { if (s[i]==='*'&&s[i+1]==='/') return i+2; i++; } return s.length; }
    return i;
  }
  function findMatchingParen(s, openPos) {
    let i=openPos+1, d=1;
    while (i<s.length&&d>0) {
      if (s[i]==="'"||s[i]==='"'||s[i]==='`') { i=skipString(s,i); continue; }
      if ((s[i]==='-'&&s[i+1]==='-')||(s[i]==='/'&&s[i+1]==='*')) { i=skipComment(s,i); continue; }
      if (s[i]==='(') d++; else if (s[i]===')') d--;
      i++;
    }
    return i-1;
  }
  function nextToken(s, i) {
    while (i<s.length&&/\s/.test(s[i])) i++;
    if (i>=s.length) return {token:'',start:i,end:i};
    if (s[i]==='`') { const end=skipString(s,i); return {token:s.slice(i+1,end-1),start:i,end}; }
    const start=i;
    while (i<s.length&&/[\w.$\-]/.test(s[i])) i++;
    return {token:s.slice(start,i),start,end:i};
  }

  const JOIN_KW_RE = /^(LEFT\s+OUTER\s+JOIN|RIGHT\s+OUTER\s+JOIN|FULL\s+OUTER\s+JOIN|LEFT\s+JOIN|RIGHT\s+JOIN|INNER\s+JOIN|CROSS\s+JOIN|FULL\s+JOIN|JOIN)[\s(]/;

  function splitOnSetOps(s, from, to) {
    const parts=[]; let partStart=from, conn=null, depth=0, i=from;
    while (i<to) {
      if (s[i]==="'"||s[i]==='"'||s[i]==='`') { i=skipString(s,i); continue; }
      if ((s[i]==='-'&&s[i+1]==='-')||(s[i]==='/'&&s[i+1]==='*')) { i=skipComment(s,i); continue; }
      if (s[i]==='(') { depth++; i++; continue; }
      if (s[i]===')') { depth--; i++; continue; }
      if (depth===0) {
        const up=s.slice(i,Math.min(i+20,to)).toUpperCase();
        let op=null, m;
        if ((m=up.match(/^UNION\s+ALL\b/))) op='UNION ALL';
        else if ((m=up.match(/^UNION\s+DISTINCT\b/))) op='UNION DISTINCT';
        else if ((m=up.match(/^UNION\b/))) op='UNION';
        else if ((m=up.match(/^INTERSECT\b/))) op='INTERSECT';
        else if ((m=up.match(/^EXCEPT\b/))) {
          // Don't treat `* EXCEPT (cols)` (BigQuery SELECT modifier) as a set op
          let p=i-1; while(p>=from&&/\s/.test(s[p]))p--;
          if(!(p>=from&&s[p]==='*')) op='EXCEPT';
        }
        if (op) {
          parts.push({start:partStart,end:i,connector:conn});
          conn=op; i+=m[0].length;
          while (i<to&&/\s/.test(s[i])) i++;
          partStart=i; continue;
        }
      }
      i++;
    }
    parts.push({start:partStart,end:to,connector:conn});
    return parts;
  }

  function parseFromJoins(s, from, to) {
    const ALIAS_STOP = new Set(['JOIN','LEFT','RIGHT','INNER','OUTER','CROSS','FULL',
      'WHERE','ON','USING','GROUP','ORDER','HAVING','LIMIT','UNION','INTERSECT',
      'EXCEPT','QUALIFY','WINDOW','SELECT','FROM','WITH','BY','SET','LATERAL',
      'PIVOT','UNPIVOT','TABLESAMPLE']);
    function readAlias(s, pos) {
      let j = pos;
      while (j < to && /\s/.test(s[j])) j++;
      if (j >= to) return { alias: null, end: pos };
      const aUp = s.slice(j, Math.min(j+3, to)).toUpperCase();
      if (aUp.startsWith('AS') && /[\s(,;]/.test(s[j+2]||' ')) {
        j += 2; while (j < to && /\s/.test(s[j])) j++;
        const tok = nextToken(s, j);
        if (tok.token && !ALIAS_STOP.has(tok.token.toUpperCase()))
          return { alias: tok.token.replace(/^`|`$/g,''), end: tok.end };
        return { alias: null, end: pos };
      }
      const tok = nextToken(s, j);
      if (tok.token && !ALIAS_STOP.has(tok.token.toUpperCase()) && tok.start === j)
        return { alias: tok.token.replace(/^`|`$/g,''), end: tok.end };
      return { alias: null, end: pos };
    }
    function readOnUsing(s, pos) {
      let k = pos;
      while (k < to && /\s/.test(s[k])) k++;
      const kUp = s.slice(k, Math.min(k+6, to)).toUpperCase();
      if (/^ON\b/.test(kUp)) {
        k += 2; while (k < to && /\s/.test(s[k])) k++;
        const condStart = k; let depth = 0;
        while (k < to) {
          if (s[k]==="'"||s[k]==='"'||s[k]==='`') { k=skipString(s,k); continue; }
          if ((s[k]==='-'&&s[k+1]==='-')||(s[k]==='/'&&s[k+1]==='*')) { k=skipComment(s,k); continue; }
          if (s[k]==='(') { depth++; k++; continue; }
          if (s[k]===')') { depth--; k++; continue; }
          if (depth === 0) {
            const peek = s.slice(k, Math.min(k+30, to)).toUpperCase();
            if (/^(LEFT|RIGHT|INNER|OUTER|CROSS|FULL|JOIN|WHERE|GROUP|ORDER|HAVING|LIMIT|UNION|INTERSECT|EXCEPT|QUALIFY|WINDOW)\b/.test(peek)) break;
          }
          k++;
        }
        return { cond: s.slice(condStart, k).trim(), end: k };
      }
      if (/^USING\b/.test(kUp)) {
        k += 5; while (k < to && /\s/.test(s[k])) k++;
        if (k < to && s[k] === '(') {
          const close = findMatchingParen(s, k);
          return { cond: 'USING ' + s.slice(k, close+1), end: close+1 };
        }
      }
      return { cond: null, end: pos };
    }

    const refs=[]; let i=from;
    while (i<to) {
      if (s[i]==="'"||s[i]==='"'||s[i]==='`') { i=skipString(s,i); continue; }
      if ((s[i]==='-'&&s[i+1]==='-')||(s[i]==='/'&&s[i+1]==='*')) { i=skipComment(s,i); continue; }
      if (s[i]==='(') { i=findMatchingParen(s,i)+1; continue; }
      const up=s.slice(i,Math.min(i+30,to)).toUpperCase();
      let joinType, kwLen;
      if (/^FROM[\s(]/.test(up)) { joinType=null; kwLen=4; }
      else { const m=up.match(JOIN_KW_RE); if (m) { joinType=m[1].replace(/\s+/g,' '); kwLen=m[1].length; } else { i++; continue; } }
      i+=kwLen;
      while (i<to&&/\s/.test(s[i])) i++;
      if (i<to&&s[i]==='(') {
        const close=findMatchingParen(s,i);
        const aliasR = readAlias(s, close+1);
        refs.push({type:'subquery', label: aliasR.alias || 'subquery', joinType,
                   alias: aliasR.alias, joinCondition: null,
                   start:i, end:close+1, bodyFrom:i+1, bodyTo:close,
                   children:parseBodyToChildren(s,i+1,close)});
        i = aliasR.end;
      } else {
        const tok=nextToken(s,i);
        if (!tok.token) { i++; continue; }
        let label = tok.token.replace(/^`|`$/g,'');
        i = tok.end;
        // Consume remaining dot-separated segments for `a`.`b`.`c` style names
        while (i < to && s[i] === '.') {
          i++;
          const part = nextToken(s, i);
          if (!part.token) break;
          label += '.' + part.token.replace(/^`|`$/g,'');
          i = part.end;
        }
        const aliasR = readAlias(s, i);
        if (aliasR.alias) i = aliasR.end;
        let joinCondition = null;
        if (joinType) {
          const onR = readOnUsing(s, i);
          if (onR.cond) { joinCondition = onR.cond; i = onR.end; }
        }
        refs.push({type:'table', label,
                   joinType, alias: aliasR.alias, joinCondition,
                   start:tok.start, end:tok.end, children:[]});
      }
    }
    return refs;
  }

  function parseBodyToChildren(s, from, to) {
    const parts=splitOnSetOps(s,from,to);
    function refsToNodes(refs) {
      if (!refs.length) return [];
      function refToNode(r) {
        return {type:r.type, label:r.label, alias:r.alias||null,
                joinCondition:r.joinCondition||null,
                bodyFrom:r.bodyFrom||null, bodyTo:r.bodyTo||null,
                start:r.start, end:r.end, children:r.children||[]};
      }
      if (refs.length===1) { return [refToNode(refs[0])]; }
      return [{type:'join_group', start:refs[0].start, end:refs[refs.length-1].end,
        items:refs.map(r=>({node:refToNode(r), connector:r.joinType}))}];
    }
    if (parts.length===1) return refsToNodes(parseFromJoins(s,from,to));
    return [{type:'union_group',start:parts[0].start,end:parts[parts.length-1].end,
      parts:parts.map(p=>({nodes:refsToNodes(parseFromJoins(s,p.start,p.end)),connector:p.connector}))}];
  }

  const nodes=[]; let i=0;
  while (i<sql.length) {
    if (/\s/.test(sql[i])) { i++; continue; }
    if ((sql[i]==='-'&&sql[i+1]==='-')||(sql[i]==='/'&&sql[i+1]==='*')) { i=skipComment(sql,i); continue; }
    break;
  }

  function skipWC(s, pos) { // skip whitespace + comments
    let k = pos;
    while (k < s.length) {
      if (/\s/.test(s[k])) { k++; continue; }
      if ((s[k]==='-'&&s[k+1]==='-')||(s[k]==='/'&&s[k+1]==='*')) { k=skipComment(s,k); continue; }
      break;
    }
    return k;
  }

  if (sql.slice(i,i+4).toUpperCase()==='WITH'&&/\s/.test(sql[i+4]||' ')) {
    let j=i+4;
    while (j<sql.length) {
      j=skipWC(sql,j);
      const nameTok=nextToken(sql,j); if (!nameTok.token) break;
      j=nameTok.end;
      j=skipWC(sql,j);
      if (sql.slice(j,j+2).toUpperCase()!=='AS') break;
      j+=2;
      j=skipWC(sql,j);
      if (sql[j]!=='(') break;
      const cteStart=nameTok.start, close=findMatchingParen(sql,j);
      nodes.push({type:'cte',label:nameTok.token.replace(/^`|`$/g,''),start:cteStart,end:close+1,bodyFrom:j+1,bodyTo:close,children:parseBodyToChildren(sql,j+1,close)});
      j=close+1;
      j=skipWC(sql,j);
      if (sql[j]===',') { j++; continue; }
      break;
    }
    i=j;
  }
  while (i<sql.length) {
    if (/\s/.test(sql[i])) { i++; continue; }
    if ((sql[i]==='-'&&sql[i+1]==='-')||(sql[i]==='/'&&sql[i+1]==='*')) { i=skipComment(sql,i); continue; }
    break;
  }
  if (sql.slice(i,i+6).toUpperCase()==='SELECT') {
    const mainStart=i; let end=sql.length, k=i, d=0;
    while (k<sql.length) {
      if (sql[k]==="'"||sql[k]==='"'||sql[k]==='`') { k=skipString(sql,k); continue; }
      if ((sql[k]==='-'&&sql[k+1]==='-')||(sql[k]==='/'&&sql[k+1]==='*')) { k=skipComment(sql,k); continue; }
      if (sql[k]==='(') { d++; k++; continue; }
      if (sql[k]===')') { d--; k++; continue; }
      if (sql[k]===';'&&d===0) { end=k; break; }
      k++;
    }
    nodes.push({type:'main',label:'SELECT',start:mainStart,end,bodyFrom:mainStart,bodyTo:end,children:parseBodyToChildren(sql,mainStart,end)});
  }
  return nodes;
}

// ── Query Tree SQL detail helpers ─────────────────────────────────────────────
function _sqlSk(s, i) { // skip string from opening quote
  const q=s[i]; i++;
  while(i<s.length){if(s[i]==='\\'){i+=2;continue;}if(s[i]===q)return i+1;i++;}
  return i;
}
function _sqlSc(s, i) { // skip comment
  if(s[i]==='-'&&s[i+1]==='-'){while(i<s.length&&s[i]!=='\n')i++;return i;}
  if(s[i]==='/'&&s[i+1]==='*'){i+=2;while(i<s.length-1){if(s[i]==='*'&&s[i+1]==='/')return i+2;i++;}return s.length;}
  return i;
}
function sqlExtractSelectList(s, from, to) {
  let i=from, depth=0, inSel=false, selStart=0;
  while(i<to){
    if(s[i]==="'"||s[i]==='"'||s[i]==='`'){i=_sqlSk(s,i);continue;}
    if((s[i]==='-'&&s[i+1]==='-')||(s[i]==='/'&&s[i+1]==='*')){i=_sqlSc(s,i);continue;}
    if(s[i]==='('){depth++;i++;continue;}
    if(s[i]===')'){depth--;i++;continue;}
    if(depth===0){
      if(!inSel&&/^SELECT\b/i.test(s.slice(i,i+7))){i+=6;selStart=i;inSel=true;continue;}
      if(inSel&&/^FROM\b/i.test(s.slice(i,i+5))){return s.slice(selStart,i).trim();}
    }
    i++;
  }
  return inSel?s.slice(selStart,to).trim():'';
}
function sqlExtractWhere(s, from, to) {
  let i=from, depth=0;
  while(i<to){
    if(s[i]==="'"||s[i]==='"'||s[i]==='`'){i=_sqlSk(s,i);continue;}
    if((s[i]==='-'&&s[i+1]==='-')||(s[i]==='/'&&s[i+1]==='*')){i=_sqlSc(s,i);continue;}
    if(s[i]==='('){depth++;i++;continue;}
    if(s[i]===')'){depth--;i++;continue;}
    if(depth===0&&/^WHERE\b/i.test(s.slice(i,i+6))){i+=5;break;}
    i++;
  }
  if(i>=to)return null;
  while(i<to&&/\s/.test(s[i]))i++;
  const start=i; depth=0;
  while(i<to){
    if(s[i]==="'"||s[i]==='"'||s[i]==='`'){i=_sqlSk(s,i);continue;}
    if((s[i]==='-'&&s[i+1]==='-')||(s[i]==='/'&&s[i+1]==='*')){i=_sqlSc(s,i);continue;}
    if(s[i]==='('){depth++;i++;continue;}
    if(s[i]===')'){depth--;i++;continue;}
    if(depth===0&&/^(GROUP|ORDER|HAVING|LIMIT|QUALIFY|WINDOW)\b/i.test(s.slice(i,i+8)))break;
    i++;
  }
  return s.slice(start,i).trim()||null;
}
function sqlFindAliasCols(selectText, alias) {
  const esc=alias.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp('\\b'+esc+'\\.([\\w]+)','gi');
  const cols=new Set(); let m;
  while((m=re.exec(selectText))!==null) cols.add(m[1]);
  return [...cols];
}
function sqlExtractBareCols(selectText) {
  if (!selectText) return [];
  const t = selectText.trim();
  if (t === '*') return ['*'];
  // Split by commas, depth-aware
  const items = []; let depth = 0, start = 0;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (c === "'" || c === '"' || c === '`') { i = _sqlSk(t, i) - 1; continue; }
    if (c === '(') depth++;
    else if (c === ')') depth--;
    else if (c === ',' && depth === 0) { items.push(t.slice(start, i).trim()); start = i + 1; }
  }
  items.push(t.slice(start).trim());
  const cols = [];
  for (let item of items) {
    if (!item) continue;
    if (/^\*(\s+EXCEPT\s*\(.*\))?$/i.test(item)) { cols.push('*'); continue; }
    item = item.replace(/\s+AS\s+\w+$/i, '').trim(); // strip AS alias
    if (/^\w+$/.test(item)) cols.push(item); // bare identifier only
  }
  return cols;
}
function sqlFindAliasConditions(whereText, alias) {
  if(!whereText||!alias)return[];
  const parts=[]; let start=0,depth=0,i=0;
  while(i<whereText.length){
    const c=whereText[i];
    if(c==="'"||c==='"'||c==='`'){const q=c;i++;while(i<whereText.length&&whereText[i]!==q)i++;i++;continue;}
    if(c==='('){depth++;i++;continue;}
    if(c===')'){depth--;i++;continue;}
    if(depth===0){
      const up=whereText.slice(i,Math.min(i+4,whereText.length)).toUpperCase();
      if(/^AND\b/.test(up)){parts.push(whereText.slice(start,i).trim());i+=3;while(i<whereText.length&&/\s/.test(whereText[i]))i++;start=i;continue;}
      if(/^OR\b/.test(up)){parts.push(whereText.slice(start,i).trim());i+=2;while(i<whereText.length&&/\s/.test(whereText[i]))i++;start=i;continue;}
    }
    i++;
  }
  parts.push(whereText.slice(start).trim());
  const esc=alias.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp('\\b'+esc+'\\.','i');
  return parts.filter(p=>p&&re.test(p));
}

function runQtPreview(label, parsedNodes, fullSql, selectCols) {
  const cteNode = parsedNodes.find(n => n.type === 'cte' && n.label === label);
  // Build column list: use extracted cols when available, else SELECT *
  const colList = (selectCols && selectCols.length) ? selectCols.join(', ') : '*';
  let previewSql;
  if (cteNode) {
    // Build a lookup of all CTE nodes by name
    const cteByName = {};
    parsedNodes.filter(n => n.type === 'cte').forEach(n => { cteByName[n.label] = n; });
    const cteNames = Object.keys(cteByName);

    // Find which CTEs are referenced inside a given CTE's body
    function depsOf(name) {
      const n = cteByName[name]; if (!n) return [];
      const body = fullSql.slice(n.bodyFrom, n.bodyTo);
      return cteNames.filter(dep => dep !== name &&
        new RegExp('\\b' + dep.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b').test(body));
    }

    // Topological DFS: collect only transitive deps of the target, in dependency order
    const ordered = []; const seen = new Set();
    function visit(name) {
      if (seen.has(name) || !cteByName[name]) return;
      seen.add(name);
      depsOf(name).forEach(visit);
      ordered.push(name);
    }
    visit(label);

    const cteParts = ordered.map(l => `  ${l} AS (\n${fullSql.slice(cteByName[l].bodyFrom, cteByName[l].bodyTo)}\n)`);
    previewSql = `WITH\n${cteParts.join(',\n')}\nSELECT ${colList}\nFROM ${label}\nLIMIT 100`;
  } else {
    const q = label.includes('.') ? '`' + label + '`' : label;
    previewSql = `SELECT ${colList}\nFROM ${q}\nLIMIT 100`;
  }
  const safeId = `${_activeWsId}_${label.replace(/[^a-zA-Z0-9_-]/g, '_')}`;
  const tabBtnId = `qt-tab-${safeId}`;
  const panelId  = `qt-panel-${safeId}`;
  const shortName = label.includes('.') ? label.split('.').slice(-2).join('.') : label;
  let tabBtn = document.getElementById(tabBtnId);
  let panel  = document.getElementById(panelId);
  if (!tabBtn) {
    tabBtn = document.createElement('button');
    tabBtn.className = 'main-tab preview-dyn-tab';
    tabBtn.id = tabBtnId; tabBtn.dataset.tab = tabBtnId; tabBtn.dataset.panelId = panelId;
    const ns = document.createElement('span'); ns.textContent = shortName; tabBtn.appendChild(ns);
    const cb = document.createElement('button'); cb.className = 'main-tab-close'; cb.title = 'Close'; cb.textContent = '×';
    cb.addEventListener('click', e => { e.stopPropagation(); activateMainTab(document.querySelector('.main-tab[data-tab="sql"]')); tabBtn.remove(); panel.remove(); });
    tabBtn.appendChild(cb);
    tabBtn.dataset.wsId = _activeWsId;
    document.getElementById('main-tabs').appendChild(tabBtn);
    panel = document.createElement('div');
    panel.className = 'preview-tab-panel'; panel.id = panelId;
    panel.innerHTML = `<div class="preview-dyn-header"></div><div class="preview-dyn-error" style="display:none"></div><div class="preview-dyn-results"></div>`;
    document.getElementById('resizer-h').before(panel);
  }
  activateMainTab(tabBtn);
  const header    = panel.querySelector('.preview-dyn-header');
  const errorEl   = panel.querySelector('.preview-dyn-error');
  const resultsEl = panel.querySelector('.preview-dyn-results');
  header.textContent = `Previewing: ${shortName}…`;
  resultsEl.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text2);font-style:italic">Running…</div>';
  errorEl.style.display = 'none';
  fetch('/api/query', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ sql: previewSql, project: '' }) })
  .then(r => r.json().then(d => ({ ok: r.ok, data: d })))
  .then(({ ok, data }) => {
    if (!ok) throw new Error(data.detail || 'Query failed');
    header.textContent = `${shortName} — ${data.rows.length} row${data.rows.length !== 1 ? 's' : ''}`;
    const tbl = document.createElement('table');
    const tr0 = tbl.createTHead().insertRow();
    (data.columns||[]).forEach(c => { const th = document.createElement('th'); th.textContent = c; tr0.appendChild(th); });
    const tb = tbl.createTBody();
    (data.rows||[]).forEach(row => {
      const tr = tb.insertRow();
      (data.columns||[]).forEach((c, i) => {
        const td = tr.insertCell(); const v = row[i];
        if (v === null || v === undefined) { td.textContent = 'NULL'; td.className = 'null-val'; }
        else td.textContent = String(v);
      });
    });
    resultsEl.innerHTML = ''; resultsEl.appendChild(tbl);
  })
  .catch(err => {
    header.textContent = `${shortName} — Error`;
    errorEl.textContent = err.message; errorEl.style.display = 'block';
    resultsEl.innerHTML = '';
  });
}

function buildQueryTree(nodes, container, sql) {
  container.innerHTML = '';

  const detailBar = document.createElement('div');
  detailBar.id = 'qt-detail-bar';
  container.appendChild(detailBar);

  const treeBody = document.createElement('div');
  treeBody.className = 'qt-tree-body';
  container.appendChild(treeBody);

  if (!nodes?.length) {
    treeBody.innerHTML = '<div class="info-node query-empty">Write a query to see its structure</div>';
    return;
  }

  const JOIN_ICON = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="5.5" cy="8" r="3"/><circle cx="10.5" cy="8" r="3"/></svg>`;
  const UNION_ICON = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4v4a5 5 0 0010 0V4"/></svg>`;

  let activeChip = null;

  function closeDetail() {
    detailBar.style.display = 'none';
    detailBar.innerHTML = '';
    if (activeChip) { activeChip.classList.remove('qt-node-active'); activeChip = null; }
  }

  const DI_SEARCH = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6.5" cy="6.5" r="4.5"/><line x1="10" y1="10" x2="14" y2="14" stroke-linecap="round"/></svg>`;
  const DI_CHECK  = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,8 6,12 14,4"/></svg>`;
  const DI_NORES  = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></svg>`;

  function showDetail(kind, data, bodyCtx) {
    detailBar.style.display = 'block';
    detailBar.innerHTML = '';

    const closeBtn = document.createElement('button');
    closeBtn.className = 'qt-detail-close'; closeBtn.textContent = '×';
    closeBtn.onclick = closeDetail;
    detailBar.appendChild(closeBtn);

    // — Top search bar (always present) —
    const dsBar = document.createElement('div'); dsBar.className = 'qt-detail-search-bar';
    const dsIcon = document.createElement('span'); dsIcon.className = 'qt-search-icon'; dsIcon.style.cssText='width:13px;height:13px;flex-shrink:0;'; dsIcon.innerHTML = DI_SEARCH;
    const dsInput = document.createElement('input'); dsInput.type='text'; dsInput.className='qt-detail-search-input';
    dsInput.placeholder='Search alias, columns, filters…'; dsInput.setAttribute('autocomplete','off');
    const dsStat = document.createElement('span'); dsStat.className='qt-detail-status';
    dsBar.appendChild(dsIcon); dsBar.appendChild(dsInput); dsBar.appendChild(dsStat);
    detailBar.appendChild(dsBar);

    const searchableRows = []; // collect rows that can be filtered

    function addRow(label, content, cls) {
      const row = document.createElement('div'); row.className = 'qt-detail-row';
      const lbl = document.createElement('span'); lbl.className = 'qt-detail-label'; lbl.textContent = label;
      row.appendChild(lbl);
      let rowText = label + ' ';
      if (content instanceof HTMLElement) {
        row.appendChild(content);
        rowText += content.textContent;
      } else {
        const val = document.createElement('span');
        val.className = 'qt-detail-value' + (cls ? ' ' + cls : '');
        val.textContent = content; row.appendChild(val);
        rowText += content;
      }
      row.dataset.qtSearch = rowText.toLowerCase();
      searchableRows.push(row);
      detailBar.appendChild(row);
    }

    function runDetailSearch(term) {
      const t = term.toLowerCase().trim();
      let vis = 0;
      searchableRows.forEach(row => {
        const match = !t || (row.dataset.qtSearch || row.textContent.toLowerCase()).includes(t);
        row.classList.toggle('qt-row-hidden', !match);
        if (match) vis++;
      });
      if (!t) {
        dsIcon.className = 'qt-search-icon'; dsIcon.innerHTML = DI_SEARCH;
        dsStat.className = 'qt-detail-status'; dsStat.textContent = '';
      } else if (vis > 0) {
        dsIcon.className = 'qt-search-icon qt-si-ok'; dsIcon.innerHTML = DI_CHECK;
        dsStat.className = 'qt-detail-status qt-si-ok'; dsStat.textContent = vis + '/' + searchableRows.length;
      } else {
        dsIcon.className = 'qt-search-icon qt-si-none'; dsIcon.innerHTML = DI_NORES;
        dsStat.className = 'qt-detail-status qt-si-none'; dsStat.textContent = '0';
      }
    }
    dsInput.addEventListener('input', e => runDetailSearch(e.target.value));

    const titleEl = document.createElement('div');
    detailBar.appendChild(titleEl);

    if (kind === 'table') {
      titleEl.className = 'qt-detail-title';
      titleEl.textContent = data.label;

      if (data.alias) addRow('Alias', data.alias, 'qt-dv-alias');
      if (data.joinType) addRow('Join', data.joinType, 'qt-dv-join');
      if (data.joinCondition) addRow('ON', data.joinCondition, 'qt-dv-cond');

      const matchAlias = data.alias || (data.label.includes('.') ? data.label.split('.').pop() : data.label);
      if (bodyCtx && sql) {
        const selText = sqlExtractSelectList(sql, bodyCtx.bodyFrom, bodyCtx.bodyTo);
        const usedCols = selText ? sqlFindAliasCols(selText, matchAlias) : [];

        const whereText = sqlExtractWhere(sql, bodyCtx.bodyFrom, bodyCtx.bodyTo);
        const filters = whereText ? sqlFindAliasConditions(whereText, matchAlias) : [];

        if (usedCols.length) {
          // Build columns list element — each column row is individually searchable
          const colsEl = document.createElement('div'); colsEl.className = 'qt-detail-cols';
          usedCols.forEach(col => {
            const cr = document.createElement('div'); cr.className = 'qt-detail-col-row';
            cr.dataset.qtSearch = ('columns ' + col).toLowerCase();
            const cn = document.createElement('span'); cn.className = 'qt-dv-colname'; cn.textContent = col;
            cr.title = col;
            cr.appendChild(cn); colsEl.appendChild(cr);
            searchableRows.push(cr);
          });
          // Header row for columns section (not searchable — always visible as label)
          const colsHeaderRow = document.createElement('div'); colsHeaderRow.className = 'qt-detail-row';
          const colsLbl = document.createElement('span'); colsLbl.className = 'qt-detail-label'; colsLbl.textContent = 'Columns';
          colsHeaderRow.appendChild(colsLbl);
          detailBar.appendChild(colsHeaderRow);
          detailBar.appendChild(colsEl);

          // Async: fetch schema to annotate types + descriptions
          const parts = data.label.split('.');
          if (parts.length >= 3) {
            const [proj, ds, tbl] = parts.slice(parts.length - 3);
            fetch(`/api/tables/${encodeURIComponent(proj)}/${encodeURIComponent(ds)}/${encodeURIComponent(tbl)}/schema`)
              .then(r => r.ok ? r.json() : null)
              .then(resp => {
                if (!resp) return;
                const schema = Array.isArray(resp) ? resp : (resp.columns || []);
                const typeMap = {}, descMap = {};
                schema.forEach(c => {
                  typeMap[c.name.toLowerCase()] = c.type;
                  if (c.description) descMap[c.name.toLowerCase()] = c.description;
                });
                colsEl.querySelectorAll('.qt-detail-col-row').forEach((cr, i) => {
                  const key = usedCols[i]?.toLowerCase();
                  const t = typeMap[key];
                  if (t) {
                    const tb = document.createElement('span'); tb.className = 'qt-dv-type'; tb.textContent = t; cr.appendChild(tb);
                    // Update searchable text with type
                    cr.dataset.qtSearch = ('columns ' + (usedCols[i]||key) + ' ' + t).toLowerCase();
                  }
                  if (descMap[key]) cr.title = (usedCols[i] || key) + '\n' + descMap[key];
                });
                if (resp.tableDescription) {
                  const descRow = document.createElement('div'); descRow.className = 'qt-detail-row';
                  const lbl = document.createElement('span'); lbl.className = 'qt-detail-label'; lbl.textContent = 'Desc';
                  const val = document.createElement('span'); val.className = 'qt-detail-value'; val.style.opacity = '0.75'; val.textContent = resp.tableDescription;
                  descRow.appendChild(lbl); descRow.appendChild(val);
                  titleEl.insertAdjacentElement('afterend', descRow);
                }
              })
              .catch(() => {});
          }
        }

        if (filters.length) {
          // Each filter condition is its own searchable row
          filters.forEach((f, i) => {
            addRow(i === 0 ? 'Filters' : 'AND', f, 'qt-dv-filters');
          });
        }
      }
    } else if (kind === 'join') {
      titleEl.className = 'qt-detail-title qt-detail-join-title';
      titleEl.textContent = data.joinType || 'JOIN';
      if (data.joinCondition) addRow('ON', data.joinCondition, 'qt-dv-cond');
    }
  }

  function mkConnector(text, kind, condData) {
    const el = document.createElement('span');
    el.className = 'qt-connector qt-connector-' + kind;
    if (condData?.joinCondition) el.classList.add('qt-connector-clickable');
    const ic = document.createElement('span'); ic.className = 'icon';
    ic.innerHTML = kind === 'join' ? JOIN_ICON : UNION_ICON;
    el.appendChild(ic);
    el.appendChild(document.createTextNode(' ' + text));
    if (condData?.joinCondition) {
      el.addEventListener('click', e => { e.stopPropagation(); showDetail('join', condData, null); });
    }
    return el;
  }

  function mkChip(node, bodyCtx) {
    const el = document.createElement('div');
    el.className = 'qt-node qt-node-' + node.type;

    // Header row (icon + label + alias + play btn)
    const hdr = document.createElement('div');
    hdr.className = 'qt-node-header';
    const ic = document.createElement('span'); ic.className = 'icon';
    ic.innerHTML = ICONS['query_'+node.type] || ICONS['query_table'] || '';
    hdr.appendChild(ic);
    const lb = document.createElement('span'); lb.className = 'qt-label';
    lb.textContent = node.label;
    lb.style.color = QUERY_NODE_COLORS[node.type] || 'var(--text)';
    hdr.appendChild(lb);
    if (node.alias) {
      const al = document.createElement('span'); al.className = 'qt-node-alias';
      al.textContent = node.alias; hdr.appendChild(al);
    }
    // _chipCols is populated below (after usedCols is computed) and captured by the click closure
    let _chipCols = [];
    if (node.type === 'table' || node.type === 'subquery') {
      const pb = document.createElement('button'); pb.className = 'qt-play-btn'; pb.title = 'Preview table';
      pb.innerHTML = `<svg viewBox="0 0 10 12" fill="currentColor"><polygon points="1,1 9,6 1,11"/></svg>`;
      pb.addEventListener('click', e => {
        e.stopPropagation();
        const cols = _chipCols.filter(c => c !== '*');
        runQtPreview(node.label, nodes, sql, cols.length ? cols : null);
      });
      hdr.appendChild(pb);
    }
    el.appendChild(hdr);

    // Inline column pills for table/subquery nodes
    if ((node.type === 'table' || node.type === 'subquery') && bodyCtx && sql) {
      const matchAlias = node.alias || (node.label.includes('.') ? node.label.split('.').pop() : node.label);
      const selText = sqlExtractSelectList(sql, bodyCtx.bodyFrom, bodyCtx.bodyTo);
      let usedCols = selText ? sqlFindAliasCols(selText, matchAlias) : [];
      // Detect alias.* wildcard
      if (!usedCols.length && selText) {
        const esc = matchAlias.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        if (new RegExp('\\b' + esc + '\\.\\*', 'i').test(selText)) usedCols = ['*'];
      }
      // Fallback: no alias-qualified refs anywhere → simple query, show bare column names
      if (!usedCols.length && selText && !/\b\w+\.\w+/.test(selText)) {
        usedCols = sqlExtractBareCols(selText);
      }
      _chipCols = usedCols; // expose to play-button closure
      if (usedCols.length) {
        el.classList.add('has-cols');
        const colsDiv = document.createElement('div');
        colsDiv.className = 'qt-inline-cols';
        usedCols.forEach(col => {
          const tag = document.createElement('span');
          tag.className = 'qt-inline-col' + (col === '*' ? ' is-star' : '');
          tag.textContent = col;
          colsDiv.appendChild(tag);
        });
        el.appendChild(colsDiv);
      }
    }

    // Store searchable text for tree filtering (label + alias + columns + filter conditions)
    const colTexts = [...el.querySelectorAll('.qt-inline-col')].map(c => c.textContent).join(' ');
    let filterTexts = '';
    if ((node.type === 'table' || node.type === 'subquery') && bodyCtx && sql) {
      const _ma = node.alias || (node.label.includes('.') ? node.label.split('.').pop() : node.label);
      const _wt = sqlExtractWhere(sql, bodyCtx.bodyFrom, bodyCtx.bodyTo);
      if (_wt) filterTexts = sqlFindAliasConditions(_wt, _ma).join(' ');
    }
    el.dataset.qtText = [node.label, node.alias || '', colTexts, filterTexts].join(' ').toLowerCase();

    el.addEventListener('click', e => {
      e.stopPropagation();
      highlightRange(node.start, node.end);
      if (node.type === 'table' || node.type === 'subquery') {
        if (activeChip) activeChip.classList.remove('qt-node-active');
        activeChip = el; el.classList.add('qt-node-active');
        showDetail('table', node, bodyCtx);
      }
    });
    return el;
  }

  function renderItem(node, bodyCtx) {
    const ctx = (node.type === 'subquery' && node.bodyFrom != null)
                ? { bodyFrom: node.bodyFrom, bodyTo: node.bodyTo } : bodyCtx;
    if (!node.children?.length) return mkChip(node, bodyCtx);
    const wrap = document.createElement('div'); wrap.className = 'qt-item-wrap';
    wrap.appendChild(mkChip(node, bodyCtx));
    const ch = document.createElement('div'); ch.className = 'qt-children';
    renderGroup(node.children, ch, ctx);
    wrap.appendChild(ch);
    return wrap;
  }

  function renderGroup(children, el, bodyCtx) {
    (children||[]).forEach(child => {
      if (child.type === 'join_group') {
        const row = document.createElement('div'); row.className = 'qt-join-group';
        child.items.forEach((item, idx) => {
          if (idx > 0) {
            const condData = { joinType: item.connector, joinCondition: item.node.joinCondition };
            row.appendChild(mkConnector(item.connector || 'JOIN', 'join', condData));
          }
          row.appendChild(renderItem(item.node, bodyCtx));
        });
        el.appendChild(row);
      } else if (child.type === 'union_group') {
        const row = document.createElement('div'); row.className = 'qt-union-group';
        child.parts.forEach((part, idx) => {
          if (idx > 0 && part.connector) row.appendChild(mkConnector(part.connector, 'union', null));
          const pw = document.createElement('div'); pw.className = 'qt-union-part';
          renderGroup(part.nodes, pw, bodyCtx);
          row.appendChild(pw);
        });
        el.appendChild(row);
      } else {
        el.appendChild(renderItem(child, bodyCtx));
      }
    });
  }

  nodes.forEach(node => {
    const blk = document.createElement('div'); blk.className = 'qt-block collapsed';
    const hdr = document.createElement('div'); hdr.className = 'qt-header qt-header-' + node.type;

    // Fold toggle button (only when node has children)
    if (node.children?.length) {
      const tog = document.createElement('button'); tog.className = 'qt-block-toggle'; tog.title = 'Toggle';
      tog.innerHTML = `<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="8,3 5,7 2,3"/></svg>`;
      tog.addEventListener('click', e => { e.stopPropagation(); blk.classList.toggle('collapsed'); });
      hdr.appendChild(tog);
    }

    const ic = document.createElement('span'); ic.className = 'icon';
    ic.innerHTML = ICONS['query_'+node.type] || '';
    hdr.appendChild(ic);
    const lb = document.createElement('span'); lb.className = 'qt-label';
    lb.textContent = node.label;
    lb.style.color = QUERY_NODE_COLORS[node.type] || 'var(--text)';
    hdr.appendChild(lb);
    if (node.type === 'cte') {
      const badge = document.createElement('span'); badge.className = 'type-badge';
      badge.textContent = 'CTE'; hdr.appendChild(badge);
      const pb = document.createElement('button');
      pb.className = 'qt-play-btn'; pb.title = 'Preview CTE';
      pb.style.marginLeft = '4px';
      pb.innerHTML = `<svg viewBox="0 0 10 12" fill="currentColor"><polygon points="1,1 9,6 1,11"/></svg>`;
      pb.addEventListener('click', e => { e.stopPropagation(); runQtPreview(node.label, nodes, sql); });
      hdr.appendChild(pb);
    }
    hdr.addEventListener('click', () => highlightRange(node.start, node.end));
    blk.appendChild(hdr);
    if (node.children?.length) {
      const ch = document.createElement('div'); ch.className = 'qt-children';
      const bodyCtx = { bodyFrom: node.bodyFrom, bodyTo: node.bodyTo };
      renderGroup(node.children, ch, bodyCtx);
      blk.appendChild(ch);
    }
    treeBody.appendChild(blk);
  });

}

function highlightRange(start, end) {
  if (window._monacoEditor && window._monacoInstance) {
    const model = window._monacoEditor.getModel();
    const posS = model.getPositionAt(start);
    const posE = model.getPositionAt(end);
    const range = new window._monacoInstance.Range(posS.lineNumber, posS.column, posE.lineNumber, posE.column);
    window._monacoEditor.setSelection(range);
    window._monacoEditor.revealRangeInCenterIfOutsideViewport(range);
    window._monacoEditor.focus();
    if (!window._queryDecorations) window._queryDecorations = [];
    window._queryDecorations = window._monacoEditor.deltaDecorations(
      window._queryDecorations,
      [{ range, options: { className: 'query-highlight' } }]
    );
    return;
  }
  // Textarea fallback
  const ta = document.getElementById('editor-fallback');
  ta.focus();
  ta.setSelectionRange(start, end);
}

// ── Alias map: parse FROM/JOIN alias → FQN ───────────────────────────────────
function parseAliasMap(sql) {
  if (!sql) return new Map();
  // Strip string literals, backtick ids, and comments so keywords inside them don't confuse us
  const stripped = sql
    .replace(/`[^`]*`/g, m => ' '.repeat(m.length))
    .replace(/'(?:[^'\\]|\\.)*'/g, m => ' '.repeat(m.length))
    .replace(/"(?:[^"\\]|\\.)*"/g, m => ' '.repeat(m.length))
    .replace(/--[^\n]*/g, m => ' '.repeat(m.length))
    .replace(/\/\*[\s\S]*?\*\//g, m => ' '.repeat(m.length));
  // Also scan original for backtick FQNs
  const map = new Map();
  const SQL_KW = /^(SELECT|FROM|WHERE|JOIN|LEFT|RIGHT|INNER|OUTER|FULL|CROSS|ON|AND|OR|NOT|AS|WITH|GROUP|ORDER|HAVING|LIMIT|UNION|USING|DISTINCT|ALL|BY|SET|INTO|IF|CASE|WHEN|THEN|ELSE|END|QUALIFY|OFFSET|EXCEPT|INTERSECT)$/i;
  // Match: FROM/JOIN  ( `backtick.fqn` | word.dotted.name )  [AS]  alias
  const re = /\b(?:FROM|JOIN)\s+(`[^`]+`|[\w][\w]*(?:\.[\w-]+)*)\s+(?:AS\s+)?([A-Za-z_]\w*)\b/gi;
  let m;
  // Run on original SQL so backtick FQNs are preserved
  while ((m = re.exec(sql)) !== null) {
    const alias = m[2];
    if (SQL_KW.test(alias)) continue;
    // Normalise: strip backticks, lowercase
    const fqn = m[1].replace(/`/g, '').toLowerCase();
    map.set(alias.toLowerCase(), fqn);
  }
  return map;
}

// ── Column type inference ─────────────────────────────────────────────────────
let _schemaCache    = new Map(); // keyed by table id → { name, type, grouped }[]
let _fqnSchemaCache = new Map(); // normalizedFqn (no backticks, lowercase) → [{name, type}]
let _currentDag = null;        // last rendered DAG, for edge redraw on expand/collapse
let _sidebarProjects = [];     // loaded project list, used by global table search
let _storyBlocks = [];         // story tab block list
let _lastQueryContext = null;  // { sql, project } — set after runQuery succeeds; used by story blocks
let _lastQueryColumns = [];    // column names from last query result; populates story column pickers
let _lastQuerySchema  = [];    // [{name, type}] from last query result; used for type-filtered col pickers

// ── Workspace management ─────────────────────────────────────────────────────
let _workspaces = [];
let _activeWsId = null;
let _wsCounter  = 0;

function _createDashboardState(name) {
  const id = 'ws_' + (++_wsCounter);
  return { id, type: 'dashboard', name: name || ('Dashboard ' + _wsCounter), widgets: [] };
}

function _createWsState(name) {
  const id = 'ws_' + (++_wsCounter);
  return {
    id,
    type: 'query',
    name: name || ('Query ' + _wsCounter),
    sql: '',
    activeTab: 'sql',
    resultsHtml: '',
    statusText: 'No results yet',
    statusWarnText: '', statusWarnVisible: false,
    statusJobIdText: '', statusJobIdVisible: false,
    errorBannerText: '', errorBannerVisible: false,
    storyBlocks: [],
    lastQueryContext: null,
    lastQueryColumns: [],
    lastQuerySchema: [],
    lastQueryData: null,
    schemaCache: new Map(),
    currentDag: null,
    abortCtrl: null,
    isRunning: false,
    addedTables: new Set(),
  };
}

function _saveCurrentWorkspace() {
  const ws = _workspaces.find(w => w.id === _activeWsId);
  if (!ws || ws.type === 'dashboard') return;
  if (ws.type === 'data') {
    ws.storyBlocks = _storyBlocks;
    const activeTabEl = document.querySelector('.main-tab.active');
    if (activeTabEl) ws.activeTab = activeTabEl.dataset.tab || 'sql';
    return;
  }
  ws.sql = EditorAPI.getValue();
  ws.statusText = document.getElementById('status-text').textContent;
  const sw = document.getElementById('status-warn');
  ws.statusWarnText    = sw.textContent;
  ws.statusWarnVisible = sw.style.display !== 'none';
  const sj = document.getElementById('status-jobid');
  ws.statusJobIdText    = sj.textContent;
  ws.statusJobIdVisible = sj.style.display !== 'none';
  const eb = document.getElementById('error-banner');
  ws.errorBannerText    = eb.textContent;
  ws.errorBannerVisible = eb.style.display !== 'none';
  ws.storyBlocks       = _storyBlocks;
  ws.lastQueryContext  = _lastQueryContext;
  ws.lastQueryColumns  = _lastQueryColumns;
  ws.lastQuerySchema   = _lastQuerySchema;
  ws.schemaCache       = _schemaCache;
  ws.currentDag        = _currentDag;
  ws.addedTables       = new Set(addedTables);
  const activeTabEl = document.querySelector('.main-tab.active');
  if (activeTabEl) ws.activeTab = activeTabEl.dataset.tab || activeTabEl.dataset.panelId || 'sql';
}

function _loadWorkspace(ws) {
  _activeWsId = ws.id;
  const mainEl = document.getElementById('main');
  if (ws.type === 'dashboard') {
    mainEl.classList.add('dashboard-active');
    renderDashboard(ws);
    return;
  }
  mainEl.classList.remove('dashboard-active');

  if (ws.type === 'data') {
    _storyBlocks      = ws.storyBlocks || [];
    _lastQueryContext  = ws.lastQueryContext;
    _lastQueryColumns  = ws.lastQueryColumns || [];
    _lastQuerySchema   = ws.lastQuerySchema  || [];
    _schemaCache       = ws.schemaCache || new Map();
    _currentDag        = null;
    _renderDataPanel(ws);
    // Hide query-only toolbar controls; swap sql tab → table tab
    document.getElementById('run-btn').style.display     = 'none';
    document.getElementById('stop-btn').style.display    = 'none';
    document.getElementById('format-btn').style.display  = 'none';
    document.getElementById('comment-btn').style.display = 'none';
    const _sqlTabEl = document.querySelector('.main-tab[data-tab="sql"]');
    const _tableTabEl = document.getElementById('table-tab');
    if (_sqlTabEl) _sqlTabEl.style.display = 'none';
    if (_tableTabEl) _tableTabEl.style.display = '';
    renderStoryBlocks();
    const tabToActivate = document.querySelector(`.main-tab[data-tab="${ws.activeTab || 'table'}"]`);
    if (tabToActivate) activateMainTab(tabToActivate);
    _updateDownloadBtn();
    if (window._monacoEditor) window._monacoEditor.layout();
    return;
  }

  // Restore query-only toolbar controls and sql tab (may have been hidden by a data workspace)
  document.getElementById('run-btn').style.display     = '';
  document.getElementById('format-btn').style.display  = '';
  document.getElementById('comment-btn').style.display = '';
  const _sqlTabEl2 = document.querySelector('.main-tab[data-tab="sql"]');
  const _tableTabEl2 = document.getElementById('table-tab');
  if (_sqlTabEl2) _sqlTabEl2.style.display = '';
  if (_tableTabEl2) _tableTabEl2.style.display = 'none';

  _storyBlocks        = ws.storyBlocks;
  _lastQueryContext   = ws.lastQueryContext;
  _lastQueryColumns   = ws.lastQueryColumns;
  _lastQuerySchema    = ws.lastQuerySchema;
  _schemaCache        = ws.schemaCache;
  _currentDag         = ws.currentDag;

  // Clear any Monaco decorations from the previous workspace
  if (window._monacoEditor && (window._queryDecorations || []).length) {
    window._monacoEditor.deltaDecorations(window._queryDecorations, []);
  }
  window._queryDecorations = [];

  EditorAPI.setValue(ws.sql);

  // Restore results and re-attach resize handles (serialised HTML loses event listeners)
  const _rsEl = document.getElementById('results-scroll');
  if (!ws.resultsHtml && ws.lastQueryData) ws.resultsHtml = _buildResultsHtml(ws.lastQueryData);
  _rsEl.innerHTML = ws.resultsHtml;
  const _rtEl = _rsEl.querySelector('table');
  if (_rtEl) {
    _rtEl.querySelectorAll('.col-resize-handle').forEach(h => h.remove());
    makeTableResizable(_rtEl);
  }
  document.getElementById('status-text').textContent = ws.statusText;
  const sw = document.getElementById('status-warn');
  sw.textContent   = ws.statusWarnText;
  sw.style.display = ws.statusWarnVisible ? '' : 'none';
  const sj = document.getElementById('status-jobid');
  sj.textContent   = ws.statusJobIdText;
  sj.style.display = ws.statusJobIdVisible ? '' : 'none';
  const eb = document.getElementById('error-banner');
  eb.textContent    = ws.errorBannerText;
  eb.style.display  = ws.errorBannerVisible ? 'block' : 'none';

  // Restore per-workspace sidebar "added" state
  addedTables.clear();
  (ws.addedTables || new Set()).forEach(t => addedTables.add(t));
  document.querySelectorAll('.col-list').forEach(el => {
    if (el.dataset.tableFqn) el.classList.toggle('table-added', addedTables.has(el.dataset.tableFqn));
  });

  renderStoryBlocks();

  // Show/hide run controls based on running state
  const runBtn  = document.getElementById('run-btn');
  const stopBtn = document.getElementById('stop-btn');
  const overlay = document.getElementById('loading-overlay');
  if (ws.isRunning) {
    runBtn.disabled = true;
    runBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg> Running…`;
    stopBtn.style.display = 'flex';
    overlay.style.display = 'flex';
  } else {
    runBtn.disabled = false;
    runBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg> Run`;
    stopBtn.style.display = 'none';
    overlay.style.display = 'none';
  }

  // Show only dynamic tabs that belong to this workspace; hide all others
  document.querySelectorAll('.preview-dyn-tab').forEach(tab => {
    tab.style.display = (!tab.dataset.wsId || tab.dataset.wsId === ws.id) ? '' : 'none';
  });

  // Restore active sub-tab (fall back to SQL if saved tab belongs to another workspace)
  let tabToActivate = document.querySelector(`.main-tab[data-tab="${ws.activeTab}"]`)
    || document.querySelector(`.main-tab[data-panel-id="${ws.activeTab}"]`);
  if (!tabToActivate || tabToActivate.style.display === 'none') {
    tabToActivate = document.querySelector('.main-tab[data-tab="sql"]');
  }
  if (tabToActivate) activateMainTab(tabToActivate);

  _updateDownloadBtn();
  if (window._monacoEditor) window._monacoEditor.layout();
}

function _renderDataPanel(ws) {
  const sheetsEl = document.getElementById('data-panel-sheets');
  const status   = document.getElementById('data-panel-status');
  const scroll   = document.getElementById('data-panel-scroll');
  if (!ws.lastQueryData) { sheetsEl.className = 'hidden'; status.innerHTML = ''; scroll.innerHTML = ''; return; }

  // Sheet tab bar (Excel only)
  sheetsEl.innerHTML = '';
  if (ws._dataSheets && Object.keys(ws._dataSheets).length > 1) {
    sheetsEl.classList.add('visible');
    const activeSheet = ws._activeSheet || Object.keys(ws._dataSheets)[0];
    Object.entries(ws._dataSheets).forEach(([sname, sdata]) => {
      const btn = document.createElement('button');
      btn.className = 'dp-sheet-tab' + (sname === activeSheet ? ' active' : '');
      btn.textContent = sname;
      btn.title = `Table: ${sdata.tableName}`;
      btn.addEventListener('click', () => {
        ws._activeSheet = sname;
        ws.lastQueryData    = { columns: sdata.columns, schema: sdata.schema, rows: sdata.rows };
        ws._dataTotalRows   = sdata.totalRows;
        ws.lastQueryColumns = sdata.columns;
        ws.lastQuerySchema  = sdata.schema;
        _lastQueryColumns   = sdata.columns;
        _lastQuerySchema    = sdata.schema;
        _renderDataPanel(ws);
      });
      sheetsEl.appendChild(btn);
    });
  } else {
    sheetsEl.classList.remove('visible');
  }

  const { columns, rows, schema } = ws.lastQueryData;
  const trunc = ws._dataTotalRows > rows.length;
  status.innerHTML =
    `<span>${ws.filePath}</span>` +
    `<span>${rows.length.toLocaleString()} rows × ${columns.length} cols</span>` +
    (trunc ? `<span class="dp-trunc">⚠ truncated to ${rows.length.toLocaleString()} of ${ws._dataTotalRows.toLocaleString()}</span>` : '');

  scroll.innerHTML = '';
  const dpWrap = document.createElement('div');
  dpWrap.className = 'lq-table-scroll';
  const tbl = document.createElement('table');
  const thead = document.createElement('thead');
  const hr = document.createElement('tr');
  const _dpIdxTh = document.createElement('th'); _dpIdxTh.className = 'tbl-idx-th'; _dpIdxTh.textContent = '#'; hr.appendChild(_dpIdxTh);
  columns.forEach((col, i) => {
    const th = document.createElement('th');
    th.textContent = col;
    addTypeIcon(th, schema?.[i]?.type);
    hr.appendChild(th);
  });
  thead.appendChild(hr);
  tbl.appendChild(thead);
  const tbody = document.createElement('tbody');
  rows.forEach((row, ri) => {
    const tr = document.createElement('tr');
    const _dpIdxTd = document.createElement('td'); _dpIdxTd.className = 'tbl-idx-td'; _dpIdxTd.textContent = ri + 1; tr.appendChild(_dpIdxTd);
    row.forEach(cell => {
      const td = document.createElement('td');
      if (cell === null || cell === undefined) { td.textContent = 'NULL'; td.className = 'null-val'; }
      else td.textContent = String(cell);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  dpWrap.appendChild(tbl);
  scroll.appendChild(dpWrap);
  makeTableResizable(tbl);
}

function _updateDownloadBtn() {
  const ws = _workspaces.find(w => w.id === _activeWsId);
  const hasData = !!(ws && ws.lastQueryData);
  const wrap = document.getElementById('download-btn-wrap');
  if (wrap) wrap.style.display = hasData ? '' : 'none';
  const copyBtn = document.getElementById('copy-table-btn');
  if (copyBtn) copyBtn.style.display = (hasData && ws.lastQueryData.rows.length <= 100) ? '' : 'none';
}

// Rebuild a results table from raw query data (used when restoring session)
function _buildResultsHtml(queryData) {
  if (!queryData) return '';
  const { columns, schema, rows } = queryData;
  const wrap = document.createElement('div');
  wrap.className = 'lq-table-scroll';
  const tbl = document.createElement('table');
  const thead = document.createElement('thead');
  const hr = document.createElement('tr');
  const idxTh = document.createElement('th'); idxTh.className = 'tbl-idx-th'; idxTh.textContent = '#'; hr.appendChild(idxTh);
  columns.forEach((col, i) => {
    const th = document.createElement('th');
    th.textContent = col;
    addTypeIcon(th, schema?.[i]?.type);
    hr.appendChild(th);
  });
  thead.appendChild(hr);
  tbl.appendChild(thead);
  const tbody = document.createElement('tbody');
  rows.forEach((row, ri) => {
    const tr = document.createElement('tr');
    const idxTd = document.createElement('td'); idxTd.className = 'tbl-idx-td'; idxTd.textContent = ri + 1; tr.appendChild(idxTd);
    row.forEach(cell => {
      const td = document.createElement('td');
      if (cell === null || cell === undefined) { td.textContent = 'NULL'; td.className = 'null-val'; }
      else td.textContent = String(cell);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  wrap.appendChild(tbl);
  return wrap.innerHTML;
}

function _renderWsBar() {
  const leftEl  = document.getElementById('ws-bar-left');
  const rightEl = document.getElementById('ws-bar-right');
  if (!leftEl || !rightEl) return;
  leftEl.innerHTML = '';
  rightEl.innerHTML = '';

  const QUERY_ICON = `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--col-color)" stroke-width="1.8" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><text x="5" y="19" font-size="6" fill="var(--col-color)" stroke="none" font-family="monospace">SQL</text></svg>`;
  const DASH_ICON  = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>`;
  const DATA_ICON  = `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="8" x2="21" y2="8"/><line x1="3" y1="13" x2="21" y2="13"/><line x1="3" y1="18" x2="21" y2="18"/><line x1="8" y1="3" x2="8" y2="21"/></svg>`;

  function makeTab(ws) {
    const isDash = ws.type === 'dashboard';
    const tab = document.createElement('div');
    tab.className = 'ws-tab' + (ws.id === _activeWsId ? ' active' : '') + (isDash ? ' ws-tab-dashboard' : '');
    tab.dataset.wsId = ws.id;

    const iconEl = document.createElement('span');
    iconEl.className = 'ws-tab-icon';
    iconEl.innerHTML = isDash ? DASH_ICON : ws.type === 'data' ? DATA_ICON : QUERY_ICON;
    tab.appendChild(iconEl);

    if (!isDash && ws.isRunning) {
      const dot = document.createElement('span');
      dot.className = 'ws-running-dot';
      tab.appendChild(dot);
    }

    const nameEl = document.createElement('input');
    nameEl.type = 'text';
    nameEl.className = 'ws-tab-name';
    nameEl.value = ws.name;
    nameEl.title = ws.name;
    nameEl.spellcheck = false;
    nameEl.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); nameEl.blur(); }
      if (e.key === 'Escape') { nameEl.value = ws.name; nameEl.blur(); }
      e.stopPropagation();
    });
    nameEl.addEventListener('blur', () => {
      const newName = nameEl.value.trim() || ws.name;
      ws.name = newName; nameEl.value = newName; nameEl.title = newName;
      _schedSave();
    });
    tab.appendChild(nameEl);

    const canClose = isDash
      ? _workspaces.filter(w => w.type === 'dashboard').length > 1
      : ws.type === 'data'
        ? true
        : _workspaces.filter(w => w.type === 'query').length > 1;
    if (canClose) {
      const closeBtn = document.createElement('button');
      closeBtn.className = 'ws-tab-close';
      closeBtn.innerHTML = '×';
      closeBtn.title = 'Close';
      closeBtn.addEventListener('click', e => { e.stopPropagation(); closeWorkspace(ws.id); });
      tab.appendChild(closeBtn);
    }

    tab.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      if (e.target.closest('.ws-tab-close')) return;
      if (ws.id !== _activeWsId) {
        e.preventDefault();
        switchWorkspace(ws.id);
      }
    });

    if (isDash) {
      tab.addEventListener('dragover', e => {
        if (!e.dataTransfer.types.includes('application/bq-widget')) return;
        e.preventDefault();
        tab.classList.add('drag-over-tab');
      });
      tab.addEventListener('dragleave', () => tab.classList.remove('drag-over-tab'));
      tab.addEventListener('drop', e => {
        tab.classList.remove('drag-over-tab');
        const raw = e.dataTransfer.getData('application/bq-widget');
        if (!raw) return;
        e.preventDefault();
        _addWidgetToDashboard(JSON.parse(raw), ws.id);
      });
    }

    if (!isDash) {
      tab.draggable = true;
      tab.addEventListener('dragstart', e => {
        _wsDragId = ws.id;
        e.dataTransfer.setData('application/bq-tab', ws.id);
        e.dataTransfer.effectAllowed = 'move';
        setTimeout(() => tab.classList.add('ws-tab-dragging'), 0);
      });
      tab.addEventListener('dragend', () => {
        _wsDragId = null;
        tab.classList.remove('ws-tab-dragging');
        document.querySelectorAll('.ws-tab-drop-before,.ws-tab-drop-after').forEach(t => t.classList.remove('ws-tab-drop-before','ws-tab-drop-after'));
      });
      tab.addEventListener('dragover', e => {
        if (!_wsDragId || _wsDragId === ws.id || !e.dataTransfer.types.includes('application/bq-tab')) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        document.querySelectorAll('.ws-tab-drop-before,.ws-tab-drop-after').forEach(t => t.classList.remove('ws-tab-drop-before','ws-tab-drop-after'));
        const before = e.clientX < tab.getBoundingClientRect().left + tab.offsetWidth / 2;
        tab.classList.add(before ? 'ws-tab-drop-before' : 'ws-tab-drop-after');
      });
      tab.addEventListener('dragleave', () => tab.classList.remove('ws-tab-drop-before','ws-tab-drop-after'));
      tab.addEventListener('drop', e => {
        if (!_wsDragId || _wsDragId === ws.id || !e.dataTransfer.types.includes('application/bq-tab')) return;
        e.preventDefault();
        tab.classList.remove('ws-tab-drop-before','ws-tab-drop-after');
        const before = e.clientX < tab.getBoundingClientRect().left + tab.offsetWidth / 2;
        const srcIdx = _workspaces.findIndex(w => w.id === _wsDragId);
        if (srcIdx === -1) return;
        const [moved] = _workspaces.splice(srcIdx, 1);
        const tgtIdx = _workspaces.findIndex(w => w.id === ws.id);
        if (tgtIdx === -1) { _workspaces.push(moved); } else { _workspaces.splice(before ? tgtIdx : tgtIdx + 1, 0, moved); }
        _renderWsBar();
      });
    }

    return tab;
  }

  _workspaces.filter(w => w.type === 'query' || w.type === 'data').forEach(ws => leftEl.appendChild(makeTab(ws)));
  const addQueryBtn = document.createElement('button');
  addQueryBtn.className = 'ws-add-btn';
  addQueryBtn.textContent = '+';
  addQueryBtn.title = 'New query';
  addQueryBtn.addEventListener('click', addWorkspace);
  leftEl.appendChild(addQueryBtn);

  _workspaces.filter(w => w.type === 'dashboard').forEach(ws => rightEl.appendChild(makeTab(ws)));
  const addDashBtn = document.createElement('button');
  addDashBtn.className = 'ws-add-btn';
  addDashBtn.title = 'New dashboard';
  addDashBtn.innerHTML = `${DASH_ICON}&thinsp;+`;
  addDashBtn.addEventListener('click', addDashboard);
  rightEl.appendChild(addDashBtn);
}

function switchWorkspace(id) {
  if (id === _activeWsId) return;
  _saveCurrentWorkspace();
  const ws = _workspaces.find(w => w.id === id);
  if (!ws) return;
  try { _loadWorkspace(ws); } catch(e) { console.error('switchWorkspace: _loadWorkspace failed', e); }
  _renderWsBar();
  _schedSave();
}

function addWorkspace() {
  _saveCurrentWorkspace();
  const ws = _createWsState();
  _workspaces.push(ws);
  _loadWorkspace(ws);
  _renderWsBar();
  _schedSave();
}

function addDashboard() {
  _saveCurrentWorkspace();
  const ws = _createDashboardState();
  _workspaces.push(ws);
  _loadWorkspace(ws);
  _renderWsBar();
}

function closeWorkspace(id) {
  const idx = _workspaces.findIndex(w => w.id === id);
  if (idx === -1) return;
  const ws = _workspaces[idx];
  if (ws.type === 'query' && _workspaces.filter(w => w.type === 'query').length <= 1) return;
  if (ws.abortCtrl) ws.abortCtrl.abort();
  // Remove all dynamic preview tabs belonging to this workspace
  document.querySelectorAll(`.preview-dyn-tab[data-ws-id="${id}"]`).forEach(tab => {
    const panelId = tab.dataset.panelId;
    if (panelId) document.getElementById(panelId)?.remove();
    tab.remove();
  });
  _workspaces.splice(idx, 1);
  if (id === _activeWsId) {
    const nextWs = _workspaces[Math.min(idx, _workspaces.length - 1)];
    _loadWorkspace(nextWs);
  }
  _renderWsBar();
  _schedSave();
}

function renderDashboard(ws) {
  const panel = document.getElementById('dashboard-panel');
  if (!panel) return;
  panel.innerHTML = '';

  // Dashboard toolbar
  const toolbar = document.createElement('div');
  toolbar.className = 'dash-toolbar';
  const addTextBtn = document.createElement('button');
  addTextBtn.className = 'dash-toolbar-btn';
  addTextBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 6H3"/><path d="M21 12H3"/><path d="M15 18H3"/></svg> Add Text`;
  addTextBtn.addEventListener('click', () => {
    ws.widgets.push({ id: 'widget_' + Date.now(), widgetType: 'text', title: 'Text', content: '' });
    renderDashboard(ws);
  });
  toolbar.appendChild(addTextBtn);
  const exportBtn = document.createElement('button');
  exportBtn.className = 'dash-toolbar-btn';
  exportBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export`;
  exportBtn.addEventListener('click', () => showExportPicker(exportBtn, [
    { label: '⤓  HTML report',     action: () => exportDashboard(ws, exportBtn) },
    { label: '⤓  .ipynb notebook', action: () => exportDashboardAsNotebook(ws)  },
  ]));
  toolbar.appendChild(exportBtn);
  panel.appendChild(toolbar);

  if (!ws.widgets || !ws.widgets.length) {
    const empty = document.createElement('div');
    empty.className = 'dash-empty';
    empty.innerHTML = `<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <div>Drag story blocks here to build your dashboard</div>`;
    panel.appendChild(empty);
  } else {
    ws.widgets.forEach(widget => {
      if (widget.widgetType === 'text') {
        const card = document.createElement('div');
        card.className = 'dash-text-widget';
        const hdr = document.createElement('div');
        hdr.className = 'dash-text-hdr';
        const titleInp = document.createElement('input');
        titleInp.type = 'text';
        titleInp.className = 'dash-text-title-inp';
        titleInp.value = widget.title;
        titleInp.spellcheck = false;
        titleInp.addEventListener('keydown', e => { if (e.key === 'Enter') titleInp.blur(); e.stopPropagation(); });
        titleInp.addEventListener('blur', () => { widget.title = titleInp.value.trim() || widget.title; titleInp.value = widget.title; });
        const closeBtn = document.createElement('button');
        closeBtn.className = 'dash-text-close';
        closeBtn.innerHTML = '×';
        closeBtn.title = 'Remove';
        closeBtn.addEventListener('click', () => { ws.widgets = ws.widgets.filter(w => w.id !== widget.id); renderDashboard(ws); });
        hdr.appendChild(titleInp);
        hdr.appendChild(closeBtn);
        const body = document.createElement('div');
        body.className = 'dash-text-body';
        const ta = document.createElement('textarea');
        ta.className = 'dash-text-area';
        ta.placeholder = 'Type text here…';
        ta.value = widget.content || '';
        ta.addEventListener('input', () => { widget.content = ta.value; });
        body.appendChild(ta);
        card.appendChild(hdr);
        card.appendChild(body);
        panel.appendChild(card);
        return;
      }
      const blockEl = buildStoryBlock(widget, {
        hidePinBtn: true,
        onDelete: () => {
          ws.widgets = ws.widgets.filter(w => w.id !== widget.id);
          renderDashboard(ws);
        },
      });
      panel.appendChild(blockEl);
      // Re-render last data if present
      if (widget._lastData) {
        const outputEl = blockEl.querySelector('.story-output');
        if (outputEl) {
          renderStoryOutput(widget.type, widget._lastData, outputEl, widget);
          outputEl.className = 'story-output visible' + (
            ['histogram','scatter','lineplot','boxplot','outlier_detect','linreg','hypo_test','barplot','corr_matrix','feature_importance','predict_model','data_split'].includes(widget.type) ? ' plot-output' : ''
          );
          if (widget.folded) outputEl.style.display = 'none';
        }
      }
    });
  }

  // Drop zone
  const dropZone = document.createElement('div');
  dropZone.className = 'dash-drop-zone';
  dropZone.style.flexBasis = '100%';
  dropZone.textContent = '↓ Drop story blocks here';
  dropZone.addEventListener('dragover', e => {
    if (!e.dataTransfer.types.includes('application/bq-widget')) return;
    e.preventDefault();
    dropZone.classList.add('drag-over');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    dropZone.classList.remove('drag-over');
    const raw = e.dataTransfer.getData('application/bq-widget');
    if (!raw) return;
    e.preventDefault();
    _addWidgetToDashboard(JSON.parse(raw), ws.id);
  });
  panel.appendChild(dropZone);
}

// ── Dashboard export ──────────────────────────────────────────────────────────

function _escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function _exportCssVars() {
  const s = getComputedStyle(document.documentElement);
  const vars = ['--bg','--bg2','--bg3','--border','--border2','--text','--text2',
    '--accent','--accent-hover','--node-hover','--shadow-color',
    '--error-color','--error-bg','--warn-color','--null-color',
    '--title-color','--col-color','--badge-color','--scrollbar'];
  return vars.map(v => `${v}:${s.getPropertyValue(v).trim()}`).join(';');
}

// Serialize an ECharts option to JSON, encoding functions as tagged strings so they
// survive serialisation and can be reconstructed with eval in the exported file.
function _serializeEchartOption(opt) {
  return JSON.stringify(opt, function(k, v) {
    if (typeof v === 'function') return '__bqsfn__' + v.toString();
    return v;
  });
}

function _buildExportHtml(title, inlineVars, appCss, cardsHtml) {
  const ts = new Date().toLocaleString();
  // Inline script that initialises ECharts from the serialised options stored in
  // data-chart-opts attributes, and wires up ResizeObserver so charts redraw when
  // the user resizes a card.
  const initScript = `
(function(){
  var FN_TAG = '__bqsfn__';
  function parseOpts(s){
    return JSON.parse(s, function(k,v){
      if(typeof v==='string' && v.startsWith(FN_TAG)){
        try{
          var fn = new Function('return ('+v.slice(FN_TAG.length)+')')();
          // Wrap so closure-reference errors degrade silently to default tooltip
          return function(){ try{ return fn.apply(this,arguments); }catch(e){ return undefined; } };
        }catch(e){ return undefined; }
      }
      return v;
    });
  }
  function initAll(){
    document.querySelectorAll('[data-chart-opts]').forEach(function(el){
      try{
        var opts = parseOpts(el.dataset.chartOpts);
        opts.backgroundColor = 'transparent';
        var chart = echarts.init(el, null, {renderer:'canvas'});
        chart.setOption(opts);
        // Resize once so the chart fills its current container width
        chart.resize();
        // Keep in sync when user resizes the card
        var card = el.closest('.exp-card');
        if(card && window.ResizeObserver){
          new ResizeObserver(function(){ chart.resize(); }).observe(card);
        }
      }catch(e){
        el.innerHTML = '<div style="padding:12px;font-size:11px;color:#c00">Chart error: '+e+'</div>';
      }
    });
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', initAll);
  } else { setTimeout(initAll, 0); }
})();`;

  return `<!DOCTYPE html>
<html lang="en" style="${inlineVars}">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>${_escHtml(title)}</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"><\/script>
<style>
${appCss}
/* ── Export overrides ────────────────────────────────────────────── */
html,body{height:auto!important;overflow:auto!important;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;margin:0;padding:0;}
*{box-sizing:border-box;}
.exp-page{max-width:1600px;margin:0 auto;padding:24px 20px;}
.exp-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:4px;}
.exp-meta{font-size:11px;color:var(--text2);margin-bottom:20px;}
.exp-grid{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;}
/* Cards: resizable, keep min size, flex column so body grows */
.exp-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:6px;
  box-shadow:0 2px 10px var(--shadow-color);
  display:flex;flex-direction:column;
  min-width:220px;min-height:60px;
  resize:both;overflow:hidden;
  position:relative;
}
.exp-card-hdr{
  flex-shrink:0;padding:7px 12px;
  background:var(--bg3);border-bottom:1px solid var(--border2);
  font-size:12px;font-weight:600;color:var(--text);
  user-select:none;
}
/* Resize-handle hint in bottom-right corner */
.exp-card::after{
  content:'';position:absolute;right:3px;bottom:3px;
  width:10px;height:10px;
  background:linear-gradient(135deg,transparent 40%,var(--border2) 40%,var(--border2) 55%,transparent 55%,transparent 70%,var(--border2) 70%,var(--border2) 85%,transparent 85%);
  pointer-events:none;opacity:0.6;
}
.exp-text{padding:10px 12px;white-space:pre-wrap;font-size:13px;line-height:1.6;color:var(--text);overflow:auto;}
.exp-placeholder{padding:20px 12px;font-size:12px;color:var(--text2);font-style:italic;}
/* Story output inside export cards */
.story-output{
  display:block!important;flex:1;min-height:0;
  overflow:auto;background:var(--bg2);color:var(--text);
}

${cardsHtml}
