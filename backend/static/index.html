}

async function exportDashboard(ws, triggerBtn) {
  if (!ws.widgets || !ws.widgets.length) return;

  const origLabel = triggerBtn ? triggerBtn.innerHTML : null;
  if (triggerBtn) { triggerBtn.disabled = true; triggerBtn.innerHTML = '… Exporting'; }

  const scratch = document.createElement('div');
  scratch.style.cssText = 'position:fixed;left:-9999px;top:0;visibility:hidden;width:960px;';
  document.body.appendChild(scratch);

  // ── Intercept echarts.init to capture option objects instead of rendering SVG ──
  const _capturedCharts = new Map(); // chartId → serialized option string
  let _ecIdx = 0;
  const _origInit = echarts.init;
  echarts.init = (el, theme, opts) => {
    const chart = _origInit(el, theme, { ...(opts || {}), renderer: 'canvas' });
    const chartId = '__ec__' + (++_ecIdx);
    el.id        = chartId;
    el.dataset.exportChart = '1';
    const _origSet = chart.setOption.bind(chart);
    chart.setOption = (option, ...rest) => {
      _capturedCharts.set(chartId, _serializeEchartOption(option));
      return _origSet(option, ...rest);
    };
    return chart;
  };

  const CHART_TYPES = new Set(['histogram','scatter','lineplot','boxplot','outlier_detect',
    'linreg','hypo_test','barplot','corr_matrix','feature_importance','predict_model','data_split']);

  const cardHtmls = [];
  for (const widget of ws.widgets) {
    const card = document.createElement('div');
    // 'story-block' required so DOM-lookup render functions (renderBarplot etc.) find this card
    card.className = 'story-block exp-card';
    card.dataset.id = widget.id;

    const hdr = document.createElement('div');
    hdr.className = 'exp-card-hdr';
    hdr.textContent = widget.title || '';
    card.appendChild(hdr);

    if (widget.widgetType === 'text') {
      const body = document.createElement('div');
      body.className = 'exp-text';
      body.textContent = widget.content || '';
      card.appendChild(body);
    } else if (widget._lastData) {
      const isChart = CHART_TYPES.has(widget.type);
      const outputEl = document.createElement('div');
      outputEl.className = 'story-output visible' + (isChart ? ' plot-output' : '');
      card.appendChild(outputEl);
      scratch.appendChild(card);

      // ── Critical: mask live blocks with the same data-id ──────────────────
      // Nine render functions (renderBarplot, renderBoxplot, etc.) find their
      // container via document.querySelector('.story-block[data-id="..."]').
      // Without masking, the live dashboard block is found first (it appears
      // earlier in document order), so charts are rendered into the live UI
      // instead of the off-screen export card. The placeholder swap then finds
      // nothing in outputEl and the exported card is blank.
      const maskedEls = [...document.querySelectorAll(`.story-block[data-id="${widget.id}"]`)]
        .filter(el => el !== card);
      maskedEls.forEach(el => { el.dataset.id = '__export_mask__'; });

      try {
        renderStoryOutput(widget.type, widget._lastData, outputEl, widget);
        await new Promise(r => requestAnimationFrame(r));
        await new Promise(r => requestAnimationFrame(r));
      } catch (e) {
        outputEl.textContent = 'Render error: ' + e.message;
      } finally {
        // Always restore, even if rendering threw
        maskedEls.forEach(el => { el.dataset.id = widget.id; });
      }

      if (isChart) {
        // Replace every ECharts canvas container with a lightweight placeholder
        // div. The exported HTML re-initialises ECharts from the serialised opt.
        outputEl.querySelectorAll('[data-export-chart]').forEach(el => {
          const id  = el.id;
          const opt = _capturedCharts.get(id);
          if (!opt) { el.remove(); return; }
          const ph = document.createElement('div');
          ph.id        = id;
          ph.className = 'exp-chart';
          // Preserve exact pixel dimensions so ECharts has a non-zero size on init
          ph.style.cssText = el.style.cssText;
          ph.dataset.chartOpts = opt;
          el.replaceWith(ph);
        });
      }
    } else {
      const ph = document.createElement('div');
      ph.className = 'exp-placeholder';
      ph.textContent = 'No data — this block was never run';
      card.appendChild(ph);
    }

    // Strip interactive controls (buttons, inputs, dropdowns)
    card.querySelectorAll('button,input,select,textarea').forEach(el => el.remove());
    cardHtmls.push(card.outerHTML);
  }

  echarts.init = _origInit;
  document.body.removeChild(scratch);
  if (triggerBtn) { triggerBtn.disabled = false; triggerBtn.innerHTML = origLabel; }

  const inlineVars = _exportCssVars();
  const appCss    = (document.querySelector('style') || {}).textContent || '';
  const dashTitle = ws.name || 'Dashboard';
  const html      = _buildExportHtml(dashTitle, inlineVars, appCss, cardHtmls.join('\n'));
  const filename  = dashTitle.replace(/[^a-z0-9_\-]/gi, '-').toLowerCase() + '.html';
  await _saveFile(html, filename, 'text/html;charset=utf-8');
}

function _addWidgetToDashboard(data, dashId) {
  const srcWs = _workspaces.find(w => w.id === data.wsId);
  const srcBlocks = data.wsId === _activeWsId ? _storyBlocks : (srcWs || {}).storyBlocks;
  const block = (srcBlocks || []).find(b => b.id === data.blockId);
  if (!block) return;

  const dashWs = _workspaces.find(w => w.id === dashId);
  if (!dashWs) return;

  // Source query context/columns come from that workspace's saved state
  const qCtx     = data.wsId === _activeWsId ? _lastQueryContext  : (srcWs ? srcWs.lastQueryContext  : null);
  const qCols    = data.wsId === _activeWsId ? _lastQueryColumns  : (srcWs ? srcWs.lastQueryColumns  : []);
  const qSchema  = data.wsId === _activeWsId ? _lastQuerySchema   : (srcWs ? srcWs.lastQuerySchema   : []);

  // Deep-copy the block so dashboard widget is independent
  let widget;
  try {
    widget = JSON.parse(JSON.stringify({
      id: 'widget_' + Date.now(),
      type: block.type,
      title: block.title,
      params: block.params,
      folded: false,
      paramsHidden: block.paramsHidden,
      comment: block.comment || '',
      _lastData: block._lastData || null,
      _queryContext: qCtx,
      _queryColumns: qCols,
      _querySchema:  qSchema,
    }));
  } catch (e) {
    console.error('Failed to clone block for dashboard:', e);
    return;
  }

  dashWs.widgets.push(widget);

  if (_activeWsId === dashId) {
    renderDashboard(dashWs);
  } else {
    switchWorkspace(dashId);
  }
}

function bqTypeToInferredType(t) {
  const u = (t || '').toUpperCase();
  if (/^(STRING|BYTES|JSON|VARCHAR)/.test(u)) return 'string';
  if (/^(INT|FLOAT|NUMERIC|BIGNUMERIC|DECIMAL)/.test(u)) return 'numeric';
  if (/^(DATE|TIME|TIMESTAMP|DATETIME)/.test(u)) return 'time';
  if (/^BOOL/.test(u)) return 'bool';
  return 'unknown';
}

function inferColumnType(expr) {
  const up = expr.trim().toUpperCase();
  // CAST AS type patterns
  const castMatch = up.match(/CAST\s*\(.*AS\s+([\w]+)\s*\)/);
  if (castMatch) return bqTypeToInferredType(castMatch[1]);
  const safeCastMatch = up.match(/SAFE_CAST\s*\(.*AS\s+([\w]+)\s*\)/);
  if (safeCastMatch) return bqTypeToInferredType(safeCastMatch[1]);
  // Boolean literals
  if (/^(TRUE|FALSE)$/.test(up)) return 'bool';
  // Numeric literal
  if (/^-?\d+(\.\d+)?$/.test(up)) return 'numeric';
  // String literal
  if (/^['"`]/.test(expr.trim())) return 'string';
  // Function-based detection
  if (/\b(DATE|DATETIME|TIMESTAMP|TIME|EXTRACT|DATE_ADD|DATE_SUB|DATE_DIFF|DATE_TRUNC|TIMESTAMP_DIFF|CURRENT_DATE|CURRENT_TIMESTAMP|NOW)\b/.test(up)) return 'time';
  if (/\b(SUM|COUNT|AVG|MAX|MIN|ROUND|FLOOR|CEIL|ABS|MOD|INT64|FLOAT64|NUMERIC|RAND|INTEGER)\b/.test(up)) return 'numeric';
  if (/\b(STRING|CONCAT|SUBSTR|SUBSTRING|TRIM|UPPER|LOWER|REPLACE|SPLIT|REGEXP|FORMAT|TO_JSON_STRING)\b/.test(up)) return 'string';
  if (/\b(IF|IIF)\s*\(.*TRUE|FALSE/.test(up)) return 'bool';
  return 'unknown';
}

// ── SQL → DAG parser ──────────────────────────────────────────────────────────
function parseSQLToDAG(sql) {
  // ── Low-level helpers ────────────────────────────────────────────────────────
  function skipStr(s, i) {
    const q = s[i]; i++;
    while (i < s.length) {
      if (s[i] === '\\') { i += 2; continue; }
      if (s[i] === q) return i + 1;
      i++;
    }
    return i;
  }
  function skipCmt(s, i) {
    if (s[i] === '-' && s[i+1] === '-') { while (i < s.length && s[i] !== '\n') i++; return i; }
    if (s[i] === '/' && s[i+1] === '*') { i += 2; while (i < s.length-1) { if (s[i] === '*' && s[i+1] === '/') return i+2; i++; } return s.length; }
    return i;
  }
  function skipWS(s, i) {
    while (i < s.length) {
      if (/\s/.test(s[i])) { i++; continue; }
      if ((s[i]==='-'&&s[i+1]==='-')||(s[i]==='/'&&s[i+1]==='*')) { i=skipCmt(s,i); continue; }
      break;
    }
    return i;
  }
  function matchParen(s, open) {
    let i = open+1, d = 1;
    while (i < s.length && d > 0) {
      if (s[i]==="'"||s[i]==='"'||s[i]==='`') { i=skipStr(s,i); continue; }
      if ((s[i]==='-'&&s[i+1]==='-')||(s[i]==='/'&&s[i+1]==='*')) { i=skipCmt(s,i); continue; }
      if (s[i]==='(') d++; else if (s[i]===')') d--;
      i++;
    }
    return i-1;
  }
  // Read next word token (whitespace + comments already skipped by caller, or use skipWS first)
  function nextTok(s, i) {
    i = skipWS(s, i);
    if (i >= s.length) return { token:'', start:i, end:i };
    if (s[i]==='`') { const e=skipStr(s,i); return { token:s.slice(i,e), start:i, end:e }; }
    const st=i;
    while (i < s.length && /[\w.$]/.test(s[i])) i++;
    return { token:s.slice(st,i), start:st, end:i };
  }
  // Like nextTok but also reads hyphens that are immediately followed by a word char.
  // This handles BigQuery unquoted project IDs like `rapyd-eu-data.dataset.table`.
  // A hyphen with a space before/after is NOT consumed (so `a - b` arithmetic is safe).
  function readTableName(s, i) {
    if (i >= s.length) return { token:'', start:i, end:i };
    if (s[i]==='`') { const e=skipStr(s,i); return { token:s.slice(i,e), start:i, end:e }; }
    const st = i;
    while (i < s.length) {
      if (/[\w$.]/.test(s[i])) { i++; continue; }
      // Hyphen only if immediately followed by a word char (no space) — for project-id style names
      if (s[i]==='-' && i+1 < s.length && /[\w$]/.test(s[i+1])) { i++; continue; }
      break;
    }
    return { token:s.slice(st,i), start:st, end:i };
  }

  // Depth-aware split on commas (handles CONCAT(a,b), CASE WHEN x,y etc.)
  function splitCommas(s) {
    const parts = [];
    let start = 0, d = 0;
    for (let k = 0; k < s.length; k++) {
      if (s[k]==="'"||s[k]==='"'||s[k]==='`') { k = skipStr(s,k) - 1; continue; }
      if ((s[k]==='-'&&s[k+1]==='-')||(s[k]==='/'&&s[k+1]==='*')) { k = skipCmt(s,k) - 1; continue; }
      if (s[k]==='(') { d++; continue; }
      if (s[k]===')') { d--; continue; }
      if (d === 0 && s[k] === ',') { parts.push(s.slice(start, k)); start = k + 1; }
    }
    parts.push(s.slice(start));
    return parts.map(p => p.trim()).filter(Boolean);
  }

  // Words that cannot be a bare alias after a table name
  const JOIN_STOP = new Set([
    'ON','USING','JOIN','WHERE','LEFT','RIGHT','INNER','OUTER','CROSS','FULL',
    'GROUP','ORDER','HAVING','LIMIT','UNION','EXCEPT','INTERSECT','SELECT',
    'FROM','AS','WITH','SET','INTO','VALUES',';','',
  ]);

  // ── Extract FROM/JOIN refs at depth 0 ────────────────────────────────────────
  function extractInputs(body) {
    const refs = [];
    let i = 0;

    // Read table name + optional alias, then ON/USING keys; modifies i
    function readRef(isJoin) {
      i = skipWS(body, i);
      if (i >= body.length) return;
      if (body[i] === '(') {
        const closeP = matchParen(body, i);
        const subBody = body.slice(i + 1, closeP);
        i = closeP + 1;
        // Read optional alias
        let la = skipWS(body, i);
        const peek = nextTok(body, la);
        let alias = null;
        if (peek.token) {
          const pw = peek.token.toUpperCase();
          if (pw === 'AS') {
            const aliasTok = nextTok(body, skipWS(body, peek.end));
            alias = aliasTok.token.replace(/^`|`$/g, '') || null;
            la = aliasTok.end;
          } else if (!JOIN_STOP.has(pw)) {
            alias = peek.token.replace(/^`|`$/g, '') || null;
            la = peek.end;
          }
        }
        // Extract join keys from ON/USING clause
        let joinKeys = [];
        if (isJoin) {
          const kw2 = nextTok(body, skipWS(body, la));
          if (kw2.token) {
            const kw2u = kw2.token.toUpperCase();
            if (kw2u === 'ON') {
              let onStart = skipWS(body, kw2.end), onEnd = onStart;
              while (onEnd < body.length) {
                if (body[onEnd]==="'"||body[onEnd]==='"'||body[onEnd]==='`') { onEnd=skipStr(body,onEnd); continue; }
                if ((body[onEnd]==='-'&&body[onEnd+1]==='-')||(body[onEnd]==='/'&&body[onEnd+1]==='*')) { onEnd=skipCmt(body,onEnd); continue; }
                if (body[onEnd]==='(') { onEnd=matchParen(body,onEnd)+1; continue; }
                const sl = body.slice(onEnd, onEnd+8).toUpperCase();
                if (/^(JOIN|WHERE|GROUP|HAVING|ORDER|UNION|LIMIT|;)(\s|$)/.test(sl) ||
                    /^(LEFT|RIGHT|INNER|OUTER|CROSS|FULL)(\s|$)/.test(sl)) break;
                onEnd++;
              }
              joinKeys = [...body.slice(onStart, onEnd)
                .matchAll(/`?[\w$]+`?\.`?([\w$]+)`?/g)].map(m => m[1]);
            } else if (kw2u === 'USING') {
              const ul = skipWS(body, kw2.end);
              if (body[ul] === '(') {
                const uc = matchParen(body, ul);
                joinKeys = body.slice(ul+1, uc).split(',')
                  .map(c => c.trim().replace(/^`|`$/g,'').split('.').pop() || '').filter(Boolean);
              }
            }
          }
        }
        const subId = alias || `_sub${refs.length + 1}_`;
        refs.push({ name: subId, alias: null, joinType: isJoin ? 'join' : 'direct', joinKeys, isSubquery: true, subqueryBody: subBody });
        return;
      }
      const tableTok = readTableName(body, i);
      if (!tableTok.token) return;
      const name = tableTok.token.replace(/^`|`$/g, '');
      i = tableTok.end;
      // Reject bare SQL keywords as table names
      if (!name || JOIN_STOP.has(name.toUpperCase())) return;

      const ref = { name, alias: null, joinType: isJoin ? 'join' : 'direct', joinKeys: [] };

      // Extract optional alias for every ref (both FROM and JOIN)
      let la = skipWS(body, i);
      const peek = nextTok(body, la);
      if (peek.token) {
        const pw = peek.token.toUpperCase();
        if (pw === 'AS') {
          const aliasTok = nextTok(body, skipWS(body, peek.end));
          ref.alias = aliasTok.token.replace(/^`|`$/g, '') || null;
          la = aliasTok.end;
        } else if (!JOIN_STOP.has(pw)) {
          ref.alias = peek.token.replace(/^`|`$/g, '') || null;
          la = peek.end;
        }
      }

      if (isJoin) {
        la = skipWS(body, la);
        const kw2 = nextTok(body, la);
        const kw2u = kw2.token.toUpperCase();
        if (kw2u === 'ON') {
          let onStart = skipWS(body, kw2.end);
          let onEnd = onStart;
          while (onEnd < body.length) {
            if (body[onEnd]==="'"||body[onEnd]==='"'||body[onEnd]==='`') { onEnd=skipStr(body,onEnd); continue; }
            if ((body[onEnd]==='-'&&body[onEnd+1]==='-')||(body[onEnd]==='/'&&body[onEnd+1]==='*')) { onEnd=skipCmt(body,onEnd); continue; }
            if (body[onEnd]==='(') { onEnd=matchParen(body,onEnd)+1; continue; }
            // stop at next join/clause keyword at word boundary
            const slice8 = body.slice(onEnd, onEnd+8).toUpperCase();
            if (/^(JOIN|WHERE|GROUP|HAVING|ORDER|UNION|LIMIT|;)(\s|$)/.test(slice8) ||
                /^(LEFT|RIGHT|INNER|OUTER|CROSS|FULL)(\s|$)/.test(slice8)) break;
            onEnd++;
          }
          ref.joinKeys = [...body.slice(onStart, onEnd)
            .matchAll(/`?[\w$]+`?\.`?([\w$]+)`?/g)].map(m => m[1]);
        } else if (kw2u === 'USING') {
          la = skipWS(body, kw2.end);
          if (body[la] === '(') {
            const close = matchParen(body, la);
            ref.joinKeys = body.slice(la+1, close).split(',')
              .map(c => c.trim().replace(/^`|`$/g,'').split('.').pop() || '').filter(Boolean);
          }
        }
      }
      refs.push(ref);
    }

    while (i < body.length) {
      if (body[i]==="'"||body[i]==='"'||body[i]==='`') { i=skipStr(body,i); continue; }
      if ((body[i]==='-'&&body[i+1]==='-')||(body[i]==='/'&&body[i+1]==='*')) { i=skipCmt(body,i); continue; }
      if (body[i]==='(') { i=matchParen(body,i)+1; continue; }
      if (!/[\w`]/.test(body[i])) { i++; continue; }

      const tok = nextTok(body, i);
      if (!tok.token) { i++; continue; }
      const word = tok.token.toUpperCase();
      i = tok.end;

      if (word === 'FROM') {
        readRef(false);
      } else if (word === 'JOIN') {
        readRef(true);
      } else if (/^(LEFT|RIGHT|INNER|OUTER|CROSS|FULL)$/.test(word)) {
        // look ahead for optional OUTER|INNER, then JOIN
        let la = skipWS(body, i);
        const n1 = nextTok(body, la);
        if (/^(OUTER|INNER)$/.test(n1.token.toUpperCase())) la = skipWS(body, n1.end);
        const n2 = nextTok(body, la);
        if (n2.token.toUpperCase() === 'JOIN') {
          i = n2.end;
          readRef(true);
        }
        // else: not a join construct, skip (i already past the prefix word)
      } else if (word === 'UNION') {
        refs.push({ name: '__union__', joinType: 'union', joinKeys: [] });
      }
      // all other tokens: already advanced i past them
    }
    return refs;
  }

  // ── Extract GROUP BY columns at depth 0 ──────────────────────────────────────
  function extractGroupBy(body) {
    const names = new Set(), positions = new Set();
    let i = 0, depth = 0;
    while (i < body.length) {
      if (body[i]==="'"||body[i]==='"'||body[i]==='`') { i=skipStr(body,i); continue; }
      if ((body[i]==='-'&&body[i+1]==='-')||(body[i]==='/'&&body[i+1]==='*')) { i=skipCmt(body,i); continue; }
      if (body[i]==='(') { depth++; i++; continue; }
      if (body[i]===')') { depth--; i++; continue; }
      if (depth !== 0) { i++; continue; }
      if (!/[\w`]/.test(body[i])) { i++; continue; }
      // Read token; only act on GROUP
      {
        const tok = nextTok(body, i);
        i = tok.end;
        if (tok.token.toUpperCase() !== 'GROUP') continue;
        let j = skipWS(body, tok.end);
        const byTok = nextTok(body, j);
        if (byTok.token.toUpperCase() !== 'BY') { i = tok.end; continue; }
        j = byTok.end;
        // scan clause until HAVING/ORDER/LIMIT/; at depth 0
        let end = body.length, d2 = 0, k = j;
        while (k < body.length) {
          if (body[k]==="'"||body[k]==='"'||body[k]==='`') { k=skipStr(body,k); continue; }
          if ((body[k]==='-'&&body[k+1]==='-')||(body[k]==='/'&&body[k+1]==='*')) { k=skipCmt(body,k); continue; }
          if (body[k]==='(') { d2++; k++; continue; }
          if (body[k]===')') { d2--; k++; continue; }
          if (d2 === 0 && /^(HAVING|ORDER|LIMIT|;)/i.test(body.slice(k, k+7))) { end=k; break; }
          k++;
        }
        splitCommas(body.slice(j, end)).forEach(tok2 => {
          const t = tok2.trim().replace(/^`|`$/g,'').split(/\s/)[0].toLowerCase();
          if (/^\d+$/.test(t)) positions.add(Number(t));
          else if (t) names.add(t.split('.').pop() || t);
        });
        return { names, positions };
      }
      i++;
    }
    return { names, positions };
  }

  // ── Extract WHERE clause conditions ──────────────────────────────────────────
  function extractWhere(body) {
    let i = 0, depth = 0, whereStart = -1;
    while (i < body.length) {
      if (body[i]==="'"||body[i]==='"'||body[i]==='`') { i=skipStr(body,i); continue; }
      if ((body[i]==='-'&&body[i+1]==='-')||(body[i]==='/'&&body[i+1]==='*')) { i=skipCmt(body,i); continue; }
      if (body[i]==='(') { depth++; i++; continue; }
      if (body[i]===')') { depth--; i++; continue; }
      if (depth === 0 && /^WHERE\b/i.test(body.slice(i, i+5))) { whereStart = i + 5; break; }
      i++;
    }
    if (whereStart < 0) return [];
    // Find end of WHERE clause (next top-level keyword)
    let j = whereStart, depth2 = 0, whereEnd = body.length;
    while (j < body.length) {
      if (body[j]==="'"||body[j]==='"'||body[j]==='`') { j=skipStr(body,j); continue; }
      if ((body[j]==='-'&&body[j+1]==='-')||(body[j]==='/'&&body[j+1]==='*')) { j=skipCmt(body,j); continue; }
      if (body[j]==='(') { depth2++; j++; continue; }
      if (body[j]===')') { depth2--; j++; continue; }
      if (depth2 === 0 && /^(GROUP|HAVING|ORDER|LIMIT|UNION|EXCEPT|INTERSECT|;)\b/i.test(body.slice(j, j+10))) { whereEnd = j; break; }
      j++;
    }
    const clause = body.slice(whereStart, whereEnd).trim();
    if (!clause) return [];
    // Split on top-level AND/OR
    const conditions = [];
    let cur = '', d = 0, k = 0;
    while (k < clause.length) {
      if (clause[k]==="'"||clause[k]==='"'||clause[k]==='`') {
        const e = skipStr(clause, k); cur += clause.slice(k, e); k = e; continue;
      }
      if (clause[k]==='(') { d++; cur += clause[k++]; continue; }
      if (clause[k]===')') { d--; cur += clause[k++]; continue; }
      if (d === 0 && /^(AND|OR)\b/i.test(clause.slice(k, k+3))) {
        const part = cur.trim();
        if (part) conditions.push(part);
        cur = '';
        k += /^OR\b/i.test(clause.slice(k, k+2)) ? 2 : 3;
        continue;
      }
      cur += clause[k++];
    }
    const last = cur.trim();
    if (last) conditions.push(last);
    // Filter trivially-true no-op conditions like 1=1
    return conditions.filter(c => !/^\s*1\s*=\s*1\s*$/.test(c));
  }

  // ── Parse SELECT columns → { name, type, grouped }[] ─────────────────────────
  function extractColumns(body) {
    // Find first SELECT at depth 0
    let selStart = -1, depth = 0, i = 0;
    while (i < body.length) {
      if (body[i]==="'"||body[i]==='"'||body[i]==='`') { i=skipStr(body,i); continue; }
      if ((body[i]==='-'&&body[i+1]==='-')||(body[i]==='/'&&body[i+1]==='*')) { i=skipCmt(body,i); continue; }
      if (body[i]==='(') { depth++; i++; continue; }
      if (body[i]===')') { depth--; i++; continue; }
      if (depth === 0 && /^SELECT\b/i.test(body.slice(i, i+7))) { selStart = i; break; }
      i++;
    }
    if (selStart < 0) return [];
    i = selStart + 6;

    // Skip DISTINCT / ALL
    i = skipWS(body, i);
    if (/^DISTINCT\b/i.test(body.slice(i, i+9))) i += 8;
    else if (/^ALL\b/i.test(body.slice(i, i+4))) i += 3;

    // Find FROM at depth 0 after SELECT clause
    let fromIdx = -1;
    depth = 0;
    let j = i;
    while (j < body.length) {
      if (body[j]==="'"||body[j]==='"'||body[j]==='`') { j=skipStr(body,j); continue; }
      if ((body[j]==='-'&&body[j+1]==='-')||(body[j]==='/'&&body[j+1]==='*')) { j=skipCmt(body,j); continue; }
      if (body[j]==='(') { depth++; j++; continue; }
      if (body[j]===')') { depth--; j++; continue; }
      if (depth === 0 && /^FROM\b/i.test(body.slice(j, j+5))) { fromIdx = j; break; }
      j++;
    }
    const colStr = body.slice(i, fromIdx >= 0 ? fromIdx : body.length).trim();
    if (!colStr) return [];
    // SELECT * [EXCEPT (...)] or SELECT t.*
    const starMatch = colStr.match(/^(?:[\w`$-]+\.)?\*(?:\s+EXCEPT\s*\(([^)]*)\))?$/i);
    if (starMatch) {
      const exceptStr = (starMatch[1] || '').trim();
      const exceptCols = exceptStr
        ? new Set(exceptStr.split(',').map(s => s.trim().replace(/^`|`$/g, '').toLowerCase()))
        : new Set();
      return [{ name: '*', type: 'unknown', grouped: false, exceptCols }];
    }

    const { names: gbNames, positions: gbPos } = extractGroupBy(body);

    return splitCommas(colStr).map((raw, idx) => {
      // Find alias via last AS at depth 0
      let exprEnd = raw.length, alias = null, d2 = 0;
      for (let k = 0; k < raw.length; k++) {
        if (raw[k]==="'"||raw[k]==='"'||raw[k]==='`') { k = skipStr(raw, k) - 1; continue; }
        if (raw[k]==='(') { d2++; continue; }
        if (raw[k]===')') { d2--; continue; }
        // AS keyword at depth 0 with word boundary before and after
        if (d2 === 0 && /^AS\s/i.test(raw.slice(k, k+3)) &&
            (k === 0 || /\s/.test(raw[k-1]))) {
          exprEnd = k;
          alias = raw.slice(k+2).trim().replace(/^`|`$/g, '').split(/\s/)[0];
          break;
        }
      }
      const expr = raw.slice(0, exprEnd).trim();

      let displayName;
      if (alias) {
        displayName = alias;
      } else if (/^[\w`.$*]+$/.test(expr)) {
        // simple identifier, qualified name, or wildcard: take last part
        displayName = expr.split('.').pop().replace(/^`|`$/g, '');
      } else {
        // complex expression (function call etc.): show as-is
        displayName = expr;
      }
      if (!displayName) displayName = raw.trim();
      const nameLower = displayName.toLowerCase();
      const grouped = gbPos.has(idx + 1) || gbNames.has(nameLower);
      // Capture table alias prefix from qualified name — always, even when there is an AS alias
      // e.g. `vas.col1 AS my_col` → tableAlias='vas', name='my_col'
      let tableAlias = null;
      const dotIdx = expr.indexOf('.');
      if (dotIdx > 0 && !/[(\s]/.test(expr.slice(0, dotIdx))) {
        tableAlias = expr.slice(0, dotIdx).replace(/^`|`$/g, '');
      }
      // Types are unknown until the user runs a preview — real types come from BQ schema
      return { name: displayName, type: 'unknown', grouped, tableAlias, rawExpr: expr };
    }).filter(c => c.name).slice(0, 30);
  }

  // Attribute columns without a tableAlias by scanning their rawExpr for known input aliases.
  // Handles: func(vas.col1), COALESCE(vas.col1, 0), DATE_DIFF(vas.d1, vas.d2, DAY), etc.
  function attributeFromCols(cols, inputRefs) {
    if (!inputRefs.length) return cols;

    // Build a set of known aliases (SQL alias and short table name)
    const knownAliases = new Set();
    inputRefs.forEach(r => {
      if (r.alias) knownAliases.add(r.alias.toLowerCase());
      knownAliases.add(r.name.split('.').pop().toLowerCase());
    });

    const primaryFrom = inputRefs.find(r => r.joinType === 'direct') || inputRefs[0];
    const fromAlias = primaryFrom?.alias || primaryFrom?.name.split('.').pop() || null;

    return cols.map(col => {
      if (col.tableAlias) return col; // already set by simple dot-prefix detection

      // Scan rawExpr for alias.col patterns that match a known input alias
      if (col.rawExpr && knownAliases.size) {
        const hits = [...col.rawExpr.matchAll(/\b(`?[\w$]+`?)\.`?[\w$]+`?/g)]
          .map(m => m[1].replace(/^`|`$/g, ''))
          .filter(a => knownAliases.has(a.toLowerCase()));
        if (hits.length > 0) {
          const first = hits[0];
          if (hits.every(h => h.toLowerCase() === first.toLowerCase())) {
            return { ...col, tableAlias: first }; // unambiguous
          }
          // Multiple different sources (e.g. t1.col + t2.col) → mark as various
          return { ...col, tableAlias: '__various__' };
        }
      }

      // Fall back to primary FROM alias for unqualified columns
      return fromAlias ? { ...col, tableAlias: fromAlias } : col;
    });
  }

  // ── Build DAG ─────────────────────────────────────────────────────────────────
  const nodes = new Map();
  const edges = [];
  let i = 0;

  i = skipWS(sql, i);
  const cteNames = new Set();

  // Create CTE-like nodes for inline subqueries found in refs; recurses for nested subqueries
  function processSubqueries(refs) {
    refs.forEach(ref => {
      if (!ref.isSubquery || nodes.has(ref.name)) return;
      const subRefs = extractInputs(ref.subqueryBody);
      processSubqueries(subRefs);
      const subInputRefs = subRefs.filter(r => r.name !== '__union__');
      const hasJoin = subInputRefs.some(r => r.joinType === 'join');
      const hasUnion = subRefs.some(r => r.joinType === 'union');
      nodes.set(ref.name, {
        id: ref.name, type: 'cte', name: ref.name, body: ref.subqueryBody,
        sqlStart: 0, sqlEnd: 0,
        columns: attributeFromCols(extractColumns(ref.subqueryBody), subInputRefs),
        inputs: subInputRefs.map(r => r.name),
        joinType: hasUnion ? 'union' : hasJoin ? 'join' : 'direct',
        joinKeyColumns: new Set(subInputRefs.flatMap(r => r.joinKeys || [])),
        inputAliases: new Map(subInputRefs.filter(r => r.alias).map(r => [r.name, r.alias])),
        filters: extractWhere(ref.subqueryBody),
        aliases: new Set(), previewRan: false,
      });
      cteNames.add(ref.name);
    });
  }

  // CTE pass — WITH name [AS] (body) [, ...]
  if (sql.slice(i, i+4).toUpperCase() === 'WITH' && /\s/.test(sql[i+4]||' ')) {
    let j = skipWS(sql, i+4);
    // Optional RECURSIVE keyword
    if (/^RECURSIVE\b/i.test(sql.slice(j, j+10))) j = skipWS(sql, j+9);
    while (j < sql.length) {
      j = skipWS(sql, j);
      const nameTok = nextTok(sql, j);
      if (!nameTok.token || nameTok.token.toUpperCase() === 'SELECT') break;
      j = skipWS(sql, nameTok.end);
      if (sql.slice(j, j+2).toUpperCase() !== 'AS') break;
      j = skipWS(sql, j+2);
      if (sql[j] !== '(') break;
      const closePos = matchParen(sql, j);
      const body = sql.slice(j+1, closePos);
      const id = nameTok.token.replace(/^`|`$/g,'');
      cteNames.add(id);
      const refs = extractInputs(body);
      processSubqueries(refs);
      // Filter self-references (recursive CTEs)
      const inputRefs = refs.filter(r => r.name !== '__union__' && r.name !== id);
      const hasUnion = refs.some(r => r.joinType === 'union');
      const hasJoin  = inputRefs.some(r => r.joinType === 'join');
      nodes.set(id, {
        id, type: 'cte', name: id, body,
        sqlStart: nameTok.start, sqlEnd: closePos+1,
        columns: attributeFromCols(extractColumns(body), inputRefs),
        inputs: inputRefs.map(r => r.name),
        joinType: hasUnion ? 'union' : hasJoin ? 'join' : 'direct',
        joinKeyColumns: new Set(inputRefs.flatMap(r => r.joinKeys || [])),
        inputAliases: new Map(inputRefs.filter(r => r.alias).map(r => [r.name, r.alias])),
        filters: extractWhere(body),
        aliases: new Set(), previewRan: false,
      });
      j = skipWS(sql, closePos+1);
      if (sql[j] === ',') { j = skipWS(sql, j+1); continue; }
      break;
    }
    i = j;
  }

  // Main SELECT
  i = skipWS(sql, i);
  let mainStart = i, mainEnd = sql.length;
  if (/^SELECT\b/i.test(sql.slice(i, i+7))) {
    let k = i, depth = 0;
    while (k < sql.length) {
      if (sql[k]==="'"||sql[k]==='"'||sql[k]==='`') { k=skipStr(sql,k); continue; }
      if ((sql[k]==='-'&&sql[k+1]==='-')||(sql[k]==='/'&&sql[k+1]==='*')) { k=skipCmt(sql,k); continue; }
      if (sql[k]==='(') { depth++; k++; continue; }
      if (sql[k]===')') { depth--; k++; continue; }
      if (sql[k]===';' && depth===0) { mainEnd=k; break; }
      k++;
    }
    const mainBody = sql.slice(mainStart, mainEnd);
    const refs = extractInputs(mainBody);
    processSubqueries(refs);
    const inputRefs = refs.filter(r => r.name !== '__union__');
    nodes.set('__main__', {
      id: '__main__', type: 'main', name: 'main SELECT', body: mainBody,
      sqlStart: mainStart, sqlEnd: mainEnd,
      columns: attributeFromCols(extractColumns(mainBody), inputRefs),
      inputs: inputRefs.map(r => r.name),
      joinType: inputRefs.some(r=>r.joinType==='join') ? 'join'
              : refs.some(r=>r.joinType==='union') ? 'union' : null,
      joinKeyColumns: new Set(inputRefs.flatMap(r => r.joinKeys || [])),
      inputAliases: new Map(inputRefs.filter(r => r.alias).map(r => [r.name, r.alias])),
      filters: extractWhere(mainBody),
      aliases: new Set(), previewRan: false,
    });
  }

  // Source nodes: any table ref that isn't a CTE
  const seen = new Set();
  nodes.forEach(n => {
    n.inputs.forEach(name => {
      if (!cteNames.has(name) && !seen.has(name) && name) {
        seen.add(name);
        const parts = name.split('.');
        const tablePath = parts.length === 3 ? { project: parts[0], dataset: parts[1], table: parts[2] }
                        : parts.length === 2 ? { project: '', dataset: parts[0], table: parts[1] }
                        : null;
        nodes.set(name, {
          id: name, type: 'source', name, body: '',
          sqlStart: 0, sqlEnd: 0, columns: [], inputs: [], joinType: null,
          joinKeyColumns: new Set(), tablePath,
          inputAliases: new Map(), aliases: new Set(),
        });
      }
    });
  });

  // Resolve SELECT * columns from input nodes (works for CTE→CTE; sources resolved async later)
  nodes.forEach(node => {
    if (node.columns.length !== 1 || node.columns[0].name !== '*') return;
    const except = node.columns[0].exceptCols || new Set();
    const inputCols = [];
    (node.inputs || []).forEach(inputId => {
      const inp = nodes.get(inputId);
      if (inp && inp.columns.length > 0 && inp.columns[0].name !== '*') {
        inputCols.push(...inp.columns);
      }
    });
    if (inputCols.length > 0) {
      node.columns = inputCols.filter(c => !except.has(c.name.toLowerCase()));
      node._starExcept = except; // keep for later propagation from async source fetch
    } else {
      node._starExcept = except; // unresolved; keep except list for async resolution
    }
  });

  // Populate aliases: each node learns what names other nodes call it by
  nodes.forEach(node => {
    node.inputAliases?.forEach((alias, inputName) => {
      if (alias && nodes.has(inputName)) nodes.get(inputName).aliases.add(alias);
    });
  });

  // Edges
  nodes.forEach(node => {
    (node.inputs || []).forEach(fromId => {
      if (nodes.has(fromId)) {
        const type = node.joinType === 'union' ? 'union'
                   : node.joinType === 'join'  ? 'join' : 'direct';
        edges.push({ from: fromId, to: node.id, type });
      }
    });
  });

  // Topological level assignment (iterative, capped to avoid cycles)
  const levelOf = new Map();
  nodes.forEach((n, id) => { if (n.type === 'source') levelOf.set(id, 0); });
  let changed = true, iters = 0;
  while (changed && iters++ < 100) {
    changed = false;
    nodes.forEach((n, id) => {
      if (n.type === 'source') return;
      const maxIn = n.inputs.reduce((m, inp) => Math.max(m, levelOf.get(inp) ?? -1), -1);
      const lv = maxIn + 1;
      if (levelOf.get(id) !== lv) { levelOf.set(id, lv); changed = true; }
    });
  }
  nodes.forEach((n, id) => { if (!levelOf.has(id)) levelOf.set(id, 0); });

  const maxLevel = Math.max(0, ...levelOf.values());
  const levels = Array.from({ length: maxLevel + 1 }, () => []);
  levelOf.forEach((l, id) => levels[l].push(id));

  return { nodes, levels, edges };
}

// ── DAG tooltip (single floating element reused across all cards) ─────────────
let _dagTooltipEl = null;
function getDagTooltip() {
  if (!_dagTooltipEl) {
    _dagTooltipEl = document.createElement('div');
    _dagTooltipEl.className = 'dag-tooltip';
    document.body.appendChild(_dagTooltipEl);
  }
  return _dagTooltipEl;
}
function positionDagTooltip(tt, e) {
  const margin = 14;
  tt.style.left = '0'; tt.style.top = '0'; // reset to measure
  const w = tt.offsetWidth, h = tt.offsetHeight;
  let x = e.clientX + margin, y = e.clientY + margin;
  if (x + w > window.innerWidth  - 8) x = e.clientX - w - margin;
  if (y + h > window.innerHeight - 8) y = e.clientY - h - margin;
  tt.style.left = Math.max(4, x) + 'px';
  tt.style.top  = Math.max(4, y) + 'px';
}

// ── DAG run menu (sample vs full output) ─────────────────────────────────────
let _dagRunMenuEl = null;

function _getDagRunMenu() {
  if (_dagRunMenuEl) return _dagRunMenuEl;
  _dagRunMenuEl = document.createElement('div');
  _dagRunMenuEl.id = 'dag-run-menu';
  _dagRunMenuEl.innerHTML =
    `<button data-limit="100"><svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg> Sample <span style="color:var(--text2);font-size:11px">(100 rows)</span></button>` +
    `<button data-limit="full"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="8,17 12,21 16,17"/><line x1="12" y1="3" x2="12" y2="21"/></svg> Full output</button>`;
  document.body.appendChild(_dagRunMenuEl);
  return _dagRunMenuEl;
}

// Single document-level click listener to close the menu (registered once at startup)
document.addEventListener('click', e => {
  if (_dagRunMenuEl && _dagRunMenuEl.style.display !== 'none' && !_dagRunMenuEl.contains(e.target)) {
    _dagRunMenuEl.style.display = 'none';
  }
});

function _showDagRunMenu(triggerBtn, node) {
  const menu = _getDagRunMenu();

  // Toggle: hide if already visible from this same button click
  if (menu.style.display !== 'none') { menu.style.display = 'none'; return; }

  // Position off-screen first so we can measure, then snap to correct location
  menu.style.left = '-9999px';
  menu.style.top  = '0';
  menu.style.display = 'block';

  const rect = triggerBtn.getBoundingClientRect();
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let x = rect.right + 6, y = rect.top;
  if (x + mw > window.innerWidth  - 8) x = rect.left - mw - 4;
  if (y + mh > window.innerHeight - 8) y = window.innerHeight - mh - 8;
  menu.style.left = Math.max(4, x) + 'px';
  menu.style.top  = Math.max(4, y) + 'px';

  menu.querySelectorAll('button[data-limit]').forEach(opt => {
    opt.onclick = e => {
      e.stopPropagation();
      menu.style.display = 'none';
      runNodeQuery(node, opt.dataset.limit === 'full' ? null : 100);
    };
  });
}

// ── DAG renderer ─────────────────────────────────────────────────────────────
function makeDagCard(node) {
  const card = document.createElement('div');
  card.className = `dag-card type-${node.type}`;
  card.id = `dag-card-${CSS.escape(node.id)}`;

  const header = document.createElement('div');
  header.className = 'dag-card-header';
  header.title = 'Click to expand / collapse';

  const iconKey = node.type === 'source' ? 'dag_source' : 'dag_table';
  const iconWrap = document.createElement('span');
  iconWrap.className = 'dag-card-icon';
  iconWrap.style.color = node.type === 'source' ? '#ce9178' : node.type === 'cte' ? '#c586c0' : '#569cd6';
  iconWrap.innerHTML = ICONS[iconKey];
  header.appendChild(iconWrap);

  const nameEl = document.createElement('span');
  nameEl.className = 'dag-card-name';
  nameEl.style.color = node.type === 'source' ? '#ce9178' : node.type === 'cte' ? '#c586c0' : '#569cd6';
  const shortName = node.type === 'source' && node.tablePath
    ? (node.tablePath.dataset ? `${node.tablePath.dataset}.${node.tablePath.table}` : node.tablePath.table)
    : node.name;
  nameEl.textContent = shortName;
  if (node.type === 'source') nameEl.title = node.name;
  header.appendChild(nameEl);

  // JOIN/UNION badge
  if (node.inputs?.length > 1) {
    const badge = document.createElement('span');
    badge.className = `dag-inputs-badge type-${node.joinType === 'union' ? 'union' : 'join'}`;
    badge.textContent = node.joinType === 'union' ? 'UNION' : 'JOIN';
    header.appendChild(badge);
  }

  // Run button
  if (node.body || node.type === 'source') {
    const runBtn = document.createElement('button');
    runBtn.className = 'dag-btn run-btn';
    runBtn.title = 'Preview this table';
    runBtn.innerHTML = ICONS['dag_run'];
    runBtn.addEventListener('click', e => { e.stopPropagation(); _showDagRunMenu(runBtn, node); });
    header.appendChild(runBtn);
  }

  card.appendChild(header);

  // ── Details section (visible when card is open) ──────────────────────────
  const details = document.createElement('div');
  details.className = 'dag-card-details';

  // Save fresh SQL-parsed columns before cache may overwrite them.
  // runNodeQuery uses _parsedColumns to build parsedMap so alias attribution
  // always reflects the CURRENT SQL text, not stale cache.
  node._parsedColumns = node.columns ? [...node.columns] : [];

  // Restore preview data from cache so state survives tree re-renders
  const _cached = _schemaCache.get(node.id);
  if (_cached && node.type !== 'source') {
    node.previewRan = true;
    node.columns = _cached;
  }

  // 1. Column list
  const colList = document.createElement('div');
  colList.className = 'dag-card-cols';
  renderColsIntoList(colList, node);
  details.appendChild(colList);

  // 2. Sources list (for CTE/main nodes with inputs)
  if (node.inputs?.length > 0) {
    const srcSection = document.createElement('div');
    srcSection.className = 'dag-card-sources';
    const srcHd = document.createElement('div');
    srcHd.className = 'dag-card-section-hd';
    srcHd.textContent = 'Sources';
    srcSection.appendChild(srcHd);
    node.inputs.forEach(inp => {
      const alias = node.inputAliases?.get(inp);
      const parts = inp.split('.');
      const display = parts.length >= 3 ? `${parts[1]}.${parts[2]}`
                    : parts.length === 2 ? inp : inp;
      const row = document.createElement('div');
      row.className = 'dag-card-source-row';
      const srcIcon = document.createElement('span');
      srcIcon.style.cssText = 'width:10px;height:10px;flex-shrink:0;display:inline-flex;color:var(--text2)';
      srcIcon.innerHTML = ICONS['dag_source'];
      row.appendChild(srcIcon);
      const lbl = document.createElement('span');
      lbl.textContent = display;
      row.appendChild(lbl);
      if (alias) {
        const aliasSpan = document.createElement('span');
        aliasSpan.className = 'dag-card-source-alias';
        aliasSpan.textContent = `as ${alias}`;
        row.appendChild(aliasSpan);
      }
      srcSection.appendChild(row);
    });
    // Project for source nodes in the details
    if (node.type === 'source' && node.tablePath?.project) {
      const projRow = document.createElement('div');
      projRow.className = 'dag-card-source-row';
      projRow.style.cssText = 'opacity:0.6;font-size:10px';
      projRow.textContent = node.tablePath.project;
      srcSection.appendChild(projRow);
    }
    details.appendChild(srcSection);
  }

  // 3. Filters section (WHERE clause)
  if (node.filters?.length > 0) {
    const fltSection = document.createElement('div');
    fltSection.className = 'dag-card-filters';
    const fltHd = document.createElement('div');
    fltHd.className = 'dag-card-section-hd';
    fltHd.textContent = 'Filters';
    fltSection.appendChild(fltHd);
    node.filters.forEach(cond => {
      const row = document.createElement('div');
      row.className = 'dag-filter-row';
      row.textContent = cond;
      fltSection.appendChild(row);
    });
    details.appendChild(fltSection);
  }

  card.appendChild(details);

  // ── Toggle expand/collapse on header click ───────────────────────────────
  header.addEventListener('click', () => {
    card.classList.toggle('open');
    const wrap = card.closest('.dag-wrap');
    if (wrap) requestAnimationFrame(() => drawDAGEdges(_currentDag, wrap));
  });

  // ── SQL hover tooltip ────────────────────────────────────────────────────
  const tooltipBody = node.body?.trim() || (node.type === 'source' ? node.name : '');
  if (tooltipBody) {
    const tt = getDagTooltip();
    card.addEventListener('mouseenter', e => {
      tt.textContent = tooltipBody.length > 600 ? tooltipBody.slice(0, 600) + '\n…' : tooltipBody;
      tt.style.display = 'block';
      positionDagTooltip(tt, e);
    });
    card.addEventListener('mousemove', e => positionDagTooltip(tt, e));
    card.addEventListener('mouseleave', () => { tt.style.display = 'none'; });
  }

  // Auto-fetch schema for source nodes
  if (node.type === 'source') loadSourceSchema(node, card);

  return card;
}

function buildColRow(colObj, joinKeyColumns) {
  const isJoinKey = joinKeyColumns?.has(colObj.name);
  const row = document.createElement('div');
  row.className = `dag-col-row dag-col-${colObj.type}${colObj.grouped ? ' dag-col-grouped' : ''}`;
  const ci = document.createElement('span');
  ci.className = 'dag-col-icon';
  ci.innerHTML = ICONS[isJoinKey ? 'dag_join_key' : 'dag_col'];
  row.appendChild(ci);
  row.appendChild(document.createTextNode(colObj.name));
  if (colObj.rawType) {
    const tb = document.createElement('span');
    tb.className = 'dag-col-type';
    tb.textContent = `{${colObj.rawType}}`;
    row.appendChild(tb);
  }
  row.title = colObj.description ? colObj.name + '\n' + colObj.description : colObj.name;
  return row;
}

// Render columns (grouped by tableAlias when available) into a colList element
function renderColsIntoList(colList, node) {
  colList.innerHTML = '';
  const cols = node.columns || [];
  if (!cols.length) {
    const empty = document.createElement('div');
    empty.className = 'dag-col-row';
    empty.style.cssText = 'color:var(--text2);font-style:italic;padding:3px 10px';
    empty.textContent = 'Loading…';
    colList.appendChild(empty);
    return;
  }

  // Build alias → input name reverse map
  const aliasToInput = new Map([...(node.inputAliases || new Map()).entries()].map(([k,v]) => [v,k]));

  // Group by tableAlias
  const groups = new Map(); // alias → colObj[]
  const noGroup = [];
  cols.forEach(col => {
    const colObj = typeof col === 'object' ? col : { name: col, type: 'unknown', grouped: false };
    if (colObj.tableAlias) {
      if (!groups.has(colObj.tableAlias)) groups.set(colObj.tableAlias, []);
      groups.get(colObj.tableAlias).push(colObj);
    } else {
      noGroup.push(colObj);
    }
  });

  const makeGroup = (aliasKey, groupCols) => {
    const grp = document.createElement('div');
    grp.className = 'dag-col-group';
    if (aliasKey) {
      const hdr = document.createElement('div');
      if (aliasKey === '__various__') {
        hdr.className = 'dag-col-group-header dag-col-group-various';
        hdr.textContent = 'various sources';
        hdr.title = 'Derived from multiple source tables';
      } else {
        hdr.className = 'dag-col-group-header';
        const inputName = aliasToInput.get(aliasKey) || aliasKey;
        const parts = inputName.split('.');
        hdr.textContent = parts.length >= 2 ? parts.slice(-2).join('.') : inputName;
        hdr.title = aliasKey !== inputName ? `alias: ${aliasKey} → ${inputName}` : aliasKey;
      }
      grp.appendChild(hdr);
    }
    groupCols.forEach(col => grp.appendChild(buildColRow(col, node.joinKeyColumns)));
    return grp;
  };

  if (node.previewRan) {
    // After preview: always grouped; unattributed columns go into an unlabelled group first
    if (noGroup.length) colList.appendChild(makeGroup(null, noGroup));
    groups.forEach((groupCols, alias) => colList.appendChild(makeGroup(alias, groupCols)));
  } else {
    // Before preview: flat list, no headers
    const grp = document.createElement('div');
    grp.className = 'dag-col-group';
    const allCols = [...noGroup, ...[...groups.values()].flat()];
    allCols.forEach(col => grp.appendChild(buildColRow(col, node.joinKeyColumns)));
    colList.appendChild(grp);
  }
}

function applySchemaToCard(cardEl, node, typedCols) {
  node.columns = typedCols;
  const colList = cardEl.querySelector('.dag-card-cols');
  if (!colList) return;
  renderColsIntoList(colList, node);
  if (cardEl.classList.contains('open')) {
    const wrap = cardEl.closest('.dag-wrap');
    if (wrap) requestAnimationFrame(() => drawDAGEdges(_currentDag, wrap));
  }
}

function loadSourceSchema(node, cardEl) {
  if (!node.tablePath) return;
  const { project, dataset, table } = node.tablePath;
  if (!dataset || !table) return;
  const key = node.id;
  if (_schemaCache.has(key)) { applySchemaToCard(cardEl, node, _schemaCache.get(key)); return; }
  const url = project
    ? `/api/tables/${enc(project)}/${enc(dataset)}/${enc(table)}/schema`
    : `/api/tables/_/${enc(dataset)}/${enc(table)}/schema`;
  fetch(url).then(r => r.ok ? r.json() : null).then(resp => {
    const cols = Array.isArray(resp) ? resp : (resp?.columns || []);
    if (!cols.length) return;
    // Types are shown only after running a preview — store names now, types as unknown
    const typed = cols.map(c => ({ name: c.name, type: 'unknown', grouped: false, tableAlias: null, description: c.description || '' }));
    _schemaCache.set(key, typed);
    _fqnSchemaCache.set([project, dataset, table].filter(Boolean).join('.').toLowerCase(), cols.map(c => ({ name: c.name, type: c.type || '' })));
    applySchemaToCard(cardEl, node, typed);
    // Propagate to downstream SELECT * nodes that were unresolved at parse time
    if (_currentDag) {
      const dagWrap = document.querySelector('#query-tree-panel .dag-wrap');
      _currentDag.nodes.forEach(n => {
        if (!n.inputs.includes(node.id)) return;
        if (n.columns.length === 1 && n.columns[0]?.name === '*') {
          const except = n.columns[0].exceptCols || n._starExcept || new Set();
          // Tag each column with the source's alias in this downstream node
          const srcAlias = n.inputAliases?.get(node.id) || node.id.split('.').pop();
          const resolved = typed
            .filter(c => !except.has(c.name.toLowerCase()))
            .map(c => ({ ...c, tableAlias: srcAlias }));
          n.columns = resolved;
          if (dagWrap) {
            const nCard = dagWrap.querySelector(`#dag-card-${CSS.escape(n.id)}`);
            if (nCard) applySchemaToCard(nCard, n, resolved);
          }
        }
      });
    }
  }).catch(() => {});
}

function renderDAG(dag, container) {
  _currentDag = dag;
  container.innerHTML = '';
  if (!dag || !dag.levels?.length || dag.levels.every(l => !l.length)) {
    container.innerHTML = '<div class="dag-empty">Write a SQL query to see its structure</div>';
    return;
  }
  const wrap = document.createElement('div');
  wrap.className = 'dag-wrap';
  container.appendChild(wrap);

  dag.levels.forEach((levelIds, li) => {
    const levelRow = document.createElement('div');
    levelRow.className = 'dag-level';
    levelIds.forEach(id => levelRow.appendChild(makeDagCard(dag.nodes.get(id))));
    wrap.appendChild(levelRow);
    if (li < dag.levels.length - 1) {
      const gap = document.createElement('div');
      gap.className = 'dag-level-gap';
      wrap.appendChild(gap);
    }
  });

  const overlaySvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  overlaySvg.classList.add('dag-svg-overlay');
  wrap.appendChild(overlaySvg);

  requestAnimationFrame(() => requestAnimationFrame(() => drawDAGEdges(dag, wrap)));

  const legend = document.createElement('div');
  legend.className = 'dag-legend';
  legend.innerHTML =
    `<span class="dag-legend-item"><span class="dag-legend-dot" style="background:#c586c0"></span>String</span>` +
    `<span class="dag-legend-item"><span class="dag-legend-dot" style="background:#4ec9b0"></span>Numeric</span>` +
    `<span class="dag-legend-item"><span class="dag-legend-dot" style="background:#f44747"></span>Date/Time</span>` +
    `<span class="dag-legend-item"><span class="dag-legend-dot" style="background:#ce9178"></span>Bool</span>` +
    `<span class="dag-legend-item"><span class="dag-legend-bold">B</span>Group By</span>` +
    `<span class="dag-legend-item"><span class="dag-legend-icon">${ICONS['dag_join_key']}</span>Join Key</span>`;
  container.insertBefore(legend, container.firstChild);
}

function drawDAGEdges(dag, wrap) {
  const svg = wrap.querySelector('.dag-svg-overlay');
  if (!svg) return;
  svg.innerHTML = '';
  const wrapRect = wrap.getBoundingClientRect();
  if (!wrapRect.width) return;

  dag.edges.forEach(edge => {
    const fromCard = wrap.querySelector(`#dag-card-${CSS.escape(edge.from)}`);
    const toCard   = wrap.querySelector(`#dag-card-${CSS.escape(edge.to)}`);
    if (!fromCard || !toCard) return;
    const fr = fromCard.getBoundingClientRect();
    const tr = toCard.getBoundingClientRect();
    const fx = fr.left + fr.width  / 2 - wrapRect.left;
    const fy = fr.bottom - wrapRect.top;
    const tx = tr.left + tr.width  / 2 - wrapRect.left;
    const ty = tr.top   - wrapRect.top;
    const midY = (fy + ty) / 2;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M${fx},${fy} C${fx},${midY} ${tx},${midY} ${tx},${ty}`);
    path.classList.add('dag-edge', `dag-edge-${edge.type}`);
    svg.appendChild(path);
  });
}

// Collect all CTE deps of nodeId in topological order (including nodeId if CTE)
function collectCteDeps(nodeId, dag) {
  const visited = new Set();
  const ordered = [];
  function visit(id) {
    if (visited.has(id)) return;
    visited.add(id);
    const n = dag.nodes.get(id);
    if (!n || n.type === 'source') return;
    (n.inputs || []).forEach(inp => visit(inp));
    if (n.type === 'cte') ordered.push(n);
  }
  visit(nodeId);
  return ordered;
}

// Build the SQL to run for a given node using the full query context
// After preview we know real column names. Cross-reference each column against input
// node schemas (from _schemaCache) to attribute every column to the right source table.
function inferColSources(typedCols, node) {
  if (!node.inputs?.length) return typedCols;

  // inputId → the alias string used as grouping key (SQL alias, or short table name)
  const inputAlias = new Map();
  node.inputs.forEach(id => {
    const sqlAlias = node.inputAliases?.get(id);
    inputAlias.set(id, sqlAlias || id.split('.').pop());
  });

  // colNameLower → first inputId that has that column (FROM-table wins over JOINs via inputs order)
  const colToInputId = new Map();
  node.inputs.forEach(id => {
    (_schemaCache.get(id) || []).forEach(c => {
      const k = c.name.toLowerCase();
      if (!colToInputId.has(k)) colToInputId.set(k, id);
    });
  });

  // Fallback when schemas not loaded yet: single-input node → attribute to it
  const singleInput = node.inputs.length === 1 ? node.inputs[0] : null;

  return typedCols.map(col => {
    if (col.tableAlias) return col; // already attributed from SQL parsing (alias.col or alias.col AS name)
    const inputId = colToInputId.get(col.name.toLowerCase());
    if (inputId) return { ...col, tableAlias: inputAlias.get(inputId) };
    if (singleInput) return { ...col, tableAlias: inputAlias.get(singleInput) };
    return col;
  });
}

function buildSQLForNode(node, dag, limit = 100) {
  const lc = limit != null ? `\nLIMIT ${limit}` : '';
  if (node.type === 'source') {
    const ref = node.name.includes('.') ? '`' + node.name + '`' : node.name;
    return `SELECT *\nFROM ${ref}${lc}`;
  }
  if (node.type === 'main') {
    return node.body;
  }
  // CTE: reconstruct WITH clause with transitive deps + SELECT * FROM this CTE
  const deps = collectCteDeps(node.id, dag);
  if (!deps.length) return `SELECT *\nFROM (\n${node.body}\n) t${lc}`;
  const cteParts = deps.map(n => `  ${n.name} AS (\n${n.body}\n)`);
  return `WITH\n${cteParts.join(',\n')}\nSELECT *\nFROM ${node.name}${lc}`;
}

function runNodeQuery(node, limit = 100) {
  const sql = buildSQLForNode(node, _currentDag, limit);

  const shortName = node.type === 'source' && node.tablePath
    ? (node.tablePath.dataset ? `${node.tablePath.dataset}.${node.tablePath.table}` : node.tablePath.table)
    : node.name;
  const safeId = `${_activeWsId}_${node.id.replace(/[^a-zA-Z0-9_-]/g, '_')}`;
  const tabBtnId = `dyn-tab-${safeId}`;
  const panelId  = `dyn-panel-${safeId}`;

  // Create or reuse tab + panel
  let tabBtn = document.getElementById(tabBtnId);
  let panel  = document.getElementById(panelId);

  if (!tabBtn) {
    tabBtn = document.createElement('button');
    tabBtn.className = 'main-tab preview-dyn-tab';
    tabBtn.id = tabBtnId;
    tabBtn.dataset.tab = tabBtnId;
    tabBtn.dataset.panelId = panelId;

    const nameSpan = document.createElement('span');
    nameSpan.textContent = shortName;
    tabBtn.appendChild(nameSpan);

    const closeBtn = document.createElement('button');
    closeBtn.className = 'main-tab-close';
    closeBtn.title = 'Close';
    closeBtn.textContent = '×';
    closeBtn.addEventListener('click', e => {
      e.stopPropagation();
      activateMainTab(document.querySelector('.main-tab[data-tab="sql"]'));
      tabBtn.remove();
      panel.remove();
    });
    tabBtn.appendChild(closeBtn);
    tabBtn.dataset.wsId = _activeWsId;
    document.getElementById('main-tabs').appendChild(tabBtn);

    panel = document.createElement('div');
    panel.className = 'preview-tab-panel';
    panel.id = panelId;
    panel.innerHTML = `<div class="preview-dyn-header"></div><div class="preview-dyn-error" style="display:none"></div><div class="preview-dyn-results"></div>`;
    document.getElementById('resizer-h').before(panel);
  }

  activateMainTab(tabBtn);

  const header    = panel.querySelector('.preview-dyn-header');
  const errorEl   = panel.querySelector('.preview-dyn-error');
  const resultsEl = panel.querySelector('.preview-dyn-results');

  header.textContent = `Previewing: ${shortName}${limit == null ? ' — full output' : ' — sample'}…`;
  resultsEl.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text2);font-style:italic">Running query…</div>';
  errorEl.style.display = 'none';

  fetch('/api/query', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sql, project: '' }),
  })
  .then(r => r.json().then(d => ({ ok: r.ok, data: d })))
  .then(({ ok, data }) => {
    if (!ok) throw new Error(data.detail || 'Query failed');
    header.textContent = `${shortName} — ${data.rows.length} row${data.rows.length !== 1 ? 's' : ''}`;
    // Update DAG card with real types from query schema
    if (data.schema?.length) {
      // Preserve tableAlias from pre-parsed columns (matched by name)
      // Use fresh SQL-parsed columns (not cache) so tableAlias reflects current SQL aliases
      const parsedMap = new Map((node._parsedColumns || node.columns || []).map(c => [c.name.toLowerCase(), c]));
      const rawTyped = data.schema.map(c => ({
        name: c.name,
        type: bqTypeToInferredType(c.type),
        rawType: c.type,
        grouped: node.joinKeyColumns?.has(c.name) || false,
        tableAlias: parsedMap.get(c.name.toLowerCase())?.tableAlias || null,
      }));
      // Cross-reference against input schemas to attribute unqualified columns
      const typedCols = inferColSources(rawTyped, node);
      node.previewRan = true;
      node.columns = typedCols;
      _schemaCache.set(node.id, typedCols);
      const dagWrap = document.querySelector('#query-tree-panel .dag-wrap');
      if (dagWrap) {
        const cardEl = dagWrap.querySelector(`#dag-card-${CSS.escape(node.id)}`);
        if (cardEl) applySchemaToCard(cardEl, node, typedCols);
      }
    }
    resultsEl.innerHTML = '';
    const tbl = document.createElement('table');
    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    data.columns.forEach(col => { const th = document.createElement('th'); th.textContent = col; hr.appendChild(th); });
    thead.appendChild(hr);
    tbl.appendChild(thead);
    const tbody = document.createElement('tbody');
    data.rows.forEach(row => {
      const tr = document.createElement('tr');
      row.forEach(cell => {
        const td = document.createElement('td');
        if (cell === null || cell === undefined) { td.textContent = 'NULL'; td.className = 'null-val'; }
        else td.textContent = String(cell);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    resultsEl.appendChild(tbl);
  })
  .catch(e => {
    header.textContent = `${shortName} — failed`;
    errorEl.textContent = e.message;
    errorEl.style.display = 'block';
    resultsEl.innerHTML = '';
  });
}

// ── Query tree search ─────────────────────────────────────────────────────────
function _qtApplySearch(term) {
  const panel = document.getElementById('query-tree-panel');
  if (!panel) return;
  const t = (term || '').toLowerCase().trim();

  // Clear all previous hit/hidden marks
  panel.querySelectorAll('.qt-node, .qt-header').forEach(el => {
    el.classList.remove('qt-search-hit', 'qt-search-hidden');
  });
  panel.querySelectorAll('.qt-block').forEach(blk => blk.classList.remove('collapsed'));

  // Clear Monaco highlights and result-table column highlights
  if (!t) {
    if (window._monacoEditor) {
      window._qtSearchDecorations = window._monacoEditor.deltaDecorations(
        window._qtSearchDecorations || [], []);
    }
    document.querySelectorAll('#results-scroll thead th.col-search-hit').forEach(th => {
      th.classList.remove('col-search-hit');
    });
    return;
  }

  // Highlight matching nodes in the tree
  panel.querySelectorAll('.qt-node').forEach(el => {
    const text = (el.dataset.qtText || el.textContent).toLowerCase();
    if (text.includes(t)) el.classList.add('qt-search-hit');
    else el.classList.add('qt-search-hidden');
  });
  panel.querySelectorAll('.qt-header').forEach(el => {
    const text = (el.dataset.qtText || el.textContent).toLowerCase();
    if (text.includes(t)) el.classList.add('qt-search-hit');
  });

  // Highlight all occurrences in Monaco editor
  if (window._monacoEditor && window._monacoInstance) {
    const model = window._monacoEditor.getModel();
    const fullText = model.getValue();
    const decorations = [];
    const re = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    let m;
    while ((m = re.exec(fullText)) !== null) {
      const posS = model.getPositionAt(m.index);
      const posE = model.getPositionAt(m.index + m[0].length);
      decorations.push({
        range: new window._monacoInstance.Range(posS.lineNumber, posS.column, posE.lineNumber, posE.column),
        options: { className: 'qt-search-editor-hit', inlineClassName: 'qt-search-editor-hit-inline' }
      });
    }
    window._qtSearchDecorations = window._monacoEditor.deltaDecorations(
      window._qtSearchDecorations || [], decorations);
  }

  // Highlight matching column headers in the result table and scroll to first match
  const resultsScroll = document.getElementById('results-scroll');
  const resultTable = resultsScroll?.querySelector('table');
  if (resultTable) {
    let firstHit = null;
    resultTable.querySelectorAll('thead th').forEach(th => {
      // Compare against the column name text (first text node, ignoring the type badge)
      const colName = (th.childNodes[0]?.nodeType === Node.TEXT_NODE
        ? th.childNodes[0].textContent
        : th.textContent).toLowerCase().trim();
      const hit = colName.includes(t);
      th.classList.toggle('col-search-hit', hit);
      if (hit && !firstHit) firstHit = th;
    });
    if (firstHit) {
      firstHit.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
  }
}

let _queryTreeTimer = null;
function refreshQueryTree() {
  clearTimeout(_queryTreeTimer);
  _queryTreeTimer = setTimeout(() => {
    const panel = document.getElementById('query-tree-panel');
    if (!panel) return;
    const sql = EditorAPI.getValue();
    // Get or create the content area (preserve the panel header + search bar)
    let qtContent = panel.querySelector('.qt-content');
    if (!qtContent) {
      qtContent = document.createElement('div');
      qtContent.className = 'qt-content';
      qtContent.style.cssText = 'display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;';
      panel.appendChild(qtContent);
    }
    if (!sql?.trim()) {
      qtContent.innerHTML = '<div class="dag-empty" style="padding:8px">Write a SQL query to see its structure</div>';
      return;
    }
    try {
      buildQueryTree(parseSQL(sql), qtContent, sql);
      // Re-apply current search if any
      const searchInp = document.getElementById('qt-search-inp');
      if (searchInp && searchInp.value.trim()) _qtApplySearch(searchInp.value.trim());
    } catch(e) {
      qtContent.innerHTML = '<div class="info-node query-empty" style="padding:8px">Could not parse query</div>';
    }
  }, 400);
}

// ── API helper ────────────────────────────────────────────────────────────────
async function api(url) {
  const res = await fetch(url);
  const data = await res.json();
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}

function enc(s) { return encodeURIComponent(s); }

// ── Search helpers ────────────────────────────────────────────────────────────
function prependSearchBar(container) {
  if (container.querySelector('.search-bar-row')) return;
  const bar = document.createElement('div');
  bar.className = 'search-bar-row';
  bar.innerHTML = `<input class="search-input" placeholder="Filter…" autocomplete="off" spellcheck="false"/>`;
  container.insertBefore(bar, container.firstChild);
  const input = bar.querySelector('input');
  input.focus();
  input.addEventListener('input', () => filterChildren(container, input.value));
  input.addEventListener('keydown', e => { if (e.key === 'Escape') removeSearchBar(container); });
}

function removeSearchBar(container) {
  const bar = container.querySelector('.search-bar-row');
  if (bar) bar.remove();
  filterChildren(container, '');
}

function filterChildren(container, query) {
  const q = query.toLowerCase().trim();
  const children = Array.from(container.children);
  let i = 0;
  while (i < children.length) {
    const el = children[i];
    if (el.classList.contains('search-bar-row')) { i++; continue; }
    if (el.classList.contains('tree-node')) {
      const label = el.querySelector('.label')?.textContent?.toLowerCase() || '';
      const hidden = !!q && !label.includes(q);
      el.classList.toggle('search-hidden', hidden);
      const next = children[i + 1];
      if (next && !next.classList.contains('tree-node') && !next.classList.contains('search-bar-row')) {
        next.classList.toggle('search-hidden', hidden);
        i++;
      }
    }
    i++;
  }
}

// ── Tree builder ──────────────────────────────────────────────────────────────
function makeNode({ indent, icon, label, labelColor, badge, hasChildren, hasSearch, onExpand, onAdd, addLabel }) {
  const row = document.createElement('div');
  row.className = 'tree-node';
  row.style.paddingLeft = indent + 'px';

  // Chevron or spacer
  const chevronEl = document.createElement('span');
  chevronEl.className = 'chevron';
  chevronEl.innerHTML = hasChildren ? CHEVRON_SVG : '';
  if (!hasChildren) chevronEl.style.visibility = 'hidden';
  row.appendChild(chevronEl);

  // Icon
  const iconEl = document.createElement('span');
  iconEl.className = 'icon';
  iconEl.innerHTML = ICONS[icon] || '';
  row.appendChild(iconEl);

  // Label
  const labelEl = document.createElement('span');
  labelEl.className = 'label';
  labelEl.textContent = label;
  if (labelColor) labelEl.style.color = labelColor;
  row.appendChild(labelEl);

  if (badge) {
    const b = document.createElement('span');
    b.className = 'type-badge';
    b.textContent = badge;
    row.appendChild(b);
  }

  if (onAdd) {
    const btn = document.createElement('button');
    btn.className = 'add-btn';
    btn.textContent = '+ ' + (addLabel || 'add');
    btn.addEventListener('click', e => { e.stopPropagation(); onAdd(); });
    row.appendChild(btn);
  }

  // Children container
  const childrenEl = document.createElement('div');
  childrenEl.style.display = 'none';

  if (hasChildren) {
    let expanded = false;
    let loaded = false;
    let searchActive = false;
    row.addEventListener('click', async () => {
      expanded = !expanded;
      chevronEl.classList.toggle('open', expanded);
      childrenEl.style.display = expanded ? '' : 'none';
      if (expanded && !loaded) {
        loaded = true;
        childrenEl.innerHTML = '<div class="info-node">Loading…</div>';
        try {
          await onExpand(childrenEl);
          if (searchActive) prependSearchBar(childrenEl);
        } catch(e) {
          childrenEl.innerHTML = `<div class="error-node">${e.message}</div>`;
        }
      } else if (expanded && searchActive && !childrenEl.querySelector('.search-bar-row')) {
        prependSearchBar(childrenEl);
      }
    });

    if (hasSearch) {
      const searchBtn = document.createElement('button');
      searchBtn.className = 'search-btn';
      searchBtn.title = 'Filter';
      searchBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>`;
      searchBtn.addEventListener('click', e => {
        e.stopPropagation();
        searchActive = !searchActive;
        searchBtn.classList.toggle('active', searchActive);
        if (searchActive) {
          if (!expanded) row.click();
          else if (loaded) prependSearchBar(childrenEl);
        } else {
          removeSearchBar(childrenEl);
        }
      });
      row.appendChild(searchBtn);
    }
  }

  return { row, children: childrenEl };
}

// ── Smart column insertion ────────────────────────────────────────────────────
function smartInsertColumn(colName, tableFqn) {
  const sql      = window._monacoEditor ? window._monacoEditor.getModel().getValue() : EditorAPI.getValue();
  const normFqn  = tableFqn.replace(/`/g, '').toLowerCase();
  const aliasMap = parseAliasMap(sql);
  let alias = '';
  for (const [a, fqn] of aliasMap) { if (fqn === normFqn) { alias = a; break; } }

  const colRef = (alias ? alias + '.' : '') + colName;

  if (!window._monacoEditor || !window._monacoInstance || !alias) {
    EditorAPI.insertText(colRef + ',');
    return;
  }

  const editor    = window._monacoEditor;
  const monaco    = window._monacoInstance;
  const model     = editor.getModel();
  const lineCount = model.getLineCount();

  // Find the FROM/JOIN line that introduces this alias
  const aliasRe = new RegExp(`\\b(?:FROM|JOIN)\\s+\\S+\\s+(?:AS\\s+)?${alias}\\b`, 'i');
  let fromLine = -1;
  for (let ln = 1; ln <= lineCount; ln++) {
    if (aliasRe.test(model.getLineContent(ln))) { fromLine = ln; break; }
  }

  if (fromLine === -1) {
    const sel = editor.getSelection();
    editor.executeEdits('bq-slave', [{ range: sel, text: colRef + ',', forceMoveMarkers: true }]);
    editor.focus();
    return;
  }

  // Scan backwards from fromLine-1: find the last SELECT column line that starts with alias.
  const aliasDot = alias.toLowerCase() + '.';
  let insertAfterLine = -1;
  for (let ln = fromLine - 1; ln >= 1; ln--) {
    const lineText  = model.getLineContent(ln);
    const lineLower = lineText.toLowerCase().trimStart();
    if (lineLower.startsWith(aliasDot)) { insertAfterLine = ln; break; }
    if (/^\s*(FROM|WHERE|JOIN|GROUP\s+BY|ORDER\s+BY|HAVING|LIMIT|UNION)\b/i.test(lineText)) break;
    if (/^\s*SELECT\b/i.test(lineText)) { insertAfterLine = ln; break; } // no alias cols yet; insert after SELECT
  }

  // Final fallback: last non-empty line before FROM
  if (insertAfterLine === -1) {
    insertAfterLine = fromLine - 1;
    while (insertAfterLine > 1 && !model.getLineContent(insertAfterLine).trim()) insertAfterLine--;
  }

  const targetText   = model.getLineContent(insertAfterLine);
  const isSelectLine = /^\s*SELECT\b/i.test(targetText);
  const indent       = isSelectLine
    ? (targetText.match(/^(\s*)/)?.[1] || '') + '    '
    : (targetText.match(/^(\s+)/)?.[1] || '    ');
  const needsComma   = !isSelectLine && !targetText.trimEnd().endsWith(',');
  const insertText   = (needsComma ? ',' : '') + '\n' + indent + colRef + ',';

  editor.executeEdits('bq-slave', [{
    range: new monaco.Range(insertAfterLine, targetText.length + 1, insertAfterLine, targetText.length + 1),
    text:  insertText,
    forceMoveMarkers: true,
  }]);
  editor.focus();
}

// ── Table nodes ───────────────────────────────────────────────────────────────
function buildTableNodes(tables, parent, indent) {
  parent.innerHTML = '';
  if (!tables.length) { parent.innerHTML = '<div class="info-node">No tables</div>'; return; }
  tables.forEach(t => {
    const fqn = '`' + t.project + '.' + t.dataset + '.' + t.id + '`';
    const { row, children } = makeNode({
      indent, icon: 'table', label: t.id, labelColor: 'var(--table-label)', hasChildren: true, hasSearch: true,
      async onExpand(el) {
        const resp = await api(`/api/tables/${enc(t.project)}/${enc(t.dataset)}/${enc(t.id)}/schema`);
        const cols = Array.isArray(resp) ? resp : (resp?.columns || []);
        const tableDesc = resp?.tableDescription || '';
        row.title = tableDesc ? t.id + '\n' + tableDesc : t.id;
        if (tableDesc && !row.querySelector('.sidebar-inline-desc')) {
          const labelEl = row.querySelector('.label');
          labelEl.style.flex = '0 1 auto';
          const descSpan = document.createElement('span');
          descSpan.className = 'sidebar-inline-desc';
          descSpan.textContent = '{' + tableDesc + '}';
          descSpan.title = tableDesc;
          labelEl.insertAdjacentElement('afterend', descSpan);
        }
        buildColumnNodes(cols, el, indent + 16, fqn);
        _fqnSchemaCache.set(fqn.replace(/`/g, '').toLowerCase(), cols.map(c => ({ name: c.name, type: c.type || '' })));
      },
    });
    row.dataset.tableFqn = fqn;
    row.dataset.tableId  = t.id;
    const mainBtn = makeAddBtn('+ main', () => addTableMain(fqn, children));
    const cteBtn  = makeAddBtn('+ cte',  () => addTableCTE(fqn, t.id, children));
    const joinBtn = makeAddBtn('+ join', () => addTableJoin(fqn, t.id, children));
    joinBtn.classList.add('join-btn');
    const starBtn = document.createElement('button');
    starBtn.className = 'add-btn fav-star-btn';
    starBtn.dataset.fqn = fqn;
    const _isFav = () => _favorites.tables.some(ft => ft.fqn === fqn);
    const _updateStar = () => {
      const fav = _isFav();
      starBtn.textContent = fav ? '★' : '☆';
      starBtn.title = fav ? 'Remove from favorites' : 'Add to favorites';
      starBtn.classList.toggle('is-fav', fav);
      if (fav) starBtn.style.display = 'inline-block';
    };
    _updateStar();
    starBtn.addEventListener('click', e => {
      e.stopPropagation();
      if (_isFav()) {
        const existing = _favorites.tables.find(ft => ft.fqn === fqn);
        if (existing) removeFavoriteTable(existing.id);
      } else {
        addFavoriteTable(fqn, t.id);
      }
      _updateStar();
    });
    row.appendChild(cteBtn);
    row.appendChild(mainBtn);
    row.appendChild(joinBtn);
    row.appendChild(starBtn);
    parent.appendChild(row);
    parent.appendChild(children);
  });
}

// ── Dataset nodes ─────────────────────────────────────────────────────────────
function buildDatasetNodes(datasets, parent, indent) {
  parent.innerHTML = '';
  if (!datasets.length) { parent.innerHTML = '<div class="info-node">No datasets</div>'; return; }
  datasets.forEach(ds => {

  document.querySelectorAll('.cast-type-picker').forEach(p => p.remove());

  picker.className = 'cast-type-picker';
  CAST_TYPES.forEach(t => {
    const item = document.createElement('div');

    item.addEventListener('mousedown', e => {
      e.preventDefault();
      e.stopPropagation();
      EditorAPI.insertText('CAST(' + colName + ' AS ' + t + '),');
      picker.remove();
    });
    picker.appendChild(item);
  });
  document.body.appendChild(picker);
  const rect = anchorEl.getBoundingClientRect();
  const left = Math.min(rect.left, window.innerWidth - 140);
  const top  = rect.bottom + 3 + window.scrollY;
  picker.style.left = left + 'px';
  picker.style.top  = top  + 'px';
  setTimeout(() => document.addEventListener('click', () => picker.remove(), { once: true }), 0);
