// ── Session persistence ───────────────────────────────────────────────────────
let _saveTimer = null;
function _schedSave() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(_saveSession, 900);
}

function _buildSessionData() {
  _saveCurrentWorkspace();
  return {
    version: 1,
    activeWsId: _activeWsId,
    wsCounter: _wsCounter,
    sidebarSearch: document.getElementById('sidebar-search-input')?.value || '',
    workspaces: _workspaces.map(ws => {
      const c = { ...ws };
      delete c.abortCtrl;
      c.isRunning = false;
      c.addedTables = [...(ws.addedTables instanceof Set ? ws.addedTables : new Set(ws.addedTables || []))];
      delete c.schemaCache;
      delete c.currentDag;
      delete c.resultsHtml;  // regenerated on load from lastQueryData
      // Strip runtime-only _ properties from story blocks
      c.storyBlocks = (ws.storyBlocks || []).map(b => {
        const sb = {};
        for (const k of Object.keys(b)) { if (!k.startsWith('_')) sb[k] = b[k]; }
        return sb;
      });
      // Strip runtime-only _ properties from dashboard widgets (same logic)
      if (Array.isArray(c.widgets)) {
        c.widgets = c.widgets.map(w => {
          const sw = {};
          for (const k of Object.keys(w)) { if (!k.startsWith('_')) sw[k] = w[k]; }
          return sw;
        });
      }
      return c;
    }),
  };
}

async function _saveSession() {
  try {
    const data = _buildSessionData();
    await fetch('/api/session/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
  } catch(e) { /* silently ignore */ }
}

function _initDefaultSession() {
  const ws = _createWsState('Query 1');
  _workspaces.push(ws);
  _activeWsId = ws.id;
  _renderWsBar();
}

async function _loadSession() {
  try {
    const ctrl = new AbortController();
    const _t = setTimeout(() => ctrl.abort(), 30000);
    const res = await fetch('/api/session/load', { signal: ctrl.signal });
    clearTimeout(_t);
    if (!res.ok) { _initDefaultSession(); return; }
    const session = await res.json();
    if (!session?.workspaces?.length) { _initDefaultSession(); return; }

    _wsCounter = session.wsCounter || 0;
    _workspaces = session.workspaces.map(raw => ({
      ...raw,
      addedTables: new Set(raw.addedTables || []),
      schemaCache: new Map(),
      currentDag: null,
      abortCtrl: null,
      isRunning: false,
      resultsHtml: '',
      storyBlocks: raw.storyBlocks || [],
      lastQueryColumns: raw.lastQueryColumns || [],
      lastQuerySchema:  raw.lastQuerySchema  || [],
      activeTab: raw.activeTab || (raw.type === 'data' ? 'table' : 'sql'),
    }));

    const activeWs = _workspaces.find(w => w.id === session.activeWsId) || _workspaces[0];
    _activeWsId = activeWs.id;

    _renderWsBar();
    _loadWorkspace(activeWs);

    if (session.sidebarSearch) {
      const si = document.getElementById('sidebar-search-input');
      if (si) si.value = session.sidebarSearch;  // restore value; search fires once user interacts
    }
    // Re-save immediately with stripped data so next reload is fast
    setTimeout(_schedSave, 500);
  } catch(e) {
    _initDefaultSession();
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────────
(async function() {
  await _loadSession();
  loadProjects();
  buildKeybindingList();
  renderFavorites();
})();

window.addEventListener('beforeunload', () => {
  clearTimeout(_saveTimer);
  const data = _buildSessionData();
  navigator.sendBeacon('/api/session/save', new Blob([JSON.stringify(data)], { type: 'application/json' }));
});

document.getElementById('sidebar-search-input').addEventListener('input', function() {
  clearTimeout(_sidebarSearchTimer);
  _sidebarSearchTimer = setTimeout(() => doSidebarSearch(this.value), 300);
});
document.getElementById('sidebar-search-input').addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { this.value = ''; doSidebarSearch(''); }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    const nodes = getVisibleTreeNodes();
    if (nodes.length) { document.getElementById('sidebar-tree').focus(); setTreeFocus(nodes[0]); }
  }
});

// ── File Explorer ─────────────────────────────────────────────────────────────
(function() {
  const _FE_ROOT_KEY  = 'bqs-fe-root';
  const _FE_H_KEY     = 'bqs-fe-height';
  const _FE_OPEN_KEY  = 'bqs-fe-open';

  let _feRoot      = localStorage.getItem(_FE_ROOT_KEY) || '';
  window._feGetRoot = () => _feRoot;
  window._feRefresh = () => { if (_feRoot) { delete _feTree[_feRoot]; renderFileTree(); } };
  let _feSearch    = '';
  let _feTree      = {};   // path -> { items: [], loaded: bool }
  let _feExpanded  = new Set(JSON.parse(localStorage.getItem('bqs-fe-expanded') || '[]'));
  let _feSelected  = null; // currently selected path
  let _feRenaming  = null; // path being renamed
  let _feDragging  = null; // path being dragged
  let _feCurrentFile = null; // path of currently open file tab
  let _feNewPath     = null; // path of freshly saved file (drives animation)

  // ── helpers ────────────────────────────────────────────────────────────────
  function _saveExpanded() {
    localStorage.setItem('bqs-fe-expanded', JSON.stringify([..._feExpanded].slice(0, 200)));
  }

  function _dirOf(p) {
    const i = p.lastIndexOf('/');
    return i > 0 ? p.slice(0, i) : p;
  }

  function _ext(name) {
    const i = name.lastIndexOf('.');
    return i > 0 ? name.slice(i).toLowerCase() : '';
  }

  async function _fsCall(method, endpoint, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const r = await fetch('/api/fs' + endpoint, opts);
    if (!r.ok) {
      const err = await r.json().catch(() => ({ detail: 'Request failed' }));
      throw new Error(err.detail || 'Request failed');
    }
    return r.json();
  }

  async function _listDir(path) {
    if (_feTree[path]?.loaded) return _feTree[path].items;
    const data = await _fsCall('POST', '/list', { path });
    _feTree[path] = { items: data.items, loaded: true };
    return data.items;
  }

  function _invalidate(path) {
    // Invalidate the dir that contains this path, and the path itself if it's a dir
    delete _feTree[path];
    delete _feTree[_dirOf(path)];
  }

  // ── search filter ──────────────────────────────────────────────────────────
  function _matchesSearch(name) {
    if (!_feSearch) return true;
    return name.toLowerCase().includes(_feSearch.toLowerCase());
  }

  // ── render ─────────────────────────────────────────────────────────────────
  function _folderIcon(open) {
    return open
      ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--title-color)" stroke-width="1.8" stroke-linecap="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/><line x1="2" y1="12" x2="22" y2="12" stroke-opacity="0.5"/></svg>`
      : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--title-color)" stroke-width="1.8" stroke-linecap="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>`;
  }

  const _DATA_EXTS = new Set(['.csv', '.tsv', '.json', '.jsonl', '.parquet', '.xlsx', '.xls']);

  function _fileIcon(name) {
    const e = _ext(name);
    if (e === '.sql') return `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--col-color)" stroke-width="1.8" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><text x="5" y="19" font-size="6" fill="var(--col-color)" stroke="none" font-family="monospace">SQL</text></svg>`;
    if (_DATA_EXTS.has(e)) return `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="8" x2="21" y2="8"/><line x1="3" y1="13" x2="21" y2="13"/><line x1="3" y1="18" x2="21" y2="18"/><line x1="8" y1="3" x2="8" y2="21"/></svg>`;
    return `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--text2)" stroke-width="1.8" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`;
  }

  function _renderItems(items, depth, container, filterMode) {
    for (const item of items) {
      if (filterMode && !_matchesSearch(item.name)) {
        if (!item.is_dir) continue;
        // still recurse into dirs in filter mode; skip dir row itself if no match
      }

      const row = document.createElement('div');
      row.className = 'fe-item'
        + (item.path === _feSelected ? ' selected' : '')
        + (_feNewPath && item.path === _feNewPath ? ' fe-item-new' : '');
      row.dataset.path = item.path;
      row.dataset.isDir = item.is_dir ? '1' : '0';
      row.draggable = true;

      // Indentation
      const indent = document.createElement('span');
      indent.className = 'fe-item-indent';
      indent.style.width = (depth * 14) + 'px';
      row.appendChild(indent);

      // Arrow (dirs only)
      const arrow = document.createElement('span');
      arrow.className = 'fe-item-arrow' + (_feExpanded.has(item.path) ? ' open' : '');
      if (item.is_dir) {
        arrow.innerHTML = `<svg width="10" height="10" viewBox="0 0 8 8" fill="currentColor" opacity="0.5"><polygon points="1,1 7,4 1,7"/></svg>`;
        arrow.addEventListener('click', e => { e.stopPropagation(); _toggleDir(item.path); });
      }
      row.appendChild(arrow);

      // Icon
      const icon = document.createElement('span');
      icon.className = 'fe-item-icon';
      icon.innerHTML = item.is_dir ? _folderIcon(_feExpanded.has(item.path)) : _fileIcon(item.name);
      row.appendChild(icon);

      // Name (or rename input)
      if (_feRenaming === item.path) {
        const inp = document.createElement('input');
        inp.className = 'fe-rename-inp';
        inp.value = item.name;
        inp.addEventListener('click', e => e.stopPropagation());
        inp.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); _doRename(item.path, inp.value.trim()); }
          if (e.key === 'Escape') { _feRenaming = null; renderFileTree(); }
        });
        inp.addEventListener('blur', () => setTimeout(() => { if (_feRenaming === item.path) { _feRenaming = null; renderFileTree(); } }, 150));
        row.appendChild(inp);
        setTimeout(() => { inp.focus(); inp.select(); }, 10);
      } else {
        const name = document.createElement('span');
        name.className = 'fe-item-name' + (_ext(item.name) === '.sql' ? ' sql-file' : '');
        name.textContent = item.name;
        row.appendChild(name);
      }

      // Action buttons
      const btns = document.createElement('span');
      btns.className = 'fe-item-btns';
      const renBtn = document.createElement('button');
      renBtn.className = 'fe-item-btn';
      renBtn.title = 'Rename';
      renBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
      renBtn.addEventListener('click', e => { e.stopPropagation(); _feRenaming = item.path; renderFileTree(); });
      btns.appendChild(renBtn);
      const delBtn = document.createElement('button');
      delBtn.className = 'fe-item-btn';
      delBtn.title = 'Delete';
      delBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>`;
      delBtn.addEventListener('click', e => {
        e.stopPropagation();
        const label = item.is_dir ? `folder "${item.name}" and all its contents` : `"${item.name}"`;
        _feConfirm(`Delete ${label}?`, () => _doDelete(item.path));
      });
      btns.appendChild(delBtn);
      row.appendChild(btns);

      // Click: select
      row.addEventListener('click', () => {
        _feSelected = item.path;
        if (item.is_dir) _toggleDir(item.path);
        else renderFileTree();
      });

      // Dblclick: open files
      row.addEventListener('dblclick', e => {
        e.stopPropagation();
        if (item.is_dir) return;
        const ext = _ext(item.name);
        if (ext === '.sql') _openSqlFile(item.path, item.name);
        else if (_DATA_EXTS.has(ext)) _openDataFile(item.path, item.name);
      });

      // Drag and drop
      row.addEventListener('dragstart', e => {
        _feDragging = item.path;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', item.path);
      });
      row.addEventListener('dragend', () => { _feDragging = null; });
      if (item.is_dir) {
        row.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; row.classList.add('drag-over'); });
        row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
        row.addEventListener('drop', e => {
          e.preventDefault();
          row.classList.remove('drag-over');
          const src = e.dataTransfer.getData('text/plain');
          if (src && src !== item.path) _doMove(src, item.path);
        });
      }

      container.appendChild(row);

      // Children (if expanded dir)
      if (item.is_dir && _feExpanded.has(item.path) && _feTree[item.path]?.loaded) {
        let children = _feTree[item.path].items;
        if (_feSearch) children = children.filter(c => !c.is_dir ? _matchesSearch(c.name) : true);
        if (children.length) _renderItems(children, depth + 1, container, filterMode);
        else {
          const emp = document.createElement('div');
          emp.className = 'fe-empty';
          emp.style.paddingLeft = ((depth + 1) * 14 + 16) + 'px';
          emp.textContent = 'Empty folder';
          container.appendChild(emp);
        }
      }
    }
  }

  async function renderFileTree() {
    const treeEl = document.getElementById('fe-tree');
    if (!treeEl) return;
    treeEl.innerHTML = '';

    if (!_feRoot) {
      treeEl.innerHTML = '<div class="fe-no-root">Enter a folder path above and click <b>Open</b></div>';
      return;
    }

    let items;
    try {
      items = await _listDir(_feRoot);
    } catch (err) {
      treeEl.innerHTML = `<div class="fe-no-root" style="color:var(--error-color)">${err.message}</div>`;
      return;
    }

    if (_feSearch) items = items.filter(i => !i.is_dir ? _matchesSearch(i.name) : true);
    if (items.length === 0) {
      treeEl.innerHTML = '<div class="fe-empty">No files found</div>';
      return;
    }
    // Pre-load all expanded dirs so _renderItems can render children synchronously
    await Promise.all([..._feExpanded].map(p => _listDir(p).catch(() => {})));
    _renderItems(items, 0, treeEl, !!_feSearch);
  }

  // ── actions ────────────────────────────────────────────────────────────────
  async function _toggleDir(path) {
    if (_feExpanded.has(path)) {
      _feExpanded.delete(path);
    } else {
      _feExpanded.add(path);
      await _listDir(path); // pre-load
    }
    _saveExpanded();
    renderFileTree();
  }

  async function _doRename(oldPath, newName) {
    if (!newName || newName === oldPath.split('/').pop()) { _feRenaming = null; renderFileTree(); return; }
    const dir = _dirOf(oldPath);
    const newPath = dir + '/' + newName;
    try {
      await _fsCall('POST', '/rename', { old_path: oldPath, new_path: newPath });
      // Update expanded set
      if (_feExpanded.has(oldPath)) { _feExpanded.delete(oldPath); _feExpanded.add(newPath); _saveExpanded(); }
      // Update open tab if needed
      if (_feCurrentFile === oldPath) { _feCurrentFile = newPath; }
      _invalidate(dir);
    } catch (err) {
      alert('Rename failed: ' + err.message);
    }
    _feRenaming = null;
    renderFileTree();
  }

  async function _doMove(srcPath, dstDir) {
    if (srcPath === dstDir || _dirOf(srcPath) === dstDir) return;
    try {
      const res = await _fsCall('POST', '/move', { src: srcPath, dst: dstDir });
      _invalidate(srcPath);
      _invalidate(dstDir);
      if (_feCurrentFile === srcPath) _feCurrentFile = res.new_path;
    } catch (err) {
      alert('Move failed: ' + err.message);
    }
    renderFileTree();
  }

  function _feConfirm(msg, onConfirm) {
    let modal = document.getElementById('fe-confirm-modal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'fe-confirm-modal';
      modal.innerHTML =
        `<div class="fe-confirm-box">` +
          `<div class="fe-confirm-msg"></div>` +
          `<div class="fe-confirm-btns">` +
            `<button class="fe-confirm-btn fe-confirm-cancel">Cancel</button>` +
            `<button class="fe-confirm-btn danger fe-confirm-ok">Delete</button>` +
          `</div>` +
        `</div>`;
      document.body.appendChild(modal);
      modal.querySelector('.fe-confirm-cancel').addEventListener('click', () => modal.classList.remove('open'));
      modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
    }
    modal.querySelector('.fe-confirm-msg').textContent = msg;
    modal.classList.add('open');
    // Replace ok button to clear old listener
    const oldOk = modal.querySelector('.fe-confirm-ok');
    const newOk = oldOk.cloneNode(true);
    oldOk.replaceWith(newOk);
    newOk.addEventListener('click', () => { modal.classList.remove('open'); onConfirm(); });
  }

  async function _doDelete(path) {
    try {
      await _fsCall('POST', '/delete', { path });
      _invalidate(path);
      _invalidate(_dirOf(path));
      _feExpanded.delete(path);
      if (_feCurrentFile === path) _feCurrentFile = null;
      if (_feSelected    === path) _feSelected    = null;
    } catch (err) {
      alert('Delete failed: ' + err.message);
    }
    renderFileTree();
  }

  async function _newFolder() {
    const base = _feSelected && document.querySelector(`.fe-item[data-path="${CSS.escape(_feSelected)}"][data-is-dir="1"]`)
      ? _feSelected : _feRoot;
    const name = prompt('New folder name:', 'new-folder');
    if (!name) return;
    const newPath = base + '/' + name;
    try {
      await _fsCall('POST', '/mkdir', { path: newPath });
      _feExpanded.add(base);
      _invalidate(base);
      _saveExpanded();
    } catch (err) {
      alert('Create folder failed: ' + err.message);
    }
    renderFileTree();
  }

  async function _newSqlFile() {
    const base = _feSelected && document.querySelector(`.fe-item[data-path="${CSS.escape(_feSelected)}"][data-is-dir="1"]`)
      ? _feSelected : _feRoot;
    const name = prompt('New SQL file name:', 'query.sql');
    if (!name) return;
    const fileName = name.endsWith('.sql') ? name : name + '.sql';
    const newPath = base + '/' + fileName;
    try {
      await _fsCall('POST', '/write', { path: newPath, content: '-- ' + fileName + '\n' });
      _feExpanded.add(base);
      _invalidate(base);
      _saveExpanded();
    } catch (err) {
      alert('Create file failed: ' + err.message);
    }
    renderFileTree();
  }

  async function _openSqlFile(path, name) {
    let content = '';
    try {
      const res = await _fsCall('GET', `/read?path=${encodeURIComponent(path)}`);
      content = res.content;
    } catch (err) {
      alert('Read failed: ' + err.message);
      return;
    }
    _feCurrentFile = path;
    _feSelected = path;

    // Create or reuse a workspace tab for this file
    const tabId = 'file:' + path;
    let ws = _workspaces.find(w => w.id === tabId);
    if (!ws) {
      ws = _createWsState(name.replace(/\.sql$/i, ''));
      ws.id = tabId;
      ws.sql = content;
      ws.filePath = path;
      _workspaces.push(ws);
    } else {
      ws.sql = content;
      ws.filePath = path;
    }
    _activeWsId = tabId;
    _renderWsBar();
    // Switch to SQL tab
    EditorAPI.setValue(content);
    const sqlTabBtn = document.querySelector('.main-tab[data-tab="sql"]');
    if (sqlTabBtn) activateMainTab(sqlTabBtn);
    renderFileTree();
    _schedSave();
  }

  async function _openDataFile(path, name) {
    _feSelected = path;
    const tabId = 'data:' + path;
    let ws = _workspaces.find(w => w.id === tabId);
    if (ws) {
      _feCurrentFile = path;
      switchWorkspace(tabId);
      renderFileTree();
      return;
    }
    let result;
    try {
      const r = await fetch(`/api/fs/read-data?path=${encodeURIComponent(path)}`);
      if (!r.ok) { const e = await r.json(); throw new Error(e.detail || 'Failed to read file'); }
      result = await r.json();
    } catch (err) {
      alert('Failed to open file: ' + err.message);
      return;
    }
    _feCurrentFile = path;
    const firstSheet = result.sheets ? Object.keys(result.sheets)[0] : null;
    ws = {
      id: tabId,
      type: 'data',
      name: name.replace(/\.[^.]+$/, ''),
      filePath: path,
      storyBlocks: [],
      lastQueryContext: { sql: `-- ${name}`, project: '' },
      lastQueryColumns: result.columns,
      lastQuerySchema: result.schema,
      lastQueryData: { columns: result.columns, schema: result.schema, rows: result.rows },
      _dataTotalRows: result.totalRows,
      _dataSheets: result.sheets || null,
      _activeSheet: firstSheet,
      schemaCache: new Map(),
      currentDag: null,
      addedTables: new Set(),
      activeTab: 'sql',
    };
    const activeIdx = _workspaces.findIndex(w => w.id === _activeWsId);
    _workspaces.splice(activeIdx + 1, 0, ws);
    switchWorkspace(tabId);
    renderFileTree();
    _schedSave();
  }

  // Save current editor SQL to a file
  window._feSaveCurrentFile = async function(forcePath) {
    try {
      const sql = EditorAPI.getValue();
      const ws = _workspaces.find(w => w.id === _activeWsId);
      const targetPath = forcePath || ws?.filePath || null;

      if (targetPath) {
        // Write via backend — use returned normalized path for all subsequent ops
        const data = await _fsCall('POST', '/write', { path: targetPath, content: sql });
        const savedPath = (data && data.path) ? data.path : targetPath;
        if (ws) ws.filePath = savedPath;

        // Flash save indicator — only touch the text node, keep SVG intact
        const btn = document.getElementById('save-btn');
        if (btn) {
          const textNode = [...btn.childNodes].find(n => n.nodeType === 3 && n.textContent.trim());
          if (textNode) {
            const origText = textNode.nodeValue;
            textNode.nodeValue = ' Saved';
            btn.style.color = 'var(--accent)';
            setTimeout(() => { textNode.nodeValue = origText; btn.style.color = ''; }, 1200);
          }
        }

        // Clear the entire tree cache — same as _pickFolder does — guarantees fresh listing
        _feTree = {};
        // Reveal the file: expand every ancestor folder so a nested file isn't hidden
        // inside a collapsed dir. Ancestors above the root simply aren't rendered (harmless).
        let anc = _dirOf(savedPath);
        while (anc && anc.length > 1 && anc !== _dirOf(anc)) {
          _feExpanded.add(anc);
          anc = _dirOf(anc);
        }
        _saveExpanded();
        _feNewPath = savedPath;
        await renderFileTree();
        setTimeout(() => {
          const el = document.querySelector(`.fe-item[data-path="${savedPath.replace(/"/g, '\\"')}"]`);
          el?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          _feNewPath = null;
        }, 1400);
      } else if (_feRoot) {
        // Folder open — ask for filename via inline modal
        const wsName = ws?.name || 'query';
        const defaultName = wsName.replace(/[^a-z0-9_\-]/gi, '-').toLowerCase() + '.sql';
        const name = await _promptSaveAs(defaultName);
        if (!name) return;
        const fileName = name.endsWith('.sql') ? name : name + '.sql';
        const root = _feRoot.replace(/\/+$/, ''); // strip trailing slash to avoid double-slash paths
        const savePath = root + '/' + fileName;
        if (ws) ws.filePath = savePath;
        _feCurrentFile = savePath;
        await window._feSaveCurrentFile(savePath);
      } else {
        // No folder open — browser native save
        await _saveFile(sql, ((ws?.name || 'query').replace(/[^a-z0-9_\-]/gi, '-').toLowerCase() + '.sql'), 'text/plain');
      }
    } catch (err) {
      alert('Save failed: ' + err.message);
    }
  };

  // Inline save-as dialog (avoids window.prompt() which can be silently blocked)
  function _promptSaveAs(defaultName) {
    return new Promise(resolve => {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:var(--overlay-bg);display:flex;align-items:center;justify-content:center;z-index:9999';
      const box = document.createElement('div');
      box.style.cssText = 'background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:20px 24px;min-width:320px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,0.3)';
      box.innerHTML = `
        <div style="font-size:13px;color:var(--text);font-weight:500">Save SQL file</div>
        <input id="_save-as-inp" type="text" value="${defaultName}" style="background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:6px 10px;color:var(--text);font-size:13px;outline:none;width:100%">
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button id="_save-as-cancel" style="padding:5px 14px;background:none;border:1px solid var(--border);border-radius:4px;color:var(--text2);cursor:pointer;font-size:12px">Cancel</button>
          <button id="_save-as-ok" style="padding:5px 14px;background:var(--accent);border:none;border-radius:4px;color:#fff;cursor:pointer;font-size:12px;font-weight:500">Save</button>
        </div>`;
      overlay.appendChild(box);
      document.body.appendChild(overlay);
      const inp = box.querySelector('#_save-as-inp');
      inp.select();
      const finish = val => { overlay.remove(); resolve(val); };
      box.querySelector('#_save-as-cancel').addEventListener('click', () => finish(null));
      box.querySelector('#_save-as-ok').addEventListener('click', () => finish(inp.value.trim() || null));
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') finish(inp.value.trim() || null);
        if (e.key === 'Escape') finish(null);
      });
      overlay.addEventListener('click', e => { if (e.target === overlay) finish(null); });
    });
  }

  // ── UI wiring ──────────────────────────────────────────────────────────────
  function _initFileExplorer() {
    const header  = document.getElementById('fe-header');
    const chevron = document.getElementById('fe-chevron');
    const body    = document.getElementById('fe-body');
    const resizer = document.getElementById('sidebar-fe-resizer');
    const feEl    = document.getElementById('sidebar-file-explorer');

    let _feOpen = localStorage.getItem(_FE_OPEN_KEY) !== 'false';
    function _setOpen(open) {
      _feOpen = open;
      localStorage.setItem(_FE_OPEN_KEY, open);
      body.style.display = open ? 'flex' : 'none';
      resizer.style.display = open ? 'block' : 'none';
      chevron.classList.toggle('open', open);
      if (open) {
        const savedH = parseInt(localStorage.getItem(_FE_H_KEY) || '220', 10);
        feEl.style.height = savedH + 'px';
        feEl.style.flex = 'none';
        renderFileTree();
      } else {
        feEl.style.height = '';
        feEl.style.flex = '';
      }
    }
    _setOpen(_feOpen);

    header.addEventListener('click', () => _setOpen(!_feOpen));

    // Path input — click or browse button opens native folder picker
    const pathInp = document.getElementById('fe-path-input');
    pathInp.value = _feRoot;

    async function _pickFolder() {
      try {
        const res = await fetch('/api/fs/pick-folder');
        const data = await res.json();
        if (data.path) {
          pathInp.value = data.path;
          _feRoot = data.path;
          localStorage.setItem(_FE_ROOT_KEY, _feRoot);
          _feTree = {};
          renderFileTree();
        }
      } catch (err) {
        console.error('Folder pick failed:', err);
      }
    }

    pathInp.addEventListener('click', _pickFolder);
    document.getElementById('fe-browse-btn').addEventListener('click', _pickFolder);

    // Search
    let _feSearchTimer;
    document.getElementById('fe-search-inp').addEventListener('input', function() {
      clearTimeout(_feSearchTimer);
      _feSearchTimer = setTimeout(() => { _feSearch = this.value; renderFileTree(); }, 200);
    });

    // Action buttons
    document.getElementById('fe-new-folder-btn').addEventListener('click', _newFolder);
  }

  _initFileExplorer();

  // Save button
  document.getElementById('save-btn').addEventListener('click', () => window._feSaveCurrentFile());

  // Ctrl+S / Cmd+S
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      window._feSaveCurrentFile();
    }
  });
})();

// ── Resizable panels ──────────────────────────────────────────────────────────
(function() {
  // Vertical: sidebar <-> main
  const rV = document.getElementById('resizer-v');
  const sidebar = document.getElementById('sidebar');
  let draggingV = false, startX, startW;

  rV.addEventListener('mousedown', e => {
    draggingV = true;
    startX = e.clientX;
    startW = sidebar.offsetWidth;
    rV.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });

  // Horizontal: editor <-> results
  const rH = document.getElementById('resizer-h');
  const main = document.getElementById('main');
  const editorContainer = document.getElementById('editor-container');
  const resultsArea = document.getElementById('results-area');
  let draggingH = false, startY, startEditorH, startResultsH;

  const editorSplit = document.getElementById('editor-split');
  // Set initial heights so flex doesn't fight us
  editorSplit.style.flex = 'none';
  editorSplit.style.height = '60%';
  resultsArea.style.flex = 'none';
  resultsArea.style.height = '35%';

  rH.addEventListener('mousedown', e => {
    draggingH = true;
    startY = e.clientY;
    startEditorH = editorSplit.offsetHeight;
    startResultsH = resultsArea.offsetHeight;
    rH.classList.add('dragging');
    document.body.style.cursor = 'row-resize';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', e => {
    if (draggingV) {
      const newW = Math.max(140, Math.min(600, startW + e.clientX - startX));
      sidebar.style.width = newW + 'px';
    }
    if (draggingTree) {
      const newW = Math.max(160, Math.min(600, startWTree - (e.clientX - startXTree)));
      qTreePanel.style.width = newW + 'px';
      localStorage.setItem('bqs-qt-width', newW);
      if (window._monacoEditor) window._monacoEditor.layout();
    }
    if (draggingH) {
      const delta = e.clientY - startY;
      const toolbar = document.getElementById('toolbar');
      const toolbarH = toolbar.offsetHeight;
      const totalH = main.offsetHeight - toolbarH - rH.offsetHeight;
      const newEditorH = Math.max(80, Math.min(totalH - 60, startEditorH + delta));
      const newResultsH = Math.max(60, totalH - newEditorH);
      editorSplit.style.height = newEditorH + 'px';
      resultsArea.style.height = newResultsH + 'px';
      if (window._monacoEditor) window._monacoEditor.layout();
    }
    if (draggingFav) {
      const delta = e.clientY - startYFav;
      const sidebarBody = document.getElementById('sidebar-body');
      const maxH = sidebarBody.offsetHeight - 60;
      const newH = Math.max(32, Math.min(maxH, startHFav + delta));
      favPanel.style.height = newH + 'px';
      localStorage.setItem(_FAV_H_KEY, String(newH));
    }
    if (draggingFe) {
      const delta = e.clientY - startYFe;
      const sidebarBody = document.getElementById('sidebar-body');
      const maxH = sidebarBody.offsetHeight - 60;
      const newH = Math.max(80, Math.min(maxH, startHFe + delta));
      fePanel.style.height = newH + 'px';
      fePanel.style.flex = 'none';
      localStorage.setItem('bqs-fe-height', String(newH));
    }
  });

  // Tree panel resizer
  const rTree = document.getElementById('resizer-tree');
  const qTreePanel = document.getElementById('query-tree-panel');
  const _qtSavedW = localStorage.getItem('bqs-qt-width');
  if (_qtSavedW) qTreePanel.style.width = _qtSavedW + 'px';
  let draggingTree = false, startXTree, startWTree;
  rTree.addEventListener('mousedown', e => {
    draggingTree = true;
    startXTree = e.clientX;
    startWTree = qTreePanel.offsetWidth;
    rTree.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });

  // Sidebar favorites ↔ file-explorer resizer
  const rFav = document.getElementById('sidebar-fav-resizer');
  const favPanel = document.getElementById('sidebar-favorites');
  let draggingFav = false, startYFav, startHFav;
  const _FAV_H_KEY = 'bqs-fav-height';
  const _savedFavH = parseInt(localStorage.getItem(_FAV_H_KEY) || '0', 10);
  if (_savedFavH > 0) favPanel.style.height = _savedFavH + 'px';

  rFav.addEventListener('mousedown', e => {
    draggingFav = true;
    startYFav = e.clientY;
    startHFav = favPanel.offsetHeight;
    rFav.classList.add('dragging');
    document.body.style.cursor = 'row-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  // File explorer ↔ BQ tree resizer
  const rFe = document.getElementById('sidebar-fe-resizer');
  const fePanel = document.getElementById('sidebar-file-explorer');
  let draggingFe = false, startYFe, startHFe;

  rFe.addEventListener('mousedown', e => {
    draggingFe = true;
    startYFe = e.clientY;
    startHFe = fePanel.offsetHeight;
    rFe.classList.add('dragging');
    document.body.style.cursor = 'row-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mouseup', () => {
    if (draggingV) { draggingV = false; rV.classList.remove('dragging'); }
    if (draggingH) { draggingH = false; rH.classList.remove('dragging'); }
    if (draggingTree) { draggingTree = false; rTree.classList.remove('dragging'); }
    if (draggingFav) { draggingFav = false; rFav.classList.remove('dragging'); }
    if (draggingFe) { draggingFe = false; rFe.classList.remove('dragging'); }
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });

// ── Query tree fold button ────────────────────────────────────────────────────
document.getElementById('qt-fold-btn')?.addEventListener('click', () => {
  const panel = document.getElementById('query-tree-panel');
  const resizer = document.getElementById('resizer-tree');
  const btn = document.getElementById('qt-fold-btn');
  if (panel.classList.contains('qt-folded')) {
    const saved = panel.dataset.savedWidth || localStorage.getItem('bqs-qt-width') || '320';
    panel.style.width = saved + 'px';
    panel.classList.remove('qt-folded');
    resizer.style.display = '';
  } else {
    const w = panel.offsetWidth;
    panel.dataset.savedWidth = w;
    localStorage.setItem('bqs-qt-width', w);
    panel.style.width = '';
    panel.classList.add('qt-folded');
    resizer.style.display = 'none';
  }
  if (window._monacoEditor) window._monacoEditor.layout();
});

// ── Query tree search input ───────────────────────────────────────────────────
const _qtSearchInp = document.getElementById('qt-search-inp');
const _qtSearchClr = document.getElementById('qt-search-clr');
if (_qtSearchInp) {
  _qtSearchInp.addEventListener('input', e => {
    const v = e.target.value;
    _qtSearchClr?.classList.toggle('visible', v.length > 0);
    _qtApplySearch(v);
  });
}
if (_qtSearchClr) {
  _qtSearchClr.addEventListener('click', () => {
    _qtSearchInp.value = '';
    _qtSearchClr.classList.remove('visible');
    _qtApplySearch('');
  });
}
})();

<script>
(function() {
  const _orig = echarts.init;
  echarts.init = function(el, theme, opts) {
    const chart = _orig.call(this, el, theme, opts);
    const _origSet = chart.setOption.bind(chart);
    chart.setOption = function(option, ...rest) {
      return _origSet({ animation: false, ...option }, ...rest);
    };
    return chart;
  };
})();

<!-- ── Monaco (loads async; does NOT block tree) ── -->
<script>
(function() {
  const MONACO_CDN = '/vs';
  const loaderScript = document.createElement('script');
  loaderScript.src = MONACO_CDN + '/loader.js';
  loaderScript.onload = function() {
    require.config({ paths: { vs: MONACO_CDN } });
    require(['vs/editor/editor.main'], function() {
      // Hide textarea fallback
      const fallback = document.getElementById('editor-fallback');
      const savedText = fallback.value;
      fallback.style.display = 'none';

      // ── BigQuery SQL language: rich tokenizer ──────────────────────────────
      monaco.languages.register({ id: 'bigquery-sql' });

      monaco.languages.setMonarchTokensProvider('bigquery-sql', {
        defaultToken: 'identifier',
        tokenizer: {
          root: [
            [/[ \t\r\n]+/, ''],
            [/--[^\n]*/, 'comment'],
            [/\/\*/, { token: 'comment', next: '@block_comment' }],
            [/`[^`]*`/, 'identifier.backtick'],
            [/"""/, { token: 'string', next: '@triple_dq' }],
            [/'''/, { token: 'string', next: '@triple_sq' }],
            [/'/, { token: 'string', next: '@sq_string' }],
            [/"/, { token: 'string', next: '@dq_string' }],
            [/\d+\.?\d*(?:[eE][+\-]?\d+)?/, 'number'],
            [/[=<>!]+/, 'operator'],
            [/[+\-*\/%|^&~]/, 'operator'],
            [/[(),;\[\]]/, 'delimiter'],
            [/\.(?!\d)/, 'delimiter'],
            [/(?:SELECT|FROM|WHERE|JOIN|LEFT|RIGHT|INNER|OUTER|CROSS|FULL|ANTI|SEMI|NATURAL|ON|AS|AND|OR|NOT|IN|IS|NULL|LIKE|ILIKE|BETWEEN|EXISTS|ANY|SOME|ALL|CASE|WHEN|THEN|ELSE|END|GROUP|BY|ORDER|HAVING|LIMIT|FETCH|FIRST|NEXT|ONLY|DISTINCT|UNION|EXCEPT|INTERSECT|WITH|RECURSIVE|QUALIFY|TABLESAMPLE|PIVOT|UNPIVOT|OVER|PARTITION|ROWS|RANGE|UNBOUNDED|PRECEDING|FOLLOWING|CURRENT|ROW|WINDOW|LATERAL|UNNEST|TRUE|FALSE|ASC|DESC|NULLS|USING|IGNORE|RESPECT|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|VIEW|DROP|ALTER|ADD|COLUMN|RENAME|ROLLUP|CUBE|GROUPING|SETS|TOP|ESCAPE)(?![a-zA-Z0-9_])/i, 'keyword'],
            [/(?:COUNT|SUM|AVG|MIN|MAX|ANY_VALUE|ARRAY_AGG|STRING_AGG|COUNTIF|LOGICAL_AND|LOGICAL_OR|BIT_AND|BIT_OR|BIT_XOR|APPROX_COUNT_DISTINCT|APPROX_TOP_COUNT|APPROX_QUANTILES|COALESCE|IFNULL|NULLIF|NVL|IIF|IF|CONCAT|SUBSTR|SUBSTRING|LOWER|UPPER|TRIM|LTRIM|RTRIM|REGEXP_REPLACE|REGEXP_EXTRACT|REGEXP_EXTRACT_ALL|REGEXP_CONTAINS|SPLIT|STRPOS|INSTR|LENGTH|CHAR_LENGTH|BYTE_LENGTH|FORMAT|LPAD|RPAD|REVERSE|STARTS_WITH|ENDS_WITH|CONTAINS_SUBSTR|TO_HEX|FROM_HEX|TO_BASE64|FROM_BASE64|ASCII|CHR|UNICODE|INITCAP|SOUNDEX|TRANSLATE|DATE_ADD|DATE_SUB|DATE_DIFF|DATE_TRUNC|FORMAT_DATE|PARSE_DATE|DATETIME_ADD|DATETIME_SUB|DATETIME_DIFF|DATETIME_TRUNC|FORMAT_DATETIME|PARSE_DATETIME|TIMESTAMP_ADD|TIMESTAMP_SUB|TIMESTAMP_DIFF|TIMESTAMP_TRUNC|FORMAT_TIMESTAMP|PARSE_TIMESTAMP|EXTRACT|CURRENT_DATE|CURRENT_DATETIME|CURRENT_TIMESTAMP|CURRENT_TIME|UNIX_DATE|UNIX_MICROS|UNIX_MILLIS|UNIX_SECONDS|TIMESTAMP_MICROS|TIMESTAMP_MILLIS|DATE_PART|ABS|CEIL|CEILING|FLOOR|ROUND|TRUNC|MOD|DIV|SAFE_DIVIDE|POWER|POW|SQRT|EXP|LN|LOG|LOG10|GREATEST|LEAST|SIGN|RAND|IEEE_DIVIDE|IS_INF|IS_NAN|ROW_NUMBER|RANK|DENSE_RANK|PERCENT_RANK|CUME_DIST|NTILE|LAG|LEAD|FIRST_VALUE|LAST_VALUE|NTH_VALUE|ARRAY_LENGTH|ARRAY_REVERSE|ARRAY_CONCAT|ARRAY_TO_STRING|GENERATE_ARRAY|GENERATE_DATE_ARRAY|GENERATE_TIMESTAMP_ARRAY|FLATTEN|ARRAY_FIRST|ARRAY_LAST|CAST|SAFE_CAST|PARSE_NUMERIC|PARSE_BIGNUMERIC|MD5|SHA1|SHA256|SHA512|FARM_FINGERPRINT|JSON_VALUE|JSON_QUERY|JSON_EXTRACT|JSON_EXTRACT_SCALAR|JSON_EXTRACT_ARRAY|JSON_QUERY_ARRAY|JSON_VALUE_ARRAY|PARSE_JSON|TO_JSON|TO_JSON_STRING|JSON_TYPE|GENERATE_UUID|SESSION_USER|ERROR|SAFE|TYPEOF|ISNULL|OFFSET|ORDINAL|SAFE_OFFSET|SAFE_ORDINAL|REPLACE|ST_GEOGPOINT|ST_DISTANCE|ST_LENGTH|ST_AREA)(?![a-zA-Z0-9_])/i, 'predefined'],
            [/(?:STRING|BYTES|INT64|INT|INTEGER|SMALLINT|BIGINT|TINYINT|BYTEINT|FLOAT64|FLOAT|NUMERIC|BIGNUMERIC|DECIMAL|BIGDECIMAL|BOOL|BOOLEAN|DATE|TIME|DATETIME|TIMESTAMP|INTERVAL|JSON|GEOGRAPHY|ARRAY|STRUCT|RECORD|VARCHAR|CHAR|NCHAR)(?![a-zA-Z0-9_])/i, 'type'],
            [/[a-zA-Z_]\w*/, 'identifier'],
          ],
          block_comment: [
            [/[^/*]+/, 'comment'], [/\*\//, { token: 'comment', next: '@pop' }], [/./, 'comment'],
          ],
          sq_string: [
            [/[^\\']+/, 'string'], [/\\./, 'string.escape'], [/'/, { token: 'string', next: '@pop' }],
          ],
          dq_string: [
            [/[^\\"]+/, 'string'], [/\\./, 'string.escape'], [/"/, { token: 'string', next: '@pop' }],
          ],
          triple_dq: [
            [/[^"]+/, 'string'], [/"""/, { token: 'string', next: '@pop' }], [/"/, 'string'],
          ],
          triple_sq: [
            [/[^']+/, 'string'], [/'''/, { token: 'string', next: '@pop' }], [/'/, 'string'],
          ],
        },
      });
      monaco.languages.setLanguageConfiguration('bigquery-sql', {
        comments: { lineComment: '--', blockComment: ['/*', '*/'] },
        brackets: [['(', ')'], ['[', ']']],
        autoClosingPairs: [
          { open: '(', close: ')' }, { open: '[', close: ']' },
          { open: "'", close: "'", notIn: ['string', 'comment'] },
          { open: '"', close: '"', notIn: ['string', 'comment'] },
          { open: '`', close: '`', notIn: ['string', 'comment'] },
        ],
        surroundingPairs: [
          { open: '(', close: ')' }, { open: '[', close: ']' },
          { open: "'", close: "'" }, { open: '"', close: '"' }, { open: '`', close: '`' },
        ],
        indentationRules: {
          increaseIndentPattern: /^.*\(\s*$/,
          decreaseIndentPattern: /^\s*\)/,
        },
        wordPattern: /(-?\d*\.\d\w*)|([^\`~!#%\^&*()\-=+\[{\]}\\|;:'",.<>\/?|\s]+)/,
        folding: {
          markers: { start: /^\s*--\s*#region\b/, end: /^\s*--\s*#endregion\b/ },
        },
      });

      // Alias-aware column completion: typing "alias." triggers column suggestions
      monaco.languages.registerCompletionItemProvider('bigquery-sql', {
        triggerCharacters: ['.'],
        provideCompletionItems(model, position) {
          const lineUpTo = model.getValueInRange({
            startLineNumber: position.lineNumber, startColumn: 1,
            endLineNumber: position.lineNumber,   endColumn: position.column,
          });
          const aliasMatch = lineUpTo.match(/\b([A-Za-z_]\w*)\.$/);
          if (!aliasMatch) return { suggestions: [] };
          const alias = aliasMatch[1].toLowerCase();
          const aliasMap = parseAliasMap(model.getValue());
          const fqn = aliasMap.get(alias);
          if (!fqn) return { suggestions: [] };
          const cols = _fqnSchemaCache.get(fqn) || [];
          if (!cols.length) return { suggestions: [] };
          const range = {
            startLineNumber: position.lineNumber, endLineNumber: position.lineNumber,
            startColumn: position.column, endColumn: position.column,
          };
          return {
            suggestions: cols.map(c => ({
              label: c.name,
              kind: monaco.languages.CompletionItemKind.Field,
              detail: c.type || 'column',
              insertText: c.name,
              range,
            })),
          };
        },
      });

      // result.col completions for sql_query mini editors
      monaco.languages.registerCompletionItemProvider('bigquery-sql', {
        triggerCharacters: ['.'],
        provideCompletionItems(model, position) {
          const lineUpTo = model.getValueInRange({
            startLineNumber: position.lineNumber, startColumn: 1,
            endLineNumber: position.lineNumber,   endColumn: position.column,
          });
          if (!/\bresult\.$/i.test(lineUpTo)) return { suggestions: [] };
          const ws = _workspaces.find(w => w.id === _activeWsId);
          const cols = ws?.lastQueryData?.columns || [];
          if (!cols.length) return { suggestions: [] };
          const range = {
            startLineNumber: position.lineNumber, endLineNumber: position.lineNumber,
            startColumn: position.column, endColumn: position.column,
          };
          return {
            suggestions: cols.map(c => ({
              label: c,
              kind: monaco.languages.CompletionItemKind.Field,
              detail: 'result column',
              insertText: c,
              range,
            })),
          };
        },
      });

      // bqs-light: VS Code Light+ palette with SQL token colors
      monaco.editor.defineTheme('bqs-light', {
        base: 'vs', inherit: true,
        rules: [
          { token: 'keyword',             foreground: '0000ff', fontStyle: 'bold' },
          { token: 'type',                foreground: '267f99' },
          { token: 'predefined',          foreground: '795e26' },
          { token: 'string',              foreground: 'a31515' },
          { token: 'string.escape',       foreground: 'b54e00' },
          { token: 'number',              foreground: '098658' },
          { token: 'comment',             foreground: '008000', fontStyle: 'italic' },
          { token: 'identifier',          foreground: '001080' },
          { token: 'identifier.backtick', foreground: '0070c1' },
          { token: 'operator',            foreground: '000000' },
          { token: 'delimiter',           foreground: '666666' },
        ],
        colors: {},
      });

      // bqs-dark: VS Code Dark+ palette adapted for BigQuery SQL
      monaco.editor.defineTheme('bqs-dark', {
        base: 'vs-dark', inherit: true,
        rules: [
          { token: 'keyword',             foreground: '569cd6', fontStyle: 'bold' },
          { token: 'type',                foreground: '4ec9b0' },
          { token: 'predefined',          foreground: 'dcdcaa' },
          { token: 'string',              foreground: 'ce9178' },
          { token: 'string.escape',       foreground: 'd7ba7d' },
          { token: 'number',              foreground: 'b5cea8' },
          { token: 'comment',             foreground: '6a9955', fontStyle: 'italic' },
          { token: 'identifier',          foreground: 'd4d4d4' },
          { token: 'identifier.backtick', foreground: '9cdcfe' },
          { token: 'operator',            foreground: 'e06c75' },
          { token: 'delimiter',           foreground: 'abb2bf' },
        ],
        colors: {
          'editor.background':              '#1e1e1e',
          'editor.lineHighlightBackground': '#2a2d2e',
          'editor.selectionBackground':     '#264f7880',
          'editorLineNumber.foreground':    '#858585',
          'editorLineNumber.activeForeground': '#c6c6c6',
        },
      });

      // bqs-vscode: VS Code Dark+ exact palette

      // ── SQL formatter ──────────────────────────────────────────────────────

        if (!raw || !raw.trim()) return raw;
        const IND = '    ';

        {
          const _KWS = new Set(['WHERE','ON','GROUP','ORDER','HAVING','LIMIT','OFFSET',
            'SELECT','FROM','JOIN','LEFT','RIGHT','INNER','OUTER','CROSS','FULL','UNION',
            'INTERSECT','EXCEPT','WITH','AND','OR','NOT','IN','IS','NULL','USING','QUALIFY',
            'WINDOW','PARTITION','OVER','FETCH','LATERAL','UNNEST','TRUE','FALSE','CASE',
            'WHEN','THEN','ELSE','END','BETWEEN','LIKE','DISTINCT','ALL','ANY','SOME',
            'EXISTS','INTO','VALUES','SET','BY','AS','ROLLUP','CUBE','RECURSIVE','SEMI',
            'ANTI','NATURAL','PIVOT','UNPIVOT','DELETE','INSERT','UPDATE','CREATE','DROP',
            'ALTER','VIEW','TABLE','MERGE','MATCHED','TOP','ESCAPE','STRAIGHT']);
          const _uals = new Set(), _tal = {}, _oldAlMap = {};
          const _h2 = [];
          let _r = raw.replace(/('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"|--[^\n]*|\/\*[\s\S]*?\*\/)/g,
            m => { _h2.push(m); return '\x00' + (_h2.length - 1) + '\x00'; });
          // Table ref: backtick-quoted OR unquoted multi-part (proj.dataset.table or dataset.table)
          const _TREF = '(`[^`]+`|(?:[\\w-]+\\.)+[\\w-]+)';
          // Generate short alias from last word-segment of table name (≤3 chars)
          function _ga(ref) {
            const tn = ref.replace(/`/g,'').split('.').pop();
            const pts = tn.split(/[_-]/).filter(Boolean);
            const stem = pts[pts.length - 1] || tn;
            const base = (stem.slice(0, 3) || 'tbl').toLowerCase();
            let a = base, n = 2;
            while (_uals.has(a)) a = base + n++;
            _uals.add(a); return a;
          }
          // Pass 1: scan all FROM/JOIN tables in order and assign new aliases
          for (const _m of [..._r.matchAll(new RegExp('\\b(?:FROM|JOIN)\\s+(' + _TREF.slice(1,-1) + ')', 'gi'))]) {
            const ref = _m[1];
            const tn = ref.replace(/`/g,'').split('.').pop().toLowerCase();
            if (!_tal[tn]) _tal[tn] = _ga(ref);
          }
          // Pass 2: collect old aliases → build old→new remap for col-ref updates
          for (const _m of [..._r.matchAll(new RegExp('\\b(?:FROM|JOIN)\\s+(' + _TREF.slice(1,-1) + ')\\s+(?:AS\\s+)?([a-zA-Z_]\\w*)', 'gi'))]) {
            const ref = _m[1], oldAl = _m[2];
            const tn = ref.replace(/`/g,'').split('.').pop().toLowerCase();
            if (oldAl && !_KWS.has(oldAl.toUpperCase()) && _tal[tn]) {
              const newAl = _tal[tn];
              if (oldAl.toLowerCase() !== newAl.toLowerCase()) _oldAlMap[oldAl.toLowerCase()] = newAl;
            }
          }
          // Pass 3: rewrite all FROM/JOIN refs with new alias (replace any existing alias)
          _r = _r.replace(
            new RegExp('\\b(FROM|(?:(?:LEFT|RIGHT|FULL|INNER|CROSS|OUTER)\\s+)*(?:OUTER\\s+)?JOIN)\\s+(' + _TREF.slice(1,-1) + ')(\\s+AS\\s+([a-zA-Z_]\\w*)|\\s+([a-zA-Z_]\\w*))?', 'gi'),
            (_m2, kw, ref, _ap, asAl, bareAl) => {
              const tn = ref.replace(/`/g,'').split('.').pop().toLowerCase();
              const newAl = _tal[tn];
              if (!newAl) return _m2;
              const trail = (bareAl && !asAl && _KWS.has(bareAl.toUpperCase())) ? ' ' + bareAl : '';
              return kw + ' ' + ref + ' AS ' + newAl + trail;
            }
          );
          // Update old alias col refs: old.col → new.col
          for (const [oldAl, newAl] of Object.entries(_oldAlMap)) {
            _r = _r.replace(new RegExp('\\b' + oldAl.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\.', 'gi'), newAl + '.');
          }
          // Update tableName.col → alias.col
          for (const [tn, al] of Object.entries(_tal)) {
            if (tn && al) _r = _r.replace(new RegExp('\\b' + tn.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\.', 'gi'), al + '.');
          }
          raw = _r.replace(/\x00(\d+)\x00/g, (_, i) => _h2[+i]);
        }

        // Protect string literals, backtick identifiers, and comments
        const hold = [];
        let s = raw.replace(
          /('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"|`[^`]*`|--[^\n]*|\/\*[\s\S]*?\*\/)/g,
          m => { hold.push(m); return '\x01' + (hold.length - 1) + '\x01' + (m[0] === '-' ? '\x02' : ''); }
        );
        s = s.replace(/\s+/g, ' ').trim();

        // Split at depth-0 commas (preserves function call contents)
        function splitCommas(t) {
          const parts = []; let cur = '', d = 0;
          for (let i = 0; i < t.length; i++) {
            const c = t[i];
            if (c === '(' || c === '[') d++;
            else if (c === ')' || c === ']') d--;
            else if (c === ',' && d === 0) { parts.push(cur.trim()); cur = ''; continue; }
            cur += c;
          }
          if (cur.trim()) parts.push(cur.trim());
          return parts;
        }

        // Split at depth-0 AND/OR; handles BETWEEN..AND correctly
        function splitConds(t) {
          const parts = []; let cur = '', d = 0, inBetween = false, i = 0;
          while (i < t.length) {
            const c = t[i];
            if (c === '(' || c === '[') { d++; cur += c; i++; continue; }
            if (c === ')' || c === ']') { d--; cur += c; i++; continue; }
            if (d === 0) {
              const rest = t.slice(i);
              const betM = rest.match(/^BETWEEN(?=\s)/i);
              const andM = rest.match(/^AND(?=\s)/i);
              const orM  = rest.match(/^OR(?=\s)/i);
              if (betM) { inBetween = true; cur += rest.slice(0, betM[0].length); i += betM[0].length; continue; }
              if (andM && inBetween) { inBetween = false; cur += rest.slice(0, andM[0].length); i += andM[0].length; continue; }
              if ((andM || orM) && !inBetween) {
                const kw = andM ? 'AND' : 'OR';
                if (cur.trim()) parts.push(cur.trim());
                cur = kw; i += kw.length; continue;
              }
            }
            cur += c; i++;
          }
          if (cur.trim()) parts.push(cur.trim());
          return parts;
        }

        // CASE…END depth-aware body parser (handles nested CASE)
        function parseCaseBody(s) {
          let pDepth = 0, cDepth = 0, i = 0, cur = '', curKw = null;
          const result = [];
          while (i < s.length) {
            const c = s[i];
            if (c === '(' || c === '[') { pDepth++; cur += c; i++; continue; }
            if (c === ')' || c === ']') { pDepth--; cur += c; i++; continue; }
            if (pDepth === 0) {
              const rest = s.slice(i);
              if (/^CASE\b/i.test(rest)) { cDepth++; cur += rest.slice(0, 4); i += 4; continue; }
              if (cDepth > 0) {
                if (/^END\b/i.test(rest)) { cDepth--; cur += rest.slice(0, 3); i += 3; continue; }
              } else {
                let matched = false;
                for (const kw of ['WHEN', 'THEN', 'ELSE', 'END']) {
                  if (new RegExp('^' + kw + '\\b', 'i').test(rest)) {
                    result.push({ kw: curKw, content: cur.trim() });
                    cur = ''; curKw = kw.toUpperCase(); i += kw.length;
                    if (s[i] === ' ') i++;
                    matched = true; break;
                  }
                }
                if (matched) continue;
              }
            }
            cur += c; i++;
          }
          result.push({ kw: curKw, content: cur.trim() });
          return result;
        }

        // Format a CASE…END column expression; returns array of indented lines, or null
        function formatCaseExpr(expr, baseInd) {
          const trimmed = expr.trim();
          if (!/^CASE\b/i.test(trimmed)) return null;
          const whenInd = baseInd + IND;
          let afterCase = trimmed.slice(4);
          if (afterCase[0] === ' ') afterCase = afterCase.slice(1);
          const parts = parseCaseBody(afterCase);
          const caseSearchExpr = (parts.length && parts[0].kw === null) ? parts[0].content : '';
          const whens = [], thens = [];
          let elsePart = null, endSuffix = '';
          for (const { kw, content } of parts) {
            if (kw === 'WHEN') whens.push(content);
            else if (kw === 'THEN') thens.push(content);
            else if (kw === 'ELSE') elsePart = content;
            else if (kw === 'END') endSuffix = content;
          }
          if (!whens.length) return null;
          const lines = [baseInd + 'CASE' + (caseSearchExpr ? ' ' + caseSearchExpr : '')];
          const n = Math.min(whens.length, thens.length);
          for (let j = 0; j < n; j++) {
            let line = whenInd + 'WHEN ' + whens[j] + ' THEN ' + thens[j];
            if (j === n - 1 && elsePart !== null) line += ' ELSE ' + elsePart;
            lines.push(line);
          }
          lines.push(baseInd + 'END' + (endSuffix ? ' ' + endSuffix : ''));
          return lines;
        }

        // Clause keywords in priority order (most specific first)
        const KWS = [
          ['WITH',             /^WITH(?!\w)/i],
          ['SELECT DISTINCT',  /^SELECT\s+DISTINCT(?!\w)/i],
          ['SELECT ALL',       /^SELECT\s+ALL(?!\w)/i],
          ['SELECT',           /^SELECT(?!\w)/i],
          ['FROM',             /^FROM(?!\w)/i],
          ['LEFT OUTER JOIN',  /^LEFT\s+OUTER\s+JOIN(?!\w)/i],
          ['RIGHT OUTER JOIN', /^RIGHT\s+OUTER\s+JOIN(?!\w)/i],
          ['FULL OUTER JOIN',  /^FULL\s+OUTER\s+JOIN(?!\w)/i],
          ['LEFT JOIN',        /^LEFT\s+JOIN(?!\w)/i],
          ['RIGHT JOIN',       /^RIGHT\s+JOIN(?!\w)/i],
          ['FULL JOIN',        /^FULL\s+JOIN(?!\w)/i],
          ['INNER JOIN',       /^INNER\s+JOIN(?!\w)/i],
          ['CROSS JOIN',       /^CROSS\s+JOIN(?!\w)/i],
          ['JOIN',             /^JOIN(?!\w)/i],
          ['ON',               /^ON(?!\w)/i],
          ['USING',            /^USING(?!\w)/i],
          ['WHERE',            /^WHERE(?!\w)/i],
          ['GROUP BY',         /^GROUP\s+BY(?!\w)/i],
          ['HAVING',           /^HAVING(?!\w)/i],
          ['ORDER BY',         /^ORDER\s+BY(?!\w)/i],
          ['QUALIFY',          /^QUALIFY(?!\w)/i],
          ['LIMIT',            /^LIMIT(?!\w)/i],
          ['OFFSET',           /^OFFSET(?!\w)/i],
          ['UNION ALL',        /^UNION\s+ALL(?!\w)/i],
          ['UNION',            /^UNION(?!\w)/i],
          ['INTERSECT',        /^INTERSECT(?!\w)/i],
          ['EXCEPT',           /^EXCEPT(?!\s*\()(?!\w)/i],
        ];

        // Parse sql into depth-0 clause segments [{kw, content}]
        function parseSegs(sql) {
          const breaks = [];
          let depth = 0;
          for (let i = 0; i < sql.length; i++) {
            const c = sql[i];
            if (c === '(' || c === '[') { depth++; continue; }
            if (c === ')' || c === ']') { depth--; continue; }
            if (depth === 0 && /[A-Za-z]/.test(c)) {
              const prevIsWord = i > 0 && /\w/.test(sql[i - 1]);
              if (!prevIsWord) {
                const rest = sql.slice(i);
                for (const [kwName, re] of KWS) {
                  const m = rest.match(re);
                  if (m && m.index === 0) {
                    breaks.push({ pos: i, kw: kwName, kwLen: m[0].length });
                    i += m[0].length - 1;
                    break;
                  }
                }
              }
            }
          }
          if (!breaks.length) return [{ kw: null, content: sql.trim() }];
          const segs = [];
          if (breaks[0].pos > 0) {
            const pre = sql.slice(0, breaks[0].pos).trim();
            if (pre) segs.push({ kw: null, content: pre });
          }
          for (let i = 0; i < breaks.length; i++) {
            const { pos, kw, kwLen } = breaks[i];
            const end = i + 1 < breaks.length ? breaks[i + 1].pos : sql.length;
            segs.push({ kw, content: sql.slice(pos + kwLen, end).trim() });
          }
          return segs;
        }

        // Format CTE list; recursively formats each body
        function fmtCTEs(content, ind) {
          let s2 = content.trim();
          let prefix = '';
          const recM = s2.match(/^RECURSIVE\s+/i);
          if (recM) { prefix = 'RECURSIVE '; s2 = s2.slice(recM[0].length); }
          const parts = splitCommas(s2);
          const lines = parts.map((part, idx) => {
            part = part.trim();
            const m = part.match(/^(\S+)\s+AS\s*\(([\s\S]*)\)\s*$/i);
            if (!m) return ind + IND + part;
            const body = fmtSegs(parseSegs(m[2].trim()), ind + IND + IND);
            const comma = idx < parts.length - 1 ? ',' : '';
            return ind + IND + m[1] + ' AS (\n' + body + '\n' + ind + IND + ')' + comma;
          });
          return prefix + '\n' + lines.join('\n');
        }

        const JOIN_KWS = new Set([
          'JOIN','LEFT JOIN','RIGHT JOIN','FULL JOIN','INNER JOIN','CROSS JOIN',
          'LEFT OUTER JOIN','RIGHT OUTER JOIN','FULL OUTER JOIN',
        ]);

        function fmtSegs(segs, ind) {
          const ci = ind + IND;
          const out = [];
          for (let si = 0; si < segs.length; si++) {
            const { kw, content } = segs[si];
            if (kw === null) { if (content) out.push(ind + content); continue; }
            const kwUP = kw.toUpperCase();
            if (kwUP === 'SELECT' || kwUP === 'SELECT DISTINCT' || kwUP === 'SELECT ALL') {
              out.push(ind + kwUP);
              const cols = splitCommas(content);
              cols.forEach((col, i) => {
                const comma = i < cols.length - 1 ? ',' : '';
                const caseLines = formatCaseExpr(col.trim(), ci);
                if (caseLines) {
                  caseLines[caseLines.length - 1] += comma;
                  caseLines.forEach(l => out.push(l));
                } else {
                  out.push(ci + col + comma);
                }
              });
            } else if (kwUP === 'WHERE' || kwUP === 'HAVING' || kwUP === 'QUALIFY') {
              out.push(ind + kwUP);
              if (kwUP === 'WHERE') {
                const conds = splitConds(content);
                // Check if first condition is already 1=1
                const firstNorm = (conds[0] || '').replace(/\s+/g,'').toLowerCase();
                const has1eq1 = firstNorm === '1=1';
                const norm = ['1=1'];
                const start = has1eq1 ? 1 : 0;
                for (let _ci = start; _ci < conds.length; _ci++) {
                  const c = conds[_ci];
                  norm.push(/^(AND|OR)\b/i.test(c) ? c : 'AND ' + c);
                }
                norm.forEach(c => out.push(ci + c));
              } else {
                splitConds(content).forEach(c => out.push(ci + c));
              }
            } else if (kwUP === 'GROUP BY' || kwUP === 'ORDER BY') {
              if (kwUP === 'GROUP BY') {
                const items = splitCommas(content);
                // All-integer positional group → collapse to GROUP BY ALL
                if (items.every(it => /^\d+$/.test(it.trim()))) {
                  out.push(ind + 'GROUP BY ALL');
                } else {
                  out.push(ind + 'GROUP BY ' + items.join(', '));
                }
              } else {
                const items = splitCommas(content);
                out.push(ind + 'ORDER BY ' + items.join(', '));
              }
            } else if (kwUP === 'WITH') {
              out.push(ind + 'WITH' + fmtCTEs(content, ind));
            } else if (kwUP === 'ON') {
              // Standalone ON (not consumed by JOIN look-ahead) — keep on its own line
              const conds = splitConds(content);
              out.push(ind + 'ON ' + (conds[0] || ''));
              conds.slice(1).forEach(c => out.push(ci + c));
            } else if (kwUP === 'UNION ALL' || kwUP === 'UNION' || kwUP === 'INTERSECT' || kwUP === 'EXCEPT') {
              out.push(''); out.push(ind + kwUP); out.push('');
            } else if (JOIN_KWS.has(kwUP)) {
              // Merge JOIN table with the following ON/USING onto one line
              let line = ind + kwUP + (content ? ' ' + content : '');
              if (si + 1 < segs.length) {
                const nextKw = (segs[si + 1].kw || '').toUpperCase();
                if (nextKw === 'ON' || nextKw === 'USING') {
                  si++;
                  line += ' ' + nextKw + ' ' + segs[si].content.replace(/\s+/g, ' ').trim();
                }
              }
              out.push(line);
            } else {
              out.push(content ? ind + kwUP + ' ' + content : ind + kwUP);
            }
          }
          return out.join('\n');
        }

        const segs = parseSegs(s);
        if (!segs.length) return raw;
        let result = fmtSegs(segs, '');
        // Uppercase SQL keywords/functions/types (strings are still placeholders)
        result = result.replace(/\b(SELECT|FROM|WHERE|JOIN|LEFT|RIGHT|INNER|OUTER|CROSS|FULL|ANTI|SEMI|NATURAL|ON|AS|AND|OR|NOT|IN|IS|NULL|LIKE|ILIKE|BETWEEN|EXISTS|ANY|SOME|ALL|CASE|WHEN|THEN|ELSE|END|GROUP|BY|ORDER|HAVING|LIMIT|OFFSET|FETCH|FIRST|NEXT|ONLY|DISTINCT|UNION|EXCEPT|INTERSECT|WITH|RECURSIVE|QUALIFY|OVER|PARTITION|ROWS|RANGE|WINDOW|LATERAL|UNNEST|TRUE|FALSE|ASC|DESC|NULLS|USING|IGNORE|RESPECT|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|VIEW|DROP|ALTER|ADD|COLUMN|RENAME|ROLLUP|CUBE|GROUPING|SETS|TOP|ESCAPE|COUNT|SUM|AVG|MIN|MAX|ANY_VALUE|ARRAY_AGG|STRING_AGG|COUNTIF|COALESCE|IFNULL|NULLIF|IF|CAST|SAFE_CAST|CONCAT|SUBSTR|SUBSTRING|LOWER|UPPER|TRIM|LTRIM|RTRIM|LENGTH|FORMAT|EXTRACT|CURRENT_DATE|CURRENT_DATETIME|CURRENT_TIMESTAMP|CURRENT_TIME|DATE_ADD|DATE_SUB|DATE_DIFF|DATE_TRUNC|TIMESTAMP_ADD|TIMESTAMP_SUB|ABS|CEIL|FLOOR|ROUND|MOD|POWER|SQRT|RAND|ROW_NUMBER|RANK|DENSE_RANK|LAG|LEAD|FIRST_VALUE|LAST_VALUE|ARRAY_LENGTH|ARRAY_CONCAT|GENERATE_ARRAY|MD5|SHA256|JSON_VALUE|TO_JSON_STRING|GENERATE_UUID|REPLACE|STRING|BYTES|INT64|INT|INTEGER|SMALLINT|BIGINT|FLOAT64|FLOAT|NUMERIC|BIGNUMERIC|DECIMAL|BOOL|BOOLEAN|DATE|TIME|DATETIME|TIMESTAMP|INTERVAL|JSON|GEOGRAPHY|ARRAY|STRUCT|RECORD|VARCHAR|CHAR)\b/gi, m => m.toUpperCase());
        result = result.replace(/\x02/g, '\n');
        result = result.replace(/\x01(\d+)\x01/g, (_, i) => hold[+i]);
        return result.replace(/[;\s]+$/, '') + ';\n';
      }

      // Register as Monaco document formatter (Shift+Alt+F)
      monaco.languages.registerDocumentFormattingEditProvider('bigquery-sql', {
        provideDocumentFormattingEdits(model) {
          return [{ range: model.getFullModelRange(), text: formatSQL(model.getValue()) }];
        },
      });

      // Format button — formats selection if present, otherwise whole document
      document.getElementById('format-btn').addEventListener('click', () => {
        const sel = editor.getSelection();
        if (sel && !sel.isEmpty()) {
          const raw = editor.getModel().getValueInRange(sel);
          const formatted = formatSQL(raw).replace(/[;\s]+$/, '');
          editor.executeEdits('format-selection', [{ range: sel, text: formatted }]);
          editor.focus();
        } else {
          editor.getAction('editor.action.formatDocument').run();
        }
      });

      // Comment toggle button
      document.getElementById('comment-btn').addEventListener('click', () => {
        editor.trigger('comment-btn', 'editor.action.commentLine', {});
        editor.focus();
      });
      editor.onKeyDown(e => {
        const be = e.browserEvent;
        if (matchKeybinding(be, 'runQuery'))  { e.preventDefault(); e.stopPropagation(); runQuery(); }
        if (matchKeybinding(be, 'stopQuery')) { e.preventDefault(); e.stopPropagation(); stopQuery(); }
      });
      editor.onDidChangeModelContent(() => refreshQueryTree());
      refreshQueryTree();
    });
  };
  loaderScript.onerror = function() {
    console.warn('Monaco CDN failed to load — using textarea editor');
  };
  document.head.appendChild(loaderScript);
})();
</script>

</body>
