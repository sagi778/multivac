.story-col-search:focus { outline:1px solid var(--accent); outline-offset:-1px; }
.coldesc-header { display:flex; align-items:center; gap:8px; margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--border); }
.coldesc-name { font-weight:600; color:var(--col-color); font-family:monospace; font-size:12px; }
.coldesc-badge { font-size:10px; padding:1px 5px; border-radius:3px; background:var(--bg3); border:1px solid var(--border); font-weight:500; }
.coldesc-stats { display:flex; flex-wrap:wrap; gap:8px 18px; }
.coldesc-stat { display:flex; flex-direction:column; gap:1px; min-width:72px; }
.coldesc-key { font-size:10px; color:var(--text2); }
.coldesc-val { font-size:12px; font-weight:600; font-variant-numeric:tabular-nums; }
.coldesc-top { margin-top:10px; }
.coldesc-top-label { font-size:10px; color:var(--text2); margin-bottom:5px; }
.coldesc-top-row { display:flex; align-items:center; gap:6px; margin-bottom:3px; font-size:11px; }
.coldesc-top-val { color:var(--text); font-family:monospace; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex-shrink:0; }
.coldesc-bar-wrap { flex:1; height:6px; background:var(--bg3); border-radius:2px; overflow:hidden; }
.coldesc-bar { height:6px; background:var(--accent); border-radius:2px; opacity:0.75; }
.coldesc-count { font-size:10px; color:var(--text2); flex-shrink:0; }
.story-fold-icon { transition:transform 0.15s; display:inline-block; line-height:0; }
.story-block.folded .story-fold-icon { transform:rotate(-90deg); }
.histogram-wrap { overflow:auto; max-width:100%; max-height:1000px; padding-bottom:4px; }
.coldesc-dist-wrap { width:100%; margin-top:6px; }
.coldesc-bias-row { display:flex; align-items:center; gap:6px; font-size:11px; padding:2px 0 4px; }
.coldesc-bias-lbl { color:var(--text2); }
.coldesc-bias-val { font-weight:600; font-family:monospace; }
.coldesc-bias-hint { font-size:10px; color:var(--text2); opacity:0.7; }

/* ── DAG visualizer ── */
.dag-wrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 0; min-width: 400px; padding-bottom: 24px; }
.dag-level { display: flex; justify-content: center; gap: 20px; padding: 4px 24px; flex-wrap: nowrap; }
.dag-level-gap { height: 52px; width: 100%; flex-shrink: 0; }
.dag-svg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.dag-edge { fill: none; stroke: var(--border); stroke-width: 1.5; }
.dag-edge-join { stroke: #569cd6; stroke-width: 2; }
.dag-edge-union { stroke: #c586c0; stroke-width: 2; }
.dag-card { min-width: 160px; max-width: 280px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg2); overflow: hidden; transition: border-color 0.15s; flex-shrink: 0; }
.dag-card.open { max-width: none; overflow: visible; }
.dag-card:hover { border-color: var(--accent); }
.dag-card.type-source { border-left: 3px solid #ce9178; }
.dag-card.type-cte    { border-left: 3px solid #c586c0; }
.dag-card.type-main   { border-left: 3px solid #569cd6; }
.dag-card-header { display: flex; align-items: center; gap: 5px; padding: 7px 8px; cursor: pointer; user-select: none; }
.dag-card-header:hover { background: var(--node-hover); }
.dag-card-icon { flex-shrink: 0; width: 14px; height: 14px; display: flex; align-items: center; }
.dag-card-icon svg { width: 14px; height: 14px; }
.dag-card-name { flex: 1; font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dag-btn { flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; border-radius: 3px; padding: 2px 4px; color: var(--text2); transition: color 0.1s, background 0.1s; }
.dag-btn:hover { color: var(--text); background: var(--bg3); }
.dag-btn svg { width: 11px; height: 11px; }
.dag-btn.run-btn:hover { color: #4ec9b0; }
#dag-run-menu { position: fixed; z-index: 9999; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 4px 14px var(--shadow-color); overflow: hidden; display: none; min-width: 160px; }
#dag-run-menu button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 14px; background: none; border: none; color: var(--text); font-size: 12px; cursor: pointer; white-space: nowrap; text-align: left; font-family: inherit; }
#dag-run-menu button:hover { background: var(--node-hover); color: var(--accent); }
/* Details panel — shown when card is open */
.dag-card-details { display: none; border-top: 1px solid var(--border2); }
.dag-card.open .dag-card-details { display: block; }
.dag-card-header { cursor: pointer; }
/* Column list inside details */
.dag-card-cols { display: flex; }
.dag-col-group { flex: 1; min-width: 80px; border-left: 1px solid var(--border2); padding: 3px 0; }
.dag-col-group:first-child { border-left: none; }
.dag-col-group-header { padding: 2px 10px 3px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.65; border-bottom: 1px solid var(--border2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Sources section inside details */
.dag-card-sources { border-top: 1px solid var(--border2); padding: 3px 0; }
.dag-card-section-hd { padding: 2px 10px 2px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.55; color: var(--text2); }
.dag-col-group-various { color: #c586c0 !important; opacity: 0.8 !important; font-style: italic; letter-spacing: 0.03em; }
.dag-card-source-row { display: flex; align-items: center; gap: 5px; padding: 2px 10px; font-size: 11px; color: var(--text2); }
.dag-card-source-alias { font-style: italic; opacity: 0.7; font-size: 10px; }
/* SQL hover tooltip */
.dag-tooltip { display: none; position: fixed; z-index: 9999; max-width: 480px; max-height: 240px; overflow: auto; background: var(--bg3); border: 1px solid var(--border); border-radius: 5px; padding: 8px 12px; font-family: 'Menlo','Monaco','Courier New',monospace; font-size: 11px; color: var(--text); white-space: pre; pointer-events: none; box-shadow: 0 4px 18px var(--shadow-strong); line-height: 1.5; }
.dag-col-row { display: flex; align-items: center; gap: 5px; padding: 2px 10px; font-size: 11px; color: var(--text2); cursor: default; white-space: nowrap; }
.dag-col-row:hover { background: var(--node-hover); }
.dag-col-unknown { color: var(--text2); }
.dag-col-unknown:hover { color: var(--text); }
.dag-col-icon { flex-shrink: 0; width: 10px; height: 10px; display: flex; align-items: center; }
.dag-col-icon svg { width: 10px; height: 10px; }
.dag-col-type { font-size: 9px; opacity: 0.6; margin-left: 2px; font-family: 'Menlo','Monaco','Courier New',monospace; }
.dag-card-filters { border-top: 1px solid var(--border2); padding: 3px 0; }
.dag-filter-row { display: flex; align-items: flex-start; gap: 5px; padding: 2px 10px; font-size: 10px; color: var(--text2); font-family: 'Menlo','Monaco','Courier New',monospace; white-space: pre-wrap; word-break: break-all; line-height: 1.4; }
.dag-empty { padding: 40px 24px; text-align: center; color: var(--text2); font-style: italic; font-size: 13px; }

/* Column type colors */
.dag-col-string  { color: #c586c0; }
.dag-col-numeric { color: #2d9e6b; }
.dag-col-time    { color: #f44747; }
.dag-col-bool    { color: #ce9178; }
.dag-col-grouped { font-weight: 700; }

/* JOIN/UNION badge on card header */
.dag-inputs-badge { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px; flex-shrink: 0; letter-spacing: 0.04em; }
.dag-inputs-badge.type-join  { background: rgba(86,156,214,0.15); color: #569cd6; border: 1px solid rgba(86,156,214,0.5); }
.dag-inputs-badge.type-union { background: rgba(197,134,192,0.15); color: #c586c0; border: 1px solid rgba(197,134,192,0.5); }

/* Legend — sticky top bar */
.dag-legend {
  position: sticky; top: 0; z-index: 2;
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  background: transparent;
  padding: 6px 14px; font-size: 10px; color: var(--text2);
}
.dag-legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 3px; flex-shrink: 0; }
.dag-legend-item { display: flex; align-items: center; gap: 2px; }
.dag-legend-bold { font-weight: 700; font-size: 11px; color: var(--text); margin-right: 2px; }
.dag-legend-icon { display: inline-flex; align-items: center; width: 11px; height: 11px; margin-right: 3px; }
.dag-legend-icon svg { width: 11px; height: 11px; }


/* Preview panel */
#preview-panel { display: none; flex: 1; overflow: hidden; flex-direction: column; border-top: 1px solid var(--border); }
#preview-header { padding: 8px 14px; background: var(--bg2); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text2); flex-shrink: 0; }
#preview-results { flex: 1; overflow: auto; }
#preview-error { margin: 10px; padding: 10px 14px; background: var(--error-bg); border: 1px solid var(--error-color); border-radius: 4px; color: var(--error-color); font-family: monospace; font-size: 12px; display: none; }

/* Dynamic per-node preview tabs */
.preview-tab-panel { display: none; flex: 1; overflow: hidden; flex-direction: column; border-top: 1px solid var(--border); }
.preview-dyn-header { padding: 8px 14px; background: var(--bg2); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text2); flex-shrink: 0; }
.preview-dyn-results { flex: 1; overflow: auto; }
.preview-dyn-error { margin: 10px; padding: 10px 14px; background: var(--error-bg); border: 1px solid var(--error-color); border-radius: 4px; color: var(--error-color); font-family: monospace; font-size: 12px; }
.main-tab.preview-dyn-tab { display: flex; align-items: center; gap: 5px; padding-right: 6px; }
.main-tab-close { background: none; border: none; cursor: pointer; color: var(--text2); font-size: 14px; line-height: 1; padding: 0 2px; border-radius: 2px; display: flex; align-items: center; }
.main-tab-close:hover { color: var(--text); background: var(--bg3); }

/* Workspace tabs bar */
#ws-bar { display: flex; align-items: stretch; justify-content: space-between; background: var(--bg); border-top: 1px solid var(--border); padding: 4px 8px 0; flex-shrink: 0; overflow-x: auto; gap: 2px; position: relative; z-index: 2; }
#ws-bar::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px; background: var(--border); pointer-events: none; z-index: 0; }
#ws-bar::-webkit-scrollbar { height: 0; }
#ws-bar-left, #ws-bar-right { display: flex; align-items: stretch; gap: 2px; }
#ws-bar-right { border-left: 1px solid var(--border2); padding-left: 8px; margin-left: 4px; flex-shrink: 0; }
.ws-tab { display: flex; align-items: center; gap: 5px; padding: 5px 8px 5px 10px; border: 1px solid transparent; border-radius: 5px 5px 0 0; background: none; color: var(--text2); cursor: pointer; font-size: 12px; white-space: nowrap; flex-shrink: 0; max-width: 180px; position: relative; z-index: 1; transition: color 0.1s, background 0.1s; }
.ws-tab:hover { background: var(--bg3); color: var(--text); }
.ws-tab.active { background: var(--bg2); color: var(--text); border-color: var(--border); border-bottom-color: var(--bg2); box-shadow: 0 -3px 8px -1px var(--shadow-color); z-index: 2; }
.ws-tab-icon { display: flex; align-items: center; flex-shrink: 0; opacity: 0.5; transition: opacity 0.1s; }
.ws-tab:hover .ws-tab-icon, .ws-tab.active .ws-tab-icon { opacity: 0.85; }
.ws-tab.ws-tab-dashboard .ws-tab-icon { color: var(--accent); }
.ws-tab-name { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 20px; outline: none; background: none; border: none; color: inherit; font: inherit; cursor: pointer; padding: 0; }
.ws-tab-name:focus { cursor: text; color: var(--text); }
.ws-tab-close { background: none; border: none; cursor: pointer; padding: 0 2px; color: var(--text2); border-radius: 2px; font-size: 14px; line-height: 1; opacity: 0; display: flex; align-items: center; flex-shrink: 0; }
.ws-tab:hover .ws-tab-close, .ws-tab.active .ws-tab-close { opacity: 0.7; }
.ws-tab-close:hover { opacity: 1 !important; color: var(--text); background: var(--bg3); }
.ws-running-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; animation: ws-pulse 1.2s ease-in-out infinite; }
@keyframes ws-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
.ws-add-btn { background: none; border: 1px solid transparent; border-radius: 4px; cursor: pointer; padding: 3px 9px; color: var(--text2); font-size: 17px; line-height: 1; flex-shrink: 0; align-self: center; margin-left: 2px; }
.ws-add-btn:hover { color: var(--text); background: var(--bg2); border-color: var(--border); }
.ws-tab.drag-over-tab { border-color: var(--accent) !important; background: var(--node-hover) !important; }
.ws-tab-dragging { opacity: 0.45; }
.ws-tab-drop-before::before { content:''; position:absolute; left:-1px; top:20%; bottom:20%; width:2px; background:var(--accent); border-radius:1px; z-index:10; pointer-events:none; }
.ws-tab-drop-after::after { content:''; position:absolute; right:-1px; top:20%; bottom:20%; width:2px; background:var(--accent); border-radius:1px; z-index:10; pointer-events:none; }
/* Dashboard panel */
#dashboard-panel { display: none; flex: 1; overflow: auto; padding: 14px; background: var(--bg); }
#main.dashboard-active #toolbar, #main.dashboard-active #main-tabs, #main.dashboard-active #editor-split,
#main.dashboard-active #query-tree-panel, #main.dashboard-active #preview-panel,
#main.dashboard-active #story-panel, #main.dashboard-active #resizer-h,
#main.dashboard-active #results-area { display: none !important; }
#main.dashboard-active #dashboard-panel { display: flex; flex-wrap: wrap; align-content: flex-start; align-items: flex-start; gap: 12px; }
/* Dashboard widgets */
.dash-widget { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; min-width: 280px; flex: 1 1 280px; display: flex; flex-direction: column; }
.dash-widget-hdr { display: flex; align-items: center; gap: 6px; padding: 5px 10px; background: var(--bg3); border-bottom: 1px solid var(--border2); flex-shrink: 0; }
.dash-widget-title { flex: 1; font-size: 12px; font-weight: 600; color: var(--text); outline: none; background: none; border: none; font-family: inherit; cursor: pointer; padding: 0; }
.dash-widget-title:focus { outline: 1px solid var(--accent); border-radius: 2px; outline-offset: 1px; cursor: text; }
.dash-widget-close { background: none; border: none; cursor: pointer; color: var(--text2); padding: 2px 3px; border-radius: 2px; font-size: 14px; line-height: 1; opacity: 0; display: flex; align-items: center; }
.dash-widget:hover .dash-widget-close { opacity: 0.7; }
.dash-widget-close:hover { opacity: 1 !important; color: var(--text); background: var(--node-hover); }
.dash-widget-body { overflow: auto; max-height: 380px; background: var(--bg); color: var(--text); flex: 1; }
.dash-widget-body.plot-body { background: transparent; max-height: none; overflow: visible; padding: 8px 8px 4px; }
.dash-widget-body.text-body { padding: 10px; }
.dash-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 200px; color: var(--text2); font-size: 13px; text-align: center; }
.dash-drop-zone { flex-basis: 100%; min-height: 60px; border: 2px dashed var(--border); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--text2); font-size: 12px; transition: border-color 0.15s, color 0.15s; cursor: default; }
.dash-drop-zone.drag-over { border-color: var(--accent); color: var(--accent); }
/* Pin-to-dashboard button on story blocks */
.story-block-btn.story-pin-btn { cursor: grab; }
.story-block-btn.story-pin-btn:active { cursor: grabbing; }
/* Story blocks inside dashboard panel */
#dashboard-panel .story-block { min-width: 280px; flex: 0 0 auto; box-shadow: 0 2px 10px var(--shadow-color); }
/* Dashboard text widget */
.dash-text-widget { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 2px 10px var(--shadow-color); min-width: 200px; flex: 0 0 auto; display: flex; flex-direction: column; }
.dash-text-hdr { display: flex; align-items: center; gap: 6px; padding: 5px 10px; background: var(--bg3); border-bottom: 1px solid var(--border2); border-radius: 6px 6px 0 0; }
.dash-text-title-inp { flex: 1; font-size: 12px; font-weight: 600; color: var(--text); outline: none; background: none; border: none; font-family: inherit; cursor: pointer; padding: 0; }
.dash-text-title-inp:focus { outline: 1px solid var(--accent); border-radius: 2px; outline-offset: 1px; cursor: text; }
.dash-text-close { background: none; border: none; cursor: pointer; color: var(--text2); padding: 2px 4px; border-radius: 2px; font-size: 14px; line-height: 1; opacity: 0; display: flex; align-items: center; }
.dash-text-widget:hover .dash-text-close { opacity: 0.7; }
.dash-text-close:hover { opacity: 1 !important; color: var(--text); background: var(--node-hover); }
.dash-text-body { padding: 8px 12px; }
.dash-text-area { width: 100%; min-height: 60px; min-width: 200px; background: none; border: none; outline: none; color: var(--text); font-size: 13px; font-family: inherit; resize: both; line-height: 1.6; }
/* Dashboard toolbar */
.dash-toolbar { flex-basis: 100%; display: flex; gap: 8px; padding-bottom: 6px; }
.dash-toolbar-btn { display: flex; align-items: center; gap: 5px; padding: 4px 10px; background: none; border: 1px solid var(--border); border-radius: 4px; color: var(--text2); font-size: 12px; cursor: pointer; }
.dash-toolbar-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--node-hover); }

/* Main area */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#toolbar { height: 40px; background: var(--bg2); display: flex; align-items: center; padding: 0 12px; gap: 10px; flex-shrink: 0; }
#toolbar-icon-group { display: flex; align-items: center; gap: 2px; }
#toolbar-title { display: none; }
#run-btn { display: flex; align-items: center; gap: 6px; padding: 4px 14px; background: var(--accent); border: none; border-radius: 4px; color: #fff; cursor: pointer; font-size: 13px; font-weight: 500; }
#run-btn:hover { background: var(--accent-hover); }
#run-btn:disabled { background: #555; cursor: not-allowed; }
#stop-btn { display: none; align-items: center; gap: 6px; padding: 4px 14px; background: #8b2020; border: none; border-radius: 4px; color: #fff; cursor: pointer; font-size: 13px; font-weight: 500; }
#stop-btn:hover { background: #a82828; }
#format-btn { display: flex; align-items: center; gap: 5px; padding: 3px 10px; background: none; border: none; color: var(--toolbar-icon); cursor: pointer; font-size: 12px; border-radius: 4px; }
#format-btn:hover { background: var(--node-hover); color: var(--text); }
#format-btn svg { width: 15px; height: 15px; }
#run-hint { color: var(--text2); font-size: 11px; }
@keyframes tree-flash { 0% { background: transparent; } 25% { background: var(--accent); color: #fff; } 100% { background: transparent; } }
.tree-node.tree-highlight { animation: tree-flash 1.4s ease forwards; }
.fav-edit-btn { display: none; padding: 0 4px; font-size: 12px; background: none; border: none; color: var(--text2); cursor: pointer; border-radius: 2px; flex-shrink: 0; }
.fav-item:hover .fav-edit-btn { display: block; }
.fav-edit-btn:hover { color: var(--accent); }
.fav-rename-input { flex: 1; background: var(--bg3); border: 1px solid var(--accent); border-radius: 3px; color: var(--text); font-size: 12px; padding: 1px 6px; outline: none; font-family: inherit; min-width: 0; }
#main-tabs { display: flex; flex-shrink: 0; background: var(--bg2); position: relative; z-index: 1; }
.main-tab { padding: 7px 14px; font-size: 12px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--text2); cursor: pointer; margin-bottom: -1px; transition: color 0.1s, border-color 0.1s; }
.main-tab:hover { color: var(--text); }
.main-tab.active { color: var(--text); border-bottom-color: var(--accent); }
#editor-split { flex: none; display: flex; flex-direction: row; min-height: 0; overflow: hidden; border-top: 1px solid var(--border); }
#editor-container { flex: 1; min-width: 200px; min-height: 0; position: relative; z-index: 1; box-shadow: inset -5px 0 14px -4px rgba(0,0,0,0.15); }
#resizer-tree { width: 5px; flex-shrink: 0; background: transparent; cursor: col-resize; }
#resizer-tree:hover, #resizer-tree.dragging { background: transparent; }
#editor-fallback { width: 100%; height: 100%; background: var(--bg); color: var(--text); border: none; resize: none; outline: none; font-family: 'Menlo', 'Monaco', 'Courier New', monospace; font-size: 14px; padding: 12px; line-height: 1.5; }
#query-tree-panel { display: flex; flex-direction: column; min-height: 0; width: 320px; flex-shrink: 0; }
#query-tree-panel.qt-folded { width: 36px; min-width: 36px; overflow: hidden; }
#query-tree-panel.qt-folded > *:not(.qt-panel-header) { display: none !important; }
#query-tree-panel.qt-folded .qt-panel-title { display: none; }
.qt-tree-body { flex: 1; overflow-y: auto; padding: 8px 4px; min-height: 0; }
.qt-panel-header { display: flex; align-items: center; justify-content: flex-start; padding: 6px 6px; border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--bg2); }
.qt-fold-btn { background: none; border: none; cursor: pointer; color: var(--text2); padding: 2px 6px; border-radius: 3px; display: flex; align-items: center; line-height: 1; flex-shrink: 0; }
.qt-fold-btn:hover { color: var(--text); background: var(--node-hover); }
.qt-fold-btn svg { width: 21px; height: 21px; flex-shrink: 0; }
.qt-panel-title { font-size: 11px; font-weight: 600; color: var(--text2); white-space: nowrap; text-transform: uppercase; letter-spacing: 0.06em; margin-left: 6px; }
.qt-block-toggle { background: none; border: none; cursor: pointer; color: var(--text2); padding: 0 2px; display: flex; align-items: center; flex-shrink: 0; border-radius: 2px; line-height: 1; }
.qt-block-toggle:hover { color: var(--text); }
.qt-block-toggle svg { width: 10px; height: 10px; transition: transform 0.12s; }
.qt-block.collapsed > .qt-children { display: none; }
.qt-block.collapsed .qt-block-toggle svg { transform: rotate(-90deg); }
.qt-search-wrap { display: flex; align-items: center; gap: 4px; padding: 4px 6px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.qt-search-inp { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 3px; color: var(--text); font-size: 11px; padding: 3px 7px; outline: none; }
.qt-search-inp:focus { border-color: var(--accent); }
.qt-search-inp::placeholder { color: var(--text2); opacity: 0.55; }
.qt-search-clr { background: none; border: none; cursor: pointer; color: var(--text2); padding: 2px 4px; border-radius: 3px; font-size: 13px; line-height: 1; display: none; }
.qt-search-clr.visible { display: block; }
.qt-search-clr:hover { color: var(--text); background: var(--node-hover); }
.qt-node.qt-search-hit { border-color: var(--accent); background: rgba(var(--accent-rgb, 86,156,214), 0.15); }
.qt-header.qt-search-hit { background: var(--node-hover); color: var(--accent); }
.qt-search-hidden { opacity: 0.25; }
.qt-search-editor-hit-inline { background: rgba(255,200,0,0.25); border-radius: 2px; outline: 1px solid rgba(255,200,0,0.5); }
/* Query Tree — detail bar */
#qt-detail-bar { display: none; flex-shrink: 0; padding: 10px 36px 10px 12px; background: var(--bg); border-bottom: 2px solid var(--accent); position: relative; max-height: 220px; overflow-y: auto; font-family: 'Cascadia Code', 'Consolas', 'SF Mono', 'Menlo', monospace; }
.qt-detail-title { font-size: 12px; font-weight: 700; color: var(--title-color); margin-bottom: 6px; font-family: inherit; letter-spacing: 0.01em; }
.qt-detail-join-title { color: #4ec9b0; }
.qt-detail-row { display: flex; gap: 6px; margin-bottom: 3px; font-size: 11px; line-height: 1.5; align-items: flex-start; }
.qt-detail-label { color: #569cd6; min-width: 60px; flex-shrink: 0; font-size: 10px; font-weight: 600; text-transform: uppercase; padding-top: 2px; letter-spacing: 0.04em; font-family: inherit; }
.qt-detail-value { font-family: inherit; white-space: pre-wrap; word-break: break-all; }
.qt-dv-alias { color: var(--col-color); }
.qt-dv-join  { color: #569cd6; font-weight: 700; }
.qt-dv-cond  { color: #ce9178; }
.qt-dv-filters { color: var(--warn-color); }
.qt-detail-cols { display: flex; flex-direction: column; gap: 1px; }
.qt-detail-col-row { display: flex; align-items: center; gap: 5px; }
.qt-dv-colname { color: var(--col-color); font-family: inherit; font-size: 11px; font-weight: 600; background: var(--bg3); padding: 1px 5px; border-radius: 3px; border: 1px solid var(--border2); }
.qt-dv-type { color: #4ec9b0; font-family: inherit; font-size: 10px; opacity: 0.8; }
.qt-detail-close { position: absolute; top: 8px; right: 8px; background: none; border: none; cursor: pointer; color: var(--text2); font-size: 16px; line-height: 1; padding: 2px 5px; border-radius: 3px; }
.qt-detail-close:hover { color: var(--text); background: var(--bg3); }
/* Play button on chips */
.qt-play-btn { background: none; border: none; cursor: pointer; color: var(--text2); padding: 1px 3px; margin-left: 2px; border-radius: 2px; display: inline-flex; align-items: center; opacity: 0; transition: opacity 0.12s; flex-shrink: 0; line-height: 1; }
.qt-play-btn svg { width: 9px; height: 10px; }
.qt-node:hover .qt-play-btn, .qt-header:hover .qt-play-btn { opacity: 0.7; }
.qt-play-btn:hover { opacity: 1 !important; color: var(--accent); background: rgba(255,255,255,0.08); }
/* Query Tree — top-to-bottom structured layout */
.qt-block { padding: 2px 0 8px; }
.qt-header { display: flex; align-items: center; gap: 6px; padding: 4px 8px; cursor: pointer; border-radius: 4px; font-size: 12px; user-select: none; white-space: nowrap; }
.qt-header:hover { background: var(--node-hover); }
.qt-header .qt-label { font-weight: 500; }
.qt-children { margin-left: 12px; padding: 2px 0 2px 8px; border-left: 1px solid var(--border); }
.qt-join-group { display: flex; align-items: flex-start; gap: 4px; flex-wrap: wrap; padding: 2px 0; }
.qt-union-group { display: flex; align-items: flex-start; gap: 4px; flex-wrap: wrap; padding: 2px 0; }
.qt-union-part { display: flex; align-items: flex-start; }
.qt-item-wrap { display: flex; flex-direction: column; }
.qt-item-wrap > .qt-children { margin-top: 2px; }
.qt-node { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 4px; cursor: pointer; background: var(--bg3); border: 1px solid var(--border); font-size: 11px; user-select: none; white-space: nowrap; }
.qt-node.has-cols { flex-direction: column; align-items: flex-start; gap: 3px; white-space: normal; min-width: 0; }
.qt-node-header { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.qt-inline-cols { display: flex; flex-wrap: wrap; gap: 2px 3px; border-top: 1px solid var(--border); padding-top: 3px; width: 100%; }
.qt-inline-col { font-size: 9px; padding: 1px 5px; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; color: var(--text2); white-space: nowrap; }
.qt-inline-col.is-star { color: var(--accent); border-color: var(--accent); opacity: 0.7; }
.qt-node:hover { border-color: var(--accent); }
.qt-node.qt-node-active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.qt-node .icon { width: 13px; height: 13px; }
.qt-node .icon svg { width: 13px; height: 13px; }
.qt-node .qt-label { overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
.qt-node-alias { color: var(--text2); font-size: 10px; margin-left: 2px; }
.qt-connector { display: inline-flex; align-items: center; gap: 2px; font-size: 10px; font-weight: 600; padding: 2px 5px; border-radius: 3px; user-select: none; flex-shrink: 0; white-space: nowrap; align-self: center; cursor: default; }
.qt-connector-join { background: rgba(78,201,176,0.12); color: #4ec9b0; border: 1px solid rgba(78,201,176,0.25); }
.qt-connector-union { background: rgba(206,145,120,0.12); color: #ce9178; border: 1px solid rgba(206,145,120,0.25); }
.qt-connector-clickable { cursor: pointer; }
.qt-connector-clickable:hover { opacity: 0.75; }
.qt-connector .icon { width: 12px; height: 12px; }
.qt-connector .icon svg { width: 12px; height: 12px; }
/* Query Tree — detail search icons */
.qt-search-icon { flex-shrink: 0; display: flex; align-items: center; color: var(--text2); opacity: 0.55; }
.qt-search-icon svg { width: 13px; height: 13px; }
.qt-search-icon.qt-si-ok { color: #4ec9b0; opacity: 1; }
.qt-search-icon.qt-si-none { color: var(--error-color); opacity: 1; }
/* Query Tree — detail panel search */
.qt-detail-search-bar { display: flex; align-items: center; gap: 5px; padding: 0 0 8px 0; }
.qt-detail-search-input { flex: 1; min-width: 0; background: var(--bg2); border: 1px solid var(--border); border-radius: 3px; color: var(--text); font-size: 11px; padding: 3px 7px; outline: none; font-family: inherit; }
.qt-detail-search-input:focus { border-color: var(--accent); }
.qt-detail-search-input::placeholder { color: var(--text2); opacity: 0.55; }
.qt-detail-status { flex-shrink: 0; font-size: 10px; color: var(--text2); }
.qt-detail-status.qt-si-ok { color: #4ec9b0; }
.qt-detail-status.qt-si-none { color: var(--error-color); }
.qt-row-hidden { display: none !important; }

/* Outlier detect summary */
.outlier-summary { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 0 8px; }
.outlier-stat { display: flex; align-items: baseline; gap: 4px; background: var(--bg3); border: 1px solid var(--border); border-radius: 3px; padding: 2px 8px; font-size: 11px; }
.outlier-stat-label { color: var(--text2); font-size: 10px; }
.outlier-stat-val { color: var(--text); font-weight: 600; font-family: monospace; }
.outlier-stat-val.outlier-hi { color: var(--error-color); }
.outlier-stat-val.outlier-thresh { color: var(--warn-color); }
.story-text-inp { width: 130px; font-size: 11px; padding: 2px 5px; border: 1px solid var(--border); border-radius: 3px; background: var(--bg); color: var(--text); }
.linreg-wrap { display: flex; flex-direction: row; align-items: flex-start; gap: 12px; overflow-x: auto; }
.linreg-group-tbl { border-collapse: collapse; font-size: 12.5px; width: max-content; margin-bottom: 10px; }
.linreg-group-tbl th { padding: 4px 10px; border: 1px solid var(--border); background: var(--bg3); color: var(--text2); font-weight: 600; white-space: nowrap; text-align: right; }
.linreg-group-tbl th:first-child { text-align: left; }
.linreg-group-tbl td { padding: 3px 10px; border: 1px solid var(--border); font-family: monospace; color: var(--text); white-space: nowrap; text-align: right; }
.linreg-group-tbl td:first-child { font-family: inherit; font-weight: 600; text-align: left; }
.linreg-group-tbl .lr-g-hi { color: var(--error-color); }
.linreg-stats-tbl { border-collapse: collapse; font-size: 12.5px; flex-shrink: 0; width: max-content; }
.linreg-stats-tbl td { padding: 3px 8px; border: 1px solid var(--border); white-space: nowrap; }
.linreg-stats-tbl td:first-child { color: var(--text2); background: var(--bg3); }
.linreg-stats-tbl td:last-child { font-family: monospace; color: var(--text); }
.linreg-stats-tbl .lr-hi td:last-child { color: var(--error-color); }
.outlier-clean-row { display: flex; gap: 12px; align-items: flex-start; margin-top: 6px; }
.outlier-clean-tbl { font-size: 11px; border-collapse: collapse; flex-shrink: 0; }
.outlier-clean-tbl td { padding: 2px 10px 2px 0; white-space: nowrap; }
.outlier-clean-tbl td:first-child { color: #888; }
.outlier-clean-tbl td:last-child { font-weight: 600; font-family: monospace; color: #333; }
.story-block-title[contenteditable] { cursor: default; border-radius: 2px; padding: 1px 2px; margin: -1px -2px; }
.story-block-title[contenteditable]:focus { outline: 1px solid var(--accent); outline-offset: 1px; cursor: text; }
.story-block-btn.story-params-btn.active { color: var(--accent); }
.hypo-banner { padding: 6px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
.hypo-banner.hypo-sig { background: rgba(244,71,71,0.12); color: var(--error-color); border: 1px solid var(--error-color); }
.hypo-banner.hypo-nosig { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }
.hypo-stats-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 8px; }
.hypo-stats-table th { color: var(--text2); font-weight: 500; text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--border); }
.hypo-stats-table td { color: var(--text); padding: 3px 8px; border-bottom: 1px solid var(--border2); font-family: monospace; }
.hypo-stats-table tr:last-child td { border-bottom: none; }

/* Preview filter bar */
.pf-bar { padding: 4px 6px 6px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.pf-bar-header { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); margin-bottom: 4px; }
.pf-count-badge { font-size: 10px; padding: 1px 5px; background: var(--accent); color: #fff; border-radius: 10px; }
.pf-clear-all { padding: 1px 7px; background: none; border: 1px solid var(--border); border-radius: 3px; color: var(--text2); font-size: 11px; cursor: pointer; }
.pf-clear-all:hover { color: var(--error-color); border-color: var(--error-color); }
.pf-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.pf-chip { display: inline-flex; align-items: center; gap: 2px; padding: 2px 5px; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; }
.pf-chip.pf-active { border-color: var(--accent); }
.pf-chip-label { font-family: monospace; font-size: 10px; color: var(--text2); white-space: nowrap; margin-right: 2px; }
.pf-inp { padding: 1px 4px; background: var(--bg); border: 1px solid var(--border2); border-radius: 2px; color: var(--text); font-size: 11px; font-family: monospace; }
.pf-inp-num { width: 68px; } .pf-inp-str { width: 115px; } .pf-inp-date { width: 108px; }
.pf-inp:focus { outline: none; border-color: var(--accent); }
.pf-sep { color: var(--text2); font-size: 10px; margin: 0 2px; }
.pf-clr-chip { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 13px; line-height: 1; padding: 0 0 0 1px; }
.pf-clr-chip:hover { color: var(--error-color); }
.pf-hint { font-size: 10px; color: var(--text2); margin-top: 3px; }
/* Search-block filter panel (sf-* = search filters) */
.sf-panel { border-bottom: 1px solid var(--border); margin-bottom: 4px; padding: 4px 6px 5px; }
.sf-panel-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:3px; }
.sf-chips { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:4px; }
.sf-chip { display:inline-flex; align-items:center; gap:3px; padding:3px 5px; background:var(--bg3); border:1px solid var(--border); border-radius:4px; }
.sf-chip.sf-active { border-color:var(--accent); }
.sf-chip-col { font-family:monospace; font-size:10px; color:var(--text2); white-space:nowrap; margin-right:2px; }
.sf-op-sel { padding:1px 2px; background:var(--bg); border:1px solid var(--border2); border-radius:2px; color:var(--text); font-size:10px; font-family:inherit; cursor:pointer; outline:none; }
.sf-op-sel:focus { border-color:var(--accent); }
.sf-inp { padding:1px 4px; background:var(--bg); border:1px solid var(--border2); border-radius:2px; color:var(--text); font-size:11px; font-family:monospace; outline:none; }
.sf-inp-num { width:68px; } .sf-inp-str { width:110px; } .sf-inp-date { width:110px; }
.sf-inp:focus { border-color:var(--accent); }
.sf-sep { color:var(--text2); font-size:10px; margin:0 1px; }
.sf-del { background:none; border:none; color:var(--text2); cursor:pointer; font-size:14px; line-height:1; padding:0 0 0 2px; }
.sf-del:hover { color:var(--error-color); }
/* Add-filter row */
.sf-add-row { display:flex; align-items:center; gap:5px; margin-top:3px; }
.sf-add-label { font-size:11px; color:var(--text2); white-space:nowrap; flex-shrink:0; }
.sf-search-wrap { position:relative; flex:1; }
.sf-search-inp { width:100%; box-sizing:border-box; background:var(--bg3); border:1px solid var(--border); border-radius:3px; padding:3px 7px; font-size:11px; color:var(--text); font-family:inherit; outline:none; }
.sf-search-inp:focus { border-color:var(--accent); }
.sf-col-dropdown { position:absolute; top:calc(100% + 2px); left:0; right:0; background:var(--bg2); border:1px solid var(--border); border-radius:4px; z-index:30; max-height:160px; overflow-y:auto; box-shadow:0 4px 14px rgba(0,0,0,0.18); }
.sf-col-opt { display:flex; align-items:center; gap:6px; padding:5px 8px; cursor:pointer; font-size:11px; }
.sf-col-opt:hover { background:var(--bg3); }
.sf-col-name { font-family:monospace; color:var(--text); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sf-col-type-badge { font-size:9px; padding:1px 4px; border-radius:2px; color:#fff; flex-shrink:0; }
.sf-col-type-badge.num { background:#4ec9b0; } .sf-col-type-badge.dat { background:#f44747; } .sf-col-type-badge.str { background:#c586c0; }
/* Output resize handle */
.story-resize-handle { height:8px; cursor:ns-resize; display:flex; align-items:center; justify-content:center; user-select:none; flex-shrink:0; margin-top:6px; opacity:0.35; transition:opacity 0.15s; }
.story-resize-handle:hover,.story-resize-handle.dragging { opacity:1; }
.story-resize-handle::after { content:''; display:block; width:36px; height:3px; background:var(--border); border-radius:2px; }

/* Results */
#results-area { flex-shrink: 0; display: flex; flex-direction: column; position: relative; z-index: 1; box-shadow: 0 -4px 16px -2px rgba(0,0,0,0.15); border-top: 2px solid var(--accent); }
#data-panel { display: none; flex-direction: column; overflow: hidden; }
#data-panel-sheets { display: none; flex-shrink: 0; padding: 0 8px; background: var(--bg2); border-bottom: 1px solid var(--border); gap: 2px; align-items: flex-end; overflow-x: auto; }
#data-panel-sheets.visible { display: flex; }
.dp-sheet-tab { padding: 4px 12px; border: 1px solid transparent; border-bottom: none; border-radius: 4px 4px 0 0; background: none; color: var(--text2); cursor: pointer; font-size: 11px; font-family: inherit; white-space: nowrap; margin-bottom: -1px; }
.dp-sheet-tab:hover { background: var(--node-hover); color: var(--text); }
.dp-sheet-tab.active { background: var(--bg); border-color: var(--border); color: var(--text); }
#data-panel-status { padding: 5px 14px; background: var(--bg2); border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text2); flex-shrink: 0; display: flex; gap: 16px; align-items: center; }
#data-panel-status .dp-trunc { color: var(--warn-color); }
#data-panel-scroll { flex: 1; overflow: auto; }
#results-statusbar { padding: 4px 12px; background: var(--bg2); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text2); display: flex; gap: 16px; align-items: center; flex-shrink: 0; }
/* Local query panel */
#results-statusbar .job-id { font-family: monospace; font-size: 11px; }
#download-btn-wrap { margin-left: auto; position: relative; display: flex; gap: 4px; }
.dl-btn { display: flex; align-items: center; justify-content: center; padding: 3px 6px; background: none; border: 1px solid var(--border); border-radius: 4px; color: var(--text2); cursor: pointer; }
.dl-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--node-hover); }
#results-statusbar .warn { color: var(--warn-color); }
#results-scroll-wrap { position: relative; flex: 1; overflow: hidden; display: flex; flex-direction: column; }
#loading-overlay { display: none; position: absolute; inset: 0; background: var(--overlay-bg); align-items: center; justify-content: center; color: var(--overlay-text); z-index: 10; }
#loading-overlay-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; }
#slow-query-notice { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: var(--text2); }
.sq-btns { display: flex; gap: 8px; }
.sq-btns button { padding: 4px 12px; font-size: 12px; border-radius: 4px; border: 1px solid var(--border); cursor: pointer; background: var(--bg3); color: var(--text); }
.sq-btns button:hover { border-color: var(--accent); color: var(--accent); }
#slow-limit-btn { border-color: var(--warn-color); color: var(--warn-color); }
#slow-limit-btn:hover { background: rgba(255,170,0,0.08); }
#error-banner { display: none; margin: 10px; padding: 10px 14px; background: var(--error-bg); border: 1px solid var(--error-color); border-radius: 4px; color: var(--error-color); font-family: monospace; font-size: 12px; white-space: pre-wrap; }
#results-scroll { flex: 1; overflow: auto; background: var(--bg); }
#results-hscrollbar { overflow-x: scroll; overflow-y: hidden; height: 10px; flex-shrink: 0; border-top: 1px solid var(--border); background: var(--bg2); display: none; }
#results-hscrollbar-inner { height: 1px; }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-family: monospace; font-size: 12px; }
thead th { position: sticky; top: 0; z-index: 2; background: var(--bg2); padding: 6px 12px; text-align: left; border-bottom: 2px solid color-mix(in srgb, var(--text) 65%, var(--border) 35%); box-shadow: none; color: var(--text); white-space: nowrap; font-weight: 600; font-size: 12px; letter-spacing: normal; text-transform: none; transition: background 0.15s; }
thead th.col-search-hit { background: rgba(255,200,0,0.22); color: var(--text); outline: 2px solid rgba(255,200,0,0.7); outline-offset: -2px; }
.col-type-badge { display: block; font-size: 9px; font-weight: 500; font-family: 'Menlo','Monaco','Courier New',monospace; opacity: 0.65; margin-top: 2px; letter-spacing: 0.02em; text-transform: none; }
.lq-table-scroll thead th .col-type-badge { font-size: 9px; }
.col-type-icon { display:inline-flex; align-items:center; justify-content:center; padding:2px 3px; border-radius:3px; background:var(--bg2); vertical-align:middle; margin-left:5px; cursor:default; flex-shrink:0; line-height:0; opacity:0.85; }
.preview-type-legend { display:flex; align-items:center; gap:10px; padding:5px 10px 3px; font-size:10px; color:var(--text2); flex-wrap:wrap; border-top:1px solid var(--border2); }
.preview-type-legend .legend-item { display:flex; align-items:center; gap:4px; white-space:nowrap; }
.tbl-idx-th { min-width:26px; width:26px; max-width:26px; color:var(--text); font-weight:400 !important; text-align:right !important; padding:4px 5px !important; opacity:0.65; user-select:none; font-size:10px !important; text-transform:none !important; letter-spacing:0 !important; border-right:1px solid var(--border2) !important; }
.tbl-idx-td { color:var(--text); text-align:right; padding:3px 5px !important; opacity:0.65; user-select:none; font-size:10px; font-family:'Menlo','Monaco','Courier New',monospace; border-right:1px solid var(--border2); }
#results-scroll .lq-table-scroll,
#data-panel-scroll .lq-table-scroll,
.story-output .lq-table-scroll { max-height:none; overflow:visible; border:0; border-radius:0; background:transparent; }
.story-output .lq-table-scroll thead th { z-index:2; }
tbody tr { background: transparent; }
tbody tr:hover td { background: var(--node-hover); }
tbody td { padding: 5px 12px; border-bottom: 1px solid var(--border2); color: var(--text); font-size: 12px; white-space: nowrap; max-width: 400px; overflow: hidden; text-overflow: ellipsis; }
tbody td.null-val { color: var(--null-color); font-style: italic; }
.story-output tbody tr { background: transparent; }

/* ── File Explorer ─────────────────────────────────────────────────────────── */
#sidebar-file-explorer { flex-shrink: 0; display: flex; flex-direction: column; min-height: 0; overflow: hidden; background: var(--bg2); }
#sidebar-fe-resizer { height: 4px; flex-shrink: 0; background: transparent; cursor: row-resize; }
#sidebar-fe-resizer:hover, #sidebar-fe-resizer.dragging { background: transparent; }
.fe-header { display: flex; align-items: center; gap: 5px; padding: 6px 8px; cursor: pointer; user-select: none; font-size: 11px; font-weight: 600; color: var(--text2); letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0; }
.fe-header:hover { background: var(--node-hover); color: var(--text); }
.fe-header-title { flex: 1; }
.fe-chevron { display: inline-flex; align-items: center; justify-content: center; width: 10px; height: 10px; transition: transform 0.15s; flex-shrink: 0; opacity: 0.5; }
.fe-chevron.open { transform: rotate(90deg); opacity: 0.8; }
.fe-body { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
.fe-path-bar { display: flex; align-items: center; gap: 4px; padding: 4px 8px; flex-shrink: 0; background: var(--bg3); }
#fe-path-input { flex: 1; background: transparent; border: none; color: var(--text2); font-size: 11px; padding: 2px 4px; outline: none; font-family: inherit; min-width: 0; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#fe-path-input:hover { color: var(--text); }
.fe-browse-btn { padding: 3px; background: none; border: none; color: var(--text2); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; border-radius: 3px; }
.fe-browse-btn:hover { color: var(--accent); background: var(--node-hover); }
.fe-search-wrap { display: flex; align-items: center; gap: 4px; padding: 4px 8px; flex-shrink: 0; }
#fe-search-inp { flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: 3px; color: var(--text); font-size: 11px; padding: 3px 6px; outline: none; font-family: inherit; }
#fe-search-inp:focus { border-color: var(--accent); }
.fe-tree-wrap { overflow-y: auto; flex: 1; min-height: 0; padding: 2px 0; }
.fe-tree-actions { display: flex; align-items: center; gap: 4px; padding: 4px 8px 5px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.fe-act-btn { display: flex; align-items: center; gap: 4px; padding: 4px 8px; background: none; border: none; border-radius: 4px; color: var(--text2); font-size: 12px; cursor: pointer; }
.fe-act-btn:hover { color: var(--accent); background: var(--node-hover); }
.fe-item { display: flex; align-items: center; padding: 3px 4px; cursor: pointer; user-select: none; font-size: 12px; color: var(--text); position: relative; }
.fe-item:hover { background: var(--node-hover); }
.fe-item.selected { background: var(--node-hover); border-left: 2px solid var(--accent); padding-left: 2px; }
.fe-item.drag-over { background: var(--node-hover); outline: 1px dashed var(--accent); outline-offset: -1px; }
@keyframes fe-item-appear { 0% { background: var(--accent); opacity: 0; transform: translateX(-10px); } 40% { opacity: 1; transform: translateX(0); } 100% { background: transparent; } }
.fe-item-new { animation: fe-item-appear 1.4s ease forwards; }
.fe-item-indent { flex-shrink: 0; }
.fe-item-arrow { width: 15px; height: 15px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--text2); transition: transform 0.12s; }
.fe-item-arrow.open { transform: rotate(90deg); }
.fe-item-arrow svg { pointer-events: none; }
.fe-item-icon { width: 15px; height: 15px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.fe-item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; color: var(--text); }
.fe-item-name.sql-file { color: var(--col-color); font-weight: 500; }
.fe-item.selected .fe-item-name { color: var(--text); }
.fe-item-btns { display: none; align-items: center; gap: 2px; flex-shrink: 0; margin-right: 2px; }
.fe-item:hover .fe-item-btns { display: flex; }
.fe-item-btn { padding: 2px 4px; background: none; border: none; color: var(--text2); cursor: pointer; border-radius: 2px; line-height: 1; display: flex; align-items: center; }
.fe-item-btn:hover { color: var(--accent); background: var(--bg3); }
.fe-rename-inp { flex: 1; background: var(--bg3); border: 1px solid var(--accent); border-radius: 2px; color: var(--text); font-size: 12px; padding: 0 3px; font-family: inherit; outline: none; min-width: 0; }
.fe-empty { padding: 6px 12px; font-size: 12px; color: var(--text2); font-style: italic; }
.fe-no-root { padding: 10px 12px; font-size: 11px; color: var(--text2); text-align: center; line-height: 1.7; }
#fe-confirm-modal { position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,0.45); display: none; align-items: center; justify-content: center; }
#fe-confirm-modal.open { display: flex; }
.fe-confirm-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 20px 24px; min-width: 270px; max-width: 380px; box-shadow: 0 8px 32px var(--shadow-color); }
.fe-confirm-msg { color: var(--text); font-size: 13px; margin-bottom: 18px; line-height: 1.5; }
.fe-confirm-btns { display: flex; gap: 8px; justify-content: flex-end; }
.fe-confirm-btn { padding: 5px 16px; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: inherit; border: none; background: var(--bg3); color: var(--text2); }
.fe-confirm-btn:hover { color: var(--text); background: var(--node-hover); }
.fe-confirm-btn.danger { background: var(--error-color); color: #fff; }
.fe-confirm-btn.danger:hover { opacity: 0.85; }

/* Save button */
#save-btn { display: flex; align-items: center; gap: 6px; padding: 4px 11px; background: none; border: none; border-radius: 4px; color: var(--toolbar-icon); cursor: pointer; font-size: 13px; }
#save-btn:hover { background: var(--node-hover); color: var(--text); }
#save-btn svg { width: 16px; height: 16px; }

/* Comment toggle button */
#comment-btn { display: flex; align-items: center; gap: 5px; padding: 4px 11px; background: none; border: none; border-radius: 4px; color: var(--toolbar-icon); cursor: pointer; font-size: 13px; }
#comment-btn:hover { background: var(--node-hover); color: var(--text); }
#comment-btn svg { width: 17px; height: 17px; }
</style>
